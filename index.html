  ...MESES];
function _canon(t){
  const productos = (S.cache.inventory||[]).flatMap(i => _normTxt(i.descripcion).split(/[^a-z0-9]+/)).filter(w => w.length >= 5 && !/\d/.test(w));
  const vocab = new Set([...VOCAB, ...productos]);
  const protegidas = new Set([...(S.cache.inventory||[]).flatMap(i => _normTxt(i.descripcion).split(/[^a-z0-9]+/)), ...(S.cache.lotes||[]).flatMap(l => _normTxt([l.codigo, l.cultivo, l.variedad].join(' ')).split(/[^a-z0-9]+/))]);
  return t.split(' ').map(w => {
    if (JERGA[w]) return JERGA[w];
    if (w.length < 5 || vocab.has(w) || protegidas.has(w) || STOP_CONSULTA.has(w) || /\d/.test(w)) return w;
    let mejor = null, d0 = w.length >= 8 ? 2 : 1;
    for (const v of vocab){ if (v[0] !== w[0] || Math.abs(v.length - w.length) > d0) continue; const d = levenshtein(w, v); if (d <= d0 && (!mejor || d < mejor.d)) mejor = { v, d }; }
    return mejor ? mejor.v : w;
  }).join(' ');
}

/* ── REGISTROS POR SECCIÓN ── devuelve la misma propuesta que daría el agente de IA.
   _seguro=false cuando faltan datos clave: entonces se intenta con la IA (si hay cuota). */
const RX_COMPRA = /\b(compr\w*|entr(o|aron)|lleg(o|aron)|trajeron|traje|repus\w*|reponer|ingres(o|aron)|recibi\w*)\b/;
const RX_SALIDA = /\b(use|uso|usamos|usaron|sali(o|eron)|saque|saco|sacamos|sacaron|gaste|gasto|gastamos|gastaron|eche|echo|echamos|echaron|aplic\w*|consum\w*)\b/;
const RX_LABOR  = /\b(fumig|asperj|aplic|pode|podo|podamos|podaron|regu|regamos|regaron|riego|abon|fertiliz|sembr|trasplant|desyerb|limpi|guada|desbro|deshoj|cosech|recog|tutor|amarr|plate|fumigu|cerc|arregl|repar|desmalez|rocer|rozamos|deschup|ralee|ralea)\w*/;
const ESTADOS_LOTE = { planificacion:'planificación', siembra:'siembra', sembrado:'siembra', vegetativo:'vegetativo', crecimiento:'vegetativo', produccion:'producción', produciendo:'producción', cosecha:'cosecha', cosechando:'cosecha', descanso:'descanso', descansando:'descanso' };

function interpretarLocal(dominio, texto){
  const t = _txt(texto);                              // mismo largo que el texto original (para _quitar)
  if (!t.trim()) return null;
  const inf = entenderInforme(texto);                 // pedidos de informes y preguntas sobre registros
  if (inf) return inf;
  if (_pareceAPregunta(texto)) return null;          // consejos y preguntas abiertas: eso sí es para la IA
  const hoy = hoyISO();

  switch (dominio){
    case 'bitacora': {
      const f = _fecha(t, false), lote = _lote(t), fecha = fechaAgente(f?.fecha) || hoy;
      const kg = /cosech|recog|sacamos|sacaron/.test(t) && t.match(new RegExp('\\b' + RX_NUM + '\\s*(kilos?|kgs?|kilogramos?|arrobas?|toneladas?)\\b'));
      if (kg){
        const kilos = _numero(kg[1]) * (/^arroba/.test(kg[2]) ? 12.5 : /^tonelada/.test(kg[2]) ? 1000 : 1);
        return { accion:'cosecha', kilos, calidad:'normal', observaciones:'', lote_codigo: lote?.codigo || null, fecha, resumen:`Cosecha de ${kilos.toLocaleString('es-CO')} kg${lote ? ' en ' + lote.codigo : ''}`, _seguro: !!lote };
      }
      const actividad = _frase(_quitar(texto, f));
      let insumos = productosDeLabor(texto).map(p => {
        const it = _producto(_normTxt(p.nombre));
        const u = p.unidad === 'g' ? 'g' : p.unidad === 'cc' ? 'cc' : (p.unidad || it?.unidad_medida || '');
        return { nombre: it?.descripcion || p.nombre, cantidad: p.cantidad, unidad: u };
      });
      if (!insumos.length){
        const c = _cantidad(t), prod = c ? _producto(t) : null, nombre = prod?.descripcion || _nombreTras(t, c);
        if (c && nombre && !/^(agua|lts?|litros?)$/.test(_normTxt(nombre))) insumos = [{ nombre, cantidad: c.cantidad, unidad: c.unidad }];
      }
      return { accion:'registrar_labor', actividad, fecha, lote_codigo: lote?.codigo || null, insumos,
        resumen: `Labor${lote ? ' en ' + lote.codigo : ''}${fecha !== hoy ? ' · ' + fmtFecha(fecha) : ''}`, _seguro: actividad.length >= 3 };
    }
    case 'bodega': {
      const f = _fecha(t, false), c = _cantidad(t), prod = _producto(t), lote = _lote(t);
      const nombre = prod?.descripcion || _nombreTras(t, c);
      const entra = RX_COMPRA.test(t), sale = RX_SALIDA.test(t);
      const resto = _quitar(t, f, c);
      const plata = _plata(resto);
      const accion = entra && !sale ? 'entrada' : sale && !entra ? 'salida' : (plata ? 'entrada' : null);
      if (!accion) return null;
      const base = { producto: nombre, cantidad: c?.cantidad || '', unidad: c?.unidad || prod?.unidad_medida || '', fecha: fechaAgente(f?.fecha) || hoy, _seguro: !!(nombre && c) };
      if (accion === 'entrada') return { accion, ...base, precio_total: plata?.v || '', lote_codigo: null, resumen: `Entrada a bodega${nombre ? ': ' + nombre : ''}` };
      return { accion, ...base, lote_codigo: lote?.codigo || null, resumen: `Salida de bodega${nombre ? ': ' + nombre : ''}${lote ? ' para ' + lote.codigo : ''}` };
    }
    case 'dinero': {
      const f = _fecha(t, false), fecha = fechaAgente(f?.fecha) || hoy;
      const t2 = _quitar(t, f), plata = _plata(t2), valor = plata?.v || 0, lote = _lote(t2);
      if (/\bjornal|\btrabaj(o|aron|amos)\b|\bdias? de trabajo\b/.test(t2)){
        const d = t2.match(new RegExp('\\b' + RX_NUM + '\\s*(jornales|jornal|dias?)\\b'));
        const dias = d ? _numero(d[1]) : 1;
        let valor_dia = valor;
        if (valor && dias > 1 && valor >= 150000 && !/\b(el|por|cada|al) (dia|jornal)\b|diario|c\/u|cada uno/.test(t2)) valor_dia = Math.round(valor / dias);
        const trabajador = _persona(t2) || _nombrePropio(texto);
        return { accion:'jornal', trabajador, dias, valor_dia: valor_dia || '', lote_codigo: lote?.codigo || null, fecha, resumen: `Jornal${trabajador ? ' de ' + trabajador : ''}`, _seguro: !!(valor && trabajador) };
      }
      const limpio = _frase(_quitar(texto, f, plata)
        .replace(/^\s*(hoy|ayer|antier)?\s*(gaste|gasté|pague|pagué|compre|compré|compramos|pagamos|se pago|se pagó|se compro|se compró|vendi|vendí|vendimos|se vendio|se vendió|me pagaron|nos pagaron|recibi|recibí|registra|anota)\s+(en|de|por|el|la|los|las|un|una|unos|unas)?\s*/i, ''));
      if (/\bvend\w*|\bventa\b|\bingres\w*|me pagaron|nos pagaron|\bcobr\w*|\brecibi\b/.test(t2))
        return { accion:'ingreso', concepto: limpio || 'Venta', valor: valor || '', fecha, resumen: 'Ingreso / venta', _seguro: !!valor };
      return { accion:'gasto', concepto: limpio, valor: valor || '', categoria: _categoria(t2), lote_codigo: lote?.codigo || null, fecha, resumen: 'Gasto', _seguro: !!(valor && limpio) };
    }
    case 'tareas': {
      if (/\b(ya )?(hice|hicimos|termin\w*|complet\w*|acab\w*|listo|lista|cumpl\w*)\b/.test(t) && !/\b(recuerd\w*|program\w*|agend\w*|hay que|tengo que|toca)\b/.test(t)){
        const tk = _tareaPendiente(t);
        return { accion:'completar_tarea', titulo: tk?.titulo || _frase(texto), resumen: tk ? `Completar: ${tk.titulo}` : 'Completar tarea', _seguro: !!tk };
      }
      const f = _fecha(t, true), lote = _lote(t), persona = _persona(t);
      const titulo = _frase(_quitar(texto, f)
        .replace(/^\s*(por favor\s+)?(recuerdame|recuérdame|recuerda|recordar|programa|programar|agenda|agendar|anota|apunta|crea\s+(una\s+)?tarea(\s+de|\s+para)?|tarea(\s+de|\s+para)?|hay que|tengo que|tenemos que|toca|debo|debemos|necesito)\s+(que\s+)?/i, ''));
      const fl = f?.fecha && f.fecha >= hoyISO() ? f.fecha : '';
      return { accion:'crear_tarea', titulo, fecha_limite: fl, asignado: persona || 'todos', lote_codigo: lote?.codigo || null, resumen: `Tarea${fl ? ' para el ' + fmtFecha(fl) : ''}`, _seguro: titulo.length >= 3 };
    }
    case 'cultivos': {
      if (/\b(crea\w*|nuevo|nueva|agreg\w*|registr\w*|abr\w*)\b.*\blote\b|\blote nuevo\b/.test(t)){
        const m = t.match(/\blote\s+(?:nuevo\s+)?([a-z]{0,3}-?\d+[a-z]?)\b/);
        const codigo = m ? m[1].toUpperCase() : '';
        const tras = m ? t.slice(m.index + m[0].length) : t;
        const mc = tras.match(/\b(?:de|con|para)\s+([a-zñ]+)(?:\s+(?!en\b|y\b|de\b|con\b|para\b)([a-zñ0-9]+))?/);
        const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
        return { accion:'crear_lote', codigo, cultivo: cap(mc?.[1] || ''), variedad: cap(mc?.[2] || ''), resumen: 'Lote nuevo', _seguro: !!(codigo && mc) };
      }
      const est = t.match(new RegExp('\\b(' + Object.keys(ESTADOS_LOTE).join('|') + ')\\b'));
      if (est){
        const lote = _lote(t);
        return { accion:'estado_lote', lote_codigo: lote?.codigo || '', estado: ESTADOS_LOTE[est[1]], resumen: `Cambiar estado${lote ? ' de ' + lote.codigo : ''}`, _seguro: !!lote };
      }
      return null;
    }
  }
  return null;
}

/* En el chat general: ¿de qué sección es esta frase? (null = que la atienda la IA) */
function dominioDeTexto(texto){
  const t = _canon(_txt(texto).replace(/\s+/g, ' ').trim());
  if (_pareceAPregunta(texto)) return null;
  if (/\bjornal|\bjornales\b/.test(t) || (/\btrabaj(o|aron|amos)\b/.test(t) && /\b(dias?|mil|\$)/.test(t))) return 'dinero';
  if (/\b(recuerd\w*|program\w*|agend\w*|hay que|tengo que|tenemos que|toca|tarea)\b/.test(t)) return 'tareas';
  if (/\b(crea\w*|nuevo|nueva|agreg\w*)\b.*\blote\b/.test(t) || (/\blote\b/.test(t) && new RegExp('\\b(' + Object.keys(ESTADOS_LOTE).join('|') + ')\\b').test(t) && /\b(pasa|paso|esta|entro|quedo|cambia|cambiar|ponlo|pon)\b/.test(t))) return 'cultivos';
  if (/\b(ya )?(termine|terminamos|complete|completamos|acabe|acabamos)\b/.test(t) && _tareaPendiente(t)) return 'tareas';
  if (/\b(vend\w*|venta|me pagaron|nos pagaron|cobr\w*)\b/.test(t)) return 'dinero';
  if (RX_COMPRA.test(t) && _cantidad(t)) return 'bodega';
  if (/\b(gaste|pague|pagamos|compre|compramos|se pago|se compro)\b/.test(t) && _plata(t)) return 'dinero';
  if (RX_LABOR.test(t)) return 'bitacora';
  if (RX_SALIDA.test(t) && _cantidad(t) && _producto(t)) return 'bodega';
  return null;
}

/* Tito (mapas) responde solo, sin IA: áreas y perímetros calculados del mapa */
function respuestaMapas(texto){
  const medir = l => { const pts = (S.cache.coordenadas||[]).filter(c => c.lote_id === l.id); return pts.length >= 3 ? MapEngine.calcDims(pts.map(p => ({ lat:p.latitud, lng:p.longitud }))) : null; };
  const lote = _lote(_txt(texto));
  if (lote){ const d = medir(lote); return d ? `${lote.codigo} (${lote.cultivo}): área ${MapEngine.fmtArea(d.area)}, perímetro ${MapEngine.fmtDist(d.perimetro)}.` : `${lote.codigo} todavía no tiene el contorno marcado en el mapa.`; }
  let total = 0;
  const lineas = (S.cache.lotes||[]).map(l => { const d = medir(l); if (d) total += d.area; return `• ${l.codigo} (${l.cultivo}): ${d ? MapEngine.fmtArea(d.area) + ' · ' + MapEngine.fmtDist(d.perimetro) : 'sin medir'}`; });
  if (!lineas.length) return 'Todavía no hay lotes.';
  return `Áreas de los lotes:\n${lineas.join('\n')}${total ? `\nTotal medido: ${MapEngine.fmtArea(total)}.` : ''}`;
}

/* Control de cuota: si Gemini responde 429 (cuota agotada) se deja de llamar un rato
   y la app sigue trabajando solo con las reglas locales. */
const IA = { pausaHasta: 0 };
function iaDisponible(){ return S.isOnline && Date.now() > IA.pausaHasta; }
/* Todas las llamadas a Gemini pasan por aquí: sin "pensamiento" extra (gasta tokens sin necesidad) */
async function llamarGemini(req){
  if (!iaDisponible()) return { ok:false, status: S.isOnline ? 429 : 0 };
  req.generationConfig = { ...(req.generationConfig || {}), thinkingConfig: { thinkingBudget: 0 } };
  let res;
  try{ res = await fetch(`${API_URL_FLASH}?key=${GEMINI_API_KEY}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(req) }); }
  catch(e){ return { ok:false, status:0 }; }
  if (res.status === 429){ IA.pausaHasta = Date.now() + 10*60*1000; toast('La IA se quedó sin cuota por ahora. Sigo con lo que entiendo sin ella.'); }
  if (!res.ok) return { ok:false, status: res.status };
  return { ok:true, status: res.status, data: await res.json() };
}

/* ═══════════════════════════════════════════════════════════════
   INFORMES: EL CEREBRO LÓGICO DE LA APP (SIN IA)
   Entiende pedidos como "dame las fechas de fumigación", "lista de
   insumos en bodega" o "compras de este mes por categoría", y arma el
   listado completo con totales a partir de TODOS los registros.
   ═══════════════════════════════════════════════════════════════ */
const RX_PIDE = /^(y\s+)?(por favor\s+)?(en (que|donde)|donde|rentabilidad|cual (es|fue) (el|la)|como (vamos|va|nos fue|esta la finca|van)|(el |los )?productos? mas|dame|dime|damelo|muestrame|muestra|mostrar|mostrame|ensename|quiero (ver|saber|el|la|los|las|un|una)|necesito (ver|saber|el|la|los|las|un|una)|ver (el|la|los|las)|cuales|que|cual|cuando|cuanto|cuanta|cuantos|cuantas|hace cuanto|en que fechas?|fechas?|todas las|todos los|lista|listado|listar|informe|reporte|resumen|historial|relacion|detalle|consulta)\b/;
const RX_TEMAS = '(insumos|productos|compras|gastos|jornales|cosechas|fumigaciones|fertilizaciones|abonadas|podas|riegos|labores|tareas|ventas|ingresos|aplicaciones|inventario|plagas|lotes|salidas|consumos)';
const RX_FUERTE = new RegExp('\\b(lista|listado|listar|informe|reporte|resumen|historial|inventario|ultima vez|primera vez|hace cuanto|cuantas veces)\\b|\\b' + RX_TEMAS +
  '\\b.*\\b(este mes|esta semana|del mes|mes pasado|semana pasada|este ano|ano pasado|por (lote|mes|categoria|producto|trabajador)|' + MESES.join('|') + ')\\b');
const RX_EMPIEZA_TEMA = new RegExp('^(y\\s+)?(las|los|el|la)?\\s*' + RX_TEMAS + '\\b');
const RX_LISTA = /\b(lista|listado|listar|informe|reporte|resumen|historial|relacion|detalle|detallado|dame|muestrame|muestra|mostrar|ensename|fechas|todas|todos|cuales)\b/;
const STOP_INFORME = new Set([...STOP_CONSULTA, ...('dame dime damelo muestrame muestra mostrar mostrame ensename quiero necesito ver saber lista listado listar informe reporte resumen ' +
  'historial relacion detalle detallado consulta fechas fecha favor porfa inventario bodega stock existencia existencias insumos insumo productos producto ' +
  'compras compra compro compraron comprados compradas aplicado aplicados aplicadas usado usados echado tareas tarea pendientes pendiente completadas completada ' +
  'hechas hecha terminadas cosechas lotes cultivos cultivo gastos ingresos ventas plagas jornales trabajador trabajadores agotados agotado vencer vencidos ' +
  'categoria categorias meses proveedor salidas salida consumos consumo bitacora actividades actividad trabajos tengo tenemos quedan queda estan esta ' +
  'activas activa todas todos desde hasta entre partir cuales cual acabando acaban acabado reponer faltan falta poco').split(' ')]);

/* Categoría o subcategoría de bodega mencionada ("fungicidas", "abonos"…) */
const CAT_PALABRAS = [
  [/fungicid/, { sub:'Fungicidas' }], [/insecticid/, { sub:'Insecticidas' }], [/herbicid|matamaleza/, { sub:'Herbicidas' }],
  [/acaricid/, { sub:'Acaricidas' }], [/coadyuv|adherent/, { sub:'Coadyuvantes' }], [/foliar/, { sub:'Líquidos / Foliares' }],
  [/bioestimul/, { sub:'Bioestimulantes' }], [/organic/, { sub:'Orgánicos' }], [/\briego\b/, { sub:'Sistema de Riego' }],
  [/abono|fertiliz|nutric/, { cat:'Nutrición' }], [/agroquimic|veneno|plaguicid/, { cat:'Agroquímicos' }],
  [/herramient|equipo/, { cat:'Equipos y Herramientas' }], [/\bepp\b|proteccion|dotacion/, { cat:'EPP' }], [/consumible|empaque/, { cat:'Insumos Consumibles' }],
];
function _categoriaPedida(t){ for (const [rx, c] of CAT_PALABRAS) if (rx.test(t)) return c; return null; }
/* Insumo de bodega al que corresponde una compra ("Lannate (reposición: 1.000 CC)" → Lannate) */
function _itemDeConcepto(concepto){
  const c = _normTxt(String(concepto||'').replace(/\(.*$/, '')).trim(); if (!c) return null;
  const inv = S.cache.inventory || [];
  return inv.find(i => _normTxt(i.descripcion).trim() === c) || inv.find(i => { const d = _normTxt(i.descripcion).trim(); return d.length >= 4 && (c.includes(d) || d.includes(c)); }) || null;
}

/* Productos y dosis escritos en una labor: "Se fumigó con: trionex 100cc, lannate 150cc para 100 lts de agua" */
function productosDeLabor(texto){
  const t = String(texto||'');
  const m = t.match(/\bcon\s*:?\s*(.+?)(?:\s+para\s+[\d.,]+\s*(?:lts?|litros?|l)\b.*)?$/i);
  if (!m) return [];
  const out = [];
  m[1].split(/\s*,\s*|\s+y\s+/).forEach(seg => {
    const s = seg.trim().replace(/\.$/, '');
    const p = s.match(/^(.+?)\s*(\d+(?:[.,]\d+)*)\s*(cc|ml|grs?|g|gramos?|kgs?|kilos?|lts?|litros?|l|unidades?|und)?$/i);
    if (!p) return;
    const nombre = p[1].replace(/[:\-]+$/, '').trim(); if (!nombre || /^\d/.test(nombre)) return;
    let cant = _numero(p[2]), uni = (p[3]||'').toLowerCase();
    if (/^(ml|cc)$/.test(uni)) uni = 'cc';
    else if (/^(g|grs?|gramos?)$/.test(uni)) uni = 'g';
    else if (/^(kgs?|kilos?)$/.test(uni)){ uni = 'g'; cant *= 1000; }
    else if (/^(lts?|litros?|l)$/.test(uni)){ uni = 'cc'; cant *= 1000; }
    else if (/^(unidades?|und)$/.test(uni)) uni = 'unidad';
    out.push({ nombre: nombre[0].toUpperCase() + nombre.slice(1), clave: _normTxt(nombre).trim(), cantidad: cant, unidad: uni });
  });
  return out;
}
function _fmtCant(v, u){
  if (u === 'cc' && v >= 1000) return `${(Math.round(v/100)/10).toLocaleString('es-CO')} L`;
  if (u === 'g'  && v >= 1000) return `${(Math.round(v/100)/10).toLocaleString('es-CO')} kg`;
  return `${(Math.round(v*100)/100).toLocaleString('es-CO')}${u ? ' ' + u : ''}`;
}
function _nombresAplicados(){ const s = new Set(); (S.cache.activities||[]).forEach(b => productosDeLabor(b.actividad).forEach(p => s.add(p.clave))); return s; }
function _fechaCorta(d){ const s = fechaDia(d); if (!s) return '—'; const f = fmtFecha(s); return s.slice(0,4) === fechaLocalISO().slice(0,4) ? f : `${f} ${s.slice(0,4)}`; }
function _mesDe(d){ const s = fechaDia(d); if (!s) return 'Sin fecha'; const n = new Date(s.slice(0,7) + '-15T12:00:00Z').toLocaleDateString('es-CO', { month:'long', year:'numeric', timeZone:'UTC' }); return n[0].toUpperCase() + n.slice(1); }
const _codLote = id => (S.cache.lotes||[]).find(l => l.id === id)?.codigo || '';

/* Rango de fechas, también "desde el 1 de septiembre", "entre el 1 y el 15 de agosto", "del mes", "septiembre" */
function _rangoAmplio(t){
  const hoy = fechaLocalISO(); let m;
  if ((m = t.match(/\b(?:desde|a partir de)\s+(?:el\s+)?(.+?)(?:\s+(?:hasta|al)\s+(?:el\s+)?(.+))?$/))){
    const a = _fecha(m[1], false), b = m[2] ? _fecha(m[2], false) : null;
    if (a) return { desde: a.fecha, hasta: b?.fecha || hoy, i: m.index, n: m[0].length };
  }
  if ((m = t.match(/\bentre\s+(?:el\s+)?(.+?)\s+y\s+(?:el\s+)?(.+)$/))){
    const b = _fecha(m[2], false); let a = _fecha(m[1], false);
    if (!a && b && /^\d{1,2}$/.test(m[1].trim())) a = { fecha: b.fecha.slice(0,8) + m[1].trim().padStart(2,'0') };
    if (a && b) return { desde: a.fecha < b.fecha ? a.fecha : b.fecha, hasta: a.fecha < b.fecha ? b.fecha : a.fecha, i: m.index, n: m[0].length };
  }
  const r = _rango(t); if (r) return r;
  const y = +hoy.slice(0,4), mo = +hoy.slice(5,7);
  if ((m = t.match(/\bdel mes\b/))) return { desde: hoy.slice(0,8) + '01', hasta: hoy, i: m.index, n: m[0].length };
  if ((m = t.match(/\bde la semana\b/))){ const dow = new Date(hoy + 'T12:00:00Z').getUTCDay(); return { desde: sumarDias(hoy, -((dow + 6) % 7)), hasta: hoy, i: m.index, n: m[0].length }; }
  if ((m = t.match(new RegExp('\\b(' + MESES.join('|') + ')\\b(?:\\s+(?:de|del)\\s+(\\d{4}))?')))){
    const mm = MESES.indexOf(m[1]) + 1, yy = m[2] ? +m[2] : (mm > mo ? y - 1 : y);
    return { desde: `${yy}-${String(mm).padStart(2,'0')}-01`, hasta: fechaLocalISO(new Date(Date.UTC(yy, mm, 0, 12))), i: m.index, n: m[0].length };
  }
  return null;
}

/* Entiende el pedido. Devuelve la especificación del informe o null (null = no es un pedido de informe) */
function entenderInforme(texto){
  const t0 = _canon(_txt(texto).replace(/[.,]/g, ' ').replace(/\s+/g, ' ').trim());
  if (!t0 || RX_CONSEJO.test(t0)) return null;
  const porTema = RX_EMPIEZA_TEMA.test(t0) && !_plata(t0) && !_cantidad(t0);   // "jornales de Gerardo", "tareas pendientes" (sin plata ni cantidades: no es un registro)
  if (!RX_PIDE.test(t0) && !RX_FUERTE.test(t0) && !porTema) return null;
  const rango = _rangoAmplio(t0);
  const t = rango ? (t0.slice(0, rango.i) + ' ' + t0.slice(rango.i + rango.n)).replace(/\s+/g, ' ').trim() : t0;

  let fuente = null;
  const hayProductoAplicado = () => { const ns = _nombresAplicados(); return t.split(' ').some(w => w.length >= 4 && [...ns].some(n => n.startsWith(w) || w.startsWith(n))) || !!_producto(t); };
  if (/\bcompr/.test(t)) fuente = 'compras';
  else if (/\b(inventario|bodega|stock|existencias?|agotad\w*|por vencer|vencid\w*|se (esta|estan) acabando)\b/.test(t) || /\b(que|cuales) (insumos|productos) (hay|tengo|tenemos|quedan)\b/.test(t)) fuente = 'inventario';
  else if (/\bjornal|mano de obra|\btrabajador/.test(t)) fuente = 'jornales';
  else if (/\b(salidas?|consumos?|descontad\w*)\b/.test(t)) fuente = 'salidas';
  else if (/\b(productos?|insumos?|dosis)\b.*\b(aplicad\w*|usad\w*|echad\w*)\b/.test(t) || (/\b(cuant[oa]|cantidad|total)\b/.test(t) && /\b(aplicad\w*|usad\w*|echad\w*|gastad\w*)\b/.test(t) && hayProductoAplicado())) fuente = 'aplicaciones';
  else if (/cosech|produccion|produjo|\bkilos\b/.test(t)) fuente = 'cosechas';
  else if (/\bvent|\bvend|\bingres/.test(t)) fuente = 'ingresos';
  else if (/plaga|enfermedad/.test(t)) fuente = 'plagas';
  else if (/\btareas?\b|\bpendientes?\b/.test(t)) fuente = 'tareas';
  else if (/rentabilidad|costo por kilo|cuanto (cuesta|sale|vale) (producir|el kilo)|ganancia|utilidad/.test(t)) fuente = 'lotes';
  else if (/gast|egreso|\bpagos?\b|pague|plata|dinero|\bcost|invert/.test(t)) fuente = 'gastos';
  else if (RX_LABOR.test(t) || /\b(labor|labores|bitacora|actividad|actividades|trabajos|se hizo|hicimos|hizo|hecho)\b/.test(t)) fuente = 'labores';
  else if (/\b(lotes|cultivos)\b/.test(t)) fuente = 'lotes';
  if (!fuente && (/\b(resumen|informe|reporte) (general|de la finca|completo|de todo)\b|\bcomo (va|vamos|esta) (la finca|todo)\b/.test(t0)
      || (rango && /\b(resumen|como (vamos|va|nos fue)|que (paso|ha pasado|hubo)|balance|movimientos|novedades|informe|reporte)\b/.test(t0)))) fuente = 'general';
  if (!fuente) return null;

  const lista = RX_LISTA.test(t0);
  let op = 'lista';
  if (/\bprimera vez\b/.test(t)) op = 'primero';
  else if (!lista && (/^(y\s+)?cuando\b|\bultima vez\b|\bhace cuanto\b|\bcuando fue\b/.test(t))) op = 'ultimo';
  else if (!lista && (/cuantas veces/.test(t) || (/\bcuant[oa]s\b/.test(t) && !/cuant[oa]s (kilos|pesos)/.test(t)))) op = 'contar';
  else if (!lista && /\bcuant[oa]\b|\btotal\b|\bsuma\b/.test(t)) op = 'total';
  if (fuente === 'inventario' && op !== 'lista') op = 'lista';

  const g = t.match(/\bpor (lote|lotes|mes|meses|trabajador|trabajadores|persona|categoria|categorias|producto|productos|proveedor)\b/);
  const g2 = !g && t.match(/\b(?:en )?(?:que|cual|cuales) (lote|lotes|mes|meses|trabajador|trabajadores|categoria|categorias|producto|productos)\b/);
  const dim = g ? g[1] : g2 ? g2[1] : null;
  let agrupar = dim ? ({ lotes:'lote', meses:'mes', trabajadores:'persona', trabajador:'persona', categorias:'categoria', productos:'producto' }[dim] || dim) : null;
  if (!agrupar && fuente === 'aplicaciones' && (op === 'total' || /\bmas (usad|aplicad|gastad)/.test(t))) agrupar = 'producto';
  if (!agrupar && fuente === 'gastos' && /\ben (que|donde) (se )?(gast\w*|va|fue|se va|se fue)|\bmas (se gasta|gastamos|plata)|\bmas caro/.test(t)) agrupar = 'categoria';
  if (!agrupar && fuente === 'compras' && /\bmas (comprad|caro)/.test(t)) agrupar = 'producto';

  const lote = _lote(t0);
  const usaCategoria = ['inventario','compras','gastos'].includes(fuente);
  const categoria = usaCategoria ? _categoriaPedida(t) : null;
  const estadoInv = fuente !== 'inventario' ? null : /agotad|se acab|no (hay|queda)/.test(t) ? 'agotado' : /(se (esta|estan) acabando|stock bajo|poco|por reponer)/.test(t) ? 'bajo' : /vencer|vencid/.test(t) ? 'vencer' : /\b(todo|todos|completo)\b/.test(t) ? 'todo' : 'con';
  const estadoTarea = fuente !== 'tareas' ? null : /(completad|hech|terminad|cumplid)/.test(t) ? 'completada' : /\btodas\b/.test(t) ? 'todas' : 'pendiente';
  const estadoPlaga = fuente !== 'plagas' ? null : /activ/.test(t) ? 'activa' : /controlad/.test(t) ? 'controlada' : null;
  const nombresTrab = [...new Set([...(S.cache.jornales||[]).map(j => j.trabajador), ...(S.cache.users||[]).map(u => u.nombre_corto)].filter(Boolean))];
  const persona = ['jornales','gastos','labores','tareas'].includes(fuente)
    ? (nombresTrab.find(n => { const k = _normTxt(n).trim(); return k.length >= 3 && new RegExp('\\b' + _rxEsc(k) + '\\b').test(t0); }) || null) : null;

  const quitar = new Set();
  if (lote) [_normTxt(lote.codigo), ...(_normTxt(lote.codigo).match(/[a-z0-9]+/g)||[])].forEach(w => quitar.add(w));
  if (persona) (_normTxt(persona).match(/[a-z0-9]+/g)||[]).forEach(w => quitar.add(w));
  const palabras = t.split(' ').filter(w => w.length >= 4 && !STOP_INFORME.has(w) && !quitar.has(w) && !/^\d+$/.test(w) && !MESES.includes(w) && !DIAS_SEM.includes(w)
    && !(categoria && CAT_PALABRAS.some(([rx]) => rx.test(w))) && !(fuente === 'cosechas' && /^(cosech|kilo|produc)/.test(w))
    && !(fuente === 'aplicaciones' && /^(aplic|usad|echad|gastad|cantidad|dosis)/.test(w)));
  return { accion:'informe', fuente, op, agrupar, lote_codigo: lote?.codigo || null, persona, categoria, estadoInv, estadoTarea, estadoPlaga, palabras,
    desde: rango?.desde || null, hasta: rango?.hasta || null, _seguro: true };
}

/* Arma el informe: filtra, ordena, agrupa y suma. Devuelve {titulo, filtro, cols, filas, total, texto} */
function generarInforme(q){
  if (q.fuente === 'general') return resumenGeneral(q);
  const src = FUENTES_INF[q.fuente]; if (!src) return null;
  const lote = q.lote_codigo ? resolverLote(q.lote_codigo) : null;
  let filas = src.filas(q);
  const notas = [];
  if (lote && !src.sinLote) filas = filas.filter(f => f.lote_id === lote.id);
  if (q.persona){ const p = _normTxt(q.persona); filas = filas.filter(f => _normTxt(f.persona || '').includes(p) || f.texto.includes(p)); }
  if (q.categoria){ const c = q.categoria; filas = filas.filter(f => c.sub ? (f.sub === c.sub || f.texto.includes(_normTxt(c.sub).slice(0,6))) : (f.cat === c.cat)); }
  if (q.estadoInv === 'con') filas = filas.filter(f => f.cantidad > 0);
  if (q.estadoInv === 'agotado') filas = filas.filter(f => f.cantidad <= 0);
  if (q.estadoInv === 'bajo'){ const ids = new Set(Alerts.compute().stockBajo.map(i => i.id)); filas = filas.filter(f => ids.has(f.item?.id) || f.cantidad <= 0); }
  if (q.estadoInv === 'vencer') filas = filas.filter(f => f.item?.fecha_vencimiento && diasHasta(f.item.fecha_vencimiento) <= 30).map(f => ({ ...f, cant: f.cant + ` · vence ${_fechaCorta(f.item.fecha_vencimiento)}` }));
  if (q.estadoTarea && q.estadoTarea !== 'todas') filas = filas.filter(f => f.est === q.estadoTarea);
  if (q.estadoPlaga) filas = filas.filter(f => f.estado === q.estadoPlaga);
  if (src.fechas){
    if (q.desde) filas = filas.filter(f => f.dia && f.dia >= q.desde);
    if (q.hasta) filas = filas.filter(f => f.dia && f.dia <= q.hasta);
  }
  /* Palabras: cada una debe aparecer (con sus sinónimos). Las que no aparecen en ningún registro se ignoran
     (suelen ser palabras de relleno), salvo que sean un producto o un lote conocido. */
  const todas = src.filas(q), conocidas = _nombresAplicados();
  const grupos = [];
  (q.palabras || []).forEach(w => {
    const alts = _expandir([_raiz(w)]);
    const existe = todas.some(f => alts.some(a => f.texto.includes(a)));
    const esProducto = (S.cache.inventory||[]).some(i => _normTxt(i.descripcion).includes(w.slice(0,5))) || [...conocidas].some(n => n.startsWith(w.slice(0,5)));
    if (existe || esProducto) grupos.push({ w, alts }); else notas.push(w);
  });
  if (grupos.length) filas = filas.filter(f => grupos.every(g => g.alts.some(a => f.texto.includes(a))));
  if (src.fechas) filas.sort((a,b) => q.fuente === 'tareas' && q.estadoTarea === 'pendiente' ? (a.orden||9e15) - (b.orden||9e15) : b.orden - a.orden);
  else filas.sort((a,b) => String(a.categoria||a.lote||'').localeCompare(String(b.categoria||b.lote||'')) || String(a.producto||'').localeCompare(String(b.producto||'')));

  // Título y descripción del filtro
  const temas = grupos.map(g => g.w);
  const esFumig = q.fuente === 'labores' && temas.length && _expandir(temas).some(a => a.startsWith('fumig'));
  let titulo = esFumig ? 'Fumigaciones' : src.titulo;
  if (q.fuente === 'tareas') titulo = q.estadoTarea === 'completada' ? 'Tareas completadas' : q.estadoTarea === 'todas' ? 'Todas las tareas' : 'Tareas pendientes';
  if (q.fuente === 'inventario') titulo = { agotado:'Insumos agotados', bajo:'Insumos por reponer', vencer:'Insumos por vencer', todo:'Inventario completo' }[q.estadoInv] || 'Inventario en bodega';
  if (q.fuente === 'plagas' && q.estadoPlaga) titulo = q.estadoPlaga === 'activa' ? 'Plagas activas' : 'Plagas controladas';
  const filtro = [
    lote ? (/^lote\b/i.test(lote.codigo) ? lote.codigo : 'Lote ' + lote.codigo) : '', q.persona ? q.persona : '', q.categoria ? (q.categoria.sub || q.categoria.cat) : '',
    temas.length && !esFumig ? `con "${temas.join(', ')}"` : (esFumig && temas.length > 1 ? `con "${temas.filter(w => !/^fumig/.test(w)).join(', ')}"` : ''),
    q.desde || q.hasta ? (q.desde === q.hasta ? fmtFecha(q.desde) : `${q.desde ? fmtFecha(q.desde) : 'inicio'} → ${q.hasta ? fmtFecha(q.hasta) : 'hoy'}`) : '',
  ].filter(Boolean).join(' · ');

  const totalPlata = src.unidad === '$' ? filas.reduce((a,f) => a + (f.valor||0), 0) : 0;
  const totalKg = q.fuente === 'cosechas' || q.fuente === 'lotes' ? filas.reduce((a,f) => a + (f.kg||0), 0) : 0;

  // Agrupado: una fila por grupo con cantidad de registros y totales
  let cols = src.cols, filasVista = filas, agrupado = null;
  const claveGrupo = { lote: f => f.lote || _codLote(f.lote_id) || 'Finca', mes: f => _mesDe(f.dia), persona: f => f.persona || f.trabajador || f.asignado || '—',
    categoria: f => f.categoria || f.cat || '—', producto: f => f.producto || f.concepto || '—', proveedor: f => f.proveedor || '—' }[q.agrupar];
  if (claveGrupo){
    const mapa = new Map();
    filas.forEach(f => {
      const k = q.agrupar === 'producto' && f.clave ? f.clave : claveGrupo(f);
      const g = mapa.get(k) || { grupo: claveGrupo(f), n:0, valor:0, kg:0, cant:{}, ultima:'' };
      g.n++; g.valor += f.valor||0; g.kg += f.kg||0; if (f.uni !== undefined) g.cant[f.uni] = (g.cant[f.uni]||0) + (f.cantidad||0);
      if (!g.ultima || (f.dia && f.dia > g.ultima)) g.ultima = f.dia; mapa.set(k, g);
    });
    agrupado = [...mapa.values()].map(g => ({ ...g, cantTxt: Object.entries(g.cant).map(([u,v]) => _fmtCant(v,u)).join(' + '), ultimaTxt: g.ultima ? _fechaCorta(g.ultima) : '' }));
    agrupado.sort((a,b) => (b.valor - a.valor) || (b.kg - a.kg) || (b.n - a.n) || String(a.grupo).localeCompare(String(b.grupo)));
    cols = [['grupo', { lote:'Lote', mes:'Mes', persona:'Persona', categoria:'Categoría', producto:'Producto', proveedor:'Proveedor' }[q.agrupar]], ['n','Registros']];
    if (q.fuente === 'aplicaciones') cols.push(['cantTxt','Cantidad total'], ['ultimaTxt','Última vez']);
    if (src.unidad === '$') cols.push(['valor','Total']);
    if (totalKg) cols.push(['kg','Kilos']);
    filasVista = agrupado;
  }

  // Texto para el chat
  const enc = `📋 ${titulo}${filtro ? ' · ' + filtro : ''}`;
  const rango = filas.length > 1 && src.fechas ? ` (del ${fmtFecha(filas.reduce((m,f) => f.dia && f.dia < m ? f.dia : m, '9999'))} al ${fmtFecha(filas.reduce((m,f) => f.dia > m ? f.dia : m, ''))})` : '';
  const pie = [totalPlata ? `Total: ${fmtMoney(totalPlata)}` : '', totalKg ? `Total cosechado: ${totalKg.toLocaleString('es-CO')} kg` : '', notas.length ? `(No tuve en cuenta: ${notas.join(', ')})` : ''].filter(Boolean).join('\n');
  let texto;
  if (!filas.length) texto = `${enc}\nNo encontré registros con esos filtros.${notas.length ? `\n(No tuve en cuenta: ${notas.join(', ')})` : ''}`;
  else if (q.op === 'ultimo') texto = `${enc}\nÚltima vez: ${fmtFechaLarga(filas[0].dia)}\n${src.linea(filas[0])}\nEn total hay ${filas.length} registro(s)${rango}.`;
  else if (q.op === 'primero') texto = `${enc}\nPrimera vez: ${fmtFechaLarga(filas[filas.length-1].dia)}\n${src.linea(filas[filas.length-1])}`;
  else if (q.op === 'contar' && !agrupado) texto = `${enc}\n${filas.length} registro(s)${rango}.${pie ? '\n' + pie : ''}`;
  else if (q.op === 'total' && !agrupado && (totalPlata || totalKg)) texto = `${enc}\n${totalPlata ? 'Total: ' + fmtMoney(totalPlata) : 'Total cosechado: ' + totalKg.toLocaleString('es-CO') + ' kg'} en ${filas.length} registro(s)${rango}.${notas.length ? `\n(No tuve en cuenta: ${notas.join(', ')})` : ''}\nToca «Ver informe» para ver el detalle.`;
  else if (agrupado){
    const lin = agrupado.map(g => `• ${g.grupo}: ${g.n} registro(s)${g.cantTxt ? ' · ' + g.cantTxt : ''}${g.valor ? ' · ' + fmtMoney(g.valor) : ''}${g.kg ? ' · ' + g.kg.toLocaleString('es-CO') + ' kg' : ''}${g.ultimaTxt && q.fuente === 'aplicaciones' ? ' · última ' + g.ultimaTxt : ''}`);
    texto = `${enc}\n${filas.length} registro(s)${rango}, agrupados por ${cols[0][1].toLowerCase()}:\n${lin.join('\n')}${pie ? '\n' + pie : ''}`;
  } else {
    const MAX = 60;
    const lin = filas.slice(0, MAX).map(src.linea).join('\n');
    texto = `${enc}\n${filas.length} registro(s)${rango}:\n${lin}${filas.length > MAX ? `\n…y ${filas.length - MAX} más. Toca «Ver informe» para verlo completo.` : ''}${pie ? '\n' + pie : ''}`;
  }
  return { titulo, filtro, cols, filas: filasVista, n: filas.length, total: totalPlata, totalKg, texto, agrupado: !!agrupado };
}

/* Resumen de todo en un periodo (por defecto este mes): labores, compras, jornales, cosechas, ventas y balance */
function resumenGeneral(q){
  const hoy = fechaLocalISO(), desde = q.desde || hoy.slice(0,8) + '01', hasta = q.hasta || hoy;
  const base = { op:'lista', palabras:[], desde, hasta, lote_codigo: q.lote_codigo };
  const r = f => generarInforme({ ...base, fuente: f });
  const lab = r('labores'), com = r('compras'), jor = r('jornales'), cos = r('cosechas'), ing = r('ingresos'), sal = r('salidas');
  const apl = generarInforme({ ...base, fuente:'aplicaciones', agrupar:'producto' });
  const fum = generarInforme({ ...base, fuente:'labores', palabras:['fumigacion'] }), abo = generarInforme({ ...base, fuente:'labores', palabras:['fertiliz'] });
  const egresos = com.total + jor.total, periodo = desde === hasta ? fmtFecha(desde) : `${fmtFecha(desde)} → ${fmtFecha(hasta)}`;
  const lote = q.lote_codigo ? resolverLote(q.lote_codigo) : null;
  const filas = [
    { grupo:'Labores anotadas', n: lab.n, valor: 0 }, { grupo:' · fumigaciones', n: fum.n, valor: 0 }, { grupo:' · fertilizaciones', n: abo.n, valor: 0 },
    { grupo:'Compras', n: com.n, valor: com.total }, { grupo:'Jornales', n: jor.n, valor: jor.total }, { grupo:'Insumos usados (costo)', n: sal.n, valor: sal.total },
    { grupo:'Cosechas', n: cos.n, valor: 0, kg: cos.totalKg }, { grupo:'Ventas e ingresos', n: ing.n, valor: ing.total },
  ];
  const top = apl.agrupado ? apl.filas.slice(0, 5).map(g => `${g.grupo} ${g.cantTxt}`).join(', ') : '';
  const texto = [`📊 Resumen ${lote ? 'de ' + lote.codigo + ' ' : ''}· ${periodo}`,
    `📝 Labores: ${lab.n} (fumigaciones ${fum.n}, fertilizaciones ${abo.n})`,
    `🛒 Compras: ${com.n} · ${fmtMoney(com.total)}`, `👷 Jornales: ${jor.n} · ${fmtMoney(jor.total)}`,
    sal.n ? `📦 Insumos usados: ${fmtMoney(sal.total)}` : '', cos.n ? `🧺 Cosechas: ${cos.n} · ${cos.totalKg.toLocaleString('es-CO')} kg` : '',
    ing.n ? `💰 Ventas: ${ing.n} · ${fmtMoney(ing.total)}` : '', `💸 Gastado (compras + jornales): ${fmtMoney(egresos)}`,
    ing.n ? `⚖️ Balance: ${fmtMoney(ing.total - egresos)}` : '', top ? `🧪 Productos más aplicados: ${top}` : '',
    'Pide el detalle de cada tema, por ejemplo «compras de este mes».'].filter(Boolean).join('\n');
  return { titulo: 'Resumen general', filtro: [lote?.codigo, periodo].filter(Boolean).join(' · '), cols: [['grupo','Tema'],['n','Registros'],['valor','Total'],['kg','Kilos']],
    filas, n: filas.length, total: egresos, totalKg: cos.totalKg, texto, agrupado: true };
}

/* Informe a partir de lo que escribió el usuario (null si no es un pedido de informe) */
function informeLocal(texto){ const q = entenderInforme(texto); return q ? generarInforme(q) : null; }

/* ── Vista del informe: tabla completa, copiar, compartir y descargar en CSV (abre en Excel) ── */
function _celda(f, k){ const v = f[k]; if (k === 'valor') return v ? fmtMoney(v) : ''; if (k === 'kg') return v ? v.toLocaleString('es-CO') : ''; return v == null ? '' : String(v); }
function _csvInforme(inf){
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const filas = inf.filas.map(f => inf.cols.map(([k]) => q(k === 'valor' ? Math.round(f[k]||0) : k === 'kg' ? (f[k]||0) : (k === 'fecha' && f.dia) ? f.dia : _celda(f, k))).join(';'));
  return '﻿' + [`${q(inf.titulo)};${q(inf.filtro||'')}`, inf.cols.map(([,l]) => q(l)).join(';'), ...filas,
    inf.total ? `${q('TOTAL')};${q(Math.round(inf.total))}` : ''].filter(Boolean).join('\r\n');
}
window.abrirInforme = function(inf){
  if (typeof inf === 'number') inf = (S.messages[inf] || {}).informe;
  if (!inf) return;
  const head = inf.cols.map(([,l]) => `<th>${esc(l)}</th>`).join('');
  const body = inf.filas.map(f => `<tr>${inf.cols.map(([k]) => `<td class="${k === 'valor' || k === 'kg' || k === 'n' ? 'num' : ''}">${esc(_celda(f, k))}</td>`).join('')}</tr>`).join('');
  const html = `<div class="modal-h"><i class="ti ti-report-analytics"></i> ${esc(inf.titulo)}</div>
    <div class="modal-sub">${esc(inf.filtro || 'Todos los registros')} · ${inf.n} registro(s)${inf.total ? ' · <b>' + fmtMoney(inf.total) + '</b>' : ''}${inf.totalKg ? ' · <b>' + inf.totalKg.toLocaleString('es-CO') + ' kg</b>' : ''}</div>
    <div class="inf-wrap">${inf.filas.length ? `<table class="inf-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` : '<div class="text-small" style="padding:14px;text-align:center">Sin registros.</div>'}</div>
    <div class="modal-actions" style="flex-wrap:wrap;gap:6px">
      <button class="btn btn-ghost" id="inf-copiar"><i class="ti ti-copy"></i> Copiar</button>
      <button class="btn btn-ghost" id="inf-csv"><i class="ti ti-file-spreadsheet"></i> Excel</button>
      <button class="btn btn-primary" id="inf-compartir"><i class="ti ti-share"></i> Compartir</button>
    </div>`;
  M._open(html);
  document.getElementById('inf-copiar').onclick = async () => { try{ await navigator.clipboard.writeText(inf.texto); toast('Informe copiado'); }catch(e){ toast('No se pudo copiar'); } };
  document.getElementById('inf-csv').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([_csvInforme(inf)], { type:'text/csv;charset=utf-8' }));
    a.download = `${_normTxt(inf.titulo).replace(/[^a-z0-9]+/g, '-')}-${fechaLocalISO()}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  document.getElementById('inf-compartir').onclick = async () => {
    if (navigator.share){ try{ await navigator.share({ title: inf.titulo, text: inf.texto }); }catch(e){} }
    else { try{ await navigator.clipboard.writeText(inf.texto); toast('Copiado: pégalo donde quieras compartirlo'); }catch(e){} }
  };
};

/* Ficha o datos de un producto de bodega: "para qué sirve lannate", "ficha del engeo" */
function fichaLocal(t){
  const m = t.match(/\b(para que sirve|que es|que hace|ficha( tecnica)?( de| del)?|informacion (de|del|sobre)|datos (de|del)|caracteristicas (de|del)|ingrediente activo (de|del)|franja (de|del)|toxicidad (de|del))\s+(el |la |los |las )?(.+)$/);
  if (!m) return null;
  const nombre = m[m.length - 1].replace(/[?¿!.]/g, '').trim();
  const r = buscarDifuso(nombre, S.cache.inventory || [], 'descripcion'), it = r.exacto || r.sugerido;
  if (!it) return null;
  const base = `📦 ${it.descripcion}\n${[it.categoria, subcatActual(it.subcategoria)].filter(Boolean).join(' · ')}${it.detalles ? '\nComposición: ' + it.detalles : ''}${it.franja_toxicologica ? '\nFranja: ' + it.franja_toxicologica : ''}\nEn bodega: ${it.cantidad_actual} ${it.unidad_medida || ''}`;
  if (it.ficha_investigacion) return { texto: `${base}\n\n🔬 Ficha guardada:\n${it.ficha_investigacion}` };
  return { texto: `${base}\n\nTodavía no tiene ficha técnica guardada.`, boton: { label:'Investigar con IA (1 consulta)', icon:'ti-microscope', fn:'flowInvestigarInsumo', arg: it.id } };
}

/* Apuntes guardados (memoria): "recuerda que…" guarda; "qué sabemos de…" busca */
function apunteLocal(texto, t){
  let m = String(texto).match(/^\s*(recuerda|recordar|anota|apunta|guarda|ten en cuenta)\s+que\s+(.+)$/i);
  if (m && !/\brecuerdame\b/.test(t)) return { propuesta: { accion:'apunte', contenido: _frase(m[2]), resumen:'Lo guardo como apunte de la finca' } };
  m = t.match(/\b(que (sabemos|sabes|recuerdas|tenemos anotado|hay anotado)|apuntes?|notas?) (de|del|sobre|acerca de)\s+(.+)$/);
  if (!m) return null;
  const pal = m[4].split(/\s+/).filter(w => w.length >= 4).map(_raiz);
  const hits = (S.cache.memoria || []).filter(x => { const c = _normTxt(x.contenido); return pal.some(w => c.includes(w)); });
  return { texto: hits.length ? `🧠 Apuntes sobre "${m[4]}":\n` + hits.map(x => `• ${x.contenido}${x.fecha ? ' (' + _fechaCorta(x.fecha) + ')' : ''}`).join('\n') : `No tengo apuntes sobre "${m[4]}". Puedes guardar uno con «recuerda que …».` };
}

/* Borrar o corregir el último registro de un tipo: "borra la última labor", "corrige el último gasto" */
function ultimoRegistroLocal(t){
  const m = t.match(/\b(borra|borrar|borre|elimina|eliminar|quita|quitar|deshacer|deshaz|corrige|corregir|edita|editar|cambia|cambiar|modifica|modificar|arregla)\b.*\b(ultim[oa]|anterior)\b|^(deshacer|deshaz)\b/);
  if (!m) return null;
  const borrar = /\b(borr|elimin|quit|deshac|deshaz)/.test(t);
  const cuando = (x, f) => tsOrden(x.creado_en || x.created_at || f(x));
  const ult = (lista, f) => (lista || []).slice().sort((a,b) => cuando(b, f) - cuando(a, f))[0];
  let tipo = /jornal/.test(t) ? 'jornal' : /cosech/.test(t) ? 'cosecha' : /\b(venta|ingreso)/.test(t) ? 'ingreso' : /\b(gasto|compra)/.test(t) ? 'gasto' : /tarea/.test(t) ? 'tarea' : 'labor';
  const R = {
    labor:   () => { const x = ult(S.cache.activities, y => y.fecha); return x && { desc:`${_fechaCorta(x.fecha)} · ${x.actividad}`, del:['flowDeleteActivity', x.id], edit:['flowEditActivity', x.id, x.actividad] }; },
    gasto:   () => { const x = ult((S.cache.compras||[]).filter(c => c.origen !== 'consumo'), y => y.fecha_compra); return x && { desc:`${_fechaCorta(x.fecha_compra)} · ${x.concepto} · ${fmtMoney(x.valor_total)}`, del:['flowDeleteGasto', x.id, x.concepto], edit:['flowEditGasto', x.id, x.concepto, x.valor_total, x.categoria] }; },
    jornal:  () => { const x = ult(S.cache.jornales, y => y.fecha); return x && { desc:`${_fechaCorta(x.fecha)} · ${x.trabajador} · ${fmtMoney(x.valor_total)}`, del:['flowDeleteJornal', x.id], edit:['flowEditJornal', x.id] }; },
    cosecha: () => { const x = ult(S.cache.cosechas, y => y.fecha_recoleccion); return x && { desc:`${_fechaCorta(x.fecha_recoleccion)} · ${x.volumen_kg} kg`, del:['flowDeleteCosecha', x.id], edit:['flowEditCosecha', x.id] }; },
    ingreso: () => { const x = ult(S.cache.ingresos, y => y.fecha); return x && { desc:`${_fechaCorta(x.fecha)} · ${x.concepto} · ${fmtMoney(x.valor_total)}`, del:['flowDeleteIngreso', x.id, x.concepto], edit:['flowEditIngreso', x.id, x.concepto, x.valor_total] }; },
    tarea:   () => { const x = ult(S.cache.tasks, y => y.creado_en); return x && { desc:x.titulo, del:['flowDeleteTask', x.id, x.titulo], edit:['flowEditTask', x.id] }; },
  };
  const r = R[tipo]();
  if (!r) return { texto:`No encontré ningún registro de ese tipo (${tipo}).` };
  const [fn, ...args] = borrar ? r.del : r.edit;
  return { ejecutar: () => window[fn](...args), texto: `${borrar ? '🗑️ Último' : '✏️ Último'} registro de ${tipo}: ${r.desc}` };
}

/* Si la frase no se entendió: el usuario elige qué es (sin IA) */
const OPCIONES_REGISTRO = [
  { value:'bitacora', label:'Anotar como labor', icon:'ti-notebook' }, { value:'gasto', label:'Registrar gasto', icon:'ti-receipt', color:'red' },
  { value:'jornal', label:'Registrar jornal', icon:'ti-users', color:'brown' }, { value:'ingreso', label:'Registrar venta o ingreso', icon:'ti-cash', color:'blue' },
  { value:'tareas', label:'Programar tarea', icon:'ti-calendar-plus', color:'yellow' }, { value:'entrada', label:'Entró a bodega (compra)', icon:'ti-download', color:'brown' },
  { value:'salida', label:'Salió de bodega (uso)', icon:'ti-upload', color:'brown' },
  { value:'apunte', label:'Guardar como apunte', icon:'ti-bulb' }, { value:'ia', label:'Preguntar a la IA (gasta cuota)', icon:'ti-sparkles', color:'blue' },
];
function propuestaForzada(tipo, texto){
  const t = String(texto||'').trim();
  if (tipo === 'apunte') return { accion:'apunte', contenido:_frase(t), resumen:'Lo guardo como apunte de la finca' };
  if (tipo === 'entrada' || tipo === 'salida'){
    const p = interpretarLocal('bodega', (tipo === 'entrada' ? 'entró ' : 'usé ') + t);
    return (p && p.accion === tipo) ? p : { accion:tipo, producto:'', cantidad:'', unidad:'', precio_total:'', lote_codigo:null, fecha:hoyISO(), resumen:'Revisa y completa' };
  }
  if (tipo === 'gasto' || tipo === 'jornal' || tipo === 'ingreso'){
    const pista = { gasto:'gasté ', jornal:'jornal ', ingreso:'vendimos ' }[tipo];
    const p = interpretarLocal('dinero', /^(gast|jornal|vend)/i.test(t) ? t : pista + t);
    if (p && p.accion === tipo) return p;
    return tipo === 'jornal' ? { accion:'jornal', trabajador:'', dias:1, valor_dia:'', lote_codigo:null, fecha:hoyISO(), resumen:'Revisa y completa' }
      : tipo === 'ingreso' ? { accion:'ingreso', concepto:_frase(t), valor:'', fecha:hoyISO(), resumen:'Revisa y completa' }
      : { accion:'gasto', concepto:_frase(t), valor:'', categoria:'otro', lote_codigo:null, fecha:hoyISO(), resumen:'Revisa y completa' };
  }
  const p = interpretarLocal(tipo, t);
  if (p && p.accion !== 'informe') return p;
  if (tipo === 'bitacora') return { accion:'registrar_labor', actividad:_frase(t), fecha:hoyISO(), lote_codigo:null, insumos:[], resumen:'Revisa y completa' };
  if (tipo === 'tareas') return { accion:'crear_tarea', titulo:_frase(t), fecha_limite:'', asignado:'todos', lote_codigo:null, resumen:'Revisa y completa' };
  return null;
}

/* ── El cerebro: decide qué hacer. Devuelve
     {texto, informe?, boton?}        → respuesta para mostrar
     {propuesta, dominio}             → tarjeta para confirmar y guardar
     {ejecutar, texto}                → abre un flujo de la app (borrar/editar)
     {elegir:true}                    → no entendí: que el usuario elija
     {ia:true, texto}                 → es una consulta de consejo (botón de IA) ── */
function pensar(texto, dominio){
  const raw = String(texto||'').trim(); if (!raw) return null;
  const t = _txt(raw).replace(/\s+/g, ' ').trim();
  const corto = t.split(' ').length <= 6;

  if (/^(ia|ai|gemini|pregunta(le)? a la ia|preguntale a la ia|consulta a la ia)\b[:,]?\s*/.test(t)) return { ia:true, directo:true, texto: raw.replace(/^\s*(ia|ai|gemini|preg[uú]nta(le)? a la ia|consulta a la ia)\s*[:,]?\s*/i, '') };
  if (corto && /^(hola|holi|buenas|buenos dias|buenas tardes|buenas noches|hey|que mas|quiubo|epa|saludos)\b/.test(t) && !RX_LABOR.test(t)) return { texto: saludoLocal() };
  if (/^(ayuda|help|menu|\?)$|\b(que (puedes|sabes) hacer|como (funciona|te uso|se usa)|que te puedo (decir|preguntar|pedir)|comandos|ejemplos)\b/.test(t)) return { texto: AYUDA };
  if (corto && /^(gracias|muchas gracias|listo|ok|okey|vale|perfecto|bien|excelente|de una)\b/.test(t)) return { texto: '👍 Con gusto.' };
  const nav = t.match(/^(abre|abrir|abreme|ir a|ve a|vamos a|llevame a|muestrame la pestana de|pestana)\s+(la |el |los |las )?(\w+)/);
  if (nav && PESTANAS[nav[3]]) return { ir: PESTANAS[nav[3]], texto: `Listo, abrí ${nav[3]}.` };

  const rapido = respuestaLocal(raw); if (rapido) return { texto: rapido };
  const ficha = fichaLocal(t); if (ficha) return ficha;
  const apunte = apunteLocal(raw, t); if (apunte) return apunte.propuesta ? { propuesta: apunte.propuesta, dominio:'apunte' } : apunte;
  const ultimo = ultimoRegistroLocal(t); if (ultimo) return ultimo;
  if (dominio === 'mapas') return { texto: respuestaMapas(raw) };

  const inf = informeLocal(raw); if (inf) return { texto: inf.texto, informe: inf };

  // Registros: primero la sección donde se escribe, después lo que diga el texto
  const dom = (dominio && dominio !== 'agente' && dominio !== 'mapas') ? dominio : dominioDeTexto(raw);
  if (dom){
    const p = interpretarLocal(dom, raw);
    if (p && p.accion !== 'informe' && (p._seguro || dominio === dom)) return { propuesta: p, dominio: dom };
    if (!p && dominio === dom && !_pareceAPregunta(raw)){
      if (dom === 'bitacora') return { propuesta: propuestaForzada('bitacora', raw), dominio: dom };
      if (dom === 'tareas') return { propuesta: propuestaForzada('tareas', raw), dominio: dom };
    }
    if (p && p.accion !== 'informe') return { propuesta: p, dominio: dom };
  }
  if (_pareceAPregunta(raw) || RX_CONSEJO.test(t)) return { ia:true, texto: raw };
  return { elegir:true };
}

/* IA pequeña para consejos: una sola llamada, sin herramientas y con poco contexto */
async function consejoIA(pregunta, media){
  if (!iaDisponible()) return S.isOnline ? '⏳ La IA está sin cuota por ahora. Intenta más tarde.' : '📵 Sin internet no puedo preguntarle a la IA.';
  const lotes = (S.cache.lotes||[]).map(l => `${l.codigo} (${[l.cultivo, l.variedad].filter(Boolean).join(' ')}, ${l.estado}${l.fecha_siembra ? ', ' + diasDesde(l.fecha_siembra) + ' días de sembrado' : ''})`).join('; ');
  const bodega = (S.cache.inventory||[]).filter(i => (parseFloat(i.cantidad_actual)||0) > 0).map(i => i.descripcion).slice(0, 80).join(', ');
  const sys = `Eres asesor agronómico de la finca El Retiro (Pradera, Valle del Cauca, Colombia). Hoy es ${fechaLarga()}. Responde en español sencillo, práctico y corto (máximo 160 palabras), sin markdown.
Lotes: ${lotes || 'ninguno'}. Productos en bodega: ${bodega || 'ninguno'}.${Weather.contextForAgent()}
Si recomiendas productos, prioriza los que hay en bodega. Advierte riesgos de mezclas y toxicidad sin rodeos. Si no estás seguro, dilo.`;
  const parts = [{ text: pregunta || 'Analiza esta foto de la finca: qué ves y qué recomiendas.' }];
  if (media){ let md = media; try{ md = await comprimirParaAgente(media); }catch(e){} parts.unshift({ inlineData:{ mimeType: md.type, data: md.b64 } }); }
  const r = await llamarGemini({ contents:[{ role:'user', parts }], systemInstruction:{ parts:[{ text: sys }] }, generationConfig:{ maxOutputTokens: 700, temperature: 0.4 } });
  if (!r.ok) return r.status === 429 ? '⏳ La IA se quedó sin cuota por ahora. Lo demás de la app sigue funcionando.' : '⚠️ No pude hablar con la IA (sin red).';
  const txt = (r.data.candidates?.[0]?.content?.parts || []).filter(p => p.text).map(p => p.text).join('').trim();
  return txt ? '🤖 ' + txt : '🤖 La IA no respondió nada.';
}
function fechaLarga(){ return new Date().toLocaleDateString('es-CO', { weekday:'long', year:'numeric', month:'long', day:'numeric', timeZone: TZ_FINCA }); }

/* Confirma y guarda una propuesta. Devuelve el texto del resultado o '' si se canceló */
async function confirmarYGuardar(dominio, prop){
  const v = await confirmAccion(dominio, prop);
  if (!v) return '';
  try{ return await ejecutarAccion(v) || '✅ Hecho.'; }
  catch(e){ return '⚠️ Error: ' + e.message; }
}
async function elegirTipo(texto){
  return await M.select({ title:'¿Qué hago con esto?', sub: esc(texto), options: OPCIONES_REGISTRO });
}

/* Barra de cada sección */
async function flowAgenteSeccion(dominio, texto){
  if (!texto) return;
  const ag = AGENTES[dominio] || { nombre:'Finca', icon:'ti-leaf' };
  const mostrar = (txt) => M.confirm({ title:`<i class="ti ${ag.icon}"></i> ${ag.nombre}`, body: esc(txt).replace(/\n/g,'<br>'), okText:'Entendido', cancelText:'' });
  let r = pensar(texto, dominio);
  if (!r) return;
  if (r.ir){ S.tab = r.ir; Nav.push(); render(); return; }
  if (r.ejecutar){ await r.ejecutar(); return; }
  if (r.informe){ abrirInforme(r.informe); return; }
  if (r.elegir){
    const tipo = await elegirTipo(texto); if (!tipo) return;
    if (tipo === 'ia'){ await mostrar(await consejoIA(texto)); return; }
    r = { propuesta: propuestaForzada(tipo, texto), dominio: tipo };
    if (!r.propuesta) return;
  }
  if (r.ia){
    const ok = r.directo || await M.confirm({ title:'Pregunta de consejo', body:'Esto no está en los registros de la finca. ¿Se lo pregunto a la IA? (gasta 1 consulta de la cuota)', okText:'Preguntar a la IA', cancelText:'No' });
    if (ok) await mostrar(await consejoIA(r.texto));
    return;
  }
  if (r.propuesta){
    const msg = await confirmarYGuardar(r.dominio, r.propuesta);
    if (msg) toast(msg);
    render(); return;
  }
  if (r.texto) await mostrar(r.texto);
}

/* Botón «Preguntar a la IA» en un mensaje del chat */
window.preguntarIA = async function(idx){
  const m = S.messages[idx]; if (!m || !m.preguntaIA) return;
  const pregunta = m.preguntaIA; m.preguntaIA = null;
  S.loading = true; render();
  const resp = await consejoIA(pregunta);
  S.messages.push({ role:'assistant', content: resp });
  S.loading = false; render();
  setTimeout(() => document.getElementById('chat-end')?.scrollIntoView({behavior:'smooth'}), 60);
};
window.botonMensaje = function(idx){
  const b = S.messages[idx]?.boton; if (!b || typeof window[b.fn] !== 'function') return;
  window[b.fn](b.arg);
};

/* Chat principal: todo pasa por el cerebro */
async function atenderChat(texto, media){
  const hist = S.messages;
  const decir = (content, extra = {}) => hist.push({ role:'assistant', content, ...extra });
  if (media){
    decir(await consejoIA(texto, media));
    return;
  }
  let r = pensar(texto, 'agente');
  if (!r) return;
  if (r.ir){ decir(r.texto); S.tab = r.ir; Nav.push(); return; }
  if (r.ejecutar){ decir(r.texto); S.loading = false; render(); await r.ejecutar(); return; }
  if (r.informe){ decir(r.texto, { informe: r.informe }); return; }
  if (r.elegir){
    S.loading = false; render();
    const tipo = await elegirTipo(texto);
    if (!tipo){ decir('No guardé nada. Escribe «ayuda» para ver ejemplos de lo que entiendo.'); return; }
    if (tipo === 'ia'){ S.loading = true; render(); decir(await consejoIA(texto)); return; }
    r = { propuesta: propuestaForzada(tipo, texto), dominio: tipo };
    if (!r.propuesta){ decir('No pude armar ese registro; inténtalo desde la sección.'); return; }
  }
  if (r.ia){
    if (r.directo){ decir(await consejoIA(r.texto)); return; }
    decir('🤔 Esa es una pregunta de consejo y no está en los registros de la finca. Puedo preguntársela a la IA (gasta 1 consulta de la cuota).', { preguntaIA: r.texto });
    return;
  }
  if (r.propuesta){
    S.loading = false; render();
    const msg = await confirmarYGuardar(r.dominio, r.propuesta);
    decir(msg || 'Listo, no guardé nada.');
    return;
  }
  decir(r.texto, r.boton ? { boton: r.boton } : {});
}

/* Campos editables según la acción propuesta (para confirmar/editar en el momento) */
function camposDe(prop){
  const lotesOpts=[{value:'',label:'Sin lote / finca'},...(S.cache.lotes||[]).map(l=>({value:l.codigo,label:`${l.codigo} · ${l.cultivo}`}))];
  const userOpts=[{value:'todos',label:'Toda la finca'},...(S.cache.users||[]).map(u=>({value:u.nombre_corto,label:u.nombre_corto}))];
  switch(prop.accion){
    case 'registrar_labor':{
      const f=[{k:'actividad',label:'Labor',type:'text',v:prop.actividad||''},
        {k:'fecha',label:'Fecha',type:'date',v:prop.fecha||hoyISO()},
        {k:'lote_codigo',label:'Lote',type:'select',v:prop.lote_codigo||'',options:lotesOpts}];
      const ins = prop.insumos || (prop.insumo ? [prop.insumo] : []);
      ins.slice(0, 12).forEach((x, n) => f.push({k:`_ins_${n}_nombre`,label:`Insumo ${n+1} (se descuenta de bodega)`,type:'text',v:x.nombre||''},
        {k:`_ins_${n}_cant`,label:'Cantidad',type:'number',v:x.cantidad||''},
        {k:`_ins_${n}_uni`,label:'Unidad',type:'text',v:x.unidad||''}));
      return f;
    }
    case 'entrada': return [{k:'producto',label:'Producto',type:'text',v:prop.producto||''},
      {k:'cantidad',label:'Cantidad',type:'number',v:prop.cantidad||''},{k:'unidad',label:'Unidad',type:'text',v:prop.unidad||''},
      {k:'precio_total',label:'Precio total (opcional)',type:'number',v:prop.precio_total||''},{k:'fecha',label:'Fecha',type:'date',v:prop.fecha||hoyISO()}];
    case 'salida': return [{k:'producto',label:'Producto',type:'text',v:prop.producto||''},
      {k:'cantidad',label:'Cantidad',type:'number',v:prop.cantidad||''},{k:'unidad',label:'Unidad',type:'text',v:prop.unidad||''},
      {k:'lote_codigo',label:'Lote',type:'select',v:prop.lote_codigo||'',options:lotesOpts}];
    case 'gasto': return [{k:'concepto',label:'Concepto',type:'text',v:prop.concepto||''},{k:'valor',label:'Valor',type:'number',v:prop.valor||''},
      {k:'categoria',label:'Categoría',type:'text',v:prop.categoria||'otro'},{k:'lote_codigo',label:'Lote',type:'select',v:prop.lote_codigo||'',options:lotesOpts},{k:'fecha',label:'Fecha',type:'date',v:prop.fecha||hoyISO()}];
    case 'ingreso': return [{k:'concepto',label:'Concepto',type:'text',v:prop.concepto||''},{k:'valor',label:'Valor',type:'number',v:prop.valor||''},{k:'fecha',label:'Fecha',type:'date',v:prop.fecha||hoyISO()}];
    case 'jornal': return [{k:'trabajador',label:'Trabajador',type:'text',v:prop.trabajador||''},{k:'dias',label:'Días',type:'number',v:prop.dias||1},
      {k:'valor_dia',label:'Valor por día',type:'number',v:prop.valor_dia||''},{k:'lote_codigo',label:'Lote',type:'select',v:prop.lote_codigo||'',options:lotesOpts},{k:'fecha',label:'Fecha',type:'date',v:prop.fecha||hoyISO()}];
    case 'crear_tarea': return [{k:'titulo',label:'Tarea',type:'text',v:prop.titulo||''},{k:'fecha_limite',label:'Fecha límite',type:'date',v:prop.fecha_limite||''},{k:'asignado',label:'Asignado a',type:'select',v:prop.asignado||'todos',options:userOpts},{k:'lote_codigo',label:'Lote',type:'select',v:prop.lote_codigo||'',options:lotesOpts}];
    case 'completar_tarea': return [{k:'titulo',label:'Tarea a completar',type:'text',v:prop.titulo||''}];
    case 'apunte': return [{k:'contenido',label:'Apunte para recordar',type:'text',v:prop.contenido||''}];
    case 'cosecha': return [{k:'kilos',label:'Kilos',type:'number',v:prop.kilos||''},{k:'calidad',label:'Calidad',type:'select',v:prop.calidad||'normal',options:[{value:'primera',label:'Primera'},{value:'normal',label:'Normal'},{value:'segunda',label:'Segunda'}]},
      {k:'lote_codigo',label:'Lote',type:'select',v:prop.lote_codigo||'',options:lotesOpts},{k:'observaciones',label:'Observaciones',type:'text',v:prop.observaciones||''},{k:'fecha',label:'Fecha',type:'date',v:prop.fecha||hoyISO()}];
    case 'crear_lote': return [{k:'codigo',label:'Código',type:'text',v:prop.codigo||''},{k:'cultivo',label:'Cultivo',type:'text',v:prop.cultivo||''},{k:'variedad',label:'Variedad',type:'text',v:prop.variedad||''}];
    case 'estado_lote': return [{k:'lote_codigo',label:'Lote',type:'select',v:prop.lote_codigo||'',options:lotesOpts},{k:'estado',label:'Estado',type:'select',v:prop.estado||'',options:['planificación','siembra','vegetativo','producción','cosecha','descanso'].map(e=>({value:e,label:e}))}];
    default: return [];
  }
}

/* Tarjeta de confirmación con edición en el momento. Devuelve valores o null */
async function confirmAccion(dominio, prop){
  const campos = camposDe(prop);
  const [icono, titulo] = ACCIONES_UI[prop.accion] || ['ti-check', 'Confirmar'];
  const fieldsHtml = campos.map((f,i)=>{
    const id='ca-'+i;
    if(f.type==='select'){ const opts=(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.v)?'selected':''}>${esc(o.label)}</option>`).join(''); return `<div class="modal-field"><label class="modal-label">${esc(f.label)}</label><select class="modal-select" id="${id}">${opts}</select></div>`; }
    return `<div class="modal-field"><label class="modal-label">${esc(f.label)}</label><input class="modal-input" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" id="${id}" value="${esc(f.v)}"></div>`;
  }).join('');
  const html=`<div class="modal-h"><i class="ti ${icono}"></i> ${esc(titulo)}</div>
    <div class="modal-sub"><i class="ti ti-eye"></i> ${esc(prop.resumen||'Revisa y confirma')}</div>
    ${fieldsHtml}
    <div class="modal-actions"><button class="btn btn-ghost" id="ca-cancel">Cancelar</button><button class="btn btn-primary" id="ca-ok"><i class="ti ti-check"></i> Confirmar</button></div>`;
  return await new Promise(resolve=>{
    document.getElementById('modal-host').innerHTML=`<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const close=v=>{document.getElementById('modal-host').innerHTML='';resolve(v);};
    document.querySelector('#m-ov').addEventListener('click',e=>{if(e.target===e.currentTarget)close(null);});
    document.getElementById('ca-cancel').onclick=()=>close(null);
    document.getElementById('ca-ok').onclick=()=>{
      const out={accion:prop.accion};
      campos.forEach((f,i)=>{ out[f.k]=document.getElementById('ca-'+i).value; });
      close(out);
    };
  });
}

/* Resuelve un producto por nombre con coincidencia difusa (pregunta si hay duda) */
async function resolverProducto(nombre){
  const r=buscarDifuso(nombre,S.cache.inventory||[],'descripcion');
  if(r.exacto) return r.exacto;
  if(r.sugerido){ const ok=await M.confirm({title:'¿Quisiste decir…?',body:`No encontré "${esc(nombre)}". ¿Te refieres a <b>${esc(r.sugerido.descripcion)}</b>?`,okText:'Sí, ese',cancelText:'No'}); if(ok) return r.sugerido; }
  return null;
}
function resolverLote(cod){ if(!cod) return null; const r=buscarDifuso(cod,S.cache.lotes||[],'codigo'); return r.exacto||r.sugerido||null; }

/* Ejecuta la acción confirmada usando los handlers existentes */
async function ejecutarAccion(v){
  const conv=(cant,uni,base,bk)=>{ let c=convertirUnidad(parseFloat(cant)||0,uni,base,bk); return c===null?(parseFloat(cant)||0):c; };
  switch(v.accion){
    case 'registrar_labor':{
      const lote=resolverLote(v.lote_codigo);
      await HANDLERS.log_activity({lote_id:lote?.id||null, codigo:lote?.codigo||null, actividad:v.actividad, fecha:v.fecha||null});
      const descontados=[], faltan=[];
      for(let n=0; v[`_ins_${n}_nombre`]!==undefined; n++){
        const nom=v[`_ins_${n}_nombre`], cant=v[`_ins_${n}_cant`], uni=v[`_ins_${n}_uni`];
        if(!nom || !(parseFloat(cant)>0)) continue;
        const it=await resolverProducto(nom);
        if(!it){ faltan.push(nom); continue; }
        const r=await consumirInsumo({itemId:it.id, cantidad:conv(cant, uni||it.unidad_medida, it.unidad_medida), loteId:lote?.id||null});
        if(r.success) descontados.push(`${it.descripcion} -${Math.round(r.usado*100)/100} ${r.unidad}`); else faltan.push(`${nom} (${r.msg})`);
      }
      return '📝 Labor registrada' + (descontados.length ? `\n📦 Descontado de bodega: ${descontados.join(', ')}` : '') + (faltan.length ? `\n⚠️ No descontado (no está en bodega o sin stock): ${faltan.join(', ')}` : '');
    }
    case 'entrada':{
      const it=await resolverProducto(v.producto);
      const precio=parseFloat(v.precio_total)||0;
      if(it){ const cant=conv(v.cantidad, v.unidad||it.unidad_medida, it.unidad_medida); await HANDLERS.restock_inventory(it.id, cant, precio); if(precio>0) await HANDLERS.add_gasto({concepto:`${it.descripcion} (reposición)`, categoria:it.categoria||'otro', valor_total:precio, fecha:v.fecha||null}); return '📦 Entrada registrada en bodega'; }
      // No existe → crear con el formulario (prellenado)
      toast('Producto nuevo, complétalo'); flowNewInsumo(null,{desc:v.producto,can:v.cantidad,uni:v.unidad,pre:v.precio_total}); return '';
    }
    case 'salida':{
      const it=await resolverProducto(v.producto);
      if(!it) return '⚠️ No encontré ese producto en bodega';
      const lote=resolverLote(v.lote_codigo);
      const cant=conv(v.cantidad, v.unidad||it.unidad_medida, it.unidad_medida);
      const r=await consumirInsumo({itemId:it.id, cantidad:cant, loteId:lote?.id||null});
      return r.success?`📦 Salida: -${r.usado} ${r.unidad} de ${r.descripcion}${r.costo>0?' · '+fmtMoney(r.costo):''}`:('⚠️ '+r.msg);
    }
    case 'apunte':{ const r=await HANDLERS.save_memory({contenido:v.contenido}); if(r.success && S.isOnline) S.cache.memoria.unshift({contenido:v.contenido, fecha:ahoraLocalISO()}); return r.success?'🧠 Apunte guardado':('⚠️ '+r.msg); }
    case 'gasto':{ const lote=resolverLote(v.lote_codigo); await HANDLERS.add_gasto({concepto:v.concepto,categoria:v.categoria||'otro',valor_total:parseFloat(v.valor)||0,lote_id:lote?.id||null,fecha:v.fecha||null}); return '💸 Gasto registrado'; }
    case 'ingreso':{ await HANDLERS.add_ingreso({concepto:v.concepto,valor_total:parseFloat(v.valor)||0,fecha:v.fecha||null}); return '💰 Ingreso registrado'; }
    case 'jornal':{ const lote=resolverLote(v.lote_codigo); const r=await HANDLERS.registrar_jornal({trabajador:v.trabajador,dias:parseFloat(v.dias)||1,valor_dia:parseFloat(v.valor_dia)||0,lote_id:lote?.id||null,fecha:v.fecha||null}); return r.success?`👷 Jornal · ${fmtMoney(r.total)}`:('⚠️ '+r.msg); }
    case 'crear_tarea':{ const lote=resolverLote(v.lote_codigo); const r=await HANDLERS.create_task({titulo:v.titulo,fecha_limite:v.fecha_limite||null,asignado_a:v.asignado||'todos',lote_id:lote?.id||null}); return r.success?'📋 Tarea programada':('⚠️ '+r.msg); }
    case 'cosecha':{ const lote=resolverLote(v.lote_codigo); if(!lote) return '⚠️ Elige el lote de la cosecha'; const r=await HANDLERS.registrar_cosecha({lote_id:lote.id,kilos:parseFloat(v.kilos)||0,calidad:v.calidad||'normal',observaciones:v.observaciones||null,fecha:fechaAgente(v.fecha)||null}); return r.success?`🧺 Cosecha: ${(parseFloat(v.kilos)||0).toLocaleString('es-CO')} kg en ${lote.codigo}`:('⚠️ '+r.msg); }
    case 'completar_tarea':{ const tk=_norm(v.titulo); const t=(S.cache.tasks||[]).find(x=>x.estado==='pendiente'&&_norm(x.titulo).includes(tk)); if(!t) return '⚠️ No encontré esa tarea'; await HANDLERS.complete_task(t.id); return '✅ Tarea completada'; }
    case 'crear_lote':{ const r=await HANDLERS.create_lote({codigo:v.codigo,cultivo:v.cultivo,variedad:v.variedad||null}); return r.success?'🌱 Lote creado':('⚠️ '+r.msg); }
    case 'estado_lote':{ const lote=resolverLote(v.lote_codigo); if(!lote) return '⚠️ No encontré el lote'; const r=await HANDLERS.edit_lote(lote.id,{estado:v.estado}); return r.success?`🌱 ${lote.codigo} → ${v.estado}`:('⚠️ '+r.msg); }
    default: return '';
  }
}

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE MODALES (M)
   ═══════════════════════════════════════════════════════════════ */
const M = {
  _open(html, { dismissable=true } = {}){
    return new Promise((resolve) => {
      const host = document.getElementById('modal-host');
      host.innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet" id="m-sh"><div class="modal-handle"></div>${html}</div></div>`;
      const ov = document.getElementById('m-ov');
      const close = (val) => { host.innerHTML = ''; resolve(val); };
      if (dismissable) ov.addEventListener('click', (e) => { if (e.target === ov) close(null); });
      const onEsc = (e) => { if (e.key === 'Escape') { document.removeEventListener('keydown', onEsc); close(null); } };
      document.addEventListener('keydown', onEsc);
      M._close = close;
    });
  },
  async input({ title, sub='', label='', placeholder='', initial='', type='text', okText='Guardar', cancelText='Cancelar' }){
    const isNum = type==='number';
    const html = `<div class="modal-h">${title}</div>${sub ? `<div class="modal-sub">${sub}</div>` : ''}<div class="modal-field">${label ? `<label class="modal-label">${label}</label>` : ''}<input class="modal-input" id="m-input" type="${type}" placeholder="${placeholder}" value="${initial}" ${isNum?'inputmode="decimal"':''} autofocus></div><div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">${cancelText}</button><button class="btn btn-primary" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);
    setTimeout(() => document.getElementById('m-input')?.focus(), 100);
    document.getElementById('m-cancel').onclick = () => M._close(null);
    document.getElementById('m-ok').onclick = () => M._close(document.getElementById('m-input').value.trim() || null);
    document.getElementById('m-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('m-ok').click(); });
    return promise;
  },
  async textarea({ title, sub='', label='', placeholder='', initial='', okText='Guardar' }){
    const html = `<div class="modal-h">${title}</div>${sub?`<div class="modal-sub">${sub}</div>`:''}<div class="modal-field">${label?`<label class="modal-label">${label}</label>`:''}<textarea class="modal-input modal-textarea" id="m-input" placeholder="${placeholder}" autofocus>${initial}</textarea></div><div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">Cancelar</button><button class="btn btn-primary" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);
    setTimeout(() => document.getElementById('m-input')?.focus(), 100);
    document.getElementById('m-cancel').onclick = () => M._close(null);
    document.getElementById('m-ok').onclick = () => M._close(document.getElementById('m-input').value.trim() || null);
    return promise;
  },
  async confirm({ title, body='', okText='Sí, hacerlo', cancelText='No', danger=false }){
    const html = `<div class="modal-h">${title}</div>${body?`<div class="modal-sub">${body}</div>`:''}<div class="modal-actions" style="margin-top:8px"><button class="btn btn-ghost" id="m-cancel">${cancelText}</button><button class="btn ${danger?'btn-red':'btn-primary'}" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);
    document.getElementById('m-cancel').onclick = () => M._close(false);
    document.getElementById('m-ok').onclick = () => M._close(true);
    return promise;
  },
  async select({ title, sub='', options }){
    const items = options.map(o => `<button class="modal-option" data-val="${o.value}">${o.icon ? `<div class="icon-pill ip-${o.color||'green'}"><i class="ti ${o.icon}"></i></div>` : ''}<div style="flex:1"><div style="font-weight:600">${o.label}</div>${o.sub?`<div class="text-tiny" style="margin-top:2px">${o.sub}</div>`:''}</div><i class="ti ti-chevron-right" style="color:var(--tx3)"></i></button>`).join('');
    const html = `<div class="modal-h">${title}</div>${sub?`<div class="modal-sub">${sub}</div>`:''}<div class="modal-options">${items}</div><div class="modal-actions" style="margin-top:14px"><button class="btn btn-ghost btn-block" id="m-cancel">Cancelar</button></div>`;
    const promise = this._open(html);
    document.querySelectorAll('.modal-option').forEach(el => el.onclick = () => M._close(el.dataset.val));
    document.getElementById('m-cancel').onclick = () => M._close(null);
    return promise;
  },
  async form({ title, sub='', fields, okText='Guardar' }){
    const fieldsHtml = fields.map((f,idx) => {
      const id = `f-${idx}`;
      if (f.type === 'toggle'){
        return `<div class="modal-field"><div class="modal-toggle" id="${id}-wrap" data-name="${f.name}"><div><div class="modal-toggle-label">${f.label}</div>${f.sub?`<div class="modal-toggle-sub">${f.sub}</div>`:''}</div><div class="toggle-sw ${f.initial?'on':''}" id="${id}"></div></div></div>`;
      }
      if (f.type === 'select'){
        const opts = (f.options||[]).map(o => `<option value="${o.value}" ${String(o.value)===String(f.initial||'')?'selected':''}>${o.label}</option>`).join('');
        return `<div class="modal-field" ${f.conditional?`data-show-if="${f.conditional}"`:''}><label class="modal-label">${f.label}</label><select class="modal-select" id="${id}" data-name="${f.name}">${opts}</select></div>`;
      }
      if (f.type === 'textarea'){
        return `<div class="modal-field" ${f.conditional?`data-show-if="${f.conditional}"`:''}><label class="modal-label">${f.label}</label><textarea class="modal-input modal-textarea" id="${id}" data-name="${f.name}" placeholder="${f.placeholder||''}">${f.initial||''}</textarea></div>`;
      }
      const inputType = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
      return `<div class="modal-field" ${f.conditional?`data-show-if="${f.conditional}"`:''}><label class="modal-label">${f.label}</label><input class="modal-input" type="${inputType}" id="${id}" data-name="${f.name}" placeholder="${f.placeholder||''}" value="${f.initial||''}"></div>`;
    }).join('');

    const html = `<div class="modal-h">${title}</div>${sub?`<div class="modal-sub">${sub}</div>`:''}${fieldsHtml}<div class="modal-actions" style="margin-top:6px"><button class="btn btn-ghost" id="m-cancel">Cancelar</button><button class="btn btn-primary" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);

    document.querySelectorAll('.toggle-sw').forEach(sw => {
      sw.onclick = () => { sw.classList.toggle('on'); applyConditionals(); };
    });

    function applyConditionals(){
      document.querySelectorAll('[data-show-if]').forEach(el => {
        const cond = el.getAttribute('data-show-if'), [name, val] = cond.split('=');
        const sw = document.querySelector(`[data-name="${name}"] .toggle-sw, #f-${fields.findIndex(f=>f.name===name)}`);
        const isOn = sw && sw.classList.contains('on');
        el.style.display = (isOn === (val === 'true')) ? '' : 'none';
      });
    }
    applyConditionals();

    document.getElementById('m-cancel').onclick = () => M._close(null);
    document.getElementById('m-ok').onclick = () => {
      const result = {}; let invalid = null;
      fields.forEach((f,idx) => {
        const id = `f-${idx}`;
        if (f.type === 'toggle') result[f.name] = document.getElementById(id).classList.contains('on');
        else {
          const el = document.getElementById(id);
          if (!el || (el.closest('.modal-field')?.style.display === 'none')) return;
          const v = el.value.trim();
          if (f.required && !v) invalid = f.label;
          result[f.name] = v;
        }
      });
      if (invalid){ toast(`Falta: ${invalid}`); return; }
      M._close(result);
    };
    return promise;
  }
};

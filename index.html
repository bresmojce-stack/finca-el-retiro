  req.tools = [{ functionDeclarations: ALL_TOOLS }];
  req.systemInstruction = { parts:[{ text: systemInstruction }] };
  req.generationConfig = { maxOutputTokens: 800, temperature: 0.6 };

  /* Instrucción corta para las vueltas de seguimiento: el contexto pesado
     solo se manda en la primera llamada, no se repite en cada acción. */
  const instruccionCorta = `Eres el Agente Operativo de Finca El Retiro. Hoy es ${hoyISO}. Calendario:\n${calendarioCtx()}\n Ya ejecutaste herramientas; usa sus resultados para responderle al usuario de forma breve y clara, o ejecuta otra herramienta si hace falta.`;

  /* Loop agéntico: máx 2 vueltas para ahorrar tokens. */
  try{
    let transcript = '', ultConsulta = '';
    for (let ronda = 0; ronda < 3; ronda++){
      const rq = await llamarGemini(req);
      if (!rq.ok) return `⚠️ Error de red o cuota (${rq.status || 'sin red'}).`;
      const data = rq.data;
      if (data.promptFeedback?.blockReason) return `⚠️ Bloqueado: ${data.promptFeedback.blockReason}`;
      const cand = data.candidates?.[0];
      if (cand?.finishReason === 'SAFETY') return '⚠️ Bloqueado por seguridad.';
      if (!cand) return '⚠️ Sin respuesta de Gemini.';

      const parts = cand.content?.parts || [];
      const calls = parts.filter(p => p.functionCall);
      const textOut = parts.filter(p => p.text).map(p => p.text).join('');

      if (!calls.length){
        return (transcript + (textOut ? '\n\n' + textOut : '')).trim() || ultConsulta || '✅ Hecho.';
      }

      if (textOut) transcript += '\n\n' + textOut;
      req.contents.push(cand.content);
      const responses = [];
      for (const p of calls){
        let result;
        try{ result = await executeToolCall(p.functionCall); }
        catch(e){ result = `⚠️ Error en "${p.functionCall.name}": ${e.message}`; }
        if (p.functionCall.name === 'consultar_registros') ultConsulta = result;
        else if (result) transcript += (p.functionCall.name === 'buscar_en_internet') ? '\n\n🔎 Consulté en internet...' : '\n\n' + result;
        responses.push({ functionResponse: { name: p.functionCall.name, response: { resultado: result || 'ok' } } });
      }
      req.contents.push({ role:'user', parts: responses });
      req.systemInstruction = { parts:[{ text: instruccionCorta }] };
    }
    return transcript.trim() || ultConsulta || '✅ Hecho.';
  } catch(e){
    return '⚠️ Sin conexión con Gemini.';
  }
}

async function executeToolCall(call){
  const args = call.args || {}, name = call.name;
  const hoyISO = fechaLocalISO();
  const moneyFmt = (n) => '$' + (parseFloat(n)||0).toLocaleString('es-CO', {maximumFractionDigits:0});
  const fAg = fechaAgente(args.fecha);                 // null = hoy
  const fTxt = (fAg && fAg !== hoyISO) ? ` · 📅 ${fmtFecha(fAg)}` : '';

  switch(name){
    case 'consultar_registros':
      return consultarRegistros(args);
    case 'save_memory':
      await HANDLERS.save_memory({ contenido: args.contenido });
      return `🧠 Aprendizaje guardado: "${args.contenido}"`;
    case 'create_task':
      let lote_id = null;
      if (args.lote_codigo){
        const l = S.cache.lotes.find(x => x.codigo?.toLowerCase() === args.lote_codigo.toLowerCase());
        lote_id = l?.id || null;
      }
      const r = await HANDLERS.create_task({ titulo: args.titulo, asignado_a: args.asignado_a || 'todos', fecha_limite: args.fecha_limite || null, lote_id });
      return r.success ? `📋 Tarea programada: "${args.titulo}"` : `⚠️ Error tarea: ${r.msg}`;
    case 'add_gasto':
      await HANDLERS.add_gasto({ concepto: args.concepto, categoria: args.categoria || 'general', valor_total: args.valor_total, lote_id: null, fecha: fAg });
      return `💸 Gasto registrado: ${args.concepto} — ${moneyFmt(args.valor_total)}${fTxt}`;
    case 'add_ingreso':
      await HANDLERS.add_ingreso({ concepto: args.concepto, valor_total: args.valor_total, fecha: fAg });
      return `💰 Ingreso registrado: ${args.concepto} — ${moneyFmt(args.valor_total)}${fTxt}`;
    case 'add_inventory':
      const ai = await HANDLERS.add_inventory({
        descripcion: args.descripcion, categoria: args.categoria || 'otro',
        subcategoria: args.subcategoria || '', detalles: args.detalles || '',
        cantidad: args.cantidad, unidad: args.unidad, precio_total: parseFloat(args.precio_total)||0
      });
      const costoInfo = parseFloat(args.precio_total)>0 ? ` · ${moneyFmt(args.precio_total)}` : '';
      return ai.success ? `📦 Bodega: +${args.cantidad} ${args.unidad} de ${args.descripcion}${costoInfo}${ai.isNew?' · 🔎 Investigando el producto en internet...':''}` : `⚠️ Error bodega: ${ai.msg}`;
    case 'use_inventory':
      const q = (args.descripcion || '').toLowerCase().trim();
      const item = S.cache.inventory.find(i => i.descripcion?.toLowerCase().includes(q) || q.includes(i.descripcion?.toLowerCase() || ''));
      if (!item) return `⚠️ No encontré "${args.descripcion}" en bodega.`;
      let loteUso = null;
      if (args.lote_codigo) loteUso = S.cache.lotes.find(l => l.codigo?.toLowerCase() === args.lote_codigo.toLowerCase());
      const ui = await consumirInsumo({ itemId: item.id, cantidad: args.cantidad, loteId: loteUso?.id || null });
      if(!ui.success) return `⚠️ Error: ${ui.msg}`;
      let outUso = `📦 Bodega: -${ui.usado} ${ui.unidad} de ${ui.descripcion} (quedan ${ui.restante})`;
      if (ui.costo > 0) outUso += ` · costo ${moneyFmt(ui.costo)}${loteUso ? ' asignado a ' + loteUso.codigo : ''}`;
      if (ui.capped) outUso += ` ⚠️ Pediste ${args.cantidad} pero solo había ${ui.usado} disponible`;
      return outUso;
    case 'log_activity':
      let lid = null, cod = null;
      if (args.lote_codigo){
        const l = S.cache.lotes.find(x => x.codigo?.toLowerCase() === args.lote_codigo.toLowerCase());
        lid = l?.id || null; cod = l?.codigo || null;
      }
      await HANDLERS.log_activity({ lote_id: lid, codigo: cod, actividad: args.actividad, fecha: fAg });
      return `📝 Bitácora: ${args.actividad}${cod?` (${cod})`:''}${fTxt}`;
    case 'complete_task':
      const tk = (args.titulo || '').toLowerCase().trim();
      const task = S.cache.tasks.find(t => t.estado === 'pendiente' && t.titulo?.toLowerCase().includes(tk));
      if (!task) return `⚠️ No encontré tarea pendiente con "${args.titulo}".`;
      await HANDLERS.complete_task(task.id);
      return `✅ Tarea completada: "${task.titulo}"`;
    case 'edit_task':
      const tkE = (args.titulo_actual || '').toLowerCase().trim();
      const taskE = S.cache.tasks.find(t => t.estado==='pendiente' && t.titulo?.toLowerCase().includes(tkE));
      if (!taskE) return `⚠️ No encontré tarea con "${args.titulo_actual}".`;
      const changesE = {};
      if (args.nuevo_titulo) changesE.titulo = args.nuevo_titulo;
      if (args.nueva_fecha) changesE.fecha_limite = args.nueva_fecha;
      if (args.nuevo_asignado) {
        if (args.nuevo_asignado === 'todos') { changesE.asignado_a_todos = true; changesE.asignado_a_id = null; }
        else { const u = S.cache.users.find(u=>u.codigo===args.nuevo_asignado||u.nombre_corto?.toLowerCase()===args.nuevo_asignado.toLowerCase()); if(u){changesE.asignado_a_id=u.id; changesE.asignado_a_todos=false;} }
      }
      const rE = await HANDLERS.edit_task(taskE.id, changesE);
      return rE.success ? `✏️ Tarea actualizada: "${taskE.titulo}"` : `⚠️ Error: ${rE.msg}`;
    case 'delete_task_agent':
      const tkD = (args.titulo || '').toLowerCase().trim();
      const taskD = S.cache.tasks.find(t => t.estado==='pendiente' && t.titulo?.toLowerCase().includes(tkD));
      if (!taskD) return `⚠️ No encontré tarea con "${args.titulo}".`;
      const rD = await HANDLERS.delete_task(taskD.id);
      return rD.success ? `🗑️ Tarea eliminada: "${taskD.titulo}"` : `⚠️ Error: ${rD.msg}`;
    case 'update_lote_estado':
      const loteU = S.cache.lotes.find(l => l.codigo?.toLowerCase() === (args.lote_codigo||'').toLowerCase());
      if (!loteU) return `⚠️ No encontré el lote "${args.lote_codigo}".`;
      const rU = await HANDLERS.edit_lote(loteU.id, { estado: args.estado });
      return rU.success ? `🌱 Lote ${loteU.codigo} actualizado a estado: ${args.estado}` : `⚠️ Error: ${rU.msg}`;
    case 'registrar_plaga':
      const loteP = S.cache.lotes.find(l => l.codigo?.toLowerCase() === (args.lote_codigo||'').toLowerCase());
      const rP = await HANDLERS.registrar_plaga({ lote_id: loteP?.id||null, tipo:args.tipo, descripcion:args.descripcion||'', severidad:args.severidad||'leve', fecha_deteccion:fechaAgente(args.fecha_deteccion)||fAg||hoyISO });
      return rP.success ? `🐛 Plaga registrada: ${args.tipo} en ${args.lote_codigo} (severidad: ${args.severidad||'leve'})` : `⚠️ Error: ${rP.msg}`;
    case 'controlar_plaga':
      const tP = (args.tipo_plaga||'').toLowerCase();
      const lCod = (args.lote_codigo||'').toLowerCase();
      const plagaC = S.cache.plagas.find(p => p.activa && p.tipo?.toLowerCase().includes(tP) && (!lCod || p.lote?.codigo?.toLowerCase()===lCod));
      if (!plagaC) return `⚠️ No encontré plaga activa con "${args.tipo_plaga}"${args.lote_codigo?' en '+args.lote_codigo:''}.`;
      const rC = await HANDLERS.controlar_plaga(plagaC.id, { producto:args.producto, dosis:args.dosis, resultado:args.resultado, fecha: fAg });
      return rC.success ? `✅ Control registrado: ${args.producto||'tratamiento'} para ${plagaC.tipo}` : `⚠️ Error: ${rC.msg}`;
    case 'create_lote':
      const cl = await HANDLERS.create_lote({ codigo: args.codigo, cultivo: args.cultivo, variedad: args.variedad || null });
      return cl.success ? `🌱 Lote creado: ${args.codigo}` : `⚠️ Error lote: ${cl.msg}`;
    case 'buscar_en_internet':
      if (!S.isOnline) return '⚠️ Sin internet para buscar.';
      return await webSearchGemini(args.consulta || '');
    case 'registrar_cosecha':
      const loteCo = S.cache.lotes.find(l => l.codigo?.toLowerCase() === (args.lote_codigo||'').toLowerCase());
      if (!loteCo) return `⚠️ No encontré el lote "${args.lote_codigo}".`;
      const rCo = await HANDLERS.registrar_cosecha({ lote_id:loteCo.id, kilos:args.kilos, calidad:args.calidad, observaciones:args.observaciones, fecha: fAg });
      return rCo.success ? `🌾 Cosecha registrada: ${args.kilos} kg en ${loteCo.codigo}${args.calidad?' ('+args.calidad+')':''}${fTxt}` : `⚠️ Error: ${rCo.msg}`;
    case 'registrar_jornal':
      let loteJo = null;
      if (args.lote_codigo) loteJo = S.cache.lotes.find(l => l.codigo?.toLowerCase() === args.lote_codigo.toLowerCase());
      const rJo = await HANDLERS.registrar_jornal({ trabajador:args.trabajador, dias:args.dias, valor_dia:args.valor_dia, lote_id:loteJo?.id||null, nota:args.nota, fecha: fAg });
      return rJo.success ? `👷 Jornal: ${args.trabajador} · ${args.dias} día(s) · ${moneyFmt(rJo.total)}${loteJo?' → '+loteJo.codigo:''}${fTxt}` : `⚠️ Error: ${rJo.msg}`;
    default: return `⚠️ Herramienta desconocida: ${name}`;
  }
}

/* ═══════════════════════════════════════════════════════════════
   INVESTIGACIÓN AUTÓNOMA DE PRODUCTOS (Gemini + Google Search)
   Nota: Gemini no permite mezclar google_search con functionDeclarations
   en la misma llamada, por eso esta consulta se hace aparte, en
   segundo plano, y el resultado se guarda en la ficha del insumo.
   ═══════════════════════════════════════════════════════════════ */
async function researchProduct(nombre, force = false){
  if (!iaDisponible() || !nombre) return;
  try{
    const buscar = (x) => (x.descripcion||'').trim().toLowerCase() === nombre.trim().toLowerCase();
    const item = S.cache.inventory.find(buscar);
    if (item && item.ficha_investigacion && !force) return;
    toast(`🔎 Investigando "${nombre}" en internet...`);
    const prompt = `Investiga el producto agrícola "${nombre}"${item?.detalles ? ` (composición: ${item.detalles})` : ''} usado en fincas en Colombia. Responde en español, máximo 170 palabras, sin asteriscos ni markdown, en este formato exacto:
QUÉ ES: tipo de producto e ingrediente activo
PARA QUÉ SIRVE: usos, plagas/enfermedades/deficiencias que ataca
DOSIS TÍPICA: dosis común recomendada
CULTIVOS: en qué cultivos se usa
PRECAUCIONES: toxicidad, periodo de carencia, protección necesaria
TIP: un consejo práctico de aplicación

Al final, en una línea aparte, escribe exactamente: FRANJA: seguido de una sola palabra (roja, amarilla, azul o verde) según la franja toxicológica del producto; si es un abono u otro producto sin franja escribe FRANJA: ninguna.`;
    const reqInv = { contents:[{ role:'user', parts:[{ text: prompt }] }], tools:[{ google_search:{} }] };
    const rq = await llamarGemini(reqInv);
    if (!rq.ok){ console.warn('researchProduct HTTP', rq.status); return; }
    const data = rq.data;
    let ficha = (data.candidates?.[0]?.content?.parts || []).filter(p=>p.text).map(p=>p.text).join('').trim();
    if (!ficha) return;
    // Extraer la franja toxicológica de la respuesta
    let franja = null;
    const mF = ficha.match(/FRANJA:\s*(roja|amarilla|azul|verde)/i);
    if (mF) franja = mF[1].toLowerCase();
    ficha = ficha.replace(/\n?FRANJA:.*/i, '').trim();
    const it = S.cache.inventory.find(buscar);
    if (!it || String(it.id).startsWith('tmp-')) return;
    const upd = { ficha_investigacion: ficha };
    if (franja) upd.franja_toxicologica = franja;
    const { error } = await sb.from('inventario').update(upd).eq('id', it.id);
    if (error){ console.warn('No se pudo guardar la ficha (¿falta la columna ficha_investigacion?):', error.message); return; }
    it.ficha_investigacion = ficha; if (franja) it.franja_toxicologica = franja;
    toast(`🔬 Ficha técnica lista: "${nombre}"`);
    if (S.tab === 'bodega') render();
  } catch(e){ console.warn('researchProduct:', e.message); }
}

window.flowInvestigarInsumo = async function(id){
  const item = S.cache.inventory.find(x => x.id == id);

  await researchProduct(item.descripcion, true);
};

/* ═══════════════════════════════════════════════════════════════
   REGISTRO FOTOGRÁFICO (Supabase Storage + tabla fotos)
   ═══════════════════════════════════════════════════════════════ */
async function subirFoto(media, opts = {}){
  if (!S.isOnline){ toast('Necesitas internet para subir fotos'); return null; }
  try{
    const img = new Image();
    await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = 'data:' + media.type + ';base64,' + media.b64; });
    const max = 1280, escala = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.8));
    const path = `${Date.now()}-${Math.floor(Math.random()*99999)}.jpg`;
    const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType:'image/jpeg' });
    if (error){ toast('Error subiendo la foto: ' + error.message); return null; }
    const { data } = sb.storage.from('fotos').getPublicUrl(path);
    const { error: e2 } = await sb.from('fotos').insert({ url: data.publicUrl, nota: opts.nota || null, lote_id: opts.loteId || null, tomada_por: S.user?.dbId || null });
    if (e2){ toast('Foto subida pero no quedó registrada: ' + e2.message); return null; }
    await refreshAll();
    return data.publicUrl;
  } catch(e){ toast('Error procesando la foto'); return null; }
}

  const fotos = (S.cache.fotos || []).filter(f => !loteId || f.lote_id === loteId);
  const loteNom = loteId ? (S.cache.lotes.find(l => l.id === loteId)?.codigo || '') : '';

  return p;
};

window.flowVerFoto = function(id){
  const f = (S.cache.fotos || []).find(x => x.id == id); if (!f) return;
  const ov = document.createElement('div');
  ov.className = 'foto-view';
  ov.innerHTML = `<div class="foto-view-bar"><button class="cam-btn-top" id="fv-close"><i class="ti ti-x"></i></button><div style="flex:1"></div><button class="cam-btn-top" id="fv-edit" title="Editar nota"><i class="ti ti-edit"></i></button><button class="cam-btn-top" id="fv-del" title="Borrar foto"><i class="ti ti-trash"></i></button></div><img src="${esc(f.url)}"><div class="foto-view-meta"><b>${esc(f.nota || 'Sin nota')}</b><br>${fmtDate(f.fecha)} · ${esc(f.lote?.codigo || 'Finca general')}</div>`;
  document.body.appendChild(ov);
  ov.querySelector('#fv-close').onclick = () => ov.remove();
  ov.querySelector('#fv-edit').onclick = () => { ov.remove(); flowEditFotoNota(f.id); };
  ov.querySelector('#fv-del').onclick = async () => {
    if (!window.confirm('¿Eliminar esta foto de la galería?')) return;
    if (!S.isOnline){ toast('Necesitas internet para borrar fotos'); return; }
    try{
      const path = decodeURIComponent((f.url.split('/fotos/')[1] || '').split('?')[0]);
      if (path) await sb.storage.from('fotos').remove([path]);
      await sb.from('fotos').delete().eq('id', f.id);
      await refreshAll();
      toast('🗑️ Foto borrada'); ov.remove(); render();
    } catch(e){ toast('Error borrando la foto'); }
  };
};

/* ═══════════════════════════════════════════════════════════════
   COINCIDENCIA DIFUSA ("¿quisiste decir...?")
   ═══════════════════════════════════════════════════════════════ */
function _norm(x){ return (x||'').toString().trim().toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,''); }
function levenshtein(a,b){
  a=_norm(a); b=_norm(b);
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c = a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
  }
  return d[m][n];
}
/* Busca en una lista por campo. Devuelve {exacto} o {sugerido} o {} */
function buscarDifuso(texto, lista, campo){
  const q=_norm(texto);
  if(!q) return {};
  let exacto = lista.find(o => _norm(o[campo])===q);
  if(exacto) return {exacto};
  let contiene = lista.find(o => _norm(o[campo]).includes(q) || q.includes(_norm(o[campo])));
  if(contiene) return {exacto:contiene};
  // por distancia: tolera ~30% del largo
  let mejor=null, mejorD=Infinity;
  lista.forEach(o=>{ const dd=levenshtein(q,o[campo]); if(dd<mejorD){mejorD=dd; mejor=o;} });
  if(mejor && mejorD <= Math.max(2, Math.ceil(_norm(mejor[campo]).length*0.34))) return {sugerido:mejor, dist:mejorD};
  return {};
}

/* ═══════════════════════════════════════════════════════════════
   AGENTES POR SECCIÓN (parse → confirmar → ejecutar)
   Cada agente ve solo su campo. Devuelven JSON estructurado (no
   ejecutan solos): la app muestra una tarjeta para confirmar/editar.
   ═══════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════
   INTÉRPRETE LOCAL (SIN IA)
   Entiende lo de todos los días con reglas: fechas, plata, cantidades,
   lotes, productos y personas. Gemini solo se usa cuando esto no
   alcanza (consejos, fotos, frases raras), así la cuota rinde mucho más.
   ═══════════════════════════════════════════════════════════════ */
const NUM_PAL = { un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10, once:11, doce:12, quince:15, veinte:20, treinta:30, cuarenta:40, cincuenta:50, cien:100, medio:0.5, media:0.5 };
const RX_NUM = '(\\d+(?:[.,]\\d+)*|' + Object.keys(NUM_PAL).join('|') + ')';
const RX_UNI_INS = '(kilogramos?|kilos?|kgs?|bultos?|litros?|lts?|cc|ml|mililitros?|galon(?:es)?|gal|gramos?|grs?|g|arrobas?|unidades?|und|frascos?|tarros?|canecas?|sacos?|cajas?|rollos?|metros?)';
const DIAS_SEM = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const _rxEsc = s => String(s).replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&');

/* Texto normalizado para las reglas (minúsculas, sin tildes, sin signos) */
function _txt(s){ return _normTxt(s).replace(/[¿?¡!;:"“”]/g, ' '); }
function _pareceAPregunta(texto){
  const t = _txt(texto).trim();
  return /\?/.test(texto) || /^(y\s+)?(que|como|cual|cuales|donde|por que|porque|cuando|cuanto|cuanta|cuantos|cuantas|quien|sera|puedo|hay(?! que)|tengo(?! que)|me recomiendas|recomiendame|sabes)\b/.test(t);
}

/* "1.500" → 1500 · "1,5" → 1.5 · "dos" → 2 */
function _numero(s){
  s = String(s||'').trim();
  if (NUM_PAL[s] != null) return NUM_PAL[s];
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) return parseFloat(s.replace(/\./g,''));
  if (/^\d{1,3}(,\d{3})+$/.test(s)) return parseFloat(s.replace(/,/g,''));
  return parseFloat(s.replace(',', '.')) || 0;
}

/* Plata mencionada: "$80.000", "80 mil", "1,5 millones", "80000". Devuelve {v, i, n} o null */
function _plata(t){
  let m;
  if ((m = t.match(new RegExp('\\b' + RX_NUM + '\\s*(millones|millon|palos?)\\b(\\s+y\\s+medio)?')))) return { v: Math.round((_numero(m[1]) + (m[3] ? 0.5 : 0)) * 1e6), i:m.index, n:m[0].length };
  if ((m = t.match(new RegExp('\\b' + RX_NUM + '\\s*(mil|lucas?|k)\\b(\\s+pesos)?')))) return { v: Math.round(_numero(m[1]) * 1000), i:m.index, n:m[0].length };
  if ((m = t.match(/\$\s*(\d[\d.,]*)(\s+pesos)?/))) return { v: _numero(m[1]), i:m.index, n:m[0].length };
  if ((m = t.match(/\b(\d{1,3}(?:\.\d{3})+|\d{4,})\b(?!\s*(?:kg|kilos?|gramos?|g|gr|grs|cc|ml|litros?|metros?|m2|matas?|plantas?|arboles?))(\s+pesos)?/))) return { v: _numero(m[1]), i:m.index, n:m[0].length };
  return null;
}

/* Unidad dicha por el usuario → unidad de la app */
function _uniNorm(u){
  u = String(u||'').toLowerCase();
  if (u === 'kgs') u = 'kg';
  const n = normUnidad(u);
  if (U_FAM[n]) return n;
  if (/^(und|unidad)/.test(u)) return 'unidad';
  return u.replace(/(es|s)$/, '');
}
/* Cantidad + unidad de un insumo: "2 bultos", "medio litro", "200 cc". Devuelve {cantidad, unidad, i, n} */
function _cantidad(t){
  const m = t.match(new RegExp('\\b' + RX_NUM + '\\s*' + RX_UNI_INS + '\\b'));
  if (!m) return null;
  return { cantidad: _numero(m[1]), unidad: _uniNorm(m[2]), i: m.index, n: m[0].length };
}
/* Nombre de producto que viene después de la cantidad: "2 bultos de urea a 80 mil" → "urea" */
function _nombreTras(t, c){
  if (!c) return '';
  const m = t.slice(c.i + c.n).match(/^\s*(?:de|del)?\s*([a-z0-9ñ][a-z0-9ñ .-]*?)(?=\s+(?:a|al|por|en|para|que|y|con|el|la|los|las|hoy|ayer|antier)\b|[,$]|$)/);
  return m ? m[1].trim() : '';
}
/* Producto de bodega mencionado (el que más coincida) */
function _producto(t){
  let mejor = null, pts = 0;
  (S.cache.inventory||[]).forEach(i => {
    const d = _normTxt(i.descripcion).trim(); if (!d) return;
    if (t.includes(d)){ if (d.length * 10 > pts){ pts = d.length * 10; mejor = i; } return; }
    const hits = d.split(/[^a-z0-9]+/).filter(w => w.length >= 4 && new RegExp('\\b' + w + '\\b').test(t)).length;
    if (hits && hits * 5 > pts){ pts = hits * 5; mejor = i; }
  });
  return mejor;
}
/* Lote mencionado: "L2", "lote 2", "lote 02", "el lote del tomate" */
function _lote(t){
  const lotes = (S.cache.lotes||[]).slice().sort((a,b) => String(b.codigo||'').length - String(a.codigo||'').length);
  for (const l of lotes){
    const c = _normTxt(l.codigo).trim();
    if (c && /[a-z]/.test(c) && new RegExp('(^|[^a-z0-9])' + _rxEsc(c) + '($|[^a-z0-9])').test(t)) return l;
  }
  const m = t.match(/\blote\s*(?:#|no\.?|numero)?\s*([a-z0-9-]+)/);
  if (m){
    const k = m[1], n = parseInt(k.replace(/\D/g,''), 10);
    let l = lotes.find(x => _normTxt(x.codigo) === k);
    if (!l && !isNaN(n)) l = lotes.find(x => parseInt(String(x.codigo).replace(/\D/g,''), 10) === n);
    if (l) return l;
  }
  const porCultivo = lotes.filter(l => l.cultivo && new RegExp('\\b' + _rxEsc(_normTxt(l.cultivo).trim()) + '\\b').test(t));
  return porCultivo.length === 1 ? porCultivo[0] : null;
}
/* Trabajador de la lista de usuarios mencionado en el texto */
function _persona(t){
  for (const u of (S.cache.users||[])){
    const ns = [u.nombre_corto, (u.nombre_completo||'').split(' ')[0]].map(n => _normTxt(n).replace(/[^a-z0-9 ]/g,'').trim()).filter(n => n.length >= 3);
    if (ns.some(n => new RegExp('\\b' + n + '\\b').test(t))) return u.nombre_corto;
  }
  return null;
}
/* Nombre propio en el texto original: "le pagué a Pedro" → "Pedro" */
function _nombrePropio(texto){
  const m = String(texto||'').match(/\b(?:a|al|para|de|con)\s+(?:don\s+|doña\s+)?([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/);
  if (!m) return '';
  const n = _normTxt(m[1]);
  return (MESES.includes(n) || DIAS_SEM.includes(n) || n === 'lote') ? '' : m[1];
}

/* Fecha dicha en el texto. futuro=true para tareas. Devuelve {fecha, i, n} o null */
function _armarFecha(d, mes, anio, futuro){
  if (!(d >= 1 && d <= 31 && mes >= 1 && mes <= 12)) return null;
  const hoy = fechaLocalISO(); let y = anio || +hoy.slice(0,4);
  const iso = yy => `${yy}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if (!anio){ if (!futuro && iso(y) > hoy) y--; if (futuro && iso(y) < hoy) y++; }
  const f = iso(y);
  return fechaLocalISO(new Date(f + 'T12:00:00Z')) === f ? f : null;   // descarta 31 de febrero, etc.
}
function _fecha(t, futuro){
  const hoy = fechaLocalISO();
  const res = (fecha, m, off = 0) => fecha ? { fecha, i: m.index + off, n: m[0].length - off } : null;
  const mult = u => u[0] === 's' ? 7 : u[0] === 'm' ? 30 : 1;
  let m;
  if ((m = t.match(/\bpasado\s+manana\b/))) return res(sumarDias(hoy, 2), m);
  if ((m = t.match(/\b(antier|anteayer|antes de ayer|ante ayer)\b/))) return res(sumarDias(hoy, -2), m);
  if ((m = t.match(/\bayer\b/))) return res(sumarDias(hoy, -1), m);
  if ((m = t.match(/\b(hoy|esta manana|esta tarde|esta noche)\b/))) return res(hoy, m);
  if ((m = t.match(/(^|[^a-z])manana\b/)) && !/\b(la|esta|por la|en la|de la)\s*$/.test(t.slice(0, m.index + m[1].length))) return res(sumarDias(hoy, 1), m, m[1].length);
  if ((m = t.match(new RegExp('\\bhace\\s+' + RX_NUM + '\\s+(dias?|semanas?|mes(?:es)?)\\b')))) return res(sumarDias(hoy, -_numero(m[1]) * mult(m[2])), m);
  if ((m = t.match(new RegExp('\\b(?:en|dentro de)\\s+' + RX_NUM + '\\s+(dias?|semanas?)\\b')))) return res(sumarDias(hoy, _numero(m[1]) * mult(m[2])), m);
  if ((m = t.match(/\b(la proxima semana|la otra semana|la semana que viene)\b/))) return res(sumarDias(hoy, 7), m);
  if ((m = t.match(/\bla semana pasada\b/))) return res(sumarDias(hoy, -7), m);
  if ((m = t.match(new RegExp('\\b(?:el\\s+)?(\\d{1,2})\\s+de\\s+(' + MESES.join('|') + '|setiembre)(?:\\s+(?:de|del)\\s+(\\d{4}))?\\b')))){
    const mes = m[2] === 'setiembre' ? 9 : MESES.indexOf(m[2]) + 1;
    return res(_armarFecha(+m[1], mes, m[3] ? +m[3] : null, futuro), m);
  }
  if ((m = t.match(/\b(?:el\s+)?(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))){
    let y = m[3] ? +m[3] : null; if (y && y < 100) y += 2000;
    return res(_armarFecha(+m[1], +m[2], y, futuro), m);
  }
  if ((m = t.match(/\b(?:el\s+|este\s+)?(?:proximo\s+|pasado\s+)?(domingo|lunes|martes|miercoles|jueves|viernes|sabado)(\s+pasado|\s+que viene)?\b/))){
    const obj = DIAS_SEM.indexOf(m[1]), dow = new Date(hoy + 'T12:00:00Z').getUTCDay();
    const fut = /proximo|que viene/.test(m[0]) || (futuro && !/pasado/.test(m[0]));
    const delta = fut ? ((obj - dow + 7) % 7 || 7) : -((dow - obj + 7) % 7 || 7);
    return res(sumarDias(hoy, delta), m);
  }
  return null;
}
/* Rango de fechas para preguntas: "este mes", "la semana pasada", "en septiembre"… Devuelve {desde, hasta, i, n} */
function _rango(t){
  const hoy = fechaLocalISO(), y = +hoy.slice(0,4), mo = +hoy.slice(5,7);
  const dow = new Date(hoy + 'T12:00:00Z').getUTCDay(), lunes = sumarDias(hoy, -((dow + 6) % 7));
  const iniMes = (yy, mm) => `${yy}-${String(mm).padStart(2,'0')}-01`;
  const finMes = (yy, mm) => fechaLocalISO(new Date(Date.UTC(yy, mm, 0, 12)));
  const r = (desde, hasta, m) => ({ desde, hasta, i: m.index, n: m[0].length });
  let m;
  if ((m = t.match(/\bhoy\b/))) return r(hoy, hoy, m);
  if ((m = t.match(/\bayer\b/))) return r(sumarDias(hoy,-1), sumarDias(hoy,-1), m);
  if ((m = t.match(/\besta semana\b/))) return r(lunes, hoy, m);
  if ((m = t.match(/\b(la )?semana pasada\b/))) return r(sumarDias(lunes,-7), sumarDias(lunes,-1), m);
  if ((m = t.match(/\beste mes\b/))) return r(iniMes(y,mo), hoy, m);
  if ((m = t.match(/\b(el )?mes pasado\b/))){ const yy = mo === 1 ? y-1 : y, mm = mo === 1 ? 12 : mo-1; return r(iniMes(yy,mm), finMes(yy,mm), m); }
  if ((m = t.match(/\beste ano\b/))) return r(`${y}-01-01`, hoy, m);
  if ((m = t.match(/\b(el )?ano pasado\b/))) return r(`${y-1}-01-01`, `${y-1}-12-31`, m);
  if ((m = t.match(new RegExp('\\b(?:en\\s+)?(?:los|las)?\\s*ultim[oa]s\\s+' + RX_NUM + '\\s+(dias?|semanas?|mes(?:es)?)\\b')))){
    const k = _numero(m[1]) * (m[2][0] === 's' ? 7 : m[2][0] === 'm' ? 30 : 1); return r(sumarDias(hoy,-k), hoy, m);
  }
  if ((m = t.match(new RegExp('\\b(?:en|de|durante)\\s+(' + MESES.join('|') + ')(?:\\s+(?:de|del)\\s+(\\d{4}))?\\b')))){
    const mm = MESES.indexOf(m[1]) + 1, yy = m[2] ? +m[2] : (mm > mo ? y-1 : y); return r(iniMes(yy,mm), finMes(yy,mm), m);
  }
  return null;
}

/* Quita trozos (fechas, plata…) del texto original. Las posiciones salen del texto normalizado. */
function _quitar(texto, ...spans){
  let s = String(texto||'');
  if (_normTxt(s).length !== s.length) return s;
  spans.filter(Boolean).forEach(sp => { s = s.slice(0, sp.i) + ' '.repeat(sp.n) + s.slice(sp.i + sp.n); });   // mismo largo: las demás posiciones siguen sirviendo
  return s;
}
function _frase(s){
  s = String(s||'').replace(/\s+/g,' ').replace(/\s+([,.;:])/g,'$1').replace(/^[\s,.;:-]+|[\s,;:-]+$/g,'')
    .replace(/\s+(a|al|de|del|en|por|y|el|la|para|con)$/i,'').trim();
  return s ? s[0].toUpperCase() + s.slice(1) : s;
}
/* Raíz simple para buscar palabras: "fumigamos" → "fumig", "desyerbada" → "desyerb" */
function _raiz(w){
  const r = w.replace(/(aron|ieron|amos|imos|emos|ando|iendo|aste|iste|ados|idos|adas|idas|ado|ido|ada|ida|ciones|cion|es|e|o|a|s)$/, '');
  return r.length >= 4 ? r : w;
}
function _categoria(t){
  if (/jornal/.test(t)) return 'jornales';
  if (/abon|urea|fertiliz|triple|\bcal\b|gallinaza|compost|dap\b|potasio|nitrato/.test(t)) return 'Nutrición';
  if (/fungic|insectic|herbic|acaric|veneno|fumig|mancozeb|glifosato|roundup|coadyuv/.test(t)) return 'Agroquímicos';
  if (/guante|bota|careta|mascara|overol|traje|gafas|tapabocas/.test(t)) return 'EPP';
  if (/bomba|fumigadora|herramienta|machete|pala|azadon|guadana|manguera|tijera|motobomba|aspersor|gotero/.test(t)) return 'Equipos y Herramientas';
  if (/fibra|alambre|estaca|plastico|canastilla|caja|bolsa|empaque|tutor|polisombra|cabuya/.test(t)) return 'Insumos Consumibles';
  if (/transporte|flete|\bluz\b|\bagua\b|energia|internet|arriendo|servicio|gasolina|acpm|combustible|celular|plan de datos|impuesto|predial/.test(t)) return 'servicios';
  return 'otro';
}
function _tareaPendiente(t){
  let mejor = null, pts = 0;
  (S.cache.tasks||[]).filter(x => x.estado === 'pendiente').forEach(x => {
    const pal = _normTxt(x.titulo).split(/[^a-z0-9]+/).filter(w => w.length >= 4).map(_raiz);
    if (!pal.length) return;
    const hits = pal.filter(w => t.includes(w)).length, p = hits / pal.length + hits * 0.01;
    if (hits && p > pts){ pts = p; mejor = x; }
  });
  return pts >= 0.34 ? mejor : null;
}

/* ── PREGUNTAS SOBRE LOS REGISTROS ── traduce la pregunta a filtros de consultarRegistros, sin IA */
const RX_CONSEJO = /\b(debo|deberia|debemos|toca|hay que|conviene|recomiend\w*|se puede|puedo|podemos|sirve|como se|como hago|que hago|que le (echo|aplico|pongo)|que es|para que|por que|porque|cual es (el|la) mejor|dosis|mezclar|compatible)\b/;
const STOP_CONSULTA = new Set(('cuando cuanto cuanta cuantos cuantas fue fueron era sido la el los las lo del de en por para que se ha he has han hemos hice hizo hicimos hicieron ' +
  'ultima ultimo ultimas ultimos primera primer primero vez veces total todo toda todos todas lote lotes finca este esta estos estas mes semana ano dia dias hace hasta desde entre ' +
  'plata dinero gastado gaste gastamos gastaron gasto gastos costado costo cuesta vale precio invertido invertimos pague pagado pagamos pagaron jornal jornales cosecha cosechas cosechado cosechamos ' +
  'kilos kilo vendido vendimos vendi venta ventas ingreso ingresos plagas plaga registros registro labores labor hay tengo tenemos dime muestrame lista historial resumen ' +
  'con sin al le les me mi nos un una uno es son va van lleva llevamos llevan llevo cual cuales como donde hecho hacer ya mas menos sobre pasado pasada ' +
  'compre compramos compra compras comprado sacamos salido produjo producido sale salio ha hay habido tuvimos hubo cada').split(' '));
function consultaLocal(texto){
  const t0 = _txt(texto).replace(/[.,]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!t0 || RX_CONSEJO.test(t0)) return null;
  const rango = _rango(t0);
  const t = rango ? (t0.slice(0, rango.i) + ' ' + t0.slice(rango.i + rango.n)).replace(/\s+/g,' ').trim() : t0;

  let tabla = 'labores';
  if (/\bjornal/.test(t)) tabla = 'jornales';
  else if (/cosech|produj|producido|produccion|\bkilos?\b.*\b(sac|recog|salier)/.test(t)) tabla = 'cosechas';
  else if (/\bvend|\bventa|\bingres|\bganad|\bcobr|nos pagaron|me pagaron/.test(t)) tabla = 'ingresos';
  else if (/plaga|enfermedad|hongo|gusano|trips|arana|mosca|acaro|ataque|\bgota\b|roya|antracnosis|mildeo|picudo|broca/.test(t)) tabla = 'plagas';
  else if (/\bcompr|\b(cuesta|vale|precio)\b/.test(t)) tabla = 'gastos';
  else if (/gast|plata|dinero|costo|costad|invert|pagu|pagad|pagamos|egreso/.test(t)) tabla = 'gasto_total';
  const conValor = !['labores','plagas'].includes(tabla);

  const pideHist = /\b(ultima vez|primera vez|hace cuanto|cuantas veces|que se hizo|que hicimos|que se ha hecho|historial|lista de|registros de)\b/.test(t);
  const esCuando = /^(y\s+)?cuando\b/.test(t) || /\bcuando (fue|se|hicimos|hice|tuvimos|hubo|le|lo|la)\b/.test(t);
  const esCuanto = /\bcuant[oa]s?\b/.test(t);
  if (!pideHist && !esCuando && !(esCuanto && (conValor || /cuantas? veces|cuant[oa]s (fumig|abon|pod|rieg|labor|plaga|registro|cosecha|siembr)/.test(t)))) return null;

  let op = 'lista';
  if (/\bprimera vez\b|\bprimer[oa]?\b/.test(t)) op = 'primero';
  else if (esCuando || /\bultima vez\b|\bultim[oa]\b|\bhace cuanto\b|\b(cuesta|vale|precio)\b/.test(t)) op = 'ultimo';
  else if (/cuantas veces/.test(t) || (/\bcuant[oa]s\b/.test(t) && !/cuant[oa]s (kilos|pesos|millones)/.test(t))) op = 'contar';
  else if (esCuanto || /\btotal\b/.test(t)) op = conValor ? 'total' : 'contar';

  const lote = _lote(t);
  if (lote && tabla === 'gasto_total') tabla = 'costo_lote';
  const quitarLote = lote ? new Set([_normTxt(lote.codigo), ...(_normTxt(lote.codigo).match(/\d+/g)||[])]) : new Set();
  const palabras = t.split(' ')
    .filter(w => w.length >= 4 && !STOP_CONSULTA.has(w) && !quitarLote.has(w) && !/^\d+$/.test(w) && !MESES.includes(w) && !DIAS_SEM.includes(w))
    .map(_raiz);
  return { accion:'consultar', tabla, operacion: op, lote_codigo: lote?.codigo || null, palabras, desde: rango?.desde || null, hasta: rango?.hasta || null, _seguro: true };
}

/* ── REGISTROS POR SECCIÓN ── devuelve la misma propuesta que daría el agente de IA.
   _seguro=false cuando faltan datos clave: entonces se intenta con la IA (si hay cuota). */
const RX_COMPRA = /\b(compr\w*|entr(o|aron)|lleg(o|aron)|trajeron|traje|repus\w*|reponer|ingres(o|aron)|recibi\w*)\b/;
const RX_SALIDA = /\b(use|uso|usamos|usaron|sali(o|eron)|saque|saco|sacamos|sacaron|gaste|gasto|gastamos|gastaron|eche|echo|echamos|echaron|aplic\w*|consum\w*)\b/;
const RX_LABOR  = /\b(fumig|asperj|aplic|pode|podo|podamos|podaron|regu|regamos|regaron|riego|abon|fertiliz|sembr|trasplant|desyerb|limpi|guada|desbro|deshoj|cosech|recog|tutor|amarr|plate|fumigu|cerc|arregl|repar|desmalez|rocer|rozamos|deschup|ralee|ralea)\w*/;
const ESTADOS_LOTE = { planificacion:'planificación', siembra:'siembra', sembrado:'siembra', vegetativo:'vegetativo', crecimiento:'vegetativo', produccion:'producción', produciendo:'producción', cosecha:'cosecha', cosechando:'cosecha', descanso:'descanso', descansando:'descanso' };

function interpretarLocal(dominio, texto){
  const t = _txt(texto);                              // mismo largo que el texto original (para _quitar)
  if (!t.trim()) return null;
  const q = consultaLocal(texto);
  if (q) return q;
  if (_pareceAPregunta(texto)) return null;          // consejos y preguntas abiertas: eso sí es para la IA
  const hoy = hoyISO();

  switch (dominio){
    case 'bitacora': {
      const f = _fecha(t, false), lote = _lote(t), fecha = fechaAgente(f?.fecha) || hoy;
      const kg = /cosech|recog|sacamos|sacaron/.test(t) && t.match(new RegExp('\\b' + RX_NUM + '\\s*(kilos?|kgs?|kilogramos?|arrobas?|toneladas?)\\b'));
      if (kg){
        const kilos = _numero(kg[1]) * (/^arroba/.test(kg[2]) ? 12.5 : /^tonelada/.test(kg[2]) ? 1000 : 1);
        return { accion:'cosecha', kilos, calidad:'normal', observaciones:'', lote_codigo: lote?.codigo || null, fecha, resumen:`Cosecha de ${kilos.toLocaleString('es-CO')} kg${lote ? ' en ' + lote.codigo : ''}`, _seguro: !!lote };
      }
      const c = _cantidad(t), prod = c ? _producto(t) : null, nombre = prod?.descripcion || _nombreTras(t, c);
      const actividad = _frase(_quitar(texto, f));
      return { accion:'registrar_labor', actividad, fecha, lote_codigo: lote?.codigo || null,
        insumo: (c && nombre) ? { nombre, cantidad: c.cantidad, unidad: c.unidad } : null,
        resumen: `Labor${lote ? ' en ' + lote.codigo : ''}${fecha !== hoy ? ' · ' + fmtFecha(fecha) : ''}`, _seguro: actividad.length >= 3 };
    }
    case 'bodega': {
      const f = _fecha(t, false), c = _cantidad(t), prod = _producto(t), lote = _lote(t);
      const nombre = prod?.descripcion || _nombreTras(t, c);
      const entra = RX_COMPRA.test(t), sale = RX_SALIDA.test(t);
      const resto = _quitar(t, f, c);
      const plata = _plata(resto);
      const accion = entra && !sale ? 'entrada' : sale && !entra ? 'salida' : (plata ? 'entrada' : null);
      if (!accion) return null;
      const base = { producto: nombre, cantidad: c?.cantidad || '', unidad: c?.unidad || prod?.unidad_medida || '', fecha: fechaAgente(f?.fecha) || hoy, _seguro: !!(nombre && c) };
      if (accion === 'entrada') return { accion, ...base, precio_total: plata?.v || '', lote_codigo: null, resumen: `Entrada a bodega${nombre ? ': ' + nombre : ''}` };
      return { accion, ...base, lote_codigo: lote?.codigo || null, resumen: `Salida de bodega${nombre ? ': ' + nombre : ''}${lote ? ' para ' + lote.codigo : ''}` };
    }
    case 'dinero': {
      const f = _fecha(t, false), fecha = fechaAgente(f?.fecha) || hoy;
      const t2 = _quitar(t, f), plata = _plata(t2), valor = plata?.v || 0, lote = _lote(t2);
      if (/\bjornal|\btrabaj(o|aron|amos)\b|\bdias? de trabajo\b/.test(t2)){
        const d = t2.match(new RegExp('\\b' + RX_NUM + '\\s*(jornales|jornal|dias?)\\b'));
        const dias = d ? _numero(d[1]) : 1;
        let valor_dia = valor;
        if (valor && dias > 1 && valor >= 150000 && !/\b(el|por|cada|al) (dia|jornal)\b|diario|c\/u|cada uno/.test(t2)) valor_dia = Math.round(valor / dias);
        const trabajador = _persona(t2) || _nombrePropio(texto);
        return { accion:'jornal', trabajador, dias, valor_dia: valor_dia || '', lote_codigo: lote?.codigo || null, fecha, resumen: `Jornal${trabajador ? ' de ' + trabajador : ''}`, _seguro: !!(valor && trabajador) };
      }
      const limpio = _frase(_quitar(texto, f, plata)
        .replace(/^\s*(hoy|ayer|antier)?\s*(gaste|gasté|pague|pagué|compre|compré|compramos|pagamos|se pago|se pagó|se compro|se compró|vendi|vendí|vendimos|se vendio|se vendió|me pagaron|nos pagaron|recibi|recibí|registra|anota)\s+(en|de|por|el|la|los|las|un|una|unos|unas)?\s*/i, ''));
      if (/\bvend\w*|\bventa\b|\bingres\w*|me pagaron|nos pagaron|\bcobr\w*|\brecibi\b/.test(t2))
        return { accion:'ingreso', concepto: limpio || 'Venta', valor: valor || '', fecha, resumen: 'Ingreso / venta', _seguro: !!valor };
      return { accion:'gasto', concepto: limpio, valor: valor || '', categoria: _categoria(t2), lote_codigo: lote?.codigo || null, fecha, resumen: 'Gasto', _seguro: !!(valor && limpio) };
    }
    case 'tareas': {
      if (/\b(ya )?(hice|hicimos|termin\w*|complet\w*|acab\w*|listo|lista|cumpl\w*)\b/.test(t) && !/\b(recuerd\w*|program\w*|agend\w*|hay que|tengo que|toca)\b/.test(t)){
        const tk = _tareaPendiente(t);
        return { accion:'completar_tarea', titulo: tk?.titulo || _frase(texto), resumen: tk ? `Completar: ${tk.titulo}` : 'Completar tarea', _seguro: !!tk };
      }
      const f = _fecha(t, true), lote = _lote(t), persona = _persona(t);
      const titulo = _frase(_quitar(texto, f)
        .replace(/^\s*(por favor\s+)?(recuerdame|recuérdame|recuerda|recordar|programa|programar|agenda|agendar|anota|apunta|crea\s+(una\s+)?tarea(\s+de|\s+para)?|tarea(\s+de|\s+para)?|hay que|tengo que|tenemos que|toca|debo|debemos|necesito)\s+(que\s+)?/i, ''));
      const fl = f?.fecha && f.fecha >= hoyISO() ? f.fecha : '';
      return { accion:'crear_tarea', titulo, fecha_limite: fl, asignado: persona || 'todos', lote_codigo: lote?.codigo || null, resumen: `Tarea${fl ? ' para el ' + fmtFecha(fl) : ''}`, _seguro: titulo.length >= 3 };
    }
    case 'cultivos': {
      if (/\b(crea\w*|nuevo|nueva|agreg\w*|registr\w*|abr\w*)\b.*\blote\b|\blote nuevo\b/.test(t)){
        const m = t.match(/\blote\s+(?:nuevo\s+)?([a-z]{0,3}-?\d+[a-z]?)\b/);
        const codigo = m ? m[1].toUpperCase() : '';
        const tras = m ? t.slice(m.index + m[0].length) : t;
        const mc = tras.match(/\b(?:de|con|para)\s+([a-zñ]+)(?:\s+(?!en\b|y\b|de\b|con\b|para\b)([a-zñ0-9]+))?/);
        const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
        return { accion:'crear_lote', codigo, cultivo: cap(mc?.[1] || ''), variedad: cap(mc?.[2] || ''), resumen: 'Lote nuevo', _seguro: !!(codigo && mc) };
      }
      const est = t.match(new RegExp('\\b(' + Object.keys(ESTADOS_LOTE).join('|') + ')\\b'));
      if (est){
        const lote = _lote(t);
        return { accion:'estado_lote', lote_codigo: lote?.codigo || '', estado: ESTADOS_LOTE[est[1]], resumen: `Cambiar estado${lote ? ' de ' + lote.codigo : ''}`, _seguro: !!lote };
      }
      return null;
    }
  }
  return null;
}

/* En el chat general: ¿de qué sección es esta frase? (null = que la atienda la IA) */
function dominioDeTexto(texto){
  const t = _txt(texto);
  if (_pareceAPregunta(texto)) return null;
  if (/\bjornal|\bjornales\b/.test(t)) return 'dinero';
  if (/\b(recuerd\w*|program\w*|agend\w*|hay que|tengo que|tenemos que|toca|tarea)\b/.test(t)) return 'tareas';
  if (/\b(crea\w*|nuevo|nueva|agreg\w*)\b.*\blote\b/.test(t) || (/\blote\b/.test(t) && new RegExp('\\b(' + Object.keys(ESTADOS_LOTE).join('|') + ')\\b').test(t) && /\b(pasa|paso|esta|entro|quedo|cambia|cambiar|ponlo|pon)\b/.test(t))) return 'cultivos';
  if (/\b(ya )?(termine|terminamos|complete|completamos|acabe|acabamos)\b/.test(t) && _tareaPendiente(t)) return 'tareas';
  if (/\b(vend\w*|venta|me pagaron|nos pagaron|cobr\w*)\b/.test(t)) return 'dinero';
  if (RX_COMPRA.test(t) && _cantidad(t)) return 'bodega';
  if (/\b(gaste|pague|pagamos|compre|compramos|se pago|se compro)\b/.test(t) && _plata(t)) return 'dinero';
  if (RX_LABOR.test(t)) return 'bitacora';
  if (RX_SALIDA.test(t) && _cantidad(t) && _producto(t)) return 'bodega';
  return null;
}

/* Tito (mapas) responde solo, sin IA: áreas y perímetros calculados del mapa */
function respuestaMapas(texto){
  const medir = l => { const pts = (S.cache.coordenadas||[]).filter(c => c.lote_id === l.id); return pts.length >= 3 ? MapEngine.calcDims(pts.map(p => ({ lat:p.latitud, lng:p.longitud }))) : null; };
  const lote = _lote(_txt(texto));
  if (lote){ const d = medir(lote); return d ? `${lote.codigo} (${lote.cultivo}): área ${MapEngine.fmtArea(d.area)}, perímetro ${MapEngine.fmtDist(d.perimetro)}.` : `${lote.codigo} todavía no tiene el contorno marcado en el mapa.`; }
  let total = 0;
  const lineas = (S.cache.lotes||[]).map(l => { const d = medir(l); if (d) total += d.area; return `• ${l.codigo} (${l.cultivo}): ${d ? MapEngine.fmtArea(d.area) + ' · ' + MapEngine.fmtDist(d.perimetro) : 'sin medir'}`; });
  if (!lineas.length) return 'Todavía no hay lotes.';
  return `Áreas de los lotes:\n${lineas.join('\n')}${total ? `\nTotal medido: ${MapEngine.fmtArea(total)}.` : ''}`;
}

/* Control de cuota: si Gemini responde 429 (cuota agotada) se deja de llamar un rato
   y la app sigue trabajando solo con las reglas locales. */
const IA = { pausaHasta: 0 };
const MSG_SIN_IA = `La IA no está disponible ahora (sin cuota o sin internet), pero sin ella igual puedo:
• Registrar labores, gastos, ventas, jornales, cosechas, tareas y movimientos de bodega. Ej: «ayer fumigué el lote 2 con 200 cc de mancozeb», «pagué 2 jornales a Pedro a 70 mil», «entraron 3 bultos de urea por 240 mil».
• Responder cuándo, cuánto y cuántas veces. Ej: «¿cuándo fue la última fumigación del L1?», «¿cuánto gastamos este mes?».`;
function iaDisponible(){ return S.isOnline && Date.now() > IA.pausaHasta; }
/* Todas las llamadas a Gemini pasan por aquí: sin "pensamiento" extra (gasta tokens sin necesidad) */
async function llamarGemini(req){
  if (!iaDisponible()) return { ok:false, status: S.isOnline ? 429 : 0 };
  req.generationConfig = { ...(req.generationConfig || {}), thinkingConfig: { thinkingBudget: 0 } };
  let res;
  try{ res = await fetch(`${API_URL_FLASH}?key=${GEMINI_API_KEY}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(req) }); }
  catch(e){ return { ok:false, status:0 }; }
  if (res.status === 429){ IA.pausaHasta = Date.now() + 10*60*1000; toast('La IA se quedó sin cuota por ahora. Sigo con lo que entiendo sin ella.'); }
  if (!res.ok) return { ok:false, status: res.status };
  return { ok:true, status: res.status, data: await res.json() };
}

/* Llama a Gemini Flash en modo JSON con el contexto pequeño del dominio */
async function parseAgente(dominio, texto, media){
  const spec = AGENTES[dominio]; if(!spec) return null;
  const parts=[]; if(media) parts.push({inlineData:{mimeType:media.type,data:media.b64}});
  parts.push({text: texto || 'Analiza la imagen.'});
  const req = {
    contents:[{role:'user',parts}],
    systemInstruction:{parts:[{text: spec.instruccion() + (spec.soloConsulta ? '' : INSTR_CONSULTA)}]},
    generationConfig:{ responseMimeType:'application/json', maxOutputTokens:500, temperature:0.2 }
  };
  const r = await llamarGemini(req);
  if(!r.ok) throw new Error('red/cuota '+r.status);
  const data = r.data;
  let txt=(data.candidates?.[0]?.content?.parts||[]).filter(p=>p.text).map(p=>p.text).join('').trim();
  txt=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  const m=txt.match(/\{[\s\S]*\}/); if(!m) return null;
  return JSON.parse(m[0]);
}

/* Tarjeta de confirmación con edición en el momento. Devuelve valores o null */
async function confirmAccion(dominio, prop){
  const campos = camposDe(prop);
  const ag = AGENTES[dominio];
  const fieldsHtml = campos.map((f,i)=>{
    const id='ca-'+i;
    if(f.type==='select'){ const opts=(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.v)?'selected':''}>${esc(o.label)}</option>`).join(''); return `<div class="modal-field"><label class="modal-label">${esc(f.label)}</label><select class="modal-select" id="${id}">${opts}</select></div>`; }
    return `<div class="modal-field"><label class="modal-label">${esc(f.label)}</label><input class="modal-input" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" id="${id}" value="${esc(f.v)}"></div>`;
  }).join('');
  const html=`<div class="modal-h"><i class="ti ${ag.icon}"></i> ${esc(ag.nombre)}</div>
    <div class="modal-sub"><i class="ti ti-eye"></i> ${esc(prop.resumen||'Revisa y confirma')}</div>
    ${fieldsHtml}
    <div class="modal-actions"><button class="btn btn-ghost" id="ca-cancel">Cancelar</button><button class="btn btn-primary" id="ca-ok"><i class="ti ti-check"></i> Confirmar</button></div>`;
  return await new Promise(resolve=>{
    document.getElementById('modal-host').innerHTML=`<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const close=v=>{document.getElementById('modal-host').innerHTML='';resolve(v);};
    document.querySelector('#m-ov').addEventListener('click',e=>{if(e.target===e.currentTarget)close(null);});
    document.getElementById('ca-cancel').onclick=()=>close(null);

      const out={accion:prop.accion};
      campos.forEach((f,i)=>{ out[f.k]=document.getElementById('ca-'+i).value; });
      close(out);
    };
  });
}

/* Resuelve un producto por nombre con coincidencia difusa (pregunta si hay duda) */
async function resolverProducto(nombre){
  const r=buscarDifuso(nombre,S.cache.inventory||[],'descripcion');
  if(r.exacto) return r.exacto;
  if(r.sugerido){ const ok=await M.confirm({title:'¿Quisiste decir…?',body:`No encontré "${esc(nombre)}". ¿Te refieres a <b>${esc(r.sugerido.descripcion)}</b>?`,okText:'Sí, ese',cancelText:'No'}); if(ok) return r.sugerido; }
  return null;
}
function resolverLote(cod){ if(!cod) return null; const r=buscarDifuso(cod,S.cache.lotes||[],'codigo'); return r.exacto||r.sugerido||null; }

/* Ejecuta la acción confirmada usando los handlers existentes */
async function ejecutarAccion(v){
  const conv=(cant,uni,base,bk)=>{ let c=convertirUnidad(parseFloat(cant)||0,uni,base,bk); return c===null?(parseFloat(cant)||0):c; };
  switch(v.accion){
    case 'registrar_labor':{
      const lote=resolverLote(v.lote_codigo);
      await HANDLERS.log_activity({lote_id:lote?.id||null, codigo:lote?.codigo||null, actividad:v.actividad, fecha:v.fecha||null});
      if(v._ins_nombre && parseFloat(v._ins_cant)>0){
        const it=await resolverProducto(v._ins_nombre);
        if(it){ const cant=conv(v._ins_cant, v._ins_uni||it.unidad_medida, it.unidad_medida); await consumirInsumo({itemId:it.id, cantidad:cant, loteId:lote?.id||null}); }
        else toast('Labor guardada. Ojo: no desconté "'+v._ins_nombre+'" (no está en bodega).');
      }
      return '📝 Labor registrada';
    }
    case 'entrada':{
      const it=await resolverProducto(v.producto);
      const precio=parseFloat(v.precio_total)||0;
      if(it){ const cant=conv(v.cantidad, v.unidad||it.unidad_medida, it.unidad_medida); await HANDLERS.restock_inventory(it.id, cant, precio); if(precio>0) await HANDLERS.add_gasto({concepto:`${it.descripcion} (reposición)`, categoria:it.categoria||'otro', valor_total:precio, fecha:v.fecha||null}); return '📦 Entrada registrada en bodega'; }
      // No existe → crear con el formulario (prellenado)
      toast('Producto nuevo, complétalo'); flowNewInsumo(null,{desc:v.producto,can:v.cantidad,uni:v.unidad,pre:v.precio_total}); return '';
    }
    case 'salida':{
      const it=await resolverProducto(v.producto);
      if(!it) return '⚠️ No encontré ese producto en bodega';
      const lote=resolverLote(v.lote_codigo);
      const cant=conv(v.cantidad, v.unidad||it.unidad_medida, it.unidad_medida);
      const r=await consumirInsumo({itemId:it.id, cantidad:cant, loteId:lote?.id||null});
      return r.success?`📦 Salida: -${r.usado} ${r.unidad} de ${r.descripcion}${r.costo>0?' · '+fmtMoney(r.costo):''}`:('⚠️ '+r.msg);
    }
    case 'gasto':{ const lote=resolverLote(v.lote_codigo); await HANDLERS.add_gasto({concepto:v.concepto,categoria:v.categoria||'otro',valor_total:parseFloat(v.valor)||0,lote_id:lote?.id||null,fecha:v.fecha||null}); return '💸 Gasto registrado'; }
    case 'ingreso':{ await HANDLERS.add_ingreso({concepto:v.concepto,valor_total:parseFloat(v.valor)||0,fecha:v.fecha||null}); return '💰 Ingreso registrado'; }
    case 'jornal':{ const lote=resolverLote(v.lote_codigo); const r=await HANDLERS.registrar_jornal({trabajador:v.trabajador,dias:parseFloat(v.dias)||1,valor_dia:parseFloat(v.valor_dia)||0,lote_id:lote?.id||null,fecha:v.fecha||null}); return r.success?`👷 Jornal · ${fmtMoney(r.total)}`:('⚠️ '+r.msg); }
    case 'crear_tarea':{ const lote=resolverLote(v.lote_codigo); const r=await HANDLERS.create_task({titulo:v.titulo,fecha_limite:v.fecha_limite||null,asignado_a:v.asignado||'todos',lote_id:lote?.id||null}); return r.success?'📋 Tarea programada':('⚠️ '+r.msg); }
    case 'cosecha':{ const lote=resolverLote(v.lote_codigo); if(!lote) return '⚠️ Elige el lote de la cosecha'; const r=await HANDLERS.registrar_cosecha({lote_id:lote.id,kilos:parseFloat(v.kilos)||0,calidad:v.calidad||'normal',observaciones:v.observaciones||null,fecha:fechaAgente(v.fecha)||null}); return r.success?`🧺 Cosecha: ${(parseFloat(v.kilos)||0).toLocaleString('es-CO')} kg en ${lote.codigo}`:('⚠️ '+r.msg); }
    case 'completar_tarea':{ const tk=_norm(v.titulo); const t=(S.cache.tasks||[]).find(x=>x.estado==='pendiente'&&_norm(x.titulo).includes(tk)); if(!t) return '⚠️ No encontré esa tarea'; await HANDLERS.complete_task(t.id); return '✅ Tarea completada'; }
    case 'crear_lote':{ const r=await HANDLERS.create_lote({codigo:v.codigo,cultivo:v.cultivo,variedad:v.variedad||null}); return r.success?'🌱 Lote creado':('⚠️ '+r.msg); }
    case 'estado_lote':{ const lote=resolverLote(v.lote_codigo); if(!lote) return '⚠️ No encontré el lote'; const r=await HANDLERS.edit_lote(lote.id,{estado:v.estado}); return r.success?`🌱 ${lote.codigo} → ${v.estado}`:('⚠️ '+r.msg); }
    default: return '';
  }
}

/* Propuesta para lo que dijo el usuario: primero las reglas locales; la IA solo si no alcanzan */
function propuestaSinIA(dominio, texto){
  if (_pareceAPregunta(texto)) return { accion:'responder', texto:'Sin la IA no puedo contestar esa pregunta ahora. Sí puedo responder cuándo, cuánto y cuántas veces sobre lo registrado, y registrar lo que me digas.' };
  const t = String(texto||'').trim();
  if (dominio === 'bitacora') return { accion:'registrar_labor', actividad:_frase(t), fecha:hoyISO(), lote_codigo:null, insumo:null, resumen:'Revisa y completa' };
  if (dominio === 'dinero')   return { accion:'gasto', concepto:_frase(t), valor:'', categoria:'otro', lote_codigo:null, fecha:hoyISO(), resumen:'Revisa y completa' };
  if (dominio === 'tareas')   return { accion:'crear_tarea', titulo:_frase(t), fecha_limite:'', asignado:'todos', lote_codigo:null, resumen:'Revisa y completa' };
  return null;
}
async function proponer(dominio, texto, media){
  const ag = AGENTES[dominio];
  if (ag?.local && !media) return { accion:'responder', texto: ag.local(texto) };
  const local = (!media && texto) ? interpretarLocal(dominio, texto) : null;
  if (local && local._seguro) return local;
  if (iaDisponible()){
    toast(`${ag.nombre} está pensando…`);
    try{ const p = await parseAgente(dominio, texto, media); if (p) return p; }
    catch(e){ /* sin red o sin cuota: seguimos sin IA */ }
  }
  if (media && !texto){ return { accion:'responder', texto:'Para leer fotos necesito la IA y ahora no está disponible. Escríbeme lo que pasó.' }; }
  if (local) return local;
  if (dominio === 'bodega' && texto){
    const tipo = await M.select({ title:'¿Entrada o salida?', sub: esc(texto), options:[{value:'entrada',label:'Entró a bodega (compra)',icon:'ti-download'},{value:'salida',label:'Salió de bodega (uso)',icon:'ti-upload',color:'brown'}] });
    if (!tipo) return null;
    return interpretarLocal('bodega', (tipo === 'entrada' ? 'entró ' : 'usé ') + texto) || { accion:tipo, producto:'', cantidad:'', unidad:'', fecha:hoyISO(), resumen:'Revisa y completa' };
  }
  return propuestaSinIA(dominio, texto);
}

/* Atiende un mensaje para una sección. Devuelve {texto, consulta} o null si se canceló */
async function atenderAgente(dominio, texto, media){
  const prop = await proponer(dominio, texto, media);
  if (!prop) return null;
  if (prop.accion === 'consultar') return { texto: consultarRegistros(prop), consulta:true };
  if (prop.accion === 'responder') return { texto: prop.texto || 'No tengo ese dato.', consulta:true };
  const v = await confirmAccion(dominio, prop);
  if (!v) return null;
  try{ return { texto: await ejecutarAccion(v), consulta:false }; }
  catch(e){ return { texto: '⚠️ Error: ' + e.message, consulta:false }; }
}

/* Flujo del agente de sección (barra de cada pestaña) */
async function flowAgenteSeccion(dominio, texto, media){
  if(!texto && !media) return;
  const ag=AGENTES[dominio];
  const r = await atenderAgente(dominio, texto, media);
  if (!r){ return; }
  if (r.consulta){
    await M.confirm({title:`<i class="ti ${ag.icon}"></i> ${ag.nombre}`, body: esc(r.texto).replace(/\n/g,'<br>'), okText:'Entendido', cancelText:''});
    return;
  }
  if (r.texto) toast(r.texto);
  render();
}

/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE MODALES (M)
   ═══════════════════════════════════════════════════════════════ */
const M = {
  _open(html, { dismissable=true } = {}){
    return new Promise((resolve) => {
      const host = document.getElementById('modal-host');
      host.innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet" id="m-sh"><div class="modal-handle"></div>${html}</div></div>`;
      const ov = document.getElementById('m-ov');
      const close = (val) => { host.innerHTML = ''; resolve(val); };
      if (dismissable) ov.addEventListener('click', (e) => { if (e.target === ov) close(null); });
      const onEsc = (e) => { if (e.key === 'Escape') { document.removeEventListener('keydown', onEsc); close(null); } };
      document.addEventListener('keydown', onEsc);
      M._close = close;
    });
  },
  async input({ title, sub='', label='', placeholder='', initial='', type='text', okText='Guardar', cancelText='Cancelar' }){
    const isNum = type==='number';
    const html = `<div class="modal-h">${title}</div>${sub ? `<div class="modal-sub">${sub}</div>` : ''}<div class="modal-field">${label ? `<label class="modal-label">${label}</label>` : ''}<input class="modal-input" id="m-input" type="${type}" placeholder="${placeholder}" value="${initial}" ${isNum?'inputmode="decimal"':''} autofocus></div><div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">${cancelText}</button><button class="btn btn-primary" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);
    setTimeout(() => document.getElementById('m-input')?.focus(), 100);
    document.getElementById('m-cancel').onclick = () => M._close(null);
    document.getElementById('m-ok').onclick = () => M._close(document.getElementById('m-input').value.trim() || null);
    document.getElementById('m-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('m-ok').click(); });
    return promise;
  },
  async textarea({ title, sub='', label='', placeholder='', initial='', okText='Guardar' }){
    const html = `<div class="modal-h">${title}</div>${sub?`<div class="modal-sub">${sub}</div>`:''}<div class="modal-field">${label?`<label class="modal-label">${label}</label>`:''}<textarea class="modal-input modal-textarea" id="m-input" placeholder="${placeholder}" autofocus>${initial}</textarea></div><div class="modal-actions"><button class="btn btn-ghost" id="m-cancel">Cancelar</button><button class="btn btn-primary" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);
    setTimeout(() => document.getElementById('m-input')?.focus(), 100);
    document.getElementById('m-cancel').onclick = () => M._close(null);
    document.getElementById('m-ok').onclick = () => M._close(document.getElementById('m-input').value.trim() || null);
    return promise;
  },
  async confirm({ title, body='', okText='Sí, hacerlo', cancelText='No', danger=false }){
    const html = `<div class="modal-h">${title}</div>${body?`<div class="modal-sub">${body}</div>`:''}<div class="modal-actions" style="margin-top:8px"><button class="btn btn-ghost" id="m-cancel">${cancelText}</button><button class="btn ${danger?'btn-red':'btn-primary'}" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);
    document.getElementById('m-cancel').onclick = () => M._close(false);
    document.getElementById('m-ok').onclick = () => M._close(true);
    return promise;
  },
  async select({ title, sub='', options }){
    const items = options.map(o => `<button class="modal-option" data-val="${o.value}">${o.icon ? `<div class="icon-pill ip-${o.color||'green'}"><i class="ti ${o.icon}"></i></div>` : ''}<div style="flex:1"><div style="font-weight:600">${o.label}</div>${o.sub?`<div class="text-tiny" style="margin-top:2px">${o.sub}</div>`:''}</div><i class="ti ti-chevron-right" style="color:var(--tx3)"></i></button>`).join('');
    const html = `<div class="modal-h">${title}</div>${sub?`<div class="modal-sub">${sub}</div>`:''}<div class="modal-options">${items}</div><div class="modal-actions" style="margin-top:14px"><button class="btn btn-ghost btn-block" id="m-cancel">Cancelar</button></div>`;
    const promise = this._open(html);
    document.querySelectorAll('.modal-option').forEach(el => el.onclick = () => M._close(el.dataset.val));
    document.getElementById('m-cancel').onclick = () => M._close(null);
    return promise;
  },
  async form({ title, sub='', fields, okText='Guardar' }){
    const fieldsHtml = fields.map((f,idx) => {
      const id = `f-${idx}`;
      if (f.type === 'toggle'){
        return `<div class="modal-field"><div class="modal-toggle" id="${id}-wrap" data-name="${f.name}"><div><div class="modal-toggle-label">${f.label}</div>${f.sub?`<div class="modal-toggle-sub">${f.sub}</div>`:''}</div><div class="toggle-sw ${f.initial?'on':''}" id="${id}"></div></div></div>`;
      }
      if (f.type === 'select'){
        const opts = (f.options||[]).map(o => `<option value="${o.value}" ${String(o.value)===String(f.initial||'')?'selected':''}>${o.label}</option>`).join('');
        return `<div class="modal-field" ${f.conditional?`data-show-if="${f.conditional}"`:''}><label class="modal-label">${f.label}</label><select class="modal-select" id="${id}" data-name="${f.name}">${opts}</select></div>`;
      }
      if (f.type === 'textarea'){
        return `<div class="modal-field" ${f.conditional?`data-show-if="${f.conditional}"`:''}><label class="modal-label">${f.label}</label><textarea class="modal-input modal-textarea" id="${id}" data-name="${f.name}" placeholder="${f.placeholder||''}">${f.initial||''}</textarea></div>`;
      }
      const inputType = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
      return `<div class="modal-field" ${f.conditional?`data-show-if="${f.conditional}"`:''}><label class="modal-label">${f.label}</label><input class="modal-input" type="${inputType}" id="${id}" data-name="${f.name}" placeholder="${f.placeholder||''}" value="${f.initial||''}"></div>`;
    }).join('');

    const html = `<div class="modal-h">${title}</div>${sub?`<div class="modal-sub">${sub}</div>`:''}${fieldsHtml}<div class="modal-actions" style="margin-top:6px"><button class="btn btn-ghost" id="m-cancel">Cancelar</button><button class="btn btn-primary" id="m-ok">${okText}</button></div>`;
    const promise = this._open(html);

    document.querySelectorAll('.toggle-sw').forEach(sw => {
      sw.onclick = () => { sw.classList.toggle('on'); applyConditionals(); };
    });

    function applyConditionals(){
      document.querySelectorAll('[data-show-if]').forEach(el => {
        const cond = el.getAttribute('data-show-if'), [name, val] = cond.split('=');
        const sw = document.querySelector(`[data-name="${name}"] .toggle-sw, #f-${fields.findIndex(f=>f.name===name)}`);
        const isOn = sw && sw.classList.contains('on');
        el.style.display = (isOn === (val === 'true')) ? '' : 'none';
      });
    }
    applyConditionals();

    document.getElementById('m-cancel').onclick = () => M._close(null);
    document.getElementById('m-ok').onclick = () => {
      const result = {}; let invalid = null;
      fields.forEach((f,idx) => {
        const id = `f-${idx}`;
        if (f.type === 'toggle') result[f.name] = document.getElementById(id).classList.contains('on');
        else {
          const el = document.getElementById(id);
          if (!el || (el.closest('.modal-field')?.style.display === 'none')) return;
          const v = el.value.trim();
          if (f.required && !v) invalid = f.label;
          result[f.name] = v;
        }
      });
      if (invalid){ toast(`Falta: ${invalid}`); return; }
      M._close(result);
    };
    return promise;
  }
};

/* ═══════════════════════════════════════════════════════════════
   CÁMARA, VOZ, ALERTAS, LOCATION, WEATHER, GPS
   ═══════════════════════════════════════════════════════════════ */
const Cam = {
  async open(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return this._fallback();
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return this._fallback();
    let initialStream;
    try{ initialStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} }, audio: false }); }
    catch(err){ return this._fallback(); }

    return new Promise((resolve) => {
      let stream = initialStream, mode = 'photo', facing = 'environment', recorder = null;
      const host = document.getElementById('modal-host');
      host.innerHTML = `<div class="cam-modal"><video class="cam-video" id="cam-vid" autoplay playsinline muted></video><div class="cam-top"><button class="cam-btn-top" id="cam-close" title="Cerrar"><i class="ti ti-x"></i></button><div id="cam-rec-wrap"></div><button class="cam-btn-top" id="cam-flip" title="Voltear cámara"><i class="ti ti-camera-rotate"></i></button></div><div class="cam-bottom"><div class="cam-modes"><button class="cam-mode act" data-mode="photo">📷 Foto</button><button class="cam-mode" data-mode="video">🎥 Video</button></div><div class="cam-controls-row"><div class="cam-spacer"></div><button class="cam-shutter" id="cam-shutter"></button><div class="cam-spacer"></div></div></div></div>`;
      
      const vid = document.getElementById('cam-vid'); vid.srcObject = stream;

      async function switchStream(){
        if (stream) stream.getTracks().forEach(t => t.stop());
        try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: mode === 'video' }); vid.srcObject = stream; } catch(err){}
      }
      function close(result){
        if (recorder && recorder.state !== 'inactive') try { recorder.stop(); } catch(e){}
        if (stream) stream.getTracks().forEach(t => t.stop());
        host.innerHTML = ''; resolve(result);
      }
      function setMode(m){
        if (recorder && recorder.state === 'recording' || m === mode) return;
        mode = m; document.querySelectorAll('.cam-mode').forEach(b => b.classList.toggle('act', b.dataset.mode === m)); switchStream();
      }

      document.getElementById('cam-close').onclick = () => close(null);
      document.getElementById('cam-flip').onclick = () => { facing = (facing === 'environment') ? 'user' : 'environment'; switchStream(); };
      document.querySelectorAll('.cam-mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
      document.getElementById('cam-shutter').onclick = () => {
        if (mode === 'photo') {
          const c = document.createElement('canvas'); c.width = vid.videoWidth || 1280; c.height = vid.videoHeight || 720;
          c.getContext('2d').drawImage(vid, 0, 0);
          close({ b64: c.toDataURL('image/jpeg', 0.85).split(',')[1], type:'image/jpeg', preview:c.toDataURL('image/jpeg', 0.85), isVideo:false });
        } else {
          toast('El video web consume mucha memoria. Intenta enviar fotos.');
        }
      };
    });
  },
  _fallback(){
    return new Promise((resolve) => {
      const inp = document.getElementById('camFallback'); let done = false;
      const finish = (val) => { if (done) return; done = true; inp.removeEventListener('change', changeHandler); window.removeEventListener('focus', focusHandler); resolve(val); };
      const changeHandler = (ev) => {
        const f = ev.target.files[0]; if (!f){ finish(null); return; }
        if (f.size > 19 * 1024 * 1024){ toast('Archivo muy pesado (>19MB)'); finish(null); return; }
        const rd = new FileReader();
        rd.onload = rv => finish({ b64: rv.target.result.split(',')[1], type: f.type, preview: rv.target.result, isVideo: f.type.startsWith('video/') });
        rd.readAsDataURL(f);
      };
      const focusHandler = () => { setTimeout(() => { if (!done && !inp.files.length) finish(null); }, 800); };
      inp.addEventListener('change', changeHandler); window.addEventListener('focus', focusHandler);
      inp.value = ''; inp.click();
    });
  }
};

const Voice = {
  _rec: null, _autoTimer: null, _finalText: '',
  start(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ toast('Tu dispositivo no soporta reconocimiento de voz.'); return; }
    if (S.listening){ this.cancel(); return; }
    if (this._autoTimer) { clearTimeout(this._autoTimer); this._autoTimer = null; }
    document.getElementById('voice-cd-bar')?.remove();

    this._finalText = ''; const r = new SR(); r.lang = 'es-CO'; r.continuous = false; r.interimResults = true;
    r.onstart = () => { S.listening = true; S.voiceCountdown = false; render(); };
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++){
        if (e.results[i].isFinal) this._finalText += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      const inp = document.getElementById('txt-inp'); if (inp) { inp.value = (this._finalText + interim).trim(); adjustTextarea(); }
    };
    r.onerror = (ev) => { S.listening = false; render(); };
    r.onend = () => {
      S.listening = false; const txt = this._finalText.trim();
      const micBtn = document.getElementById('btn-voice'); if (micBtn) micBtn.classList.remove('listening');
      if (!txt) return;

      const chatInp = document.querySelector('.chat-inp');
      if (chatInp){
        document.getElementById('voice-cd-bar')?.remove();
        const cd = document.createElement('div'); cd.className = 'voice-countdown'; cd.id = 'voice-cd-bar';
        cd.innerHTML = `<i class="ti ti-send" style="font-size:14px"></i><span>Enviando en 1.5s — toca para cancelar</span><div class="voice-countdown-bar"><div class="voice-countdown-fill"></div></div>`;
        cd.onclick = () => Voice.cancelAutoSend();
        chatInp.insertBefore(cd, chatInp.firstChild);
      }
      this._autoTimer = setTimeout(() => {
        document.getElementById('voice-cd-bar')?.remove();
        if (document.getElementById('txt-inp')?.value.trim()) document.getElementById('btn-send')?.click();
      }, 1500);
    };
    this._rec = r; try{ r.start(); } catch(err){ S.listening = false; render(); }
  },
  cancel(){
    if (this._rec) try { this._rec.abort(); } catch(e){}
    if (this._autoTimer) { clearTimeout(this._autoTimer); this._autoTimer = null; }
    document.getElementById('voice-cd-bar')?.remove(); S.listening = false; render();
  },
  cancelAutoSend(){
    if (this._autoTimer) { clearTimeout(this._autoTimer); this._autoTimer = null; }
    document.getElementById('voice-cd-bar')?.remove(); toast('Auto-envío cancelado');
  }
};

const Alerts = {
  _scheduledHours: [7, 12, 18], _lastFiredHour: null, _intervalId: null, SNOOZE_KEY: 'finca_snoozed_alerts',
  _today(){ return fechaLocalISO(); },
  _getSnoozed(){
    try {
      const data = JSON.parse(localStorage.getItem(this.SNOOZE_KEY) || '{}');
      const now = Date.now(), clean = {};
      Object.entries(data).forEach(([k, v]) => { if (v > now) clean[k] = v; });
      if (Object.keys(clean).length !== Object.keys(data).length) localStorage.setItem(this.SNOOZE_KEY, JSON.stringify(clean));
      return clean;
    } catch(e) { return {}; }
  },
  snooze(key, days = 7){
    const data = this._getSnoozed(); data[key] = Date.now() + (days * 24 * 60 * 60 * 1000);
    localStorage.setItem(this.SNOOZE_KEY, JSON.stringify(data));
  },
  compute(){
    const today = this._today(), tasks = S.cache.tasks || [], inv = S.cache.inventory || [], snoozed = this._getSnoozed();
    const vencidas = tasks.filter(t => t.estado === 'pendiente' && t.fecha_limite && t.fecha_limite < today && !snoozed[`task_${t.id}`]);
    const hoy      = tasks.filter(t => t.estado === 'pendiente' && t.fecha_limite === today && !snoozed[`task_${t.id}`]);
    const proximas = tasks.filter(t => t.estado === 'pendiente' && t.fecha_limite && t.fecha_limite > today);
    const sinFecha = tasks.filter(t => t.estado === 'pendiente' && !t.fecha_limite);
    const mias = tasks.filter(t => t.estado === 'pendiente' && (t.asignado?.codigo === S.user?.id || t.asignado_a_todos) && !snoozed[`task_${t.id}`]);
    const stockBajo = inv.filter(i => {
      if (snoozed[`stock_${i.id}`]) return false;
      const inq = parseFloat(i.total_ingresado || i.cantidad_actual) || 0, act = parseFloat(i.cantidad_actual) || 0;
      return inq > 0 && act > 0 && act < (inq * 0.15);
    });
    const stockCero = inv.filter(i => { if (snoozed[`stock_${i.id}`]) return false; return parseFloat(i.cantidad_actual) === 0; });
    const porVencer = inv.filter(i => {
      if (!i.fecha_vencimiento || snoozed[`venc_${i.id}`]) return false;
      if ((parseFloat(i.cantidad_actual)||0) <= 0) return false;
      return diasHasta(i.fecha_vencimiento) <= 30;
    }).map(i => ({ ...i, _diasVenc: diasHasta(i.fecha_vencimiento) }));
    return { vencidas, hoy, proximas, sinFecha, mias, stockBajo, stockCero, porVencer, today };
  },
  urgentCount(){ const a = this.compute(); return a.vencidas.length + a.hoy.length + a.stockCero.length + a.porVencer.filter(i=>i._diasVenc<=0).length; },
  pendingTasksCount(){ return (S.cache.tasks || []).filter(t => t.estado === 'pendiente').length; },
  greeting(){
    const h = horaFinca();

        <div class="alert-row-body">

      const vencUrgentes = a.porVencer.filter(i=>i._diasVenc<=0), vencProximos = a.porVencer.filter(i=>i._diasVenc>0);
      if (vencUrgentes.length) body += `<div class="alert-group urgent"><div class="alert-group-h"><div class="icon-pill ip-red"><i class="ti ti-calendar-x"></i></div>${vencUrgentes.length} producto(s) VENCIDO(S)</div>${vencUrgentes.slice(0,5).map(vencRow).join('')}</div>`;
      if (vencProximos.length) body += `<div class="alert-group warn"><div class="alert-group-h"><div class="icon-pill ip-yellow"><i class="ti ti-calendar-exclamation"></i></div>${vencProximos.length} producto(s) por vencer (≤30 días)</div>${vencProximos.slice(0,5).map(vencRow).join('')}</div>`;
    }

    const html = `
      <div class="welcome-greeting">${greeting}${name?', '+name:''}</div>

    const p = M._open(html);

    document.getElementById('m-close').onclick = () => M._close(true);
    document.querySelectorAll('[data-complete-alert]').forEach(el => {

        if (row){ setTimeout(() => { row.classList.add('dismissing'); }, 220); setTimeout(() => { row.remove(); this._checkEmptyGroups(); }, 540); }
        await HANDLERS.complete_task(id); render();

      el.addEventListener('click', (e) => {
        const id = e.currentTarget.dataset.snoozeVenc;

  _checkEmptyGroups(){

  fireNotification(){
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const a = this.compute(), urg = a.vencidas.length + a.hoy.length;
    if (urg === 0) return;
    try{
      const n = new Notification('Finca El Retiro 🌱', { body: `Tienes ${urg} cosas pendientes.`, tag: 'finca-pendientes' });
      n.onclick = () => { window.focus(); this.showPanel(); n.close(); };

  startScheduler(){
    if (this._intervalId) clearInterval(this._intervalId);

      const h = horaFinca(), m = new Date().getMinutes();

      if (h === 0 && m === 0) this._lastFiredHour = null;

    const a = this.compute();

const Location = {

  get(){ try { return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || this.DEFAULT; } catch(e){ return this.DEFAULT; } },

  reset(){ try { localStorage.removeItem(this.STORAGE_KEY); } catch(e){} },
  async updateFromGPS(){
    if (!navigator.geolocation) throw new Error('GPS no soportado');
    const pos = await new Promise((resolve, reject) => { navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy: true, timeout: 15000}); });
    const loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy), name: 'Ubicación actual', isDefault: false };
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${loc.lat}&longitude=${loc.lon}&language=es&count=1`);
      if (r.ok){ const p = (await r.json()).results?.[0]; if (p) loc.name = [p.name, p.admin2, p.admin1].filter(Boolean).slice(0, 3).join(', '); }
    } catch(e){}
    this.set(loc); Weather.clearCache(); return loc;
  }
};

        <button class="btn btn-primary btn-block" id="m-close">Cerrar</button>
      </div>`;
    const p = M._open(html);
    document.getElementById('m-close').onclick = () => M._close(true);
    document.getElementById('m-update-loc').onclick = async () => {
      M._close(true); toast('📍 Buscando GPS...');
      try { await Location.updateFromGPS(); await Weather.fetch(true); render(); } catch(e){ toast(`❌ ${e.message}`); }
    };
    return p;
  }
};

async function captureGPS(){
  if (!navigator.geolocation){ toast('Tu dispositivo no tiene GPS.'); return; }
  toast('📍 Buscando coordenadas...');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
    const loteDbId = S.activeLote ? S.cache.lotes.find(l => l.codigo === S.activeLote.codigo)?.id : null;
    const codigoLote = S.activeLote ? S.activeLote.codigo : null;
    await HANDLERS.log_activity({ lote_id: loteDbId, codigo: codigoLote, actividad: `Punto GPS: ${coords}` });
    toast('✅ Coordenada registrada'); render();
  }, (err) => { toast('No se pudo obtener GPS'); }, { enableHighAccuracy: true, timeout: 15000 });
}

function toast(msg, opts){
  const e = document.getElementById('toast'); clearTimeout(toast._t);
  if (opts && opts.action){
    e.classList.add('has-action');
    e.innerHTML = `<span>${msg}</span><button class="toast-action" id="toast-act">${opts.action.label}</button>`;
    setTimeout(() => { const btn = document.getElementById('toast-act'); if (btn) btn.onclick = () => { opts.action.onClick(); e.classList.remove('show'); }; }, 0);
  } else { e.classList.remove('has-action'); e.textContent = msg; }
  e.classList.add('show');
  toast._t = setTimeout(() => e.classList.remove('show'), (opts && opts.duration) || 2800);
}

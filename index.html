<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3B6D11">
<title>Finca El Retiro v11.0</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finca Retiro">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS DE DISEÑO
   ═══════════════════════════════════════════════════════════════ */
:root{
  --g:#3B6D11; --gl:#EAF3DE; --gm:#639922; --gb:#C0DD97; --gd:#2A4F08;
  --br:#854F0B; --bl:#185FA5; --rd:#C53030; --yl:#B07010; --or:#D97706;
  --p-green:#DCEFC4; --p-brown:#F5E4CC; --p-blue:#D7E5F4; --p-red:#F8D4D4; --p-yellow:#FBE8C6; --p-orange:#FCE0C0;
  --bg:#F6F8F1; --s:#FFFFFF; --s2:#FBFCF7; --s3:#EEF2E8; --bd:#E1EBD2; --bdh:#CCDDB0;
  --tx:#1A1F14; --tx2:#5A6A4A; --tx3:#8A9A7A;
  --sh-sm:0 1px 3px rgba(30,60,10,.08); --sh:0 2px 10px rgba(30,60,10,.10); --sh-lg:0 6px 24px rgba(30,60,10,.14);
  --r:14px; --r2:10px; --r-xl:20px;
  --f:'Outfit',system-ui,sans-serif; --ft:'Fraunces',Georgia,serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:var(--f);overscroll-behavior:none;color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--s);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}

/* UI Básica (Login, Topbar, Nav) */
.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;overflow-y:auto;background:radial-gradient(circle at 15% 15%, rgba(192,221,151,.4), transparent 40%), radial-gradient(circle at 85% 85%, rgba(133,79,11,.06), transparent 40%), var(--s);}
.login-logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,var(--gl),#F0F8E2);border:1.5px solid var(--gb);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:var(--sh-lg);position:relative}
.login-logo::after{content:'';position:absolute;inset:-4px;border-radius:30px;border:1px dashed rgba(99,153,34,.3);pointer-events:none}
.login-logo i{color:var(--g);font-size:42px}
.login-h{font-family:var(--ft);font-size:30px;font-weight:600;color:var(--gd);letter-spacing:-.5px;margin-bottom:2px;text-align:center}
.login-sub{font-size:13px;color:var(--tx2);margin-bottom:28px;text-align:center;font-style:italic}
.ulist{width:100%;display:flex;flex-direction:column;gap:10px;max-width:340px}
.uitem{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;font-weight:600;font-family:var(--f);font-size:15px;transition:transform .15s, box-shadow .15s, border-color .15s;color:var(--tx);text-align:left}
.uitem:active{transform:scale(.97);opacity:.85}
.uitem:hover{border-color:var(--gb);box-shadow:var(--sh-sm)}
.uitem-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gm),var(--g));color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 -2px 4px rgba(0,0,0,.12)}
.uitem-chev{margin-left:auto;color:var(--tx3);font-size:18px}

.topbar{background:linear-gradient(180deg,#EFF8DF,var(--gl));padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--gb);flex-shrink:0}
.tb-logo{width:36px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);color:var(--g);font-size:20px}
.tb-mid{flex:1;min-width:0}
.tb-name{font-family:var(--ft);font-size:16px;font-weight:600;color:var(--gd);display:flex;align-items:center;gap:6px;letter-spacing:-.3px}
.tb-user{font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:4px;margin-top:1px}
.tb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gm),var(--g));color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh-sm);position:relative}
.tb-av-dot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--s);border:2px solid var(--gl);display:flex;align-items:center;justify-content:center}
.tb-av-dot::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--gm)}
.net-status{width:7px;height:7px;border-radius:50%;display:inline-block}
.net-online{background:#46C940;box-shadow:0 0 0 2px rgba(70,201,64,.25)}
.net-offline{background:var(--rd);box-shadow:0 0 0 2px rgba(197,48,48,.25);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.5}}

.nav{display:flex;background:var(--s);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ntab{flex:1;min-width:0;padding:9px 2px 7px;background:transparent;border:none;font-size:9.5px;color:var(--tx3);cursor:pointer;font-family:var(--f);display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;position:relative;line-height:1.1}
.ntab i{font-size:18px}
.ntab.act{color:var(--g);border-bottom-color:var(--gm);font-weight:700}
.ntab.act i{filter:drop-shadow(0 1px 2px rgba(99,153,34,.25))}
.ntab-badge{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:10px;padding:0 4px;background:var(--rd);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1;font-feature-settings:"tnum"}

/* Paneles, Cards y Badges */
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
.panel{flex:1;overflow-y:auto;padding:14px;background:var(--bg);scroll-behavior:smooth}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.panel-title{font-family:var(--ft);font-size:19px;font-weight:600;color:var(--gd);letter-spacing:-.3px}
.sec-t{font-size:10.5px;color:var(--gm);letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:10px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh-sm);animation:fadeUp .35s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.card-t{font-size:14px;font-weight:600;color:var(--tx)}
.badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;letter-spacing:.3px;display:inline-flex;align-items:center;gap:3px}
.bg-green{background:var(--p-green);color:#2A4F08} .bg-brown{background:var(--p-brown);color:#7A4A08}
.bg-blue{background:var(--p-blue);color:#1A3A7A} .bg-red{background:var(--p-red);color:#7A1A1A}
.bg-yellow{background:var(--p-yellow);color:#6A4008} .bg-orange{background:var(--p-orange);color:#7A3A08}

.icon-pill{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.ip-green{background:var(--p-green);color:var(--g)} .ip-brown{background:var(--p-brown);color:var(--br)}
.ip-blue{background:var(--p-blue);color:var(--bl)} .ip-red{background:var(--p-red);color:var(--rd)}
.ip-yellow{background:var(--p-yellow);color:var(--yl)} .ip-orange{background:var(--p-orange);color:var(--or)}
.ip-gray{background:#E2E8F0;color:#475569}

/* Botones */
.btn{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;font-family:var(--f);border:1px solid transparent;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:8px;gap:4px}
.btn-primary{background:linear-gradient(180deg,var(--gm),var(--g));color:#fff;box-shadow:var(--sh-sm)}
.btn-soft{background:var(--gl);color:var(--g);border-color:var(--gb)}
.btn-blue{background:var(--p-blue);color:#1A3A7A;border-color:#B9D3F3}
.btn-red{background:var(--p-red);color:#8B1A1A;border-color:#E8B0B0}
.btn-yellow{background:var(--p-yellow);color:#7A4A08;border-color:#FDE0B2}
.btn-ghost{background:transparent;color:var(--tx2);border:1px solid var(--bd)}
.btn-block{width:100%}

/* Chat */
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.chat-banner{background:linear-gradient(135deg,var(--gl),#F4FAE6);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px}
.chat-banner .icon-pill{width:32px;height:32px;border-radius:10px}
.chat-banner-t{font-size:13px;font-weight:700;color:var(--gd);font-family:var(--ft)}
.chat-banner-s{font-size:11px;color:var(--tx2);line-height:1.3}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:flex-end;gap:8px} .mrow.u{flex-direction:row-reverse}
.mrow-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--gl);color:var(--g);border:1px solid var(--gb)}
.mrow-av.web{background:#E8F0FB;color:var(--bl);border-color:#B9D3F3}
.mrow-av.user{background:linear-gradient(135deg,var(--gm),var(--g));color:#fff;border:none;font-weight:700;font-size:12px}
.bbl{max-width:80%;padding:10px 13px;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);animation:fadeUp .25s ease-out both}
.bbl-a{background:var(--s);border:1px solid var(--bd);border-bottom-left-radius:5px}
.bbl-u{background:linear-gradient(180deg,#F0F8DF,var(--gl));border:1px solid var(--gb);border-bottom-right-radius:5px}
.bbl-txt{font-size:13.5px;line-height:1.6;color:var(--tx);white-space:pre-wrap;word-break:break-word}
.inf-btn{margin-top:8px;display:inline-flex;align-items:center;gap:5px;font-family:var(--f);font-size:12px;font-weight:600;color:var(--g);background:var(--gl);border:1px solid var(--gb);border-radius:999px;padding:5px 11px;cursor:pointer}
.inf-chips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.inf-chips::-webkit-scrollbar{display:none}
.inf-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-family:var(--f);font-size:11.5px;font-weight:600;color:var(--tx2);background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.inf-chip i{color:var(--g);font-size:14px}
.inf-chip:active{transform:scale(.96)}
.inf-wrap{overflow:auto;max-height:58vh;border:1px solid var(--bd);border-radius:10px;margin:8px 0 4px;-webkit-overflow-scrolling:touch}
.inf-table{border-collapse:collapse;width:100%;font-size:12px;line-height:1.35}
.inf-table th{position:sticky;top:0;background:var(--s3);color:var(--tx2);font-weight:700;text-align:left;padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--bd)}
.inf-table td{padding:6px 8px;border-bottom:1px solid var(--s3);vertical-align:top;color:var(--tx);min-width:60px}
.inf-table td:first-child{white-space:nowrap}
.inf-table td.num{text-align:right;white-space:nowrap;font-feature-settings:'tnum'}
.inf-table tr:nth-child(even) td{background:var(--s2)}
.media-prev{width:170px;border-radius:10px;margin-bottom:7px;border:1px solid var(--bd);display:block;object-fit:cover}

.chat-inp{padding:10px 12px 12px;background:var(--s);border-top:1px solid var(--bd)}
.inp-row{display:flex;align-items:flex-end;gap:7px}
.txt-inp{flex:1;border:1.5px solid var(--bd);border-radius:20px;padding:10px 14px;font-size:13.5px;outline:none;font-family:var(--f);resize:none;max-height:120px;line-height:1.4;transition:border-color .15s}
.txt-inp:focus{border-color:var(--gm)}
.icb{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.icb i{font-size:19px;color:var(--tx2)}
.icb.send{background:linear-gradient(180deg,var(--gm),var(--g));border-color:var(--g)}
.icb.send i{color:#fff}
.icb.send:disabled{opacity:.5;cursor:not-allowed}
.icb.listening{background:#FDEAEA;border-color:var(--rd);animation:pulseMic 1.2s infinite}
.icb.listening i{color:var(--rd)}
@keyframes pulseMic{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(197,48,48,.4)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(197,48,48,0)}}

.media-pending{display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--gl);border:1px solid var(--gb);border-radius:10px;margin-bottom:8px}
.media-pending img,.media-pending video{height:36px;border-radius:6px}
.media-pending span{font-size:11px;color:var(--g);font-weight:600;flex:1}
.media-pending button{background:none;border:none;color:var(--rd);font-size:20px;cursor:pointer;padding:0 4px}

.voice-countdown{margin-bottom:8px;padding:8px 12px;background:linear-gradient(90deg,#FDEAEA,#FDF4DA);border:1px solid #F5C0C0;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--rd);font-weight:600}
.voice-countdown-bar{flex:1;height:4px;background:#F8D4D4;border-radius:2px;overflow:hidden}
.voice-countdown-fill{height:100%;background:var(--rd);animation:cdShrink 1.5s linear forwards;transform-origin:left center}
@keyframes cdShrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* Bodega Rediseñada (Carpetas) */
.bodega-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bodega-folder{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:24px 10px;text-align:center;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .1s}
.bodega-folder:active{transform:scale(.95)}
.bodega-folder .icon-pill{margin:0 auto 12px;width:52px;height:52px;font-size:26px;border-radius:16px}
.bodega-folder-title{font-family:var(--ft);font-weight:600;color:var(--tx);font-size:14.5px;line-height:1.2}

.inv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;border-top:1px dashed var(--bd);padding-top:10px}
.inv-stat{text-align:center;font-size:10px;color:var(--tx3);padding:6px 4px;background:var(--s2);border-radius:8px}
.inv-stat b{display:block;font-size:14px;color:var(--tx);font-weight:700;margin-top:2px;font-feature-settings:"tnum"}
.inv-stat.active b{color:var(--g)}

.spec-box{font-size:12.5px;color:var(--tx2);background:#F4F6F0;padding:8px 10px;border-radius:8px;margin-bottom:10px;border:1px solid var(--bdh);line-height:1.4}
.spec-box b{color:var(--gd)}

/* Texto cortado con "Ver mas" */
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp.open{display:block;-webkit-line-clamp:unset}
.ver-mas{background:none;border:none;color:var(--g);font-weight:700;font-size:11.5px;cursor:pointer;padding:2px 0;font-family:var(--f);display:inline-flex;align-items:center;gap:3px}

/* Ficha tecnica investigada por IA */
.ficha-box{font-size:12.5px;color:var(--tx2);background:linear-gradient(135deg,#EEF4FC,#F4FAFE);padding:9px 11px;border-radius:8px;margin-bottom:10px;border:1px solid #C5DAF2;line-height:1.5;white-space:pre-wrap}
.ficha-box-t{font-size:10.5px;color:var(--bl);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:4px}

/* Costos de insumo */
.costo-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:700;background:var(--p-blue);color:#1A3A7A;font-feature-settings:"tnum"}
.lote-cost-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.lote-cost-row:last-child{border-bottom:none}

/* Barra de agente por sección */
.ag-bar{background:linear-gradient(135deg,var(--gl),#F4FAE6);border:1px solid var(--gb);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.ag-bar.brown{background:linear-gradient(135deg,#F5E9D6,#FBF3E5);border-color:#E8C99A}
.ag-bar.blue{background:linear-gradient(135deg,#E9F1FB,#F2F7FD);border-color:#C5DAF2}
.ag-bar.yellow{background:linear-gradient(135deg,#FBF1D8,#FCF7E8);border-color:#F2DBA6}
.ag-bar-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ag-bar-av{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--g)}
.ag-bar.brown .ag-bar-av{color:var(--br);border-color:#E8C99A}
.ag-bar.blue .ag-bar-av{color:var(--bl);border-color:#C5DAF2}
.ag-bar.yellow .ag-bar-av{color:var(--yl);border-color:#F2DBA6}
.ag-bar-name{font-size:12.5px;font-weight:700;color:var(--gd);line-height:1.1}
.ag-bar-sub{font-size:10.5px;color:var(--tx2)}
.ag-bar-row{display:flex;align-items:center;gap:7px;background:var(--s);border:1px solid var(--bd);border-radius:20px;padding:5px 6px 5px 12px}
.ag-bar-inp{flex:1;border:none;outline:none;background:transparent;font-size:12.5px;font-family:var(--f);color:var(--tx);min-width:0}
.ag-bar-btn{width:32px;height:32px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ag-bar-mic{background:#FDEAEA;color:var(--rd)}
.ag-bar-mic.on{animation:pulseMic 1.2s infinite}
.ag-bar-send{background:linear-gradient(180deg,var(--gm),var(--g));color:#fff}

/* Planta de tomate: el agente está pensando */
.tp-tallo{transform-origin:37px 78px;animation:tpTallo 7s ease-in-out infinite}
@keyframes tpTallo{0%{transform:scaleY(0)}14%,100%{transform:scaleY(1)}}
.tp-hoja1{transform-origin:37px 62px;animation:tpHoja1 7s ease-in-out infinite}
@keyframes tpHoja1{0%,14%{transform:scale(0)}24%,100%{transform:scale(1)}}
.tp-hoja2{transform-origin:37px 52px;animation:tpHoja2 7s ease-in-out infinite}
@keyframes tpHoja2{0%,20%{transform:scale(0)}30%,100%{transform:scale(1)}}
.tp-flor{transform-origin:37px 38px;animation:tpFlor 7s ease-in-out infinite}
@keyframes tpFlor{0%,30%{transform:scale(0);opacity:0}38%,48%{transform:scale(1);opacity:1}54%,100%{transform:scale(0);opacity:0}}
.tp-tomate{transform-origin:37px 42px;animation:tpTom 7s ease-in-out infinite}
@keyframes tpTom{0%,50%{transform:scale(0)}62%{transform:scale(.65)}74%,100%{transform:scale(1)}}
.tp-fruto{animation:tpColor 7s ease-in-out infinite}
@keyframes tpColor{0%,55%{fill:#8BC34A}70%{fill:#E8A13C}82%,100%{fill:#C53030}}

/* Galería de fotos */
.galeria-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.galeria-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:pointer;background:var(--s3)}
.foto-view{position:fixed;inset:0;background:rgba(10,14,8,.94);z-index:10005;display:flex;flex-direction:column}
.foto-view img{flex:1;object-fit:contain;min-height:0;width:100%}
.foto-view-bar{padding:12px 16px;display:flex;gap:10px;align-items:center}
.foto-view-meta{padding:10px 16px 24px;color:#fff;font-size:12.5px;line-height:1.5}

/* Boton Mi ubicacion en mapas */
.map-locate-btn{position:absolute;top:8px;left:8px;z-index:1000;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:4px;color:var(--bl)}
.map-locate-btn.active{background:#EEF4FC;border-color:#B9D3F3}
.map-locate-btn i{font-size:15px}

/* Finanzas */
.finanzas-header{display:flex;gap:10px;margin-bottom:12px}
.fin-box{flex:1;padding:14px 10px;border-radius:var(--r);text-align:center;box-shadow:var(--sh-sm);border:1px solid var(--bd);position:relative;overflow:hidden}
.fin-box::before{content:'';position:absolute;top:-15px;right:-15px;width:60px;height:60px;border-radius:50%;opacity:.4}
.fin-egresos{background:linear-gradient(135deg,#FFF5F5,#FDEAEA)}
.fin-egresos::before{background:#F8D4D4}
.fin-ingresos{background:linear-gradient(135deg,#F4FBE5,var(--gl))}
.fin-ingresos::before{background:var(--gb)}
.fin-box-t{font-size:10px;color:var(--tx3);text-transform:uppercase;font-weight:700;margin-bottom:5px;letter-spacing:.6px;position:relative}
.fin-box-v{font-size:17px;font-weight:700;color:var(--tx);position:relative;font-feature-settings:"tnum"}
.balance-card{background:linear-gradient(135deg,var(--gl),#F4FAE6);border:1px solid var(--gb);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--sh)}
.balance-label{font-size:11px;color:var(--g);text-transform:uppercase;font-weight:700;letter-spacing:.8px;margin-bottom:4px}
.balance-val{font-family:var(--ft);font-size:30px;font-weight:600;letter-spacing:-.5px;font-feature-settings:"tnum"}

/* Lotes y Tareas */
.lote-card{cursor:pointer;transition:transform .1s,box-shadow .15s}
.lote-card:active{transform:scale(.98)}
.lote-card:hover{box-shadow:var(--sh)}
.lote-card-row{display:flex;align-items:center;gap:12px}
.lote-card-body{flex:1;min-width:0}
.lote-card-title{font-size:15px;font-weight:700;color:var(--tx);font-family:var(--ft);letter-spacing:-.2px}
.lote-card-sub{font-size:11px;color:var(--tx2);margin-top:2px}
.lote-card-chev{color:var(--tx3);font-size:20px}
.lote-detail-header{background:linear-gradient(135deg,var(--gl),#F4FAE6);padding:18px;border-radius:var(--r);margin-bottom:14px;border:1px solid var(--gb);position:relative;overflow:hidden}
.lote-detail-header::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(99,153,34,.18),transparent 70%)}
.lote-detail-title{font-family:var(--ft);font-size:22px;font-weight:600;color:var(--gd);letter-spacing:-.3px;position:relative}
.lote-detail-sub{font-size:12px;color:var(--tx2);margin-top:3px;position:relative}
.lote-back{background:none;border:none;color:var(--g);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 0;font-family:var(--f)}

.mini-list{font-size:12px;color:var(--tx2);margin-top:4px}
.mini-list-item{padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px;color:var(--tx);display:flex;align-items:flex-start;gap:10px}
.mini-list-item:last-child{border-bottom:none}
.mini-list-dot{width:8px;height:8px;border-radius:50%;background:var(--gb);flex-shrink:0;margin-top:6px;box-shadow:0 0 0 3px var(--gl)}
.mini-list-dot.pending{background:var(--yl);box-shadow:0 0 0 3px var(--p-yellow)}
.mini-list-dot.done{background:var(--g);box-shadow:0 0 0 3px var(--p-green)}
.mini-list-body{flex:1;min-width:0}
.mini-list-title{font-weight:600;font-size:13px;color:var(--tx);line-height:1.4}
.mini-list-meta{font-size:10.5px;color:var(--tx3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.mini-list-meta span{display:inline-flex;align-items:center;gap:3px}

.empty{padding:30px 20px;text-align:center;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty-icon{width:54px;height:54px;border-radius:50%;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:4px}
.empty-t{font-weight:600;color:var(--tx);font-size:14px}
.empty-s{font-size:12px;color:var(--tx3);max-width:240px;line-height:1.5}

/* Internet */
.internet-hero{text-align:center;padding:24px 16px;background:linear-gradient(180deg,#F4FAE6,var(--s));border-radius:var(--r);border:1px solid var(--bd);margin-bottom:12px}
.internet-hero i{font-size:44px;color:#4285F4;margin-bottom:12px;display:block}
.internet-hero h3{font-family:var(--ft);font-size:18px;font-weight:600;color:var(--gd);margin-bottom:4px}
.internet-hero p{font-size:12px;color:var(--tx2);margin-bottom:14px}
.search-box{display:flex;gap:6px;background:var(--s);padding:6px;border-radius:24px;border:1.5px solid var(--bd);box-shadow:var(--sh-sm)}
.search-box input{flex:1;border:none;outline:none;padding:8px 12px;font-size:13.5px;font-family:var(--f);background:transparent}
.search-btn{background:linear-gradient(180deg,var(--gm),var(--g));color:#fff;border:none;padding:8px 18px;border-radius:18px;font-weight:600;font-family:var(--f);cursor:pointer;font-size:13px}

/* Toast y Modales */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(26,31,20,.95);backdrop-filter:blur(8px);color:#fff;padding:11px 18px;border-radius:24px;font-size:12.5px;font-weight:500;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:var(--sh-lg);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast-action{margin-left:8px;padding:4px 10px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;border:none;font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.2px}
.toast.has-action{padding:10px 12px 10px 18px}

.modal-overlay{position:fixed;inset:0;background:rgba(20,30,10,.55);backdrop-filter:blur(4px);z-index:10000;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet{width:100%;max-width:430px;background:var(--s);border-radius:24px 24px 0 0;padding:8px 18px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:slideUp .28s cubic-bezier(.2,.8,.3,1);max-height:90vh;overflow-y:auto}
.modal-handle{width:42px;height:4px;background:var(--bdh);border-radius:2px;margin:0 auto 12px}
.modal-h{font-family:var(--ft);font-size:19px;font-weight:600;color:var(--gd);margin-bottom:6px;letter-spacing:-.3px}
.modal-sub{font-size:12.5px;color:var(--tx2);margin-bottom:16px;line-height:1.45}
.modal-field{margin-bottom:14px}
.modal-label{display:block;font-size:11.5px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.modal-input,.modal-select{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;font-size:14.5px;font-family:var(--f);outline:none;background:var(--s2);color:var(--tx);transition:border-color .15s,background .15s}
.modal-input:focus,.modal-select:focus{border-color:var(--gm);background:var(--s)}
.modal-textarea{min-height:80px;resize:vertical}
.modal-options{display:flex;flex-direction:column;gap:8px}
.modal-option{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;background:var(--s2);font-size:14px;color:var(--tx);font-family:var(--f);transition:all .15s;text-align:left}
.modal-option:active{transform:scale(.98)}
.modal-option:hover{border-color:var(--gb);background:var(--gl)}
.modal-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer}
.modal-toggle-label{font-size:13.5px;color:var(--tx);font-weight:600}
.modal-toggle-sub{font-size:11.5px;color:var(--tx2);margin-top:2px}
.toggle-sw{width:44px;height:24px;background:var(--bd);border-radius:12px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle-sw.on{background:var(--g)}
.toggle-sw.on::after{transform:translateX(20px)}
.modal-actions{display:flex;gap:8px;margin-top:8px}
.modal-actions .btn{flex:1}

/* Cámara En Vivo */
.cam-modal{position:fixed;inset:0;background:#000;z-index:10001;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cam-video{width:100%;height:100%;object-fit:cover;background:#000}
.cam-top{position:absolute;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.cam-btn-top{width:42px;height:42px;border-radius:50%;border:none;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cam-btn-top i{font-size:22px}
.cam-rec-indicator{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:rgba(197,48,48,.85);color:#fff;font-size:12px;font-weight:700}
.cam-rec-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:24px 16px 32px;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.cam-modes{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.cam-mode{padding:6px 16px;border-radius:18px;border:none;background:rgba(255,255,255,.15);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;font-family:var(--f);transition:background .15s}
.cam-mode.act{background:#fff;color:#000}
.cam-controls-row{display:flex;justify-content:space-between;align-items:center}
.cam-shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto}
.cam-shutter::after{content:'';width:56px;height:56px;border-radius:50%;background:#fff;transition:all .15s}
.cam-shutter.recording::after{width:30px;height:30px;border-radius:6px;background:var(--rd)}
.cam-shutter:active::after{transform:scale(.9)}
.cam-spacer{width:42px;height:42px}

/* Clases Flex y Utilidades */
.row{display:flex;align-items:center;gap:10px}
.gap6{gap:6px} .gap8{gap:8px} .gap12{gap:12px}
.mt8{margin-top:8px} .mt12{margin-top:12px} .mb8{margin-bottom:8px}
.text-tiny{font-size:10.5px;color:var(--tx3)}
.text-small{font-size:12px;color:var(--tx2)}
.text-bold{font-weight:700}
.flex1{flex:1}
.scroll-hide{scrollbar-width:none}
.scroll-hide::-webkit-scrollbar{display:none}

/* Alertas y Notificaciones */
.bell-btn{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border:none;box-shadow:var(--sh-sm);transition:transform .15s}
.bell-btn:active{transform:scale(.92)}
.bell-btn i{color:var(--g);font-size:18px}
.bell-btn.has-alerts i{color:var(--yl);animation:bellRing 2.5s ease-in-out infinite}
@keyframes bellRing{ 0%,90%,100%{transform:rotate(0)} 92%{transform:rotate(-12deg)} 94%{transform:rotate(10deg)} 96%{transform:rotate(-6deg)} 98%{transform:rotate(4deg)} }
.bell-badge{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:10px;padding:0 5px;background:var(--rd);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1;font-feature-settings:"tnum"}

.task-check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--gb);background:var(--s2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.2,.8,.3,1);color:transparent;font-size:16px}
.task-check:hover{border-color:var(--gm);background:var(--gl)}
.task-check:active{transform:scale(.88)}
.task-check.checked{background:linear-gradient(135deg,var(--gm),var(--g));border-color:var(--g);color:#fff;animation:checkPop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes checkPop{ 0%{transform:scale(1)} 40%{transform:scale(1.25);box-shadow:0 0 0 8px rgba(99,153,34,.15)} 100%{transform:scale(1);box-shadow:0 0 0 0 rgba(99,153,34,0)} }
.task-item-completing{opacity:.5;transition:opacity .3s}
.task-item-completing .mini-list-title{text-decoration:line-through}

.task-group{margin-bottom:14px}
.task-group-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:0 2px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.task-group-h .dot{width:9px;height:9px;border-radius:50%}
.task-group.urgent .task-group-h{color:var(--rd)} .task-group.urgent .dot{background:var(--rd);box-shadow:0 0 0 3px var(--p-red)}
.task-group.today .task-group-h{color:var(--yl)} .task-group.today .dot{background:var(--yl);box-shadow:0 0 0 3px var(--p-yellow)}
.task-group.soon .task-group-h{color:var(--g)} .task-group.soon .dot{background:var(--g);box-shadow:0 0 0 3px var(--p-green)}
.task-group.later .task-group-h{color:var(--tx3)} .task-group.later .dot{background:var(--tx3);box-shadow:0 0 0 3px var(--s3)}
.task-group-card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:4px 14px;box-shadow:var(--sh-sm)}
.task-group.urgent .task-group-card{border-left:3px solid var(--rd)}
.task-group.today .task-group-card{border-left:3px solid var(--yl)}
.task-group.soon .task-group-card{border-left:3px solid var(--g)}
.task-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.task-row:last-child{border-bottom:none}
.task-row-body{flex:1;min-width:0}
.task-row-title{font-size:13.5px;font-weight:600;color:var(--tx);line-height:1.35}
.task-row-meta{font-size:10.5px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}

.welcome-greeting{font-family:var(--ft);font-size:22px;font-weight:600;color:var(--gd);letter-spacing:-.3px;margin-bottom:2px}
.welcome-sub{font-size:13.5px;color:var(--tx2);margin-bottom:14px;line-height:1.4}
.alert-group{background:var(--s2);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--bd)}
.alert-group.urgent{background:#FFF6F6;border-color:#F5C5C5}
.alert-group.warn{background:#FFFBF0;border-color:#F5DCAA}
.alert-group-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;color:var(--tx);margin-bottom:8px}
.alert-empty{text-align:center;padding:24px 12px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:10px}
.alert-empty .icon-pill{width:48px;height:48px;border-radius:50%;font-size:24px}
.alert-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(0,0,0,.05);transition:opacity .3s, transform .3s}
.alert-row:last-child{border-bottom:none}
.alert-row.dismissing{opacity:0;transform:translateX(40px)}
.alert-row-body{flex:1;min-width:0}
.alert-row-title{font-size:13px;font-weight:600;color:var(--tx);line-height:1.35}
.alert-row-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.alert-check{width:30px;height:30px;border-radius:50%;border:2px solid var(--gb);background:var(--s2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:transparent;font-size:15px;transition:all .2s cubic-bezier(.2,.8,.3,1)}
.alert-check:hover{border-color:var(--gm);background:var(--gl);color:var(--g)}
.alert-check.done{background:linear-gradient(135deg,var(--gm),var(--g));border-color:var(--g);color:#fff;animation:checkPop .4s cubic-bezier(.2,1.5,.4,1)}
.alert-snooze{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--tx2);font-size:14px;transition:all .15s}
.alert-snooze:hover{color:var(--yl);background:#FFF8E5;border-color:#FDE0B2}

.user-menu-card{display:flex;align-items:center;gap:14px;padding:14px;background:linear-gradient(135deg,var(--gl),#F4FAE6);border:1px solid var(--gb);border-radius:14px;margin-bottom:16px}
.user-menu-av{width:56px;height:56px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--gm),var(--g));color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 4px rgba(0,0,0,.15)}
.user-menu-info{flex:1;min-width:0}
.user-menu-name{font-family:var(--ft);font-size:19px;font-weight:600;color:var(--gd);letter-spacing:-.3px}
.user-menu-full{font-size:12.5px;color:var(--tx2);margin-top:2px}
.user-menu-code{font-size:11px;color:var(--tx3);margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--s);border-radius:6px;border:1px solid var(--bd)}

.weather-pill{display:flex;align-items:center;gap:5px;padding:5px 9px 5px 7px;border-radius:14px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);cursor:pointer;font-family:var(--f);font-size:11px;font-weight:700;color:var(--gd);transition:transform .1s,box-shadow .15s;flex-shrink:0;line-height:1}
.weather-pill:active{transform:scale(.95)}
.weather-pill .wp-temp{font-feature-settings:"tnum";font-size:12px}
.weather-pill .wp-rain{display:inline-flex;align-items:center;gap:1px;font-size:10px;color:var(--bl);font-weight:600;padding-left:5px;margin-left:2px;border-left:1px solid rgba(0,0,0,.1)}
.weather-pill.loading{opacity:.5}
.weather-pill.sunny i{color:#D97706} .weather-pill.rainy i{color:var(--bl)} .weather-pill.cloudy i{color:#6B7B6F}

.weather-now{background:linear-gradient(135deg,#EEF4FC,var(--gl));border-radius:14px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:14px;border:1px solid var(--bd)}
.weather-now-icon{width:54px;height:54px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);flex-shrink:0;font-size:30px}
.weather-now-icon.sunny{color:#D97706} .weather-now-icon.cloudy{color:#6B7B6F} .weather-now-icon.rainy{color:var(--bl)}
.weather-now-body{flex:1;min-width:0}
.weather-now-temp{font-family:var(--ft);font-size:26px;font-weight:600;color:var(--gd);line-height:1;letter-spacing:-.5px}
.weather-now-desc{font-size:12.5px;color:var(--tx2);margin-top:3px}
.weather-now-extra{font-size:11px;color:var(--tx3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.weather-forecast{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.weather-day{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:10px}
.weather-day-name{font-size:12px;font-weight:600;color:var(--tx);width:75px;flex-shrink:0}
.weather-day-icon{width:22px;text-align:center;flex-shrink:0;font-size:18px}
.weather-day-temp{font-size:12.5px;color:var(--tx);font-weight:600;flex:1;font-feature-settings:"tnum"}
.weather-day-rain{font-size:11px;color:var(--bl);font-weight:600;flex-shrink:0;display:inline-flex;align-items:center;gap:3px}
.weather-loc-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--gl);border:1px solid var(--gb);border-radius:12px;margin-bottom:10px}
.weather-loc-name{font-size:13px;font-weight:700;color:var(--gd)}
.weather-loc-coord{font-size:10.5px;color:var(--tx3);margin-top:2px}
.weather-stale{font-size:11px;color:var(--yl);text-align:center;padding:6px;background:#FFF8E5;border-radius:8px;margin-bottom:10px}

/* Escapa texto para insertarlo en HTML sin riesgo de inyeccion */
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Escapa texto para usarlo dentro de atributos onclick='...' */
function escA(str){
  return String(str ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,' ');
}
/* Texto recortado a 2 lineas con boton Ver mas (solo si es largo) */

function clampHTML(text, opts={}){

}

/* ── CONVERSIÓN DE UNIDADES ──────────────────────────────────────

const U_SYN = {
  'cc':'cc','c.c':'cc','cm3':'cc','ml':'cc','mililitro':'cc','mililitros':'cc',
  'l':'litro','lt':'litro','lts':'litro','litro':'litro','litros':'litro',
  'gal':'galon','galon':'galon','galón':'galon','galones':'galon',
  'g':'g','gr':'g','grs':'g','gramo':'g','gramos':'g',
  'kg':'kg','kilo':'kg','kilos':'kg','kilogramo':'kg','kilogramos':'kg','klo':'kg','kl':'kg',
  'arroba':'arroba','arrobas':'arroba','@':'arroba',
  'bulto':'bulto','bultos':'bulto'
};
const U_FAM = { cc:'vol', litro:'vol', galon:'vol', g:'peso', kg:'peso', arroba:'peso', bulto:'peso' };
const U_FACT = { cc:1, litro:1000, galon:3785, g:1, kg:1000, arroba:12500 }; // a base (cc / g)
function normUnidad(u){ return U_SYN[(u||'').toString().trim().toLowerCase()] || (u||'').toString().trim().toLowerCase(); }
/* Convierte 'valor' de unidad 'de' a unidad 'a'. bultoKg = kg de un bulto si aplica.
   Devuelve null si no son convertibles entre sí. */
function convertirUnidad(valor, de, a, bultoKg){
  de = normUnidad(de); a = normUnidad(a);
  if (!de || !a) return null;
  if (de === a) return valor;
  const fam = U_FAM[de]; if (!fam || U_FAM[a] !== fam) return null;
  const factor = (u) => u === 'bulto' ? (parseFloat(bultoKg)||0)*1000 : U_FACT[u];
  const fd = factor(de), fa = factor(a);
  if (!fd || !fa) return null;
  return valor * fd / fa;
}
function esConvertible(u){ const n = normUnidad(u); return !!U_FAM[n]; }
/* ── FECHAS: todo en hora de Colombia (America/Bogota, UTC-5 sin horario de verano) ── */
const TZ_FINCA = 'America/Bogota';
const RX_DIA = /^\d{4}-\d{2}-\d{2}$/;
/* Día YYYY-MM-DD en Colombia. Sin argumento = hoy. Si ya es un día, lo devuelve igual. */
function fechaLocalISO(dt){
  if (dt && RX_DIA.test(String(dt))) return String(dt);
  const d = dt ? new Date(dt) : new Date();
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-CA', { timeZone: TZ_FINCA });
}
/* Momento actual como timestamp real (UTC con zona). Postgres lo guarda bien. */
function ahoraLocalISO(){ return new Date().toISOString(); }
/* Cualquier valor (día o timestamp de la BD) → día en Colombia */
function fechaDia(v){ if (!v) return ''; return fechaLocalISO(v); }
/* Para columnas fecha-hora: un día elegido se guarda al mediodía en Colombia; hoy = ahora */
function tsDeDia(dia){
  if (!dia) return ahoraLocalISO();
  const s = String(dia);
  if (!RX_DIA.test(s)) return s;
  if (s === fechaLocalISO()) return ahoraLocalISO();
  return s + 'T12:00:00-05:00';
}

function tsOrden(v){ const s = String(v||''); const t = new Date(RX_DIA.test(s) ? s+'T12:00:00-05:00' : s).getTime(); return isNaN(t) ? 0 : t; }
/* Valida una fecha que propone la IA: formato correcto y nunca en el futuro */

/* Calendario de ±7 días para que la IA no calcule "ayer" o "el lunes" de memoria */
function calendarioCtx(){
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const base = new Date(fechaLocalISO() + 'T12:00:00-05:00').getTime();
  const marcas = { '-2':' ← ANTIER', '-1':' ← AYER', '0':' ← HOY', '1':' ← MAÑANA', '2':' ← PASADO MAÑANA' };
  const lineas = [];
  for (let k = -7; k <= 7; k++){
    const iso = fechaLocalISO(new Date(base + k*86400000));
    lineas.push(`${dias[new Date(iso+'T12:00:00Z').getUTCDay()]} ${iso}${marcas[k]||''}`);
  }
  return lineas.join('\n');

const Nav = {
  _booted: false,
  estado(){ return { app: S.screen === 'app', tab: S.tab, lote: S.activeLote?.id || null, cat: S.activeBodegaCat || null, sub: S.activeBodegaSub || null }; },
  push(){
    if (!this._booted) return;
    try{ history.pushState(this.estado(), ''); }catch(e){}
  },
  init(){
    if (this._booted) return;
    this._booted = true;
    try{ history.replaceState(this.estado(), ''); }catch(e){}
    window.addEventListener('popstate', (ev) => {
      const host = document.getElementById('modal-host');
      if (host && host.innerHTML.trim()){
        if (typeof M._close === 'function'){ try{ M._close(null); }catch(e){} M._close = null; }
        host.innerHTML = '';
        try{ history.pushState(this.estado(), ''); }catch(e){}
        render();
        return;
      }
      const st = ev.state;
      if (!st || !st.app) return;
      S.tab = st.tab || 'agente';
      S.activeLote = st.lote ? (S.cache.lotes.find(l => l.id === st.lote) || null) : null;
      S.activeBodegaCat = st.cat || null;
      S.activeBodegaSub = st.sub || null;
      render();
    });
  }
};

window.addEventListener('online',  ()=>{ S.isOnline=true;  render(); syncOfflineQueue(); });
window.addEventListener('offline', ()=>{ S.isOnline=false; render(); });

/* ═══════════════════════════════════════════════════════════════
   COLA OFFLINE
   ═══════════════════════════════════════════════════════════════ */
function pushQueue(item){
  const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  q.push({...item, _retries: 0});
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
}

async function syncOfflineQueue(){
  if (!S.isOnline) return;
  let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  if (!queue.length) return;
  const pending = [];
  /* Mapa de IDs temporales (offline) → IDs reales (Supabase), para que
     una acción hecha offline sobre algo creado offline no se pierda */
  const idMap = {};
  const realId = (id) => (id != null && idMap[id]) ? idMap[id] : id;
  for (const item of queue){
    try{
      if (item.action==='add_compra')        await sb.from('compras').insert({...item.payload, lote_id: realId(item.payload?.lote_id)});
      else if (item.action==='add_ingreso')  await sb.from('ingresos').insert(item.payload);
      else if (item.action==='save_memory')  await sb.from('memoria_agente').insert(item.payload);
      else if (item.action==='create_lote'){
        const { data, error } = await sb.from('lotes').insert(item.payload).select().single();
        if (error) throw error; if (item.tmpId && data) idMap[item.tmpId] = data.id;
      }
      else if (item.action==='add_inventory'){
        const { data, error } = await sb.from('inventario').insert(item.payload).select().single();
        if (error) throw error; if (item.tmpId && data) idMap[item.tmpId] = data.id;
      }
      else if (item.action==='update_inventory')  await sb.from('inventario').update(item.payload).eq('id', realId(item.id));
      else if (item.action==='log_activity')      await sb.from('bitacora').insert({...item.payload, lote_id: realId(item.payload?.lote_id)});
      else if (item.action==='create_task'){
        const { data, error } = await sb.from('tareas').insert({...item.payload, lote_id: realId(item.payload?.lote_id)}).select().single();
        if (error) throw error; if (item.tmpId && data) idMap[item.tmpId] = data.id;
      }
      else if (item.action==='complete_task')     await sb.from('tareas').update(item.payload).eq('id', realId(item.id));
      else if (item.action==='edit_inventory')    await sb.from('inventario').update(item.payload).eq('id', realId(item.id));
      else if (item.action==='edit_lote')         await sb.from('lotes').update(item.payload).eq('id', realId(item.id));
      else if (item.action==='edit_task')         await sb.from('tareas').update(item.payload).eq('id', realId(item.id));
      else if (item.action==='edit_activity')     await sb.from('bitacora').update(item.payload).eq('id', realId(item.id));
      else if (item.action==='edit_gasto')        await sb.from('compras').update(item.payload).eq('id', realId(item.id));
      else if (item.action==='edit_ingreso')      await sb.from('ingresos').update(item.payload).eq('id', realId(item.id));
    } catch(e){
      item._retries = (item._retries||0) + 1;
      if (item._retries < 5) pending.push(item);
      else console.warn('Item descartado tras 5 reintentos:', item);
    }
  }
  localStorage.setItem(QUEUE_KEY, JSON.stringify(pending));
  if (queue.length > pending.length) toast(`Sincronizados ${queue.length - pending.length} cambios`);
  await refreshAll(); render();
}

  add_ingreso: async (i) => {

    if (!S.isOnline){ pushQueue({action:'add_ingreso', payload}); S.cache.ingresos.unshift(payload); return {success:true, msg:'Ingreso registrado (offline)'}; }
    const { error } = await sb.from('ingresos').insert(payload); 
    if (error) return {success:false, msg:'Error BD: ' + error.message};
    await refreshAll();
    return {success:true, msg:'Ingreso registrado'};
  },
  add_inventory: async (i) => {
    // Buscar si ya existe un ítem con el mismo nombre (insensible a mayúsculas)
    const normName = (i.descripcion||'').trim().toLowerCase();
    const existing = S.cache.inventory.find(x => (x.descripcion||'').trim().toLowerCase() === normName);
    
    if (existing) {
      // Ya existe: sumar cantidad al stock actual y al total ingresado
      const nuevaActual = parseFloat(existing.cantidad_actual) + parseFloat(i.cantidad);
      const nuevoTotal  = parseFloat(existing.total_ingresado||existing.cantidad_actual) + parseFloat(i.cantidad);
      const payload = { cantidad_actual: nuevaActual, total_ingresado: nuevoTotal };
      if (parseFloat(i.precio_total) > 0){
        const precioAcum = (parseFloat(existing.precio_total)||0) + parseFloat(i.precio_total);
        payload.precio_total = precioAcum;
        payload.costo_unitario = nuevoTotal > 0 ? precioAcum / nuevoTotal : 0;
        payload.ultimo_precio = parseFloat(i.cantidad) > 0 ? parseFloat(i.precio_total) / parseFloat(i.cantidad) : 0;
        payload.ultimo_precio_fecha = fechaLocalISO();
      }
      if (!S.isOnline){
        existing.cantidad_actual = nuevaActual; existing.total_ingresado = nuevoTotal;
        pushQueue({action:'update_inventory', id:existing.id, payload});
        return {success:true, msg:`Stock actualizado: +${i.cantidad} ${i.unidad||''} a "${existing.descripcion}"`};
      }
      const { error } = await sb.from('inventario').update(payload).eq('id', existing.id);
      if (error) return {success:false, msg:'Error BD: ' + error.message};
      await refreshAll();
      return {success:true, msg:`Stock actualizado: +${i.cantidad} ${i.unidad||''} a "${existing.descripcion}"`};
    }

    // No existe: crear nuevo registro
    const precioNuevo = parseFloat(i.precio_total)||0;
    const payload = { 
      descripcion:i.descripcion, 
      categoria:i.categoria, 
      subcategoria:i.subcategoria||'', 
      detalles:i.detalles||'',
      cantidad_actual:i.cantidad, 
      total_ingresado:i.cantidad, 
      unidad_medida:i.unidad,
      precio_total: precioNuevo,
      costo_unitario: (precioNuevo > 0 && parseFloat(i.cantidad) > 0) ? precioNuevo / parseFloat(i.cantidad) : 0,
      ultimo_precio: (precioNuevo > 0 && parseFloat(i.cantidad) > 0) ? precioNuevo / parseFloat(i.cantidad) : 0,
      ultimo_precio_fecha: precioNuevo > 0 ? fechaLocalISO() : null,
      franja_toxicologica: i.franja_toxicologica || null,
      fecha_vencimiento: i.fecha_vencimiento || null
    };
    if (!S.isOnline){ const _tmp='tmp-'+Date.now(); pushQueue({action:'add_inventory', payload, tmpId:_tmp}); S.cache.inventory.unshift({...payload, id:_tmp}); return {success:true, isNew:true, msg:'Insumo guardado (offline)'}; }
    const { error } = await sb.from('inventario').insert(payload); 
    if (error) {
      console.error(error);
      return {success:false, msg:`Verifica que las columnas 'subcategoria', 'detalles', 'precio_total', 'costo_unitario' y 'ficha_investigacion' estén en la tabla INVENTARIO. Detalle exacto: ${error.message}`};
    }
    await refreshAll();
    return {success:true, isNew:true, msg:'Insumo agregado a la bodega'};
  },

  create_task: async (i) => {
    if (!i.titulo) return {success:false, msg:'Falta título'};
    if (!S.user || !S.user.dbId) return {success:false, msg:'Sin usuario'};
    let asignado_id = null, a_todos = false;
    if (i.asignado_a === 'todos') a_todos = true;
    else if (i.asignado_a){
      const u = S.cache.users.find(u => u.codigo === i.asignado_a || u.nombre_corto?.toLowerCase() === i.asignado_a.toLowerCase());
      if (u) asignado_id = u.id;
    }
    let loteId = i.lote_id || null;
    if (!loteId && i.lote_codigo){
      const l = S.cache.lotes.find(x => x.codigo === i.lote_codigo);
      if (l) loteId = l.id;
    }
    const payload = { titulo:i.titulo, estado:'pendiente', asignado_a_id:asignado_id, asignado_a_todos:a_todos, fecha_limite:i.fecha_limite||null, lote_id:loteId, creado_por_id:S.user.dbId };
    if (!S.isOnline){
      const _tmp='tmp-'+Date.now();
      pushQueue({action:'create_task', payload, tmpId:_tmp});
      S.cache.tasks.unshift({...payload, id:_tmp, lote: S.cache.lotes.find(l=>l.id===loteId)});
      return {success:true, msg:'Tarea programada (offline)'};
    }
    const { error } = await sb.from('tareas').insert(payload); 
    if (error) return {success:false, msg:'Error BD: ' + error.message};
    await refreshAll();
    return {success:true, msg:'Tarea programada'};

/* ═══════════════════════════════════════════════════════════════
   CONSUMO DE INSUMOS CON COSTO POR LOTE
   El gasto se registra en "compras" con origen='consumo' y NO suma
   al total de egresos (la plata ya salió al comprar el producto);
   solo sirve para saber cuánto cuesta cada lote.
   ═══════════════════════════════════════════════════════════════ */
async function consumirInsumo({ itemId, cantidad, loteId = null }){
  const item = S.cache.inventory.find(x => x.id == itemId);
  if (!item) return { success:false, msg:'Insumo no encontrado' };
  const disponible = parseFloat(item.cantidad_actual)||0;
  let usar = parseFloat(cantidad)||0;
  if (usar <= 0) return { success:false, msg:'Cantidad inválida' };
  const capped = usar > disponible;
  if (capped) usar = disponible;
  if (usar === 0) return { success:false, msg:`No queda stock de "${item.descripcion}"` };
  const costoU = parseFloat(item.costo_unitario)||0;
  const costo = Math.round(usar * costoU);
  const unidad = item.unidad_medida||'';
  const descItem = item.descripcion;
  const r = await HANDLERS.use_inventory({ id:item.id, cantidad_descontar: usar });
  if (!r.success) return r;
  if (costo > 0){
    const lote = loteId ? S.cache.lotes.find(l => l.id == loteId) : null;
    const payload = { concepto:`Consumo: ${usar} ${unidad} de ${descItem}`.replace('  ',' '), categoria:item.categoria||'otro', valor_total:costo, lote_id:loteId||null, origen:'consumo', fecha_compra: fechaLocalISO() };
    if (!S.isOnline){ pushQueue({action:'add_compra', payload}); S.cache.compras.unshift(payload); }
    else { try{ const { error } = await sb.from('compras').insert(payload); if(error) console.warn('No se pudo registrar costo:', error.message); else await refreshAll(); } catch(e){} }
  }
  return { success:true, usado:usar, costo, restante:Math.max(0, disponible-usar), capped, descripcion:descItem, unidad };
}

/* Trae todas las filas de una consulta, de 1000 en 1000 (Supabase entrega máx. 1000 por vez) */
async function traerTodo(armar){
  const todas = [];
  for (let pag = 0; pag < 50; pag++){
    const { data, error } = await armar().range(pag*1000, pag*1000 + 999);
    if (error) return { data: todas.length ? todas : null, error };
    todas.push(...(data||[]));
    if (!data || data.length < 1000) break;
  }
  return { data: todas, error: null };
}

/* Respuestas locales: contesta consultas comunes SIN gastar tokens del agente.
   Devuelve un texto si la puede responder sola, o null si hay que usar la IA. */
function respuestaLocal(textoRaw){
  const t = (textoRaw||'').toLowerCase().trim();
  if (!t || t.length > 90) return null;
  const fmt = (n)=> '$' + (parseFloat(n)||0).toLocaleString('es-CO',{maximumFractionDigits:0});
  const hoyISO = fechaLocalISO();
  // Saldo / balance
  if (/(saldo|balance|cu[aá]nto.*(tengo|hay).*(plata|caja|dinero)|c[oó]mo.*(va|esta).*(plata|finanza))/.test(t)){
    const eg = egresosTotales();
    const in_ = (S.cache.ingresos||[]).reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
    return `💰 Balance: ${fmt(in_-eg)}\nIngresos: ${fmt(in_)} · Egresos: ${fmt(eg)}`;
  }
  // Tareas de hoy / pendientes
  if (/(qu[eépt]).*(tarea|pendiente|hacer).*(hoy)|tareas? de hoy|qu[eé] hay (para |pa )?hoy/.test(t)){
    const hoy = (S.cache.tasks||[]).filter(x=>x.estado==='pendiente' && x.fecha_limite===hoyISO);
    const venc = (S.cache.tasks||[]).filter(x=>x.estado==='pendiente' && x.fecha_limite && x.fecha_limite<hoyISO);
    let r = hoy.length ? `📋 Para hoy (${hoy.length}):\n`+hoy.map(x=>'• '+x.titulo).join('\n') : '✅ No hay tareas para hoy.';
    if (venc.length) r += `\n\n⚠️ Vencidas (${venc.length}): `+venc.slice(0,5).map(x=>x.titulo).join(', ');
    return r;
  }
  const tn = _txt(t);
  // Tareas de mañana
  if (/(tarea|pendiente|hacer).*\bmanana\b|\bmanana\b.*(tarea|hacer|toca)/.test(tn)){
    const man = sumarDias(hoyISO, 1);
    const l = (S.cache.tasks||[]).filter(x=>x.estado==='pendiente' && x.fecha_limite===man);
    return l.length ? `📋 Para mañana (${l.length}):\n`+l.map(x=>'• '+x.titulo+(x.asignado?.nombre_corto?` (${x.asignado.nombre_corto})`:'')).join('\n') : '✅ No hay tareas programadas para mañana.';
  }
  // Clima
  if (/\b(clima|va a llover|llueve|lloviendo|lluvia|temperatura|pronostico)\b/.test(tn)){
    const w = Weather.contextForAgent();
    if (w) return '🌦️' + w.replace(/^\s*CLIMA ACTUAL/, ' Clima').replace(/\n- /g, '\n• ');
  }
  // ¿Hay / tenemos un insumo?
  const mh = tn.match(/^(hay|tenemos|tengo|queda|quedan|nos queda)\s+(?:de\s+)?(.+?)\s*$/);
  if (mh && !/^(que|q|algo|alguna?|tiempo|plata|dinero|tareas?|pendientes?)\b/.test(mh[2])){ const r = buscarDifuso(mh[2].replace(/^(el|la|los|las|algo de|un poco de)\s+/, ''), S.cache.inventory||[], 'descripcion'), it = r.exacto || r.sugerido;
    if (it) return (parseFloat(it.cantidad_actual)||0) > 0 ? `📦 Sí, de ${it.descripcion} quedan ${it.cantidad_actual} ${it.unidad_medida||''}.` : `📦 No, ${it.descripcion} está agotado.`;
    if (mh[2].split(' ').length <= 3 && !RX_LABOR.test(mh[2])) return `📦 No encontré «${mh[2]}» en la bodega.`; }
  // Cuánto queda de un insumo
  let m = t.match(/cu[aá]nt[oa]s?\s+(?:hay|queda|tengo|me queda)\s+(?:de\s+)?(.+)/);
  if (m){
    const q = m[1].replace(/[?¿.!]/g,'').trim();
    const it = (S.cache.inventory||[]).find(i => (i.descripcion||'').toLowerCase().includes(q) || q.includes((i.descripcion||'').toLowerCase()));
    if (it) return `📦 ${it.descripcion}: quedan ${it.cantidad_actual} ${it.unidad_medida||''}${parseFloat(it.costo_unitario)>0?` (≈ ${fmt(valorInv(it))} en bodega)`:''}.`;
  }
  return null;
}

/* Reduce la foto antes de mandarla al agente: menos tokens, misma utilidad */
async function comprimirParaAgente(media){
  if (!media || media.isVideo || !media.b64) return media;
  return await new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const max = 800, esc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*esc); c.height = Math.round(img.height*esc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve({ type:'image/jpeg', b64: c.toDataURL('image/jpeg', 0.7).split(',')[1], isVideo:false });
    };
    img.onerror = () => resolve(media);
    img.src = 'data:' + media.type + ';base64,' + media.b64;
  });
}

/* ═══════════════════════════════════════════════════════════════
   INVESTIGACIÓN AUTÓNOMA DE PRODUCTOS (Gemini + Google Search)
   Nota: Gemini no permite mezclar google_search con functionDeclarations
   en la misma llamada, por eso esta consulta se hace aparte, en
   segundo plano, y el resultado se guarda en la ficha del insumo.
   ═══════════════════════════════════════════════════════════════ */
async function researchProduct(nombre, force = false){
  if (!iaDisponible() || !nombre) return;
  try{
    const buscar = (x) => (x.descripcion||'').trim().toLowerCase() === nombre.trim().toLowerCase();
    const item = S.cache.inventory.find(buscar);
    if (item && item.ficha_investigacion && !force) return;
    toast(`🔎 Investigando "${nombre}" en internet...`);
    const prompt = `Investiga el producto agrícola "${nombre}"${item?.detalles ? ` (composición: ${item.detalles})` : ''} usado en fincas en Colombia. Responde en español, máximo 170 palabras, sin asteriscos ni markdown, en este formato exacto:
QUÉ ES: tipo de producto e ingrediente activo
PARA QUÉ SIRVE: usos, plagas/enfermedades/deficiencias que ataca
DOSIS TÍPICA: dosis común recomendada
CULTIVOS: en qué cultivos se usa
PRECAUCIONES: toxicidad, periodo de carencia, protección necesaria
TIP: un consejo práctico de aplicación

Al final, en una línea aparte, escribe exactamente: FRANJA: seguido de una sola palabra (roja, amarilla, azul o verde) según la franja toxicológica del producto; si es un abono u otro producto sin franja escribe FRANJA: ninguna.`;
    const reqInv = { contents:[{ role:'user', parts:[{ text: prompt }] }], tools:[{ google_search:{} }] };
    const rq = await llamarGemini(reqInv);
    if (!rq.ok){ console.warn('researchProduct HTTP', rq.status); return; }
    const data = rq.data;
    let ficha = (data.candidates?.[0]?.content?.parts || []).filter(p=>p.text).map(p=>p.text).join('').trim();
    if (!ficha) return;
    // Extraer la franja toxicológica de la respuesta
    let franja = null;
    const mF = ficha.match(/FRANJA:\s*(roja|amarilla|azul|verde)/i);
    if (mF) franja = mF[1].toLowerCase();
    ficha = ficha.replace(/\n?FRANJA:.*/i, '').trim();
    const it = S.cache.inventory.find(buscar);
    if (!it || String(it.id).startsWith('tmp-')) return;
    const upd = { ficha_investigacion: ficha };
    if (franja) upd.franja_toxicologica = franja;
    const { error } = await sb.from('inventario').update(upd).eq('id', it.id);
    if (error){ console.warn('No se pudo guardar la ficha (¿falta la columna ficha_investigacion?):', error.message); return; }
    it.ficha_investigacion = ficha; if (franja) it.franja_toxicologica = franja;
    toast(`🔬 Ficha técnica lista: "${nombre}"`);
    if (S.tab === 'bodega') render();
  } catch(e){ console.warn('researchProduct:', e.message); }
}

/* ═══════════════════════════════════════════════════════════════
   REGISTRO FOTOGRÁFICO (Supabase Storage + tabla fotos)
   ═══════════════════════════════════════════════════════════════ */
async function subirFoto(media, opts = {}){
  if (!S.isOnline){ toast('Necesitas internet para subir fotos'); return null; }
  try{
    const img = new Image();
    await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = 'data:' + media.type + ';base64,' + media.b64; });
    const max = 1280, escala = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.8));
    const path = `${Date.now()}-${Math.floor(Math.random()*99999)}.jpg`;
    const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType:'image/jpeg' });
    if (error){ toast('Error subiendo la foto: ' + error.message); return null; }
    const { data } = sb.storage.from('fotos').getPublicUrl(path);
    const { error: e2 } = await sb.from('fotos').insert({ url: data.publicUrl, nota: opts.nota || null, lote_id: opts.loteId || null, tomada_por: S.user?.dbId || null });
    if (e2){ toast('Foto subida pero no quedó registrada: ' + e2.message); return null; }
    await refreshAll();
    return data.publicUrl;
  } catch(e){ toast('Error procesando la foto'); return null; }
}

   COINCIDENCIA DIFUSA ("¿quisiste decir...?")

function _norm(x){ return (x||'').toString().trim().toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,''); }
function levenshtein(a,b){
  a=_norm(a); b=_norm(b);
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c = a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
  }
  return d[m][n];
}
/* Busca en una lista por campo. Devuelve {exacto} o {sugerido} o {} */
function buscarDifuso(texto, lista, campo){
  const q=_norm(texto);
  if(!q) return {};
  let exacto = lista.find(o => _norm(o[campo])===q);
  if(exacto) return {exacto};
  let contiene = lista.find(o => _norm(o[campo]).includes(q) || q.includes(_norm(o[campo])));
  if(contiene) return {exacto:contiene};
  // por distancia: tolera ~30% del largo
  let mejor=null, mejorD=Infinity;
  lista.forEach(o=>{ const dd=levenshtein(q,o[campo]); if(dd<mejorD){mejorD=dd; mejor=o;} });
  if(mejor && mejorD <= Math.max(2, Math.ceil(_norm(mejor[campo]).length*0.34))) return {sugerido:mejor, dist:mejorD};
  return {};
}

/* ═══════════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════
   INTÉRPRETE LOCAL (SIN IA)
   Entiende lo de todos los días con reglas: fechas, plata, cantidades,
   lotes, productos y personas. Gemini solo se usa cuando esto no
   alcanza (consejos, fotos, frases raras), así la cuota rinde mucho más.
   ═══════════════════════════════════════════════════════════════ */
const NUM_PAL = { un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10, once:11, doce:12, quince:15, veinte:20, treinta:30, cuarenta:40, cincuenta:50, cien:100, medio:0.5, media:0.5 };
const RX_NUM = '(\\d+(?:[.,]\\d+)*|' + Object.keys(NUM_PAL).join('|') + ')';
const RX_UNI_INS = '(kilogramos?|kilos?|kgs?|bultos?|litros?|lts?|cc|ml|mililitros?|galon(?:es)?|gal|gramos?|grs?|g|arrobas?|unidades?|und|frascos?|tarros?|canecas?|sacos?|cajas?|rollos?|metros?)';
const DIAS_SEM = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const _rxEsc = s => String(s).replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&');

/* Texto normalizado para las reglas (minúsculas, sin tildes, sin signos) */
function _txt(s){ return _normTxt(s).replace(/[¿?¡!;:"“”]/g, ' '); }
function _pareceAPregunta(texto){
  const t = _txt(texto).trim();
  return /\?/.test(texto) || /^(y\s+)?(que|como|cual|cuales|donde|por que|porque|cuando|cuanto|cuanta|cuantos|cuantas|quien|sera|puedo|hay(?! que)|tengo(?! que)|me recomiendas|recomiendame|sabes)\b/.test(t);
}

/* "1.500" → 1500 · "1,5" → 1.5 · "dos" → 2 */
function _numero(s){
  s = String(s||'').trim();
  if (NUM_PAL[s] != null) return NUM_PAL[s];
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) return parseFloat(s.replace(/\./g,''));
  if (/^\d{1,3}(,\d{3})+$/.test(s)) return parseFloat(s.replace(/,/g,''));
  return parseFloat(s.replace(',', '.')) || 0;
}

/* Plata mencionada: "$80.000", "80 mil", "1,5 millones", "80000". Devuelve {v, i, n} o null */
function _plata(t){
  let m;
  if ((m = t.match(new RegExp('\\b' + RX_NUM + '\\s*(millones|millon|palos?)\\b(\\s+y\\s+medio)?')))) return { v: Math.round((_numero(m[1]) + (m[3] ? 0.5 : 0)) * 1e6), i:m.index, n:m[0].length };
  if ((m = t.match(new RegExp('\\b' + RX_NUM + '\\s*(mil|lucas?|k)\\b(\\s+pesos)?')))) return { v: Math.round(_numero(m[1]) * 1000), i:m.index, n:m[0].length };
  if ((m = t.match(/\$\s*(\d[\d.,]*)(\s+pesos)?/))) return { v: _numero(m[1]), i:m.index, n:m[0].length };
  if ((m = t.match(/\b(\d{1,3}(?:\.\d{3})+|\d{4,})\b(?!\s*(?:kg|kilos?|gramos?|g|gr|grs|cc|ml|litros?|metros?|m2|matas?|plantas?|arboles?))(\s+pesos)?/))) return { v: _numero(m[1]), i:m.index, n:m[0].length };
  return null;
}

/* Unidad dicha por el usuario → unidad de la app */
function _uniNorm(u){
  u = String(u||'').toLowerCase();
  if (u === 'kgs') u = 'kg';
  const n = normUnidad(u);
  if (U_FAM[n]) return n;
  if (/^(und|unidad)/.test(u)) return 'unidad';
  return u.replace(/(es|s)$/, '');
}
/* Cantidad + unidad de un insumo: "2 bultos", "medio litro", "200 cc". Devuelve {cantidad, unidad, i, n} */
function _cantidad(t){
  const m = t.match(new RegExp('\\b' + RX_NUM + '\\s*' + RX_UNI_INS + '\\b'));
  if (!m) return null;
  return { cantidad: _numero(m[1]), unidad: _uniNorm(m[2]), i: m.index, n: m[0].length };
}
/* Nombre de producto que viene después de la cantidad: "2 bultos de urea a 80 mil" → "urea" */
function _nombreTras(t, c){
  if (!c) return '';
  const m = t.slice(c.i + c.n).match(/^\s*(?:de|del)?\s*([a-z0-9ñ][a-z0-9ñ .-]*?)(?=\s+(?:a|al|por|en|para|que|y|con|el|la|los|las|hoy|ayer|antier)\b|[,$]|$)/);
  return m ? m[1].trim() : '';
}
/* Producto de bodega mencionado (el que más coincida) */
function _producto(t){
  let mejor = null, pts = 0;
  (S.cache.inventory||[]).forEach(i => {
    const d = _normTxt(i.descripcion).trim(); if (!d) return;
    if (t.includes(d)){ if (d.length * 10 > pts){ pts = d.length * 10; mejor = i; } return; }
    const hits = d.split(/[^a-z0-9]+/).filter(w => w.length >= 4 && new RegExp('\\b' + w + '\\b').test(t)).length;
    if (hits && hits * 5 > pts){ pts = hits * 5; mejor = i; }
  });
  return mejor;
}
/* Lote mencionado: "L2", "lote 2", "lote 02", "el lote del tomate" */
function _lote(t){
  const lotes = (S.cache.lotes||[]).slice().sort((a,b) => String(b.codigo||'').length - String(a.codigo||'').length);
  for (const l of lotes){
    const c = _normTxt(l.codigo).trim();
    if (c && /[a-z]/.test(c) && new RegExp('(^|[^a-z0-9])' + _rxEsc(c) + '($|[^a-z0-9])').test(t)) return l;
  }
  const m = t.match(/\blote\s*(?:#|no\.?|numero)?\s*([a-z0-9-]+)/);
  if (m){
    const k = m[1], n = parseInt(k.replace(/\D/g,''), 10);
    let l = lotes.find(x => _normTxt(x.codigo) === k);
    if (!l && !isNaN(n)) l = lotes.find(x => parseInt(String(x.codigo).replace(/\D/g,''), 10) === n);
    if (l) return l;
  }
  // Palabras propias de un solo lote (nombre o variedad): "el tronus", "la cebolla", "el cargamanto"
  const palabrasDe = l => new Set(_normTxt([l.codigo, l.cultivo, l.variedad].join(' ')).split(/[^a-z0-9]+/).filter(w => w.length >= 4 && w !== 'lote'));
  const conteo = {}; lotes.forEach(l => palabrasDe(l).forEach(w => conteo[w] = (conteo[w]||0) + 1));
  const unicos = lotes.filter(l => [...palabrasDe(l)].some(w => conteo[w] === 1 && new RegExp('\\b' + _rxEsc(w) + '\\b').test(t)));
  if (unicos.length === 1) return unicos[0];
  const porCultivo = lotes.filter(l => l.cultivo && new RegExp('\\b' + _rxEsc(_normTxt(l.cultivo).trim()) + '\\b').test(t));
  if (porCultivo.length === 1) return porCultivo[0];
  const activos = porCultivo.filter(l => !/planificacion|descanso/.test(_normTxt(l.estado)));
  return activos.length === 1 ? activos[0] : null;
}
/* Trabajador de la lista de usuarios mencionado en el texto */
function _persona(t){
  for (const n of new Set((S.cache.jornales||[]).map(j => j.trabajador).filter(Boolean))){
    const k = _normTxt(n).replace(/[^a-z0-9 ]/g,'').trim();
    if (k.length >= 3 && new RegExp('\\b' + k + '\\b').test(t)) return n;
  }

    const ns = [u.nombre_corto, ...String(u.nombre_corto||'').split(/\s+y\s+/), (u.nombre_completo||'').split(' ')[0]].map(   // "Juan Camilo y Pinto" responde a ambos nombres
    n => _normTxt(n).replace(/[^a-z0-9 ]/g,'').trim()).filter(n => n.length >= 3);
    if (ns.some(n => new RegExp('\\b' + n + '\\b').test(t))) return u.nombre_corto;

}
/* Nombre propio en el texto original: "le pagué a Pedro" → "Pedro" */
function _nombrePropio(texto){
  const m = String(texto||'').match(/\b(?:a|al|para|de|con)\s+(?:don\s+|doña\s+)?([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/);
  if (!m) return '';
  const n = _normTxt(m[1]);
  return (MESES.includes(n) || DIAS_SEM.includes(n) || n === 'lote') ? '' : m[1];
}

/* Fecha dicha en el texto. futuro=true para tareas. Devuelve {fecha, i, n} o null */
function _armarFecha(d, mes, anio, futuro){
  if (!(d >= 1 && d <= 31 && mes >= 1 && mes <= 12)) return null;
  const hoy = fechaLocalISO(); let y = anio || +hoy.slice(0,4);
  const iso = yy => `${yy}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if (!anio){ if (!futuro && iso(y) > hoy) y--; if (futuro && iso(y) < hoy) y++; }
  const f = iso(y);
  return fechaLocalISO(new Date(f + 'T12:00:00Z')) === f ? f : null;   // descarta 31 de febrero, etc.
}
function _fecha(t, futuro){
  const hoy = fechaLocalISO();
  const res = (fecha, m, off = 0) => fecha ? { fecha, i: m.index + off, n: m[0].length - off } : null;
  const mult = u => u[0] === 's' ? 7 : u[0] === 'm' ? 30 : 1;
  let m;
  if ((m = t.match(/\bpasado\s+manana\b/))) return res(sumarDias(hoy, 2), m);
  if ((m = t.match(/\b(antier|anteayer|antes de ayer|ante ayer)\b/))) return res(sumarDias(hoy, -2), m);
  if ((m = t.match(/\bayer\b/))) return res(sumarDias(hoy, -1), m);
  if ((m = t.match(/\b(hoy|esta manana|esta tarde|esta noche)\b/))) return res(hoy, m);
  if ((m = t.match(/(^|[^a-z])manana\b/)) && !/\b(la|esta|por la|en la|de la)\s*$/.test(t.slice(0, m.index + m[1].length))) return res(sumarDias(hoy, 1), m, m[1].length);
  if ((m = t.match(new RegExp('\\bhace\\s+' + RX_NUM + '\\s+(dias?|semanas?|mes(?:es)?)\\b')))) return res(sumarDias(hoy, -_numero(m[1]) * mult(m[2])), m);
  if ((m = t.match(new RegExp('\\b(?:en|dentro de)\\s+' + RX_NUM + '\\s+(dias?|semanas?)\\b')))) return res(sumarDias(hoy, _numero(m[1]) * mult(m[2])), m);
  if ((m = t.match(/\b(la proxima semana|la otra semana|la semana que viene)\b/))) return res(sumarDias(hoy, 7), m);
  if ((m = t.match(/\bla semana pasada\b/))) return res(sumarDias(hoy, -7), m);
  if ((m = t.match(new RegExp('\\b(?:el\\s+)?(\\d{1,2})\\s+de\\s+(' + MESES.join('|') + '|setiembre)(?:\\s+(?:de|del)\\s+(\\d{4}))?\\b')))){
    const mes = m[2] === 'setiembre' ? 9 : MESES.indexOf(m[2]) + 1;
    return res(_armarFecha(+m[1], mes, m[3] ? +m[3] : null, futuro), m);
  }
  if ((m = t.match(/\b(?:el\s+)?(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))){
    let y = m[3] ? +m[3] : null; if (y && y < 100) y += 2000;
    return res(_armarFecha(+m[1], +m[2], y, futuro), m);
  }
  if ((m = t.match(/\b(?:el\s+|este\s+)?(?:proximo\s+|pasado\s+)?(domingo|lunes|martes|miercoles|jueves|viernes|sabado)(\s+pasado|\s+que viene)?\b/))){
    const obj = DIAS_SEM.indexOf(m[1]), dow = new Date(hoy + 'T12:00:00Z').getUTCDay();
    const fut = /proximo|que viene/.test(m[0]) || (futuro && !/pasado/.test(m[0]));
    const delta = fut ? ((obj - dow + 7) % 7 || 7) : -((dow - obj + 7) % 7 || 7);
    return res(sumarDias(hoy, delta), m);
  }
  return null;
}
/* Rango de fechas para preguntas: "este mes", "la semana pasada", "en septiembre"… Devuelve {desde, hasta, i, n} */
function _rango(t){
  const hoy = fechaLocalISO(), y = +hoy.slice(0,4), mo = +hoy.slice(5,7);
  const dow = new Date(hoy + 'T12:00:00Z').getUTCDay(), lunes = sumarDias(hoy, -((dow + 6) % 7));
  const iniMes = (yy, mm) => `${yy}-${String(mm).padStart(2,'0')}-01`;
  const finMes = (yy, mm) => fechaLocalISO(new Date(Date.UTC(yy, mm, 0, 12)));
  const r = (desde, hasta, m) => ({ desde, hasta, i: m.index, n: m[0].length });
  let m;
  if ((m = t.match(/\bhoy\b/))) return r(hoy, hoy, m);
  if ((m = t.match(/\bayer\b/))) return r(sumarDias(hoy,-1), sumarDias(hoy,-1), m);
  if ((m = t.match(/\besta semana\b/))) return r(lunes, hoy, m);
  if ((m = t.match(/\b(la )?semana pasada\b/))) return r(sumarDias(lunes,-7), sumarDias(lunes,-1), m);
  if ((m = t.match(/\beste mes\b/))) return r(iniMes(y,mo), hoy, m);
  if ((m = t.match(/\b(el )?mes pasado\b/))){ const yy = mo === 1 ? y-1 : y, mm = mo === 1 ? 12 : mo-1; return r(iniMes(yy,mm), finMes(yy,mm), m); }
  if ((m = t.match(/\beste ano\b/))) return r(`${y}-01-01`, hoy, m);
  if ((m = t.match(/\b(el )?ano pasado\b/))) return r(`${y-1}-01-01`, `${y-1}-12-31`, m);
  if ((m = t.match(new RegExp('\\b(?:en\\s+)?(?:los|las)?\\s*ultim[oa]s\\s+' + RX_NUM + '\\s+(dias?|semanas?|mes(?:es)?)\\b')))){
    const k = _numero(m[1]) * (m[2][0] === 's' ? 7 : m[2][0] === 'm' ? 30 : 1); return r(sumarDias(hoy,-k), hoy, m);
  }
  if ((m = t.match(new RegExp('\\b(?:en|de|durante)\\s+(' + MESES.join('|') + ')(?:\\s+(?:de|del)\\s+(\\d{4}))?\\b')))){
    const mm = MESES.indexOf(m[1]) + 1, yy = m[2] ? +m[2] : (mm > mo ? y-1 : y); return r(iniMes(yy,mm), finMes(yy,mm), m);
  }
  return null;
}

/* Quita trozos (fechas, plata…) del texto original. Las posiciones salen del texto normalizado. */
function _quitar(texto, ...spans){
  let s = String(texto||'');
  if (_normTxt(s).length !== s.length) return s;
  spans.filter(Boolean).forEach(sp => { s = s.slice(0, sp.i) + ' '.repeat(sp.n) + s.slice(sp.i + sp.n); });   // mismo largo: las demás posiciones siguen sirviendo

    .replace(/\s+(a|al|de|del|en|por|y|el|la|para|con)$/i,'').trim();

}
/* Raíz simple para buscar palabras: "fumigamos" → "fumig", "desyerbada" → "desyerb" */
function _raiz(w){

}
function _categoria(t){

  if (/abon|urea|fertiliz|triple|\bcal\b|gallinaza|compost|dap\b|potasio|nitrato/.test(t)) return 'Nutrición';
  if (/fungic|insectic|herbic|acaric|veneno|fumig|mancozeb|glifosato|roundup|coadyuv/.test(t)) return 'Agroquímicos';

  if (/fibra|alambre|estaca|plastico|canastilla|caja|bolsa|empaque|tutor|polisombra|cabuya/.test(t)) return 'Insumos Consumibles';
  if (/transporte|flete|\bluz\b|\bagua\b|energia|internet|arriendo|servicio|gasolina|acpm|combustible|celular|plan de datos|impuesto|predial/.test(t)) return 'servicios';

function _tareaPendiente(t){

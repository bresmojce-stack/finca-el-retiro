window.flowEditInventory = async function(id){
  const item = S.cache.inventory.find(x => x.id == id); if (!item) return;
  const catOpts = Object.keys(BODEGA_STRUCT).map(k => `<option value="${k}" ${k===item.categoria?'selected':''}>${BODEGA_STRUCT[k].name}</option>`).join('');
  const subs = BODEGA_STRUCT[item.categoria]?.subs || [];
  const subOpts = subs.map(s => `<option value="${s}" ${s===item.subcategoria?'selected':''}>${s}</option>`).join('');

  const html = `
    <div class="modal-h">Editar Insumo</div>
    <div class="modal-field"><label class="modal-label">Nombre del producto</label><input class="modal-input" id="f-desc" value="${(item.descripcion||'').replace(/"/g,'&quot;')}"></div>
    <div class="modal-field"><label class="modal-label">Categoría</label><select class="modal-select" id="f-cat">${catOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Subcategoría</label><select class="modal-select" id="f-sub">${subOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Especificaciones</label><input class="modal-input" id="f-det" value="${(item.detalles||'').replace(/"/g,'&quot;')}"></div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1"><label class="modal-label">Cantidad disponible</label><input class="modal-input" type="number" id="f-can" value="${item.cantidad_actual}"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad (presentación)</label><input class="modal-input" id="f-uni" value="${item.unidad_medida||''}"></div>
    </div>
    <div class="spec-box" style="margin-bottom:12px;background:#EEF4FC;border-color:#C5DAF2">
      <div style="font-weight:700;color:#185FA5;margin-bottom:6px;font-size:11px"><i class="ti ti-coin"></i> PRECIO — escribe lo que pagaste y la cantidad, la app calcula el costo</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1"><label class="modal-label" style="margin-bottom:3px">Precio total</label><input class="modal-input" type="number" id="f-ptot" inputmode="decimal" placeholder="Ej: 40000"></div>
        <div style="flex:.9"><label class="modal-label" style="margin-bottom:3px">Cantidad</label><input class="modal-input" type="number" id="f-pcan" inputmode="decimal" placeholder="Ej: 1"></div>
        <div style="flex:.9"><label class="modal-label" style="margin-bottom:3px">Unidad</label><select class="modal-select" id="f-puc"></select></div>
      </div>
      <div id="f-pbk-wrap" style="display:none;margin-top:8px"><label class="modal-label" style="margin-bottom:3px">kg por bulto</label><input class="modal-input" type="number" id="f-pbk" placeholder="Ej: 50"></div>
      <div id="f-pprev" class="text-tiny" style="margin-top:8px;color:#185FA5">${parseFloat(item.costo_unitario)>0?`Costo actual: <b>${fmtMoney(item.costo_unitario)}/${esc(item.unidad_medida||'u')}</b> · cámbialo si quieres`:'Déjalo vacío si no quieres tocar el precio.'}</div>
    </div>
    <div class="modal-field"><label class="modal-label">Fecha de vencimiento (opcional)</label><input class="modal-input" type="date" id="f-ven" value="${item.fecha_vencimiento||''}"></div>
    <div class="modal-field"><label class="modal-label">Franja toxicológica</label><select class="modal-select" id="f-fra">
      <option value="">— sin definir —</option>
      <option value="roja" ${item.franja_toxicologica==='roja'?'selected':''}>Roja · muy tóxico</option>
      <option value="amarilla" ${item.franja_toxicologica==='amarilla'?'selected':''}>Amarilla · moderado</option>
      <option value="azul" ${item.franja_toxicologica==='azul'?'selected':''}>Azul · poco tóxico</option>
      <option value="verde" ${item.franja_toxicologica==='verde'?'selected':''}>Verde · bajo riesgo</option>
    </select></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="m-cancel-inv">Cancelar</button><button class="btn btn-primary" id="m-save-inv">Guardar cambios</button></div>`;

  await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const catEl = document.getElementById('f-cat'), subEl = document.getElementById('f-sub');
    catEl.onchange = () => { const s = BODEGA_STRUCT[catEl.value]?.subs||[]; subEl.innerHTML = s.map(x=>`<option value="${x}">${x}</option>`).join(''); };
    // Precio con conversión
    const baseU0 = item.unidad_medida || 'unidad';
    const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto','unidad'];
    const baseN0 = normUnidad(baseU0);
    const ordU = [baseU0, ...opU.filter(u => normUnidad(u)!==baseN0 && u!==baseU0)];
    document.getElementById('f-puc').innerHTML = [...new Set(ordU)].map(u=>`<option value="${u}" ${normUnidad(u)===baseN0?'selected':''}>${u}</option>`).join('');
    const gp = (x)=>document.getElementById(x);
    const calcP = () => {
      const baseU = gp('f-uni').value || baseU0;
      const tot=parseFloat(gp('f-ptot').value)||0, can=parseFloat(gp('f-pcan').value)||0, uc=gp('f-puc').value, bk=parseFloat(gp('f-pbk').value)||0;
      gp('f-pbk-wrap').style.display = normUnidad(uc)==='bulto'?'':'none';
      if (tot>0 && can>0){
        let cb = convertirUnidad(can, uc, baseU, bk); if (cb===null) cb=can;
        const costo = cb>0?tot/cb:0;
        gp('f-pprev').innerHTML = `Costo: <b>${fmtMoney(costo)}/${esc(baseU)}</b>${normUnidad(uc)!==normUnidad(baseU)?` <span style="opacity:.8">(${can} ${esc(uc)} = ${cb.toLocaleString('es-CO',{maximumFractionDigits:2})} ${esc(baseU)})</span>`:''}`;
      }
    };
    ['f-ptot','f-pcan','f-pbk'].forEach(x=>gp(x).addEventListener('input', calcP));
    gp('f-puc').addEventListener('change', calcP);
    const close = val => { document.getElementById('modal-host').innerHTML=''; resolve(val); };
    document.getElementById('modal-host').querySelector('#m-ov').addEventListener('click', e=>{ if(e.target===e.currentTarget) close(null); });
    document.getElementById('m-cancel-inv').onclick = () => close(null);
    document.getElementById('m-save-inv').onclick = async () => {
      const changes = {
        descripcion: document.getElementById('f-desc').value.trim(),
        categoria: document.getElementById('f-cat').value,
        subcategoria: document.getElementById('f-sub').value,
        detalles: document.getElementById('f-det').value.trim(),
        cantidad_actual: parseFloat(document.getElementById('f-can').value)||0,
        unidad_medida: document.getElementById('f-uni').value.trim(),
        fecha_vencimiento: document.getElementById('f-ven').value || null,
        franja_toxicologica: document.getElementById('f-fra').value || null
      };
      if (!changes.descripcion) { toast('Falta el nombre'); return; }
      // Precio (si lo escribió): calcular costo unitario con conversión
      const ptot=parseFloat(document.getElementById('f-ptot').value)||0, pcan=parseFloat(document.getElementById('f-pcan').value)||0, puc=document.getElementById('f-puc').value, pbk=parseFloat(document.getElementById('f-pbk').value)||0;
      if (ptot>0 && pcan>0){
        if (normUnidad(puc)==='bulto' && pbk<=0){ toast('Indica los kg del bulto'); return; }
        let cb = convertirUnidad(pcan, puc, changes.unidad_medida||'unidad', pbk); if (cb===null) cb=pcan;
        const costo = cb>0?ptot/cb:0;
        const totIng = parseFloat(changes.cantidad_actual)||0;
        changes.costo_unitario = costo;
        changes.precio_total = totIng>0 ? costo*totIng : ptot;
        changes.ultimo_precio = costo;
        changes.ultimo_precio_fecha = fechaLocalISO();
      }
      close(null);
      const r = await HANDLERS.edit_inventory(id, changes);
      toast(r.success ? '✅ Insumo actualizado' : r.msg); if (r.success) render();
    };
  });
};

window.flowSetPrecio = async function(id){
  const item = S.cache.inventory.find(x => x.id == id); if (!item) return;
  const base = item.unidad_medida || 'unidad';
  const actual = parseFloat(item.costo_unitario)||0;
  const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto','unidad'];
  // poner la unidad base de primera si está en la lista
  const baseNorm = normUnidad(base);
  const ordU = [base, ...opU.filter(u => normUnidad(u)!==baseNorm && u!==base)];
  const uOpts = [...new Set(ordU)].map(u => `<option value="${esc(u)}" ${normUnidad(u)===baseNorm?'selected':''}>${esc(u)}</option>`).join('');

  const html = `
    <div class="modal-h">Precio de "${esc(item.descripcion)}"</div>
    <div class="modal-sub">Escribe lo que pagaste y cuánto compraste. La app calcula el costo por ${esc(base)} (convirtiendo la unidad si hace falta).</div>
    ${actual>0?`<div class="spec-box" style="margin-bottom:12px">Precio actual: <b>${fmtMoney(actual)}/${esc(base)}</b></div>`:''}
    <div class="modal-field"><label class="modal-label">Precio total pagado</label><input class="modal-input" type="number" id="p-tot" inputmode="decimal" placeholder="Ej: 40000"></div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1.2"><label class="modal-label">Cantidad comprada</label><input class="modal-input" type="number" id="p-can" inputmode="decimal" placeholder="Ej: 1"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad</label><select class="modal-select" id="p-uc">${uOpts}</select></div>
    </div>
    <div class="modal-field" id="p-bk-wrap" style="display:none"><label class="modal-label">¿Cuántos kg trae cada bulto?</label><input class="modal-input" type="number" id="p-bk" inputmode="decimal" placeholder="Ej: 50"></div>
    <div id="p-prev" class="ficha-box" style="display:none"></div>
    <div style="text-align:center;margin-bottom:8px"><button class="ver-mas" id="p-conv"><i class="ti ti-arrows-exchange"></i> Calculadora de conversión</button></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="p-cancel">Cancelar</button><button class="btn btn-primary" id="p-ok">Guardar precio</button></div>`;

  const res = await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const g = (x)=>document.getElementById(x);
    const calc = () => {
      const tot = parseFloat(g('p-tot').value)||0, can = parseFloat(g('p-can').value)||0, uc = g('p-uc').value, bk = parseFloat(g('p-bk').value)||0;
      g('p-bk-wrap').style.display = normUnidad(uc)==='bulto' ? '' : 'none';
      const prev = g('p-prev');
      if (tot>0 && can>0){
        let cantBase = convertirUnidad(can, uc, base, bk);
        if (cantBase === null) cantBase = can; // no convertible → se asume misma unidad
        const costo = cantBase>0 ? tot/cantBase : 0;
        prev.style.display=''; prev.innerHTML = `<i class="ti ti-calculator"></i> Costo: <b>${fmtMoney(costo)}/${esc(base)}</b>${normUnidad(uc)!==normUnidad(base)?` <span class="text-tiny">(${can} ${esc(uc)} = ${cantBase.toLocaleString('es-CO',{maximumFractionDigits:2})} ${esc(base)})</span>`:''}`;
      } else { prev.style.display='none'; }
    };
    ['p-tot','p-can','p-bk'].forEach(x=>g(x).addEventListener('input', calc));
    g('p-uc').addEventListener('change', calc);
    const close = v => { document.getElementById('modal-host').innerHTML=''; resolve(v); };
    document.querySelector('#m-ov').addEventListener('click', e=>{ if(e.target===e.currentTarget) close(null); });
    g('p-cancel').onclick = () => close(null);
    g('p-conv').onclick = () => { close(null); setTimeout(()=>flowConvertirUnidades(),150); };
    g('p-ok').onclick = () => {
      const tot = parseFloat(g('p-tot').value)||0, can = parseFloat(g('p-can').value)||0, uc = g('p-uc').value, bk = parseFloat(g('p-bk').value)||0;
      if (tot<=0 || can<=0){ toast('Escribe el precio total y la cantidad'); return; }
      if (normUnidad(uc)==='bulto' && bk<=0){ toast('Indica cuántos kg trae el bulto'); return; }
      let cantBase = convertirUnidad(can, uc, base, bk);
      if (cantBase === null) cantBase = can;
      close({ costo: cantBase>0 ? tot/cantBase : 0 });
    };
  });
  if (!res) return;
  const r = await HANDLERS.set_precio(id, res.costo);
  toast(r.success ? `✅ Precio: ${fmtMoney(res.costo)}/${base}` : r.msg);
  if (r.success) render();
};

/* Calculadora de conversión de unidades (independiente) */
window.flowConvertirUnidades = async function(){
  const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto'];
  const sel = (idp, def) => `<select class="modal-select" id="${idp}">${opU.map(u=>`<option value="${u}" ${u===def?'selected':''}>${u}</option>`).join('')}</select>`;
  const html = `
    <div class="modal-h"><i class="ti ti-arrows-exchange"></i> Convertir unidades</div>
    <div class="modal-sub">Pasa de una unidad a otra (volumen o peso).</div>
    <div style="display:flex;gap:10px;align-items:flex-end">
      <div class="modal-field" style="flex:1.2"><label class="modal-label">Cantidad</label><input class="modal-input" type="number" id="c-val" inputmode="decimal" placeholder="Ej: 1"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">De</label>${sel('c-de','galon')}</div>
      <div class="modal-field" style="flex:1"><label class="modal-label">A</label>${sel('c-a','litro')}</div>
    </div>
    <div class="modal-field" id="c-bk-wrap" style="display:none"><label class="modal-label">kg por bulto</label><input class="modal-input" type="number" id="c-bk" placeholder="Ej: 50"></div>
    <div id="c-prev" class="ficha-box">Escribe una cantidad…</div>
    <div class="modal-actions"><button class="btn btn-primary btn-block" id="c-close">Cerrar</button></div>`;
  const p = M._open(html);
  const g = (x)=>document.getElementById(x);
  const calc = () => {
    const v = parseFloat(g('c-val').value)||0, de=g('c-de').value, a=g('c-a').value, bk=parseFloat(g('c-bk').value)||0;
    g('c-bk-wrap').style.display = (normUnidad(de)==='bulto'||normUnidad(a)==='bulto') ? '' : 'none';
    if (!v){ g('c-prev').innerHTML='Escribe una cantidad…'; return; }
    const r = convertirUnidad(v, de, a, bk);
    g('c-prev').innerHTML = r===null ? '<span style="color:var(--rd)">No se pueden convertir entre sí (una es volumen y otra es peso).</span>' : `<b>${v} ${de} = ${r.toLocaleString('es-CO',{maximumFractionDigits:3})} ${a}</b>`;
  };
  ['c-val','c-bk'].forEach(x=>g(x).addEventListener('input', calc));
  ['c-de','c-a'].forEach(x=>g(x).addEventListener('change', calc));
  g('c-close').onclick = () => M._close(null);
  return p;
};

window.flowRestockInventory = async function(id, name, unit){
  const item = S.cache.inventory.find(x => x.id == id); if (!item) return;
  const base = item.unidad_medida || unit || 'unidad';
  const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto','unidad'];
  const baseN = normUnidad(base);
  const ordU = [base, ...opU.filter(u => normUnidad(u)!==baseN && u!==base)];
  const uOpts = [...new Set(ordU)].map(u => `<option value="${esc(u)}" ${normUnidad(u)===baseN?'selected':''}>${esc(u)}</option>`).join('');

  const html = `
    <div class="modal-h">Reponer "${esc(name)}"</div>
    <div class="modal-sub">Agrega stock y, si quieres, el precio que pagaste en esta compra. La app actualiza el costo.</div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1.2"><label class="modal-label">Cantidad a agregar</label><input class="modal-input" type="number" id="r-can" inputmode="decimal" placeholder="Ej: 5"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad</label><select class="modal-select" id="r-uc">${uOpts}</select></div>
    </div>
    <div class="modal-field" id="r-bk-wrap" style="display:none"><label class="modal-label">¿Cuántos kg trae el bulto?</label><input class="modal-input" type="number" id="r-bk" placeholder="Ej: 50"></div>
    <div class="modal-field"><label class="modal-label">Precio total pagado (opcional)</label><input class="modal-input" type="number" id="r-pre" inputmode="decimal" placeholder="Lo que pagaste por esta compra"></div>
    <div class="modal-field"><label class="modal-label">Fecha de la compra</label><input class="modal-input" type="date" id="r-fec" value="${hoyISO()}"></div>
    <div id="r-prev" class="ficha-box" style="display:none"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="r-cancel">Cancelar</button><button class="btn btn-primary" id="r-ok">Reponer</button></div>`;

  const res = await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const g = (x)=>document.getElementById(x);
    const calc = () => {
      const can=parseFloat(g('r-can').value)||0, uc=g('r-uc').value, pre=parseFloat(g('r-pre').value)||0, bk=parseFloat(g('r-bk').value)||0;
      g('r-bk-wrap').style.display = normUnidad(uc)==='bulto'?'':'none';
      let cb = convertirUnidad(can, uc, base, bk); if (cb===null) cb=can;
      const prev = g('r-prev');
      if (can>0){
        let txt = `<i class="ti ti-package"></i> Agregas <b>${cb.toLocaleString('es-CO',{maximumFractionDigits:2})} ${esc(base)}</b>`;
        if (pre>0 && cb>0) txt += ` · costo de esta compra: <b>${fmtMoney(pre/cb)}/${esc(base)}</b>`;
        prev.style.display=''; prev.innerHTML = txt;
      } else prev.style.display='none';
    };
    ['r-can','r-pre','r-bk'].forEach(x=>g(x).addEventListener('input', calc));
    g('r-uc').addEventListener('change', calc);
    const close = v => { document.getElementById('modal-host').innerHTML=''; resolve(v); };
    document.querySelector('#m-ov').addEventListener('click', e=>{ if(e.target===e.currentTarget) close(null); });
    g('r-cancel').onclick = () => close(null);
    g('r-ok').onclick = () => {
      const can=parseFloat(g('r-can').value)||0, uc=g('r-uc').value, pre=parseFloat(g('r-pre').value)||0, bk=parseFloat(g('r-bk').value)||0, fec=g('r-fec').value;
      if (can<=0){ toast('Escribe la cantidad'); return; }
      if (normUnidad(uc)==='bulto' && bk<=0){ toast('Indica los kg del bulto'); return; }
      let cb = convertirUnidad(can, uc, base, bk); if (cb===null) cb=can;
      close({ cantBase: cb, precio: pre, fecha: fec });
    };
  });
  if (!res) return;
  const r = await HANDLERS.restock_inventory(id, res.cantBase, res.precio);
  if (r.success && res.precio > 0){
    await HANDLERS.add_gasto({ concepto:`${name} (reposición: ${res.cantBase.toLocaleString('es-CO',{maximumFractionDigits:2})} ${base})`, categoria:item.categoria||'otro', valor_total:res.precio, fecha: res.fecha || null });
  }
  toast(r.success ? `✅ +${res.cantBase.toLocaleString('es-CO',{maximumFractionDigits:2})} ${base}${res.precio>0?' · '+fmtMoney(res.precio):''}` : r.msg);
  if (r.success) render();
};

window.flowEditTask = async function(id){
  const task = S.cache.tasks.find(t => t.id == id); if (!task) return;
  const userOpts = [ { value:'todos', label:'Toda la finca' }, ...S.cache.users.map(u => ({ value:u.codigo, label:u.nombre_corto })) ];
  const r = await M.form({
    title:'Editar tarea', okText:'Guardar cambios',
    fields:[
      { name:'titulo', label:'¿Qué hay que hacer?', type:'text', required:true, initial: task.titulo },
      { name:'fecha_limite', label:'Fecha límite', type:'date', initial: task.fecha_limite||'' },
      { name:'asignado_a', label:'Asignar a', type:'select', options: userOpts }
    ]
  });
  if (!r) return;
  const changes = { titulo: r.titulo, fecha_limite: r.fecha_limite || null };
  if (r.asignado_a) {
    if (r.asignado_a === 'todos') { changes.asignado_a_todos = true; changes.asignado_a_id = null; }
    else { const u = S.cache.users.find(u=>u.codigo===r.asignado_a); if(u) { changes.asignado_a_id = u.id; changes.asignado_a_todos = false; } }
  }
  const resp = await HANDLERS.edit_task(id, changes);
  toast(resp.success ? '✅ Tarea actualizada' : resp.msg); if (resp.success) render();
};

async function flowNewInsumo(preCat = null, prefill = null){
  const pf = prefill || {};
  const selCat = pf.cat || preCat || 'Nutrición';
  const catOpts = Object.keys(BODEGA_STRUCT).map(k => `<option value="${k}" ${k===selCat?'selected':''}>${BODEGA_STRUCT[k].name}</option>`).join('');
  const initialSubs = BODEGA_STRUCT[selCat]?.subs || [];
  const subOpts = initialSubs.map(sx => `<option value="${sx}" ${sx===(pf.sub||'')?'selected':''}>${sx}</option>`).join('');

  const html = `
    <div class="modal-h">Nuevo Insumo</div>
    <div class="modal-sub">Escanea la etiqueta y la IA llena los datos, o escríbelos tú.</div>
    <button class="btn btn-blue btn-block" id="m-scan" style="margin-bottom:14px"><i class="ti ti-scan"></i> Escanear etiqueta con la cámara</button>
    <div class="modal-field"><label class="modal-label">Nombre del producto</label><input class="modal-input" id="f-desc" placeholder="Ej: Urea 46%" value="${esc(pf.desc||'')}"></div>
    <div class="modal-field"><label class="modal-label">Categoría</label><select class="modal-select" id="f-cat">${catOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Subcategoría</label><select class="modal-select" id="f-sub">${subOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Ingredientes / Especificaciones (Clave para IA)</label><input class="modal-input" id="f-det" placeholder="Ej: Nitrógeno 46%, Fósforo..." value="${esc(pf.det||'')}"></div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1"><label class="modal-label">Cantidad</label><input class="modal-input" type="number" id="f-can" value="${esc(pf.can||'')}"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad</label><input class="modal-input" id="f-uni" placeholder="Kg, L, Bulto..." value="${esc(pf.uni||'')}"></div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1"><label class="modal-label">Precio total (opcional)</label><input class="modal-input" type="number" id="f-pre" placeholder="Lo que costó" value="${esc(pf.pre||'')}"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Vence (opcional)</label><input class="modal-input" type="date" id="f-ven" value="${esc(pf.ven||'')}"></div>
    </div>
    <div class="modal-field"><label class="modal-label">Franja toxicológica (opcional)</label><select class="modal-select" id="f-fra">
      <option value="">— sin definir / la detecta la IA —</option>
      <option value="roja" ${pf.fra==='roja'?'selected':''}>Roja · muy tóxico</option>
      <option value="amarilla" ${pf.fra==='amarilla'?'selected':''}>Amarilla · moderado</option>
      <option value="azul" ${pf.fra==='azul'?'selected':''}>Azul · poco tóxico</option>
      <option value="verde" ${pf.fra==='verde'?'selected':''}>Verde · bajo riesgo</option>
    </select></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="m-cancel-inv">Cancelar</button><button class="btn btn-primary" id="m-save-inv">Guardar</button></div>
  `;

  const res = await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet">${html}</div></div>`;
    const catEl = document.getElementById('f-cat');
    const subEl = document.getElementById('f-sub');
    catEl.onchange = () => {
      const subs = BODEGA_STRUCT[catEl.value]?.subs || [];
      subEl.innerHTML = subs.map(sx => `<option value="${sx}">${sx}</option>`).join('');
    };
    const gv = (id) => (document.getElementById(id)?.value || '').trim();
    const leer = () => ({ desc:gv('f-desc'), cat:catEl.value, sub:subEl.value, det:gv('f-det'), can:gv('f-can'), uni:gv('f-uni'), pre:gv('f-pre'), ven:gv('f-ven'), fra:(document.getElementById('f-fra')?.value||'') });
    const close = (val) => { document.getElementById('modal-host').innerHTML = ''; resolve(val); };
    document.getElementById('m-cancel-inv').onclick = () => close(null);
    document.getElementById('m-scan').onclick = () => close({ scan:true, keep: leer() });
    document.getElementById('m-save-inv').onclick = () => {
      const d = leer();
      if (!d.desc || !d.can || !d.uni) { toast('Faltan campos (Nombre, cantidad, unidad)'); return; }
      close(d);
    };
  });

  if (!res) return;

  /* Escaneo de etiqueta: foto → Gemini visión → formulario prellenado */
  if (res.scan){
    if (!S.isOnline){ toast('Necesitas internet para escanear etiquetas'); return flowNewInsumo(preCat, res.keep); }
    const media = await Cam.open();
    if (!media || media.isVideo) return flowNewInsumo(preCat, res.keep);
    toast('🔍 Leyendo la etiqueta...');
    let info = null;
    try{ info = await analizarEtiqueta(media); } catch(e){ console.warn('analizarEtiqueta:', e.message); }
    if (!info || info.error){
      toast('No pude leer bien la etiqueta, llena los datos manualmente');
      return flowNewInsumo(preCat, res.keep);
    }
    toast('✅ Etiqueta leída, revisa los datos');
    return flowNewInsumo(null, {
      ...res.keep,
      desc: info.descripcion || res.keep.desc,
      det:  info.detalles || res.keep.det,
      cat:  BODEGA_STRUCT[info.categoria] ? info.categoria : res.keep.cat,
      sub:  info.subcategoria || res.keep.sub
    });
  }

  if (res.pre) await HANDLERS.add_gasto({ concepto: `${res.desc} (${res.can} ${res.uni})`, categoria: res.cat, valor_total: parseFloat(res.pre) });
  const resp = await HANDLERS.add_inventory({ descripcion:res.desc, categoria:res.cat, subcategoria:res.sub, detalles:res.det, cantidad: parseFloat(res.can), unidad: res.uni, precio_total: parseFloat(res.pre)||0, fecha_vencimiento: res.ven||null, franja_toxicologica: res.fra||null });

  if(!resp.success) {
    M.confirm({ title: 'Error en base de datos', body: resp.msg, okText: 'Entendido', cancelText: '', danger: true });
  } else {
    toast('✅ ' + resp.msg); 
    render();
    if (resp.isNew && S.isOnline){
      const quiere = await M.confirm({ title:'¿Investigar en internet?', body:`¿Quieres que investigue "${esc(res.desc)}" en internet (ingredientes, dosis, precauciones) y guarde la ficha?`, okText:'Sí, investigar', cancelText:'Ahora no' });
      if (quiere) researchProduct(res.desc);
    }
  }
}

/* Lee la etiqueta de un producto con Gemini visión y devuelve JSON */
async function analizarEtiqueta(media){
  const cats = Object.entries(BODEGA_STRUCT).map(([k,v]) => `"${k}" (subcategorías válidas: ${v.subs.join(', ')})`).join('; ');
  const prompt = `Lee la etiqueta del producto agrícola que aparece en la foto. Devuelve SOLO un JSON válido, sin markdown ni texto adicional, con esta forma exacta: {"descripcion":"nombre comercial corto","categoria":"...","subcategoria":"...","detalles":"ingredientes activos con su concentración"}. La categoria debe ser EXACTAMENTE una de estas: ${cats}. La subcategoria debe ser una de las válidas para esa categoría. Si la imagen no es una etiqueta legible devuelve {"error":"no legible"}.`;
  const req = { contents:[{ role:'user', parts:[{ inlineData:{ mimeType: media.type, data: media.b64 } }, { text: prompt }] }] };
  const rq = await llamarGemini(req);
  if (!rq.ok) return null;
  const data = rq.data;
  let txt = (data.candidates?.[0]?.content?.parts || []).filter(p=>p.text).map(p=>p.text).join('').trim();
  txt = txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  const m = txt.match(/\{[\s\S]*\}/);
  if (!m) return null;
  return JSON.parse(m[0]);
}

  const row = document.getElementById(`task-row-${id}`), check = row?.querySelector('.task-check');
  if (check){ check.classList.add('checked'); row.classList.add('task-item-completing'); }
  let undone = false;
  toast(`✓ Tarea completada`, {
    duration: 4500, action: { label: 'Deshacer', onClick: async () => {
      undone = true; task.estado = previousState;
      if (S.isOnline){ try { await sb.from('tareas').update({ estado: previousState }).eq('id', id); } catch(e){} }
      else { const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); localStorage.setItem(QUEUE_KEY, JSON.stringify(q.filter(x => !(x.action === 'complete_task' && x.id == id)))); }
      render();
    }}
  });
  setTimeout(async () => { if (undone) return; await HANDLERS.complete_task(id); if (!undone) render(); }, 600);
}

/* ═══════════════════════════════════════════════════════════════
   MÓDULO PLAGAS Y ENFERMEDADES
   ═══════════════════════════════════════════════════════════════ */
function renderPlagas(){
  const activas = S.cache.plagas.filter(p => p.activa).sort((a,b) => {
    const ord = {severa:0, moderada:1, leve:2};
    return (ord[a.severidad]||2) - (ord[b.severidad]||2);
  });
  const controladas = S.cache.plagas.filter(p => !p.activa).slice(0,10);

  function plagaCard(p, esControlada){
    const sev = esControlada ? 'controlada' : (p.severidad||'leve');
    const icon = sev==='severa'?'ti-alert-triangle':sev==='moderada'?'ti-alert-circle':sev==='controlada'?'ti-circle-check':'ti-bug';
    const loteNom = p.lote?.codigo || 'Finca general';
    const ctrl = p.producto_usado ? `<div class="plaga-control"><i class="ti ti-spray"></i> <b>Control:</b> ${esc(p.producto_usado)}${p.dosis?' · '+esc(p.dosis):''} ${p.fecha_control?'('+esc(p.fecha_control)+')':''} ${p.resultado?'· '+esc(p.resultado):''}</div>` : '';
    const acciones = esControlada ? 
      `<button class="btn btn-sm btn-ghost" onclick="flowDeletePlaga('${p.id}')" style="color:var(--tx3);padding:4px;border:none"><i class="ti ti-trash"></i></button>` :
      `<div class="row gap6">
        <button class="btn btn-sm btn-ghost" onclick="flowControlarPlaga('${p.id}','${escA(p.tipo||'')}','${escA(loteNom)}')" style="padding:5px" title="Registrar control"><i class="ti ti-spray"></i> Controlar</button>
        <button class="btn btn-sm btn-ghost" onclick="flowCerrarPlaga('${p.id}','${escA(p.tipo||'')}')" style="color:var(--g);padding:5px;border:none" title="Marcar controlada"><i class="ti ti-circle-check"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowDeletePlaga('${p.id}')" style="color:var(--rd);padding:5px;border:none"><i class="ti ti-trash"></i></button>
      </div>`;
    return `<div class="plaga-card ${sev}">
      <div class="plaga-header">
        <div class="plaga-icon ${sev}"><i class="ti ${icon}"></i></div>
        <div style="flex:1">
          <div class="plaga-title">${esc(p.tipo)}</div>
          <div class="plaga-meta">
            <span><i class="ti ti-map-pin"></i> ${loteNom}</span>
            <span><i class="ti ti-calendar"></i> ${p.fecha_deteccion||'—'}</span>
            ${p.registrado?.nombre_corto?`<span><i class="ti ti-user"></i> ${p.registrado.nombre_corto}</span>`:''}
          </div>
        </div>
        <div class="row gap4" style="flex-shrink:0;align-items:flex-start">
          <span class="plaga-badge ${sev}">${sev}</span>
        </div>
      </div>
      ${p.descripcion?`<div class="plaga-desc">${clampHTML(p.descripcion,{limit:110})}</div>`:''}
      ${ctrl}
      <div style="margin-top:8px;display:flex;justify-content:flex-end">${acciones}</div>
    </div>`;
  }

  const activasHtml = activas.length ? activas.map(p=>plagaCard(p,false)).join('') : emptyState('ti-leaf','Sin plagas activas','No hay problemas fitosanitarios registrados.');
  const controladasHtml = controladas.length ? controladas.map(p=>plagaCard(p,true)).join('') : `<div class="text-tiny" style="padding:10px;text-align:center">Sin registros anteriores.</div>`;

  // Resumen por lote
  const resumenLotes = S.cache.lotes.map(l => {
    const pl = S.cache.plagas.filter(p=>p.activa && p.lote_id===l.id);
    if (!pl.length) return '';
    const sevCount = pl.filter(p=>p.severidad==='severa').length;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px">
      <span><b>${l.codigo}</b> · ${l.cultivo}</span>
      <span>${pl.length} plaga${pl.length>1?'s':''}${sevCount?` · <span style="color:var(--rd);font-weight:700">${sevCount} severa${sevCount>1?'s':''}</span>`:''}</span>
    </div>`;
  }).filter(Boolean).join('');

  return `<div class="panel">
    <div class="panel-h">
      <div class="panel-title"><i class="ti ti-bug" style="color:var(--rd)"></i> Plagas y Enfermedades</div>
      <button class="btn btn-sm btn-red" onclick="flowNuevaPlaga()"><i class="ti ti-plus"></i> Registrar</button>
    </div>
    ${resumenLotes ? `<div class="card" style="margin-bottom:12px;padding:10px 14px"><div class="sec-t" style="margin:0 0 8px"><span>Resumen por lote</span></div>${resumenLotes}</div>` : ''}
    <div class="sec-t"><span><i class="ti ti-alert-circle"></i> Activas (${activas.length})</span></div>
    ${activasHtml}
    ${controladas.length ? `<div class="sec-t mt12"><span><i class="ti ti-circle-check"></i> Controladas recientes</span></div>${controladasHtml}` : ''}
  </div>`;
}

      const loteCod = c.lote_id ? (S.cache.lotes.find(l=>l.id==c.lote_id)?.codigo||'') : '';
      return `<div class="hist-item"><div class="hist-dot" style="background:var(--bl);box-shadow:0 0 0 3px var(--p-blue)"></div><div class="hist-body"><div class="hist-title">${esc(c.concepto)}</div><div class="hist-meta"><span><i class="ti ti-calendar"></i> ${fmtDate(c.fecha_compra)}</span><span><i class="ti ti-map-pin"></i> ${esc(loteCod)||'Finca'}</span><span style="font-weight:700;color:var(--bl)">${fmtMoney(c.valor_total)}</span></div></div></div>`;

/* ═══════════════════════════════════════════════════════════════
   MOTOR DE MAPAS (Leaflet + Supabase)
   ═══════════════════════════════════════════════════════════════ */
const MapEngine = {
  _maps: {},

  /* Calcula área (m²) y perímetro (m) de un polígono dado array de {lat,lng} */
  calcDims(pts){
    if (pts.length < 3) return { area:0, perimetro:0 };
    // Fórmula de Haversine para perímetro y Shoelace proyectado para área
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    let perimetro = 0;
    for (let i = 0; i < pts.length; i++){
      const a = pts[i], b = pts[(i+1) % pts.length];
      const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
      const sin2 = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
      perimetro += 2 * R * Math.asin(Math.sqrt(sin2));
    }
    // Área con proyección plana (suficiente para lotes pequeños)
    let area = 0;
    const lat0 = pts[0].lat, lng0 = pts[0].lng;
    const metersPerDegLat = 111320;
    const metersPerDegLng = 111320 * Math.cos(toRad(lat0));
    const xy = pts.map(p => ({ x:(p.lng-lng0)*metersPerDegLng, y:(p.lat-lat0)*metersPerDegLat }));
    for (let i = 0; i < xy.length; i++){
      const j = (i+1) % xy.length;
      area += xy[i].x * xy[j].y - xy[j].x * xy[i].y;
    }
    area = Math.abs(area) / 2;
    return { area: Math.round(area), perimetro: Math.round(perimetro) };
  },

  fmtArea(m2){
    if (m2 >= 10000) return (m2/10000).toFixed(2) + ' ha';
    return m2.toLocaleString('es-CO') + ' m²';
  },

  fmtDist(m){
    if (m >= 1000) return (m/1000).toFixed(2) + ' km';
    return m.toLocaleString('es-CO') + ' m';
  },

  /* Inicializa o reutiliza un mapa Leaflet en un div con ese id */
  init(divId, center, zoom){
    if (this._maps[divId]){
      try { this._maps[divId].remove(); } catch(e){}
      delete this._maps[divId];
    }
    const loc = center || Location.get();
    const map = L.map(divId, { zoomControl:true, attributionControl:false }).setView([loc.lat||3.417, loc.lon||loc.lng||-76.244], zoom||17);

    // Capas disponibles (todas gratuitas)
    // maxNativeZoom = hasta dónde hay imágenes reales; maxZoom permite acercar
    // más reusando la última imagen nítida (Leaflet la escala suave, no se pixela feo).
    const capas = {
      'Calles': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom:19, maxZoom:21 }),
      'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom:18, maxZoom:21 }),
      'Híbrido': L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom:18, maxZoom:21 }),
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', { maxNativeZoom:19, maxZoom:21 })
      ]),
      'Topográfico': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxNativeZoom:17, maxZoom:21 })
    };
    const preferida = localStorage.getItem('finca_map_capa') || 'Satélite';
    (capas[preferida] || capas['Calles']).addTo(map);
    const ctrl = L.control.layers(capas, null, { position:'topright', collapsed:true }).addTo(map);
    map.on('baselayerchange', (e) => { try{ localStorage.setItem('finca_map_capa', e.name); }catch(_){} });

    this._maps[divId] = map;
    return map;
  },

  /* Dibuja el polígono/puntos de un lote en el mapa dado */
  drawLote(map, pts, color){
    if (!pts.length) return;
    const latlngs = pts.map(p => [p.latitud, p.longitud]);
    if (pts.length >= 3){
      L.polygon(latlngs, { color: color||'#3B6D11', fillColor: color||'#639922', fillOpacity:0.25, weight:2.5 }).addTo(map);
    }
    pts.forEach((p, i) => {
      const icon = L.divIcon({ className:'', html:`<div style="width:20px;height:20px;background:${color||'#3B6D11'};color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">${i+1}</div>`, iconSize:[20,20], iconAnchor:[10,10] });
      L.marker([p.latitud, p.longitud], { icon }).addTo(map);
    });
    if (latlngs.length) map.fitBounds(latlngs.length === 1 ? [[latlngs[0][0]-0.0005,latlngs[0][1]-0.0005],[latlngs[0][0]+0.0005,latlngs[0][1]+0.0005]] : latlngs, { padding:[20,20] });
  },

  /* Botón "Mi ubicación": punto azul con círculo de precisión */
  _locMarkers: {},
  addLocate(map, divId){
    const mapDiv = document.getElementById(divId);
    const container = mapDiv ? mapDiv.parentElement : null;
    if (!container || container.querySelector('.map-locate-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'map-locate-btn';
    btn.innerHTML = '<i class="ti ti-current-location"></i> Mi ubicación';
    container.appendChild(btn);
    btn.onclick = () => {
      if (!navigator.geolocation){ toast('Este equipo no tiene GPS disponible'); return; }
      btn.classList.add('active');
      btn.innerHTML = '<i class="ti ti-loader"></i> Buscando...';
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy || 0;
        const prev = this._locMarkers[divId];
        if (prev){ try{ map.removeLayer(prev.dot); map.removeLayer(prev.circle); } catch(e){} }
        const icon = L.divIcon({ className:'', html:'<div style="width:16px;height:16px;background:#1A73E8;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 6px rgba(0,0,0,.45)"></div>', iconSize:[16,16], iconAnchor:[8,8] });
        const dot = L.marker([lat, lng], { icon, zIndexOffset:1000 }).addTo(map);
        const circle = L.circle([lat, lng], { radius: Math.max(acc, 5), color:'#1A73E8', fillColor:'#1A73E8', fillOpacity:.12, weight:1 }).addTo(map);
        this._locMarkers[divId] = { dot, circle };
        map.setView([lat, lng], Math.max(map.getZoom(), 17));
        btn.classList.remove('active');
        btn.innerHTML = '<i class="ti ti-current-location"></i> Mi ubicación';
        toast(`📍 Estás aquí (precisión ±${Math.round(acc)} m)`);
      }, (err) => {
        btn.classList.remove('active');
        btn.innerHTML = '<i class="ti ti-current-location"></i> Mi ubicación';
        toast('❌ No se pudo obtener tu ubicación: ' + err.message);
      }, { enableHighAccuracy:true, timeout:15000 });
    };
  }
};

/* Colores para cada lote en el mapa global */
const LOTE_COLORS = ['#3B6D11','#854F0B','#185FA5','#C53030','#B07010','#0D7D6C','#6B3FA0','#C97000'];

function renderMapasGlobal(){
  const lotes = S.cache.lotes;
  const allCoords = S.cache.coordenadas;
  setTimeout(() => {
    if (!document.getElementById('map-global')) return;
    const map = MapEngine.init('map-global', null, 15);
    MapEngine.addLocate(map, 'map-global');
    const bounds = [];
    lotes.forEach((l, idx) => {
      const pts = allCoords.filter(c => c.lote_id === l.id).sort((a,b) => a.orden - b.orden);
      if (!pts.length) return;
      const color = LOTE_COLORS[idx % LOTE_COLORS.length];
      MapEngine.drawLote(map, pts, color);
      const dims = MapEngine.calcDims(pts.map(p => ({ lat:p.latitud, lng:p.longitud })));
      if (pts.length >= 3){
        const cLat = pts.reduce((s,p)=>s+p.latitud,0)/pts.length;
        const cLng = pts.reduce((s,p)=>s+p.longitud,0)/pts.length;
        L.tooltip({ permanent:true, direction:'center', className:'leaflet-tooltip' }).setContent(`<b style="font-size:11px">${l.codigo}</b>${dims.area?`<br><span style='font-size:10px'>${MapEngine.fmtArea(dims.area)}</span>`:''}`)
          .setLatLng([cLat, cLng]).addTo(map);
      }
      pts.forEach(p => bounds.push([p.latitud, p.longitud]));
    });
    if (bounds.length) map.fitBounds(bounds, { padding:[20,20] });
  }, 100);

  const loteCards = lotes.map((l, idx) => {
    const pts = allCoords.filter(c => c.lote_id === l.id);
    const dims = pts.length >= 3 ? MapEngine.calcDims(pts.map(p => ({ lat:p.latitud, lng:p.longitud }))) : null;
    const color = LOTE_COLORS[idx % LOTE_COLORS.length];
    return `<div class="card" style="border-left:3px solid ${color};cursor:pointer" onclick="flowMapaLote('${l.id}','${l.codigo}')">
      <div class="card-h"><div class="card-t">${l.codigo} · ${l.cultivo}</div><div class="row gap6"><span class="badge bg-green">${pts.length} puntos</span></div></div>
      ${dims ? `<div class="map-dims" style="margin:6px 0 0"><div><b>${MapEngine.fmtArea(dims.area)}</b>Área</div><div><b>${MapEngine.fmtDist(dims.perimetro)}</b>Perímetro</div></div>` : `<div class="text-tiny" style="margin-top:4px">Sin coordenadas aún — toca para agregar</div>`}
    </div>`;
  }).join('') || emptyState('ti-map-2','Sin lotes','Crea un lote primero desde la pestaña Lotes.');

  return `<div class="panel">
    <div class="panel-h"><div class="panel-title">Mapa General</div></div>
    <div class="map-container" style="margin-bottom:12px">
      <div id="map-global"></div>
      <button class="map-fullscreen-btn" onclick="flowMapaFullscreen('global')"><i class="ti ti-arrows-maximize"></i> Ampliar</button>
    </div>
    <div class="sec-t"><span><i class="ti ti-plant"></i> Lotes</span></div>
    ${loteCards}
  </div>`;
}

/* ─── Flujo: ver/editar mapa de un lote específico ─── */
window.flowMapaLote = async function(loteId, loteCodigo){
  const lote = S.cache.lotes.find(l => l.id === loteId);
  if (!lote) return;
  let pts = S.cache.coordenadas.filter(c => c.lote_id === loteId).sort((a,b) => a.orden - b.orden);

  const host = document.getElementById('modal-host');

  function renderModal(){
    const dims = pts.length >= 3 ? MapEngine.calcDims(pts.map(p => ({ lat:p.latitud, lng:p.longitud }))) : null;
    const dimsHtml = dims ? `<div class="map-dims"><div><b>${MapEngine.fmtArea(dims.area)}</b>Área</div><div><b>${MapEngine.fmtDist(dims.perimetro)}</b>Perímetro</div><div><b>${pts.length} pts</b>Vértices</div></div>` : (pts.length ? `<div class="text-tiny" style="margin-bottom:8px;color:var(--yl)"><i class="ti ti-info-circle"></i> Necesitas al menos 3 puntos para calcular dimensiones.</div>` : '');
    const ptsList = pts.length ? pts.map((p,i) => `<div class="map-point-row"><div class="map-point-num">${i+1}</div><div class="map-point-coords">${p.latitud.toFixed(6)}, ${p.longitud.toFixed(6)}</div><div class="row gap6"><button class="btn btn-sm btn-ghost" onclick="window._mapaRetomar(${i})" style="padding:4px;border:none" title="Retomar este punto"><i class="ti ti-refresh"></i></button><button class="btn btn-sm btn-ghost" onclick="window._mapaEliminar(${i})" style="color:var(--rd);padding:4px;border:none" title="Eliminar punto"><i class="ti ti-trash"></i></button></div></div>`).join('') : `<div class="text-tiny" style="padding:10px;text-align:center">Sin puntos aún. Toca "Tomar punto GPS" para empezar.</div>`;

    host.innerHTML = `<div class="map-modal">
      <div class="map-modal-bar">
        <button class="btn btn-ghost btn-sm" id="m-map-close"><i class="ti ti-x"></i></button>
        <div class="map-modal-title"><i class="ti ti-map-pin"></i> ${loteCodigo} · ${lote.cultivo}</div>
        <button class="btn btn-sm btn-primary" id="m-map-gps"><i class="ti ti-current-location"></i> Tomar punto GPS</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px;background:var(--bg)">
        ${dimsHtml}
        <div class="map-container" style="margin-bottom:10px"><div id="map-lote" style="height:280px"></div><button class="map-fullscreen-btn" onclick="flowMapaFullscreen('lote','${loteId}','${loteCodigo}')"><i class="ti ti-arrows-maximize"></i> Ampliar</button></div>
        <div class="sec-t"><span><i class="ti ti-list-numbers"></i> Puntos del polígono</span></div>
        <div class="card">${ptsList}</div>
      </div>
    </div>`;

    // Eventos
    document.getElementById('m-map-close').onclick = () => { host.innerHTML=''; render(); };
    document.getElementById('m-map-gps').onclick = () => window._mapaTomar();

    // Inicializar mapa con pequeño delay
    setTimeout(() => {
      const map = MapEngine.init('map-lote', null, 17);
      MapEngine.drawLote(map, pts, '#3B6D11');
      MapEngine.addLocate(map, 'map-lote');
      window._currentMapLote = map;
    }, 120);

    // Helpers internos
    window._mapaTomar = async () => {
      const btn = document.getElementById('m-map-gps');
      if(btn){ btn.disabled=true; btn.innerHTML='<i class="ti ti-loader"></i> Buscando...'; }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const newPt = { lote_id: loteId, latitud: lat, longitud: lng, orden: pts.length, creado_por_id: S.user?.dbId || null };
        try {
          const { data, error } = await sb.from('coordenadas_lote').insert(newPt).select().single();
          if (error) throw error;
          pts.push(data);
          S.cache.coordenadas.push(data);
        } catch(e) {
          // offline fallback
          const tmp = { ...newPt, id: 'tmp-'+Date.now() };
          pts.push(tmp); S.cache.coordenadas.push(tmp);
          toast('Punto guardado localmente (sin conexión)');
        }
        renderModal();
      }, (err) => {
        toast('❌ No se pudo obtener GPS: ' + err.message);
        if(btn){ btn.disabled=false; btn.innerHTML='<i class="ti ti-current-location"></i> Tomar punto GPS'; }
      }, { enableHighAccuracy:true, timeout:20000 });
    };

    window._mapaEliminar = async (idx) => {
      const pt = pts[idx];
      const ok = await M.confirm({ title:'Eliminar punto', body:`¿Borrar el punto ${idx+1}?`, okText:'Sí, borrar', cancelText:'Cancelar', danger:true });
      if (!ok) return;
      if (!pt.id.toString().startsWith('tmp-')) {
        try { await sb.from('coordenadas_lote').delete().eq('id', pt.id); } catch(e){}
      }
      pts.splice(idx, 1);
      S.cache.coordenadas = S.cache.coordenadas.filter(c => c.id !== pt.id);
      // Renumerar orden en BD
      if (S.isOnline) {
        for (let i = idx; i < pts.length; i++){
          if (!pts[i].id.toString().startsWith('tmp-')) {
            await sb.from('coordenadas_lote').update({ orden: i }).eq('id', pts[i].id).then(()=>{}).catch(()=>{});
            pts[i].orden = i;
          }
        }
      }
      renderModal();
    };

    window._mapaRetomar = async (idx) => {
      const ok = await M.confirm({ title:`Retomar punto ${idx+1}`, body:'Se tomará la posición GPS actual y reemplazará este punto.', okText:'Sí, retomar', cancelText:'Cancelar' });
      if (!ok) return;
      const btn = document.getElementById('m-map-gps');
      if(btn){ btn.disabled=true; btn.innerHTML='<i class="ti ti-loader"></i> Buscando...'; }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const pt = pts[idx];
        try {
          if (!pt.id.toString().startsWith('tmp-')) {
            const { error } = await sb.from('coordenadas_lote').update({ latitud:lat, longitud:lng }).eq('id', pt.id);
            if (error) throw error;
          }
          pts[idx] = { ...pt, latitud:lat, longitud:lng };
          const ci = S.cache.coordenadas.findIndex(c => c.id === pt.id);
          if (ci>=0) S.cache.coordenadas[ci] = pts[idx];
        } catch(e){ toast('Error actualizando punto'); }
        renderModal();
      }, (err) => {
        toast('❌ GPS error: ' + err.message);
        if(btn){ btn.disabled=false; btn.innerHTML='<i class="ti ti-current-location"></i> Tomar punto GPS'; }
      }, { enableHighAccuracy:true, timeout:20000 });
    };
  }

  renderModal();
};

/* ─── Fullscreen map modal ─── */
window.flowMapaFullscreen = function(tipo, loteId, loteCodigo){
  const host = document.getElementById('modal-host');
  const titulo = tipo==='global' ? 'Mapa General — Todos los lotes' : `${loteCodigo} — Mapa completo`;
  host.innerHTML = `<div class="map-modal">
    <div class="map-modal-bar">
      <button class="btn btn-ghost btn-sm" id="m-fmap-close"><i class="ti ti-x"></i> Cerrar</button>
      <div class="map-modal-title">${titulo}</div>
    </div>
    <div class="map-modal-body"><div id="map-full" style="width:100%;height:100%"></div></div>
  </div>`;
  document.getElementById('m-fmap-close').onclick = () => { host.innerHTML=''; };
  setTimeout(() => {
    const map = MapEngine.init('map-full', null, 16);
    MapEngine.addLocate(map, 'map-full');
    if (tipo === 'global'){
      const bounds = [];
      S.cache.lotes.forEach((l, idx) => {
        const pts = S.cache.coordenadas.filter(c => c.lote_id === l.id).sort((a,b)=>a.orden-b.orden);
        if (!pts.length) return;
        MapEngine.drawLote(map, pts, LOTE_COLORS[idx % LOTE_COLORS.length]);
        pts.forEach(p => bounds.push([p.latitud, p.longitud]));
      });
      if (bounds.length) map.fitBounds(bounds, { padding:[20,20] });
    } else {
      const pts = S.cache.coordenadas.filter(c => c.lote_id === loteId).sort((a,b)=>a.orden-b.orden);
      MapEngine.drawLote(map, pts, '#3B6D11');
    }
  }, 120);
};

/* ═══════════════════════════════════════════════════════════════
   EVENTOS PRINCIPALES Y RENDER
   ═══════════════════════════════════════════════════════════════ */
function bindAppEvents(){
  document.getElementById('btn-bell')?.addEventListener('click', () => Alerts.showPanel());
  document.getElementById('btn-logout')?.addEventListener('click', showUserMenu);
  document.getElementById('weather-pill')?.addEventListener('click', () => Weather.showPanel());
  document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { S.tab = el.dataset.tab; S.activeLote = null; S.activeBodegaCat = null; S.activeBodegaSub = null; Voice.cancel(); Nav.push(); render(); }));
  document.getElementById('btn-internet-search')?.addEventListener('click', () => { const q = document.getElementById('internet-search-input').value.trim(); if (q) window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank'); });
  document.getElementById('internet-search-input')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('btn-internet-search').click(); });
  document.getElementById('btn-voice')?.addEventListener('click', () => Voice.start());
  document.getElementById('btn-cam')?.addEventListener('click', async () => { const media = await Cam.open(); if (media){ S.pendImg = media; render(); } });
  document.getElementById('btn-cancel-cam')?.addEventListener('click', () => { S.pendImg = null; render(); });
  document.getElementById('voice-cd-bar')?.addEventListener('click', () => { Voice.cancelAutoSend(); toast('Auto-envío cancelado'); });
  
  const ta = document.getElementById('txt-inp');
  if (ta){ ta.addEventListener('input', adjustTextarea); ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('btn-send').click(); } }); adjustTextarea(); }
  
  document.getElementById('btn-send')?.addEventListener('click', async () => {
    const inp = document.getElementById('txt-inp'), text = inp ? inp.value.trim() : '';
    if (!text && !S.pendImg) return;
    if (inp) { inp.value = ''; adjustTextarea(); }
    S.loading = true; const hist = S.messages;
    hist.push({ role:'user', content: text || (S.pendImg?.isVideo ? '[Video]' : '[Foto]'), mediaPreview: S.pendImg?.preview, mediaIsVideo: S.pendImg?.isVideo });
    const mediaData = S.pendImg; S.pendImg = null; render();
    setTimeout(() => document.getElementById('chat-end')?.scrollIntoView({behavior:'smooth'}), 60);
    try{ await atenderChat(text, mediaData); }
    catch(e){ console.error(e); hist.push({ role:'assistant', content:'⚠️ Algo falló: ' + e.message }); }
    if (mediaData && !mediaData.isVideo && S.isOnline){
      subirFoto(mediaData, { nota: (text || 'Foto enviada al agente').slice(0, 120) }).then(u => { if (u) toast('🖼️ Foto guardada en la galería'); }).catch(() => {});
    }
    if (S.messages.length > 40) S.messages.splice(0, S.messages.length - 40);
    S.loading = false; render();
    setTimeout(() => document.getElementById('chat-end')?.scrollIntoView({behavior:'smooth'}), 60);
  });

  document.getElementById('btn-add-gasto')?.addEventListener('click', flowAddGasto);
  document.getElementById('btn-add-ingreso')?.addEventListener('click', flowAddIngreso);
  document.querySelectorAll('[data-complete-task]').forEach(el => el.addEventListener('click', (e) => { flowCompleteTask(e.currentTarget.dataset.completeTask); }));
  document.getElementById('btn-global-task')?.addEventListener('click', () => flowNewTask(null));
  document.getElementById('btn-global-apunte')?.addEventListener('click', () => flowNewApunte(null, null));
  document.getElementById('btn-gps')?.addEventListener('click', captureGPS);

  if (S.tab === 'cultivos'){
    document.querySelectorAll('.lote-card').forEach(el => el.addEventListener('click', () => { S.activeLote = S.cache.lotes.find(l => l.codigo === el.dataset.lote); Nav.push(); render(); }));
    document.getElementById('btn-back-lote')?.addEventListener('click', () => { S.activeLote = null; Nav.push(); render(); });
    document.getElementById('btn-new-lote')?.addEventListener('click', flowNewLote);
    document.getElementById('btn-new-task')?.addEventListener('click', () => { if (!S.activeLote) return; flowNewTask(S.activeLote.id); });
    document.getElementById('btn-new-apunte')?.addEventListener('click', () => { if (!S.activeLote) return; flowNewApunte(S.activeLote.id, S.activeLote.codigo); });
  }
}

async function doLogin(user){
  S.user = user; S.screen = 'app'; S.tab = 'agente'; S.activeBodegaCat = null;
  Nav.init(); Nav.push();
  await refreshAll(); syncOfflineQueue(); render();
  Weather.fetch().then(() => render()).catch(() => {});
  if (!doLogin._weatherInterval) doLogin._weatherInterval = setInterval(() => Weather.fetch().then(() => render()), 30 * 60 * 1000);
  Alerts.startScheduler(); setTimeout(() => Alerts.checkOnStartup(), 500);
}

function barraAgente(dominio){
  const a=AGENTES[dominio]; if(!a) return '';
  const cls = a.color==='brown'?'brown':a.color==='blue'?'blue':a.color==='yellow'?'yellow':'';
  return `<div class="ag-bar ${cls}">
    <div class="ag-bar-head"><div class="ag-bar-av"><i class="ti ${a.icon}"></i></div>
      <div style="flex:1"><div class="ag-bar-name">${esc(a.nombre)}</div><div class="ag-bar-sub">${esc(a.rol)}</div></div></div>
    <div class="ag-bar-row">
      <input class="ag-bar-inp" id="ag-inp-${dominio}" placeholder="${esc(a.ph||'Escribe o dicta…')}" autocomplete="off"
        onkeydown="if(event.key==='Enter'){event.preventDefault();enviarSeccion('${dominio}');}">
      <button class="ag-bar-btn ag-bar-mic" id="ag-mic-${dominio}" onclick="dictarSeccion('${dominio}')" title="Dictar"><i class="ti ti-microphone"></i></button>
      <button class="ag-bar-btn ag-bar-send" onclick="enviarSeccion('${dominio}')" title="Enviar"><i class="ti ti-arrow-up"></i></button>
    </div>
  </div>`;
}
window.enviarSeccion = function(dominio){
  const inp=document.getElementById('ag-inp-'+dominio); if(!inp) return;
  const txt=inp.value.trim(); if(!txt) return;
  inp.value='';
  flowAgenteSeccion(dominio, txt, null);
};
window.dictarSeccion = function(dominio){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Tu dispositivo no permite dictado por voz; escribe el mensaje.'); return; }
  const inp=document.getElementById('ag-inp-'+dominio), mic=document.getElementById('ag-mic-'+dominio);
  try{
    const rec=new SR(); rec.lang='es-CO'; rec.interimResults=false; rec.maxAlternatives=1;
    mic && mic.classList.add('on');
    rec.onresult=(e)=>{ const t=e.results[0][0].transcript; if(inp){ inp.value=t; } };
    rec.onend=()=>{ mic && mic.classList.remove('on'); if(inp && inp.value.trim()) enviarSeccion(dominio); };
    rec.onerror=()=>{ mic && mic.classList.remove('on'); };
    rec.start();
  }catch(e){ mic && mic.classList.remove('on'); toast('No pude iniciar el dictado'); }
};

function render(){
  const app = document.getElementById('app');
  if (S.screen === 'login'){
    app.innerHTML = `<div class="login"><div class="login-logo"><i class="ti ti-plant-2"></i></div><h1 class="login-h">Finca El Retiro</h1><div class="login-sub">Tu mano derecha en el campo</div><div class="ulist">${S.users.length ? S.users.map(u => `<button class="uitem" data-login="${u.id}"><div class="uitem-av">${initial(u.display)}</div><div style="flex:1"><div${u.color?` style="color:${u.color}"`:''}>${u.display}</div>${u.fullName?`<div class="text-tiny" style="font-weight:400;margin-top:1px">${u.fullName}</div>`:''}</div><i class="ti ti-chevron-right uitem-chev"></i></button>`).join('') : '<div class="text-small" style="text-align:center;padding:16px">Cargando usuarios...</div>'}</div></div>`;
    document.querySelectorAll('[data-login]').forEach(el => el.addEventListener('click', () => doLogin(S.users.find(u => u.id === el.dataset.login))));
    return;
  }

  let content = '';
  if (S.tab === 'plagas' || S.tab === 'internet') S.tab = 'agente';
  if (S.tab === 'dinero')    content = renderDinero();
  if (S.tab === 'bodega')    content = renderBodega();
  if (S.tab === 'cultivos')  content = renderCultivos();
  if (S.tab === 'tareas')    content = renderTareas();
  if (S.tab === 'bitacora')  content = renderBitacora();
  if (S.tab === 'agente')    content = renderChatInterface(S.tab);
  if (S.tab === 'mapas')     content = renderMapasGlobal();
  // Inyectar la barra del agente de la sección (arriba del panel)
  if (AGENTES[S.tab] && content.includes('<div class="panel">')){
    content = content.replace('<div class="panel">', '<div class="panel">' + barraAgente(S.tab), 1);
  }

  const netDot = S.isOnline ? '<span class="net-status net-online" title="En línea"></span>' : '<span class="net-status net-offline" title="Sin conexión"></span>';
  const urgentCount = Alerts.urgentCount();
  const bell = `<button class="bell-btn ${urgentCount>0?'has-alerts':''}" id="btn-bell" title="Ver alertas"><i class="ti ti-bell"></i>${urgentCount > 0 ? `<span class="bell-badge">${urgentCount > 9 ? '9+' : urgentCount}</span>` : ''}</button>`;

  app.innerHTML = `
    <div class="topbar">
      <div class="tb-logo"><i class="ti ti-plant-2"></i></div>
      <div class="tb-mid"><div class="tb-name">Finca El Retiro ${netDot}</div><div class="tb-user"><i class="ti ti-user" style="font-size:11px"></i> ${S.user?.display || '—'} · ${S.isOnline?'sincronizado':'sin conexión'}</div></div>
      ${Weather.renderPill()} ${bell}
      <div class="tb-av" id="btn-logout" title="Tocar para cambiar de usuario">${initial(S.user?.display)}<span class="tb-av-dot"></span></div>
    </div>
    ${renderNav()}
    <div class="screen">${content}</div>`;
  bindAppEvents();
}

async function init(){ await loadUsers(); render(); }

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller){ aplicarActualizacion(newWorker); }
        });
      });
      // Buscar versión nueva al abrir y cada vez que la app vuelve a primer plano
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(err => console.warn('SW registro fallo:', err));
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
  });
}

/* Versión nueva: se aplica sola si no estás en medio de algo; si no, aparece el aviso */
function aplicarActualizacion(worker){
  const ocupado = () => S.loading || (document.getElementById('modal-host')?.innerHTML.trim()) || document.querySelector('input:focus, textarea:focus') || (document.getElementById('txt-inp')?.value || '').trim();
  if (!ocupado()){ worker.postMessage({ type: 'SKIP_WAITING' }); return; }
  showUpdateBanner(worker);
  const reintento = setInterval(() => { if (!ocupado()){ clearInterval(reintento); worker.postMessage({ type: 'SKIP_WAITING' }); } }, 15000);
}
function showUpdateBanner(worker){
  if (document.querySelector('.update-banner')) return;
  const banner = document.createElement('div'); banner.className = 'update-banner';
  banner.innerHTML = `<i class="ti ti-refresh"></i><span>Nueva versión disponible</span><button id="upd-btn">Actualizar</button>`;
  document.body.appendChild(banner);
  document.getElementById('upd-btn').onclick = () => { worker.postMessage({ type: 'SKIP_WAITING' }); banner.remove(); };
}

/* ═══════════════════════════════════════════════════════════════
   INSTALAR COMO APP (PWA)
   ═══════════════════════════════════════════════════════════════ */
let _deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); _deferredInstall = e; });
window.addEventListener('appinstalled', () => { _deferredInstall = null; toast('✅ App instalada'); });
function appYaInstalada(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
window.flowInstalar = async function(){
  if (appYaInstalada()){ toast('Ya estás usando la app instalada'); return; }
  if (_deferredInstall){
    _deferredInstall.prompt();
    try{ await _deferredInstall.userChoice; }catch(e){}
    _deferredInstall = null;
    return;
  }
  // iPhone/iPad (Safari no soporta instalación automática)
  const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const html = `<div class="modal-h"><i class="ti ti-device-mobile-down"></i> Instalar la app</div>
    <div class="modal-sub">Para tenerla como una app en tu teléfono:</div>
    ${esIOS
      ? `<div class="spec-box">1. Toca el botón <b>Compartir</b> <i class="ti ti-share"></i> (abajo en Safari).<br>2. Baja y toca <b>"Agregar a inicio"</b>.<br>3. Confirma con <b>Agregar</b>.</div>`
      : `<div class="spec-box">1. Abre el menú del navegador <b>⋮</b> (arriba a la derecha).<br>2. Toca <b>"Instalar aplicación"</b> o <b>"Agregar a pantalla de inicio"</b>.<br>3. Confirma.</div>`}
    <div class="modal-actions" style="margin-top:12px"><button class="btn btn-primary btn-block" id="m-inst-close">Entendido</button></div>`;
  M._open(html);
  document.getElementById('m-inst-close').onclick = () => M._close(null);
};

init();
</script>

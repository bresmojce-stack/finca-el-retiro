function buildProactivePanel(){
  const hoyISO = fechaLocalISO();
  const h = horaFinca();
  const greeting = h < 5 ? '🌙 Buenas noches' : h < 12 ? '☀️ Buenos días' : h < 18 ? '👋 Buenas tardes' : '🌙 Buenas noches';
  const items = [];

  // Tareas vencidas
  const venc = S.cache.tasks.filter(t => t.estado==='pendiente' && t.fecha_limite && t.fecha_limite < hoyISO);
  if (venc.length) items.push({ cls:'urgent', icon:'ti-alert-circle', text:`${venc.length} tarea${venc.length>1?'s':''} vencida${venc.length>1?'s':''}: ${venc.slice(0,2).map(t=>t.titulo).join(', ')}` });

  // Tareas para hoy
  const paraHoy = S.cache.tasks.filter(t => t.estado==='pendiente' && t.fecha_limite === hoyISO);
  if (paraHoy.length) items.push({ cls:'warn', icon:'ti-clock', text:`${paraHoy.length} tarea${paraHoy.length>1?'s':''} para hoy: ${paraHoy.slice(0,2).map(t=>t.titulo).join(', ')}` });

  // Lotes con ciclo por vencer (< 7 días)
  S.cache.lotes.forEach(l => {
    if (!l.fecha_siembra || !l.ciclo_dias) return;
    const diasTrans = diasDesde(l.fecha_siembra);
    const diasRest = l.ciclo_dias - diasTrans;
    if (diasRest >= 0 && diasRest <= 7) items.push({ cls:'warn', icon:'ti-plant', text:`Lote ${l.codigo} (${l.cultivo}) en ${diasRest === 0 ? 'cosecha HOY' : diasRest+' días para cosecha'}` });
    if (diasRest < 0) items.push({ cls:'urgent', icon:'ti-plant-off', text:`Lote ${l.codigo}: ciclo vencido hace ${Math.abs(diasRest)} días` });
  });

  // Lotes activos sin fumigación reciente (> 15 días)
  S.cache.lotes.filter(l => ['vegetativo','producción'].includes(l.estado)).forEach(l => {
    const lastFumig = S.cache.activities.filter(a => a.lote?.codigo === l.codigo && /fumig|aplica|fungic|insect/i.test(a.actividad||'')).sort((a,b) => tsOrden(b.fecha)-tsOrden(a.fecha))[0];
    if (!lastFumig) { items.push({ cls:'info', icon:'ti-spray', text:`Lote ${l.codigo}: sin fumigaciones registradas` }); return; }
    const dias = diasDesde(lastFumig.fecha);
    if (dias > 15) items.push({ cls:'info', icon:'ti-spray', text:`Lote ${l.codigo}: ${dias} días sin fumigación` });
  });

  // Plagas activas severas
  const plagasSev = (S.cache.plagas||[]).filter(p=>p.activa && p.severidad==='severa');
  if (plagasSev.length) items.push({ cls:'urgent', icon:'ti-bug', text:`Plaga severa activa: ${plagasSev.map(p=>`${p.tipo} en ${p.lote?.codigo||'finca'}`).join(', ')}` });
  const plagasMod = (S.cache.plagas||[]).filter(p=>p.activa && p.severidad==='moderada');
  if (plagasMod.length) items.push({ cls:'warn', icon:'ti-bug', text:`${plagasMod.length} plaga${plagasMod.length>1?'s':''} moderada${plagasMod.length>1?'s':''}: ${plagasMod.map(p=>p.tipo).join(', ')}` });

  if (!items.length) items.push({ cls:'ok', icon:'ti-mood-happy', text:'Todo en orden. Sin alertas pendientes.' });

  return `<div class="proactive-panel">
    <div class="proactive-greeting">${greeting}, ${S.user?.display||''}</div>
    <div class="proactive-sub">Resumen operativo · Finca El Retiro</div>
    <div class="proactive-items">${items.slice(0,5).map(i => `<div class="proactive-item ${i.cls}"><i class="ti ${i.icon}"></i><span>${i.text}</span></div>`).join('')}</div>
  </div>`;
}

            ${otros>0?`<div class="inv-stat">Otros<b style="color:var(--rd)">${fmtMoney(otros)}</b></div>`:''}
            <div class="inv-stat active">Total<b>${fmtMoney(total)}</b></div>
          </div>
        </div>`;
        // Insumos aplicados
        h += `<div class="sec-t mt12"><span><i class="ti ti-spray"></i> Insumos aplicados</span><span class="text-tiny">${fmtMoney(totInsumos)}</span></div>`;
        h += consumos.length ? `<div class="card" style="padding:4px 14px">${consumos.slice(0,12).map(c=>`<div class="mini-list-item"><div class="icon-pill ip-blue" style="width:28px;height:28px;font-size:14px"><i class="ti ti-droplet"></i></div><div class="mini-list-body"><div class="mini-list-title">${esc(c.concepto)}</div><div class="mini-list-meta"><span><i class="ti ti-calendar"></i> ${fmtDate(c.fecha_compra)}</span></div></div><div style="font-weight:700;color:var(--rd);flex-shrink:0">${fmtMoney(c.valor_total)}</div><div class="row gap6" style="flex-shrink:0"><button class="btn btn-sm btn-ghost" onclick="flowEditConsumo('${c.id}')" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button><button class="btn btn-sm btn-ghost" onclick="flowDeleteConsumo('${c.id}')" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button></div></div>`).join('')}</div>` : `<div class="text-tiny" style="padding:6px 0;color:var(--tx3)">Sin insumos aplicados aún. Usa un producto de bodega y elige este lote.</div>`;
        // Jornales
        h += `<div class="sec-t mt12"><span><i class="ti ti-users"></i> Jornales</span><span class="text-tiny">${fmtMoney(totJorn)}</span></div>`;
        h += jornL.length ? `<div class="card" style="padding:4px 14px">${jornL.slice(0,12).map(j=>`<div class="mini-list-item"><div class="icon-pill ip-brown" style="width:28px;height:28px;font-size:14px"><i class="ti ti-user"></i></div><div class="mini-list-body"><div class="mini-list-title">${esc(j.trabajador)}</div><div class="mini-list-meta"><span>${j.dias} día(s) × ${fmtMoney(j.valor_dia)}</span><span><i class="ti ti-calendar"></i> ${fmtFecha(j.fecha)}</span>${j.nota?`<span>${esc(j.nota)}</span>`:''}</div></div><div style="font-weight:700;color:var(--rd);flex-shrink:0">${fmtMoney(j.valor_total)}</div><div class="row gap6" style="flex-shrink:0"><button class="btn btn-sm btn-ghost" onclick="flowEditJornal('${j.id}')" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button><button class="btn btn-sm btn-ghost" onclick="flowDeleteJornal('${j.id}')" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button></div></div>`).join('')}</div>` : `<div class="text-tiny" style="padding:6px 0;color:var(--tx3)">Sin jornales registrados. Toca el botón Jornal arriba.</div>`;
        return h;
      })()}
      <div class="panel-h"><div class="sec-t" style="margin:0"><span><i class="ti ti-clock"></i> Pendientes (${pend.length})</span></div><div class="row gap6" style="flex-wrap:wrap;justify-content:flex-end"><button class="btn btn-sm btn-blue" onclick="flowMapaLote('${l.id}','${l.codigo}')"><i class="ti ti-map-pin"></i> Mapa</button><button class="btn btn-sm btn-yellow" id="btn-new-task"><i class="ti ti-plus"></i> Tarea</button><button class="btn btn-sm btn-soft" id="btn-new-apunte"><i class="ti ti-edit"></i> Labor</button><button class="btn btn-sm btn-brown" onclick="flowNuevoJornal('${l.id}')" style="background:var(--p-brown);color:#7A4A08;border-color:#E8C99A"><i class="ti ti-user"></i> Jornal</button></div></div>
      <div class="card">${pend.length ? pend.map(t => {
        const tit = escA(t.titulo||'');
        return `<div class="task-row" id="task-row-${t.id}"><div class="task-check" data-complete-task="${t.id}"><i class="ti ti-check"></i></div><div class="task-row-body"><div class="task-row-title">${esc(t.titulo)}</div><div class="task-row-meta"><span><i class="ti ti-calendar"></i> ${t.fecha_limite ? fmtFecha(t.fecha_limite) : 'Sin fecha'}</span></div></div><div class="row gap6" style="flex-shrink:0"><button class="btn btn-sm btn-ghost" onclick="flowEditTask('${t.id}')" style="padding:4px;border:none"><i class="ti ti-edit"></i></button><button class="btn btn-sm btn-ghost" onclick="flowDeleteTask('${t.id}','${tit}')" style="color:var(--tx3);padding:4px;border:none"><i class="ti ti-trash"></i></button></div></div>`;
      }).join('') : emptyState('ti-checks','Lote al día','Sin tareas pendientes.')}</div>
      <div class="sec-t mt12"><span><i class="ti ti-notebook"></i> Bitácora del lote</span></div>
      <div class="card">${bit.length ? bit.map(b => {
        const actEsc = escA(b.actividad||'');
        return `<div class="mini-list-item"><div class="mini-list-dot done"></div><div class="mini-list-body"><div class="mini-list-title">${esc(b.actividad)}</div><div class="mini-list-meta"><span><i class="ti ti-calendar"></i> ${fmtDate(b.fecha)}</span><span><i class="ti ti-user"></i> ${b.responsable?.nombre_corto || '—'}</span></div></div><div class="row gap6" style="flex-shrink:0"><button class="btn btn-sm btn-ghost" onclick="flowEditActivity('${b.id}','${actEsc}')" style="padding:4px;border:none"><i class="ti ti-edit"></i></button><button class="btn btn-sm btn-ghost" onclick="flowDeleteActivity('${b.id}')" style="color:var(--rd);padding:4px;border:none"><i class="ti ti-trash"></i></button></div></div>`;
      }).join('') : emptyState('ti-notebook','Sin registros','Aún no hay labores anotadas.')}</div>
      <div class="sec-t mt12"><span><i class="ti ti-basket"></i> Cosechas</span><button class="btn btn-sm btn-soft" onclick="flowNuevaCosecha('${l.id}','${escA(l.codigo||'')}')" style="font-size:10px;padding:3px 8px"><i class="ti ti-plus"></i> Cosecha</button></div>
      ${(() => {
        const cs = (S.cache.cosechas||[]).filter(c => c.lote_id === l.id);
        if (!cs.length) return `<div class="text-tiny" style="padding:6px 0;color:var(--tx3)">Sin cosechas registradas en este lote.</div>`;
        const totalKg = cs.reduce((a,c)=>a+(parseFloat(c.volumen_kg)||0),0);
        const costoL = (S.cache.compras||[]).filter(c=>c.lote_id===l.id).reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
        const resumen = `<div class="map-dims" style="margin-bottom:8px"><div><b>${totalKg.toLocaleString('es-CO')} kg</b>Cosechado</div>${costoL>0?`<div><b>${fmtMoney(costoL/totalKg)}</b>Costo por kg</div><div><b>${fmtMoney(costoL)}</b>Invertido</div>`:''}</div>`;
        return resumen + `<div class="card" style="padding:4px 14px">${cs.slice(0,8).map(c=>`<div class="mini-list-item"><div class="mini-list-dot done"></div><div class="mini-list-body"><div class="mini-list-title">${c.volumen_kg} kg · ${esc(c.calidad||'normal')}</div><div class="mini-list-meta"><span><i class="ti ti-calendar"></i> ${fmtFecha(c.fecha_recoleccion)}</span>${c.observaciones?`<span>${esc(c.observaciones)}</span>`:''}</div></div><div class="row gap6" style="flex-shrink:0"><button class="btn btn-sm btn-ghost" onclick="flowEditCosecha('${c.id}')" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button><button class="btn btn-sm btn-ghost" onclick="flowDeleteCosecha('${c.id}')" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button></div></div>`).join('')}</div>`;
      })()}
      <div class="sec-t mt12"><span><i class="ti ti-photo"></i> Fotos del lote</span><div class="row gap6"><button class="btn btn-sm btn-soft" onclick="flowGaleria('${l.id}')" style="font-size:10px;padding:3px 8px"><i class="ti ti-photo"></i> Ver todas</button><button class="btn btn-sm btn-yellow" onclick="flowNuevaFoto('${l.id}')" style="font-size:10px;padding:3px 8px"><i class="ti ti-camera"></i> Foto</button></div></div>
      ${(() => {
        const fs = (S.cache.fotos||[]).filter(f => f.lote_id === l.id).slice(0,6);
        return fs.length ? `<div class="galeria-grid">${fs.map(f => `<img class="galeria-thumb" loading="lazy" src="${esc(f.url)}" onclick="flowVerFoto('${f.id}')">`).join('')}</div>` : `<div class="text-tiny" style="padding:6px 0;color:var(--tx3)">Sin fotos de este lote aún.</div>`;
      })()}
      <div class="sec-t mt12"><span><i class="ti ti-bug"></i> Plagas activas en este lote</span><button class="btn btn-sm btn-red" onclick="flowNuevaPlaga()" style="font-size:10px;padding:3px 8px"><i class="ti ti-plus"></i> Nueva</button></div>
      ${(() => {
        const pl = S.cache.plagas.filter(p=>p.activa && p.lote_id===l.id);
        if (!pl.length) return `<div class="text-tiny" style="padding:8px 0;color:var(--tx3)"><i class="ti ti-circle-check" style="color:var(--g)"></i> Sin plagas activas en este lote.</div>`;
        return pl.map(p=>`<div class="plaga-card ${p.severidad||'leve'}" style="margin-bottom:6px">
          <div class="plaga-header"><div class="plaga-icon ${p.severidad||'leve'}"><i class="ti ti-bug"></i></div>
          <div style="flex:1"><div class="plaga-title">${esc(p.tipo)}</div><div class="plaga-meta"><span>${fmtFecha(p.fecha_deteccion)}</span></div></div>
          <span class="plaga-badge ${p.severidad||'leve'}">${p.severidad||'leve'}</span></div>
          ${p.descripcion?`<div class="plaga-desc">${clampHTML(p.descripcion,{limit:110})}</div>`:''}
          <div style="margin-top:6px;display:flex;gap:6px;justify-content:flex-end">
            <button class="btn btn-sm btn-ghost" onclick="flowControlarPlaga('${p.id}','${escA(p.tipo||'')}','${escA(l.codigo)}')" style="padding:4px 8px;font-size:11px"><i class="ti ti-spray"></i> Controlar</button>
            <button class="btn btn-sm btn-ghost" onclick="flowCerrarPlaga('${p.id}','${escA(p.tipo||'')}')" style="color:var(--g);padding:4px;border:none"><i class="ti ti-circle-check"></i></button>
          </div>
        </div>`).join('');
      })()}
    </div>`;
  }
  // Lista de lotes con progreso de ciclo
  return `<div class="panel">
    <div class="panel-h"><div class="panel-title">Lotes</div><div class="row gap6"><button class="btn btn-sm btn-soft" onclick="flowGestionCiclos()"><i class="ti ti-plant-2"></i> Ciclos</button><button class="btn btn-sm btn-primary" id="btn-new-lote"><i class="ti ti-plus"></i> Crear</button></div></div>
    ${S.cache.lotes.length ? S.cache.lotes.map(l => {
      let cicloMini = '';
      if (l.fecha_siembra && l.ciclo_dias){
        const diasTrans = diasDesde(l.fecha_siembra);
        const pct = Math.min(100, Math.round((diasTrans / l.ciclo_dias)*100));
        const diasRest = Math.max(0, l.ciclo_dias - diasTrans);
        cicloMini = `<div class="ciclo-bar" style="margin-top:8px"><div class="ciclo-bar-fill" style="width:${pct}%"></div></div><div class="ciclo-info"><span>Día ${diasTrans} de ${l.ciclo_dias}</span><span>${diasRest > 0 ? diasRest+' días para cosecha' : '⚠️ Ciclo vencido'}</span></div>`;
      } else if (l.fecha_siembra){
        const diasTrans = diasDesde(l.fecha_siembra);
        cicloMini = `<div class="text-tiny" style="margin-top:4px"><i class="ti ti-calendar"></i> Siembra: ${fmtFecha(l.fecha_siembra)} · ${diasTrans} días</div>`;
      }
      return `<div class="card lote-card" data-lote="${l.codigo}">
        <div class="lote-card-row">
          <div class="icon-pill ip-green"><i class="ti ti-plant"></i></div>
          <div class="lote-card-body">
            <div class="lote-card-title">${esc(l.codigo)} · ${esc(l.cultivo)}</div>
            <div class="lote-card-sub">${l.variedad?esc(l.variedad)+' · ':''}<span class="badge bg-yellow">${esc(l.estado)}</span></div>
            ${cicloMini}
          </div>
          <div class="row gap6" style="flex-shrink:0" onclick="event.stopPropagation()">
            <button class="btn btn-sm btn-ghost" onclick="flowEditLote('${l.id}')" style="padding:5px;border:none" title="Editar lote"><i class="ti ti-edit"></i></button>
            <button class="btn btn-sm btn-ghost" onclick="flowDeleteLote('${l.id}','${escA(l.codigo||'')}')" style="color:var(--rd);padding:5px;border:none" title="Borrar lote"><i class="ti ti-trash"></i></button>
          </div>
          <i class="ti ti-chevron-right lote-card-chev"></i>
        </div>
      </div>`;
    }).join('') : emptyState('ti-plant', 'Sin lotes', 'Crea tu primer lote.')}
  </div>`;
}

window.flowHistorialLote = function(loteId){
  const l = S.cache.lotes.find(x => x.id == loteId); if (!l) return;
  const comprasRaw = (S.cache.compras||[]).filter(c => c.lote_id === loteId);
  const jornalesRaw = (S.cache.jornales||[]).filter(j => j.lote_id === loteId)
    .map(j => ({ id:j.id, concepto:`Jornal: ${j.trabajador} (${j.dias} día${parseFloat(j.dias)>1?'s':''})`, valor_total:j.valor_total, fecha_compra:j.fecha, categoria:'jornales', _jornal:true }));
  const comprasL = [...comprasRaw, ...jornalesRaw].sort((a,b)=> tsOrden(b.fecha_compra) - tsOrden(a.fecha_compra));
  const consumos = comprasRaw.filter(c => c.origen === 'consumo');
  const totInsumos = consumos.reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
  const totJorn = jornalesRaw.reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
  const otros = comprasRaw.filter(c=>c.origen!=='consumo').reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
  const total = totInsumos + totJorn + otros;
  const cosechado = (S.cache.cosechas||[]).filter(c=>c.lote_id===loteId).reduce((a,c)=>a+(parseFloat(c.volumen_kg)||0),0);

  const icono = (c) => c._jornal ? ['ip-brown','ti-user'] : c.origen==='consumo' ? ['ip-blue','ti-droplet'] : ['ip-red','ti-shopping-cart'];
  const fnEdit = (c) => c._jornal ? `flowEditJornal('${c.id}')` : c.origen==='consumo' ? `flowEditConsumo('${c.id}')` : `flowEditGasto('${c.id}','${escA(c.concepto||'')}',${c.valor_total},'${escA(c.categoria||'otro')}')`;
  const fnDel  = (c) => c._jornal ? `flowDeleteJornal('${c.id}')` : c.origen==='consumo' ? `flowDeleteConsumo('${c.id}')` : `flowDeleteGasto('${c.id}','${escA(c.concepto||'')}')`;

  const filas = comprasL.length ? comprasL.map(c => {
    const [ip,ic] = icono(c);
    const ed = fnEdit(c);
    return `<div class="mini-list-item"><div class="icon-pill ${ip}" style="width:30px;height:30px"><i class="ti ${ic}"></i></div>
      <div class="mini-list-body"><div class="mini-list-title">${esc(c.concepto)}</div><div class="mini-list-meta"><span><i class="ti ti-calendar"></i> ${fmtDate(c.fecha_compra)}</span>${c.categoria?`<span>${esc(c.categoria)}</span>`:''}</div></div>
      <div style="font-weight:700;color:var(--rd);flex-shrink:0;font-feature-settings:'tnum'">${fmtMoney(c.valor_total)}</div>
      <div class="row gap6" style="flex-shrink:0">${ed?`<button class="btn btn-sm btn-ghost" onclick="${ed}" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button>`:''}<button class="btn btn-sm btn-ghost" onclick="${fnDel(c)}" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button></div>
    </div>`;
  }).join('') : `<div class="text-tiny" style="padding:10px;text-align:center">Sin movimientos en este lote.</div>`;

  const html = `<div class="modal-h"><i class="ti ti-plant"></i> ${esc(l.codigo)} · ${esc(l.cultivo)}</div>
    <div class="map-dims" style="margin-bottom:12px"><div><b>${fmtMoney(totInsumos)}</b>Insumos</div><div><b>${fmtMoney(totJorn)}</b>Jornales</div>${otros>0?`<div><b>${fmtMoney(otros)}</b>Otros</div>`:''}<div><b>${fmtMoney(total)}</b>Total</div></div>
    ${cosechado>0?`<div class="spec-box" style="margin-bottom:12px"><b>Producido:</b> ${cosechado.toLocaleString('es-CO')} kg · <b>Costo por kilo:</b> ${fmtMoney(total/cosechado)}</div>`:''}
    <div class="sec-t" style="margin-bottom:8px"><span>Movimientos (${comprasL.length})</span></div>
    <div class="card" style="padding:4px 14px;max-height:46vh;overflow-y:auto">${filas}</div>
    <div class="modal-actions" style="margin-top:12px"><button class="btn btn-primary btn-block" id="m-hl-close">Cerrar</button></div>`;
  const p = M._open(html);
  document.getElementById('m-hl-close').onclick = () => M._close(null);
  return p;
};

function renderDinero(){
  /* Los registros origen='consumo' son costo interno por lote: la plata ya salió al comprar el insumo, no se vuelven a sumar a egresos */
  const totalEgresos = egresosTotales();
  const totalIngresos = S.cache.ingresos.reduce((acc, c) => acc + (parseFloat(c.valor_total) || 0), 0);
  const balance = totalIngresos - totalEgresos;

  /* Costo acumulado por lote: compras + consumos + jornales (centralizado) */
  const costoPorLote = {};
  S.cache.lotes.forEach(l => { const c = costoLote(l.id); if (c>0) costoPorLote[l.id] = c; });
  const lotesConCosto = S.cache.lotes.filter(l => costoPorLote[l.id] > 0);
  const loteCostHtml = lotesConCosto.length ? `<div class="card" style="margin-top:12px;padding:10px 14px">
    <div class="sec-t" style="margin:0 0 6px"><span><i class="ti ti-plant"></i> Costo acumulado por lote</span></div>
    ${lotesConCosto.map(l => `<div class="lote-cost-row" style="cursor:pointer" onclick="flowHistorialLote('${l.id}')"><span><b>${esc(l.codigo)}</b> · ${esc(l.cultivo)}</span><span style="display:flex;align-items:center;gap:6px"><span style="font-weight:700;font-feature-settings:'tnum';color:var(--br)">${fmtMoney(costoPorLote[l.id])}</span><i class="ti ti-chevron-right" style="color:var(--tx3)"></i></span></div>`).join('')}
  </div>` : '';

  const ultimos = [
    ...S.cache.compras.map(c => ({tipo:'gasto', id:c.id, concepto:c.concepto, valor:c.valor_total, fecha:c.fecha_compra, categoria:c.categoria, origen:c.origen, lote_id:c.lote_id})),
    ...S.cache.jornales.map(j => ({tipo:'jornal', id:j.id, concepto:`Jornal: ${j.trabajador} (${j.dias} día${parseFloat(j.dias)>1?'s':''})`, valor:j.valor_total, fecha:j.fecha, categoria:'jornales', lote_id:j.lote_id})),
    ...S.cache.ingresos.map(i => ({tipo:'ingreso', id:i.id, concepto:i.concepto, valor:i.valor_total, fecha:i.fecha}))
  ].sort((a,b) => tsOrden(b.fecha) - tsOrden(a.fecha)).slice(0, 25);

  const movList = ultimos.length ? ultimos.map(m => {
    const conEsc = escA(m.concepto||'');
    const esConsumo = m.origen === 'consumo';
    const loteCod = esConsumo && m.lote_id ? (S.cache.lotes.find(l=>l.id==m.lote_id)?.codigo||'') : '';
    const editFn = m.tipo==='jornal' ? `flowEditJornal('${m.id}')` : m.tipo==='gasto' ? `flowEditGasto('${m.id}','${conEsc}',${m.valor},'${escA(m.categoria||'otro')}')` : `flowEditIngreso('${m.id}','${conEsc}',${m.valor})`;
    const delFn  = m.tipo==='jornal' ? `flowDeleteJornal('${m.id}')` : m.tipo==='gasto' ? `flowDeleteGasto('${m.id}','${conEsc}')` : `flowDeleteIngreso('${m.id}','${conEsc}')`;
    const esJornal = m.tipo==='jornal';
    return `<div class="mini-list-item">
      <div class="icon-pill ${esConsumo?'ip-blue':esJornal?'ip-brown':(m.tipo==='gasto'?'ip-red':'ip-green')}"><i class="ti ${esConsumo?'ti-droplet':esJornal?'ti-user':(m.tipo==='gasto'?'ti-arrow-down':'ti-arrow-up')}"></i></div>
      <div class="mini-list-body">
        <div class="mini-list-title">${esc(m.concepto)}</div>
        <div class="mini-list-meta"><span>${fmtDate(m.fecha)}</span>${m.categoria?`<span>${esc(m.categoria)}</span>`:''}${esConsumo?`<span class="badge bg-blue" style="font-size:9px;padding:1px 6px">costo lote${loteCod?' '+esc(loteCod):''}</span>`:''}</div>
      </div>
      <div style="font-weight:700;color:${esConsumo?'var(--bl)':esJornal?'var(--br)':(m.tipo==='gasto'?'var(--rd)':'var(--g)')};font-feature-settings:'tnum';flex-shrink:0">${fmtMoney(m.valor)}</div>
      <div class="row gap6" style="flex-shrink:0;margin-left:4px">
        <button class="btn btn-sm btn-ghost" onclick="${editFn}" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="${delFn}" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('') : emptyState('ti-coin', 'Sin movimientos', 'Registra tu primer gasto o ingreso.');

  return `<div class="panel">
    <div class="panel-h"><div class="panel-title">Dinero</div></div>
    <div class="finanzas-header">
      <div class="fin-box fin-egresos"><div class="fin-box-t">Egresos</div><div class="fin-box-v" style="color:var(--rd)">${fmtMoney(totalEgresos)}</div></div>
      <div class="fin-box fin-ingresos"><div class="fin-box-t">Ingresos</div><div class="fin-box-v" style="color:var(--g)">${fmtMoney(totalIngresos)}</div></div>
    </div>
    <div class="balance-card"><div class="balance-label">Balance real</div><div class="balance-val" style="color:${balance>=0?'var(--g)':'var(--rd)'}">${fmtMoney(balance)}</div></div>
    ${loteCostHtml}
    <div class="row gap8 mt12"><button class="btn btn-red flex1" id="btn-add-gasto"><i class="ti ti-minus"></i> Gasto</button><button class="btn btn-yellow flex1" onclick="flowNuevoJornal()"><i class="ti ti-user"></i> Jornal</button><button class="btn btn-primary flex1" id="btn-add-ingreso"><i class="ti ti-plus"></i> Ingreso</button></div>
    <div class="sec-t mt12"><span><i class="ti ti-history"></i> Últimos movimientos</span></div>

/* ═══════════════════════════════════════════════════════════════
   BODEGA (REDISEÑO CON CARPETAS Y RESCATE DE ANTIGUOS)
   ═══════════════════════════════════════════════════════════════ */
window._bodegaFilter = function(q){
  const res = document.getElementById('bodega-search-results');
  const folders = document.getElementById('bodega-folders');
  if (!res || !folders) return;
  q = (q||'').trim().toLowerCase();
  if (q.length < 2){ res.innerHTML=''; folders.style.display=''; return; }
  folders.style.display = 'none';
  const matches = S.cache.inventory.filter(i =>
    (i.descripcion||'').toLowerCase().includes(q) || (i.detalles||'').toLowerCase().includes(q) || (i.subcategoria||'').toLowerCase().includes(q)
  ).sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'', 'es'));
  res.innerHTML = matches.length ? matches.map(i => renderItemCard(i)).join('') : emptyState('ti-search-off','Sin resultados',`Nada en bodega coincide con "${esc(q)}"`);
};

function renderBodega(){
  if (S.activeBodegaCat) return renderBodegaDetalle(S.activeBodegaCat);

  const totalItems = S.cache.inventory.length;
  let html = `<div class="panel">
    <div class="panel-h"><div class="panel-title">Bodega</div><button class="btn btn-sm btn-primary" onclick="flowNewInsumo()"><i class="ti ti-plus"></i> Insumo manual</button></div>
    <div class="search-box" style="margin-bottom:12px"><input id="bodega-search" placeholder="Buscar producto en bodega..." oninput="_bodegaFilter(this.value)" autocomplete="off"><button class="search-btn" style="pointer-events:none"><i class="ti ti-search"></i></button></div>
    <div id="bodega-search-results"></div>
    <div id="bodega-folders">
    <div class="bodega-folder" onclick="abrirBodegaCat('__TODOS__')" style="margin-bottom:10px;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px">
       <div class="icon-pill ip-green" style="margin:0;width:44px;height:44px;font-size:22px"><i class="ti ti-list-letters"></i></div>
       <div style="flex:1"><div class="bodega-folder-title">Todo en bodega</div><div class="text-tiny" style="margin-top:2px">${totalItems} productos de la A a la Z</div></div>
       <i class="ti ti-chevron-right" style="color:var(--tx3)"></i>
    </div>
    <div class="bodega-grid">`;

  // Renderizar las carpetas principales (con conteo y valor total)
  for(const [cat, data] of Object.entries(BODEGA_STRUCT)){
    const its = S.cache.inventory.filter(i => i.categoria === cat);
    const comp = its.reduce((a,i)=>a+compradoInv(i),0);
    html += `<div class="bodega-folder" onclick="abrirBodegaCat('${cat}')">
       <div class="icon-pill ip-${data.color}"><i class="ti ${data.icon}"></i></div>
       <div class="bodega-folder-title">${data.name}</div>
       <div class="text-tiny" style="margin-top:6px;font-weight:600;color:var(--tx3)">${its.length} INSUMOS</div>
       ${comp>0?`<div class="text-tiny" style="margin-top:2px;color:var(--br);font-weight:700" title="Total comprado">${fmtMoney(comp)}</div>`:''}
    </div>`;
  }

  // RESCATE AUTOMÁTICO DE DATOS VIEJOS: 
  const oldItems = S.cache.inventory.filter(i => !BODEGA_STRUCT[i.categoria]);
  if(oldItems.length > 0){
    html += `<div class="bodega-folder" onclick="abrirBodegaCat('Otros')">
       <div class="icon-pill ip-gray"><i class="ti ti-archive"></i></div>
       <div class="bodega-folder-title">Otros / Antiguos</div>
       <div class="text-tiny" style="margin-top:6px;font-weight:600;color:var(--tx3)">${oldItems.length} INSUMOS</div>
    </div>`;
  }

  html += `</div></div></div>`;
  return html;
}

window.abrirBodegaCat = function(cat){
  S.activeBodegaCat = cat;
  S.activeBodegaSub = null;
  Nav.push();
  render();
};

function renderBodegaDetalle(cat){
  if (cat === '__TODOS__') {
    const items = [...S.cache.inventory].sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'', 'es'));
    let html = `<div class="panel">
      <button class="lote-back" onclick="S.activeBodegaCat=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> Volver a categorías</button>
      <div class="panel-h" style="margin-top:12px">
        <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-green" style="width:34px;height:34px"><i class="ti ti-list-letters" style="font-size:18px"></i></div>Todo en bodega (${items.length})</div>
      </div>`;
    if (!items.length) html += emptyState('ti-package','Bodega vacía','Registra tu primer insumo.');
    else {
      let letra = '';
      items.forEach(i => {
        const ini = ((i.descripcion||'?')[0]||'?').toUpperCase();
        if (ini !== letra){ letra = ini; html += `<div class="sec-t mt12" style="font-size:13px;color:var(--g)"><span>${esc(letra)}</span></div>`; }
        html += renderItemCard(i);
      });
    }
    return html + `</div>`;
  }
  if (cat === 'Otros') {
    const items = S.cache.inventory.filter(i => !BODEGA_STRUCT[i.categoria]);
    let html = `<div class="panel">
      <button class="lote-back" onclick="S.activeBodegaCat=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> Volver a categorías</button>
      <div class="panel-h" style="margin-top:12px">
        <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-gray" style="width:34px;height:34px"><i class="ti ti-archive" style="font-size:18px"></i></div>Otros / Antiguos</div>
      </div>`;
    items.forEach(i => html += renderItemCard(i));
    return html + `</div>`;
  }

  const data = BODEGA_STRUCT[cat] || { name: cat, icon:'ti-package', color:'gray', subs:[] };
  const items = S.cache.inventory.filter(i => i.categoria === cat);

  // ── NIVEL 3: una subcategoría abierta → solo sus productos ──
  if (S.activeBodegaSub){
    const sub = S.activeBodegaSub;
    const subItems = (sub === '__SINCLAS__')
      ? items.filter(i => !data.subs.includes(subcatActual(i.subcategoria))).sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'','es'))
      : items.filter(i => subcatActual(i.subcategoria) === sub).sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'','es'));
    const subNom = sub === '__SINCLAS__' ? 'Sin clasificar' : sub;
    let html = `<div class="panel">
      <button class="lote-back" onclick="S.activeBodegaSub=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> ${esc(data.name)}</button>
      <div class="panel-h" style="margin-top:12px">
        <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-${data.color}" style="width:30px;height:30px"><i class="ti ${data.icon}" style="font-size:16px"></i></div>${esc(subNom)}</div>
        <button class="btn btn-sm btn-primary" onclick="flowNewInsumo('${cat}', ${JSON.stringify({sub: sub==='__SINCLAS__'?'':sub}).replace(/"/g,'&quot;')})"><i class="ti ti-plus"></i> Añadir</button>
      </div>`;
    if (!subItems.length) html += emptyState('ti-package','Sin productos','Aún no hay insumos en esta subcategoría.');
    else subItems.forEach(i => html += renderItemCard(i));
    return html + `</div>`;
  }

  // ── NIVEL 2: la categoría → sus subcategorías como carpetas (todas a la vista) ──
  const valorCat = items.reduce((a,i)=>a+valorInv(i),0);
  const compradoCat = items.reduce((a,i)=>a+compradoInv(i),0);
  let html = `<div class="panel">
    <button class="lote-back" onclick="S.activeBodegaCat=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> Volver a categorías</button>
    <div class="panel-h" style="margin-top:12px">
      <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-${data.color}" style="width:34px;height:34px"><i class="ti ${data.icon}" style="font-size:18px"></i></div>${data.name}</div>
      <button class="btn btn-sm btn-primary" onclick="flowNewInsumo('${cat}')"><i class="ti ti-plus"></i> Añadir</button>
    </div>
    ${(compradoCat>0||valorCat>0)?`<div class="map-dims" style="margin-bottom:10px"><div><b>${items.length}</b>Productos</div><div><b>${fmtMoney(compradoCat)}</b>Comprado</div><div><b>${fmtMoney(valorCat)}</b>En bodega</div></div>`:''}`;

  data.subs.forEach(sub => {
    const subItems = items.filter(i => subcatActual(i.subcategoria) === sub);
    const valor = subItems.reduce((a,i)=>a+compradoInv(i),0);
    const vacia = subItems.length === 0;
    html += `<div class="bodega-folder" onclick="abrirBodegaSub('${escA(sub)}')" style="margin-bottom:8px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;${vacia?'opacity:.55':''}">
       <div class="icon-pill ip-${data.color}" style="margin:0;width:38px;height:38px;font-size:18px"><i class="ti ${data.icon}"></i></div>
       <div style="flex:1"><div class="bodega-folder-title" style="font-size:14px">${esc(sub)}</div><div class="text-tiny" style="margin-top:2px">${vacia?'vacía':`${subItems.length} prod${valor>0?' · comprado '+fmtMoney(valor):''}`}</div></div>
       <i class="ti ti-chevron-right" style="color:var(--tx3)"></i>
    </div>`;
  });
  // Sin clasificar (productos cuya subcategoría no está en la lista oficial)
  const sinClas = items.filter(i => !data.subs.includes(subcatActual(i.subcategoria)));
  if (sinClas.length){
    const valor = sinClas.reduce((a,i)=>a+valorInv(i),0);
    html += `<div class="bodega-folder" onclick="abrirBodegaSub('__SINCLAS__')" style="margin-bottom:8px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px">
       <div class="icon-pill ip-gray" style="margin:0;width:38px;height:38px;font-size:18px"><i class="ti ti-help-circle"></i></div>
       <div style="flex:1"><div class="bodega-folder-title" style="font-size:14px">Sin clasificar</div><div class="text-tiny" style="margin-top:2px">${sinClas.length} prod${valor>0?' · '+fmtMoney(valor):''}</div></div>
       <i class="ti ti-chevron-right" style="color:var(--tx3)"></i>
    </div>`;
  }
  return html + `</div>`;
}

window.abrirBodegaSub = function(sub){
  S.activeBodegaSub = sub;
  Nav.push();
  render();
};

function renderItemCard(i){
  const ingresado = parseFloat(i.total_ingresado || i.cantidad_actual) || 0, actual = parseFloat(i.cantidad_actual) || 0, consumido = Math.max(0, ingresado - actual), lowStock = actual < (ingresado * 0.15);
  const desc = escA(i.descripcion||'');
  const unit = escA(i.unidad_medida||'');
  const costoU = parseFloat(i.costo_unitario)||0;
  const costoChip = costoU > 0 ? `<span class="costo-chip" title="Costo unitario promedio"><i class="ti ti-coin"></i> ${fmtMoney(costoU)}/${esc(i.unidad_medida||'u')}</span>` : '';
  const ult = parseFloat(i.ultimo_precio)||0;
  let ultLinea = '';
  if (ult > 0){
    const dif = costoU>0 ? (ult>costoU*1.02?'<span style="color:var(--rd)">subió</span>':ult<costoU*0.98?'<span style="color:var(--g)">bajó</span>':'igual') : '';
    ultLinea = `<div class="text-tiny" style="margin:-2px 0 8px"><i class="ti ti-clock"></i> Último: ${fmtMoney(ult)}/${esc(i.unidad_medida||'u')}${i.ultimo_precio_fecha?' · '+fmtFecha(i.ultimo_precio_fecha):''}${dif?' · '+dif:''}</div>`;
  } else if (costoU === 0){
    ultLinea = `<div class="text-tiny" style="margin:-2px 0 8px;color:var(--yl)"><i class="ti ti-coin-off"></i> Sin precio · toca <b>Precio</b> para registrarlo</div>`;
  }
  const franja = franjaChip(i);
  let venceChip = '';
  if (i.fecha_vencimiento){
    const diasV = diasHasta(i.fecha_vencimiento);
    venceChip = diasV < 0 ? `<span class="badge bg-red"><i class="ti ti-alert-triangle"></i> Vencido</span>`
      : diasV <= 30 ? `<span class="badge bg-orange"><i class="ti ti-clock"></i> Vence en ${diasV} d</span>`
      : `<span class="badge bg-yellow"><i class="ti ti-calendar"></i> Vence ${fmtFecha(i.fecha_vencimiento)}</span>`;
  }
  const comprado = compradoInv(i);
  const tieneCosto = costoU > 0 || comprado > 0;
  const filaCostos = tieneCosto ? `<div class="inv-grid" style="grid-template-columns:repeat(2,1fr);margin-top:6px">
      <div class="inv-stat"><span style="color:var(--br)">Comprado</span><b style="color:var(--br)">${fmtMoney(comprado)}</b></div>
      <div class="inv-stat active">En bodega<b>${fmtMoney(actual*costoU)}</b></div>
    </div>` : '';
  const fichaHtml = i.ficha_investigacion
    ? `<div class="ficha-box"><div class="ficha-box-t"><i class="ti ti-microscope"></i> Ficha técnica (IA) <button class="ver-mas" style="margin-left:auto;font-size:10px" onclick="flowInvestigarInsumo('${i.id}')" title="Volver a investigar"><i class="ti ti-refresh"></i></button></div>${clampHTML(i.ficha_investigacion,{limit:150})}</div>`
    : `<button class="btn btn-sm btn-blue" style="margin-bottom:10px" onclick="flowInvestigarInsumo('${i.id}')"><i class="ti ti-world-search"></i> Investigar producto con IA</button>`;
  return `<div class="card">
    <div class="card-h">
      <div class="card-t">${esc(i.descripcion)} ${lowStock?'<span class="badge bg-red">Bajo</span>':''} ${costoChip} ${venceChip} ${franja}</div>
      <div class="row gap6">
        <button class="btn btn-sm btn-ghost" onclick="flowDeleteInventory('${i.id}','${desc}')" style="color:var(--rd);padding:6px;border:none" title="Borrar"><i class="ti ti-trash"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowEditInventory('${i.id}')" style="padding:6px;border:none" title="Editar"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowHistorialInsumo('${i.id}','${desc}')" style="padding:6px;border:none" title="Historial de uso"><i class="ti ti-history"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowSetPrecio('${i.id}')" style="color:var(--yl);padding:6px;border:none" title="Editar precio"><i class="ti ti-coin"></i></button>
        <button class="btn btn-sm btn-blue" onclick="flowRestockInventory('${i.id}','${desc}','${unit}')" title="Reponer stock"><i class="ti ti-plus"></i> Reponer</button>
        <button class="btn btn-sm btn-red" onclick="flowUseInventory('${i.id}','${desc}','${unit}')"><i class="ti ti-minus"></i> Usar</button>
      </div>
    </div>
    ${ultLinea}
    ${i.detalles ? `<div class="spec-box"><b>Especificaciones:</b> ${clampHTML(i.detalles,{limit:120})}</div>` : ''}
    ${fichaHtml}
    <div class="inv-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="inv-stat">Ingresó<b>${ingresado}</b></div>
      <div class="inv-stat">Consumido<b>${consumido}</b></div>
      <div class="inv-stat active">Disponible<b>${actual} ${esc(i.unidad_medida||'')}</b></div>
    </div>
    ${filaCostos}
  </div>`;
}

window.flowEditInventory = async function(id){
  const item = S.cache.inventory.find(x => x.id == id); if (!item) return;
  const catOpts = Object.keys(BODEGA_STRUCT).map(k => `<option value="${k}" ${k===item.categoria?'selected':''}>${BODEGA_STRUCT[k].name}</option>`).join('');
  const subs = BODEGA_STRUCT[item.categoria]?.subs || [];
  const subOpts = subs.map(s => `<option value="${s}" ${s===item.subcategoria?'selected':''}>${s}</option>`).join('');

  const html = `
    <div class="modal-h">Editar Insumo</div>
    <div class="modal-field"><label class="modal-label">Nombre del producto</label><input class="modal-input" id="f-desc" value="${(item.descripcion||'').replace(/"/g,'&quot;')}"></div>
    <div class="modal-field"><label class="modal-label">Categoría</label><select class="modal-select" id="f-cat">${catOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Subcategoría</label><select class="modal-select" id="f-sub">${subOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Especificaciones</label><input class="modal-input" id="f-det" value="${(item.detalles||'').replace(/"/g,'&quot;')}"></div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1"><label class="modal-label">Cantidad disponible</label><input class="modal-input" type="number" id="f-can" value="${item.cantidad_actual}"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad (presentación)</label><input class="modal-input" id="f-uni" value="${item.unidad_medida||''}"></div>
    </div>
    <div class="spec-box" style="margin-bottom:12px;background:#EEF4FC;border-color:#C5DAF2">
      <div style="font-weight:700;color:#185FA5;margin-bottom:6px;font-size:11px"><i class="ti ti-coin"></i> PRECIO — escribe lo que pagaste y la cantidad, la app calcula el costo</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1"><label class="modal-label" style="margin-bottom:3px">Precio total</label><input class="modal-input" type="number" id="f-ptot" inputmode="decimal" placeholder="Ej: 40000"></div>
        <div style="flex:.9"><label class="modal-label" style="margin-bottom:3px">Cantidad</label><input class="modal-input" type="number" id="f-pcan" inputmode="decimal" placeholder="Ej: 1"></div>
        <div style="flex:.9"><label class="modal-label" style="margin-bottom:3px">Unidad</label><select class="modal-select" id="f-puc"></select></div>
      </div>
      <div id="f-pbk-wrap" style="display:none;margin-top:8px"><label class="modal-label" style="margin-bottom:3px">kg por bulto</label><input class="modal-input" type="number" id="f-pbk" placeholder="Ej: 50"></div>
      <div id="f-pprev" class="text-tiny" style="margin-top:8px;color:#185FA5">${parseFloat(item.costo_unitario)>0?`Costo actual: <b>${fmtMoney(item.costo_unitario)}/${esc(item.unidad_medida||'u')}</b> · cámbialo si quieres`:'Déjalo vacío si no quieres tocar el precio.'}</div>
    </div>
    <div class="modal-field"><label class="modal-label">Fecha de vencimiento (opcional)</label><input class="modal-input" type="date" id="f-ven" value="${item.fecha_vencimiento||''}"></div>
    <div class="modal-field"><label class="modal-label">Franja toxicológica</label><select class="modal-select" id="f-fra">
      <option value="">— sin definir —</option>
      <option value="roja" ${item.franja_toxicologica==='roja'?'selected':''}>Roja · muy tóxico</option>
      <option value="amarilla" ${item.franja_toxicologica==='amarilla'?'selected':''}>Amarilla · moderado</option>
      <option value="azul" ${item.franja_toxicologica==='azul'?'selected':''}>Azul · poco tóxico</option>
      <option value="verde" ${item.franja_toxicologica==='verde'?'selected':''}>Verde · bajo riesgo</option>
    </select></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="m-cancel-inv">Cancelar</button><button class="btn btn-primary" id="m-save-inv">Guardar cambios</button></div>`;

  await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const catEl = document.getElementById('f-cat'), subEl = document.getElementById('f-sub');
    catEl.onchange = () => { const s = BODEGA_STRUCT[catEl.value]?.subs||[]; subEl.innerHTML = s.map(x=>`<option value="${x}">${x}</option>`).join(''); };
    // Precio con conversión
    const baseU0 = item.unidad_medida || 'unidad';
    const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto','unidad'];
    const baseN0 = normUnidad(baseU0);
    const ordU = [baseU0, ...opU.filter(u => normUnidad(u)!==baseN0 && u!==baseU0)];
    document.getElementById('f-puc').innerHTML = [...new Set(ordU)].map(u=>`<option value="${u}" ${normUnidad(u)===baseN0?'selected':''}>${u}</option>`).join('');
    const gp = (x)=>document.getElementById(x);
    const calcP = () => {
      const baseU = gp('f-uni').value || baseU0;
      const tot=parseFloat(gp('f-ptot').value)||0, can=parseFloat(gp('f-pcan').value)||0, uc=gp('f-puc').value, bk=parseFloat(gp('f-pbk').value)||0;
      gp('f-pbk-wrap').style.display = normUnidad(uc)==='bulto'?'':'none';
      if (tot>0 && can>0){
        let cb = convertirUnidad(can, uc, baseU, bk); if (cb===null) cb=can;
        const costo = cb>0?tot/cb:0;
        gp('f-pprev').innerHTML = `Costo: <b>${fmtMoney(costo)}/${esc(baseU)}</b>${normUnidad(uc)!==normUnidad(baseU)?` <span style="opacity:.8">(${can} ${esc(uc)} = ${cb.toLocaleString('es-CO',{maximumFractionDigits:2})} ${esc(baseU)})</span>`:''}`;
      }
    };
    ['f-ptot','f-pcan','f-pbk'].forEach(x=>gp(x).addEventListener('input', calcP));
    gp('f-puc').addEventListener('change', calcP);
    const close = val => { document.getElementById('modal-host').innerHTML=''; resolve(val); };
    document.getElementById('modal-host').querySelector('#m-ov').addEventListener('click', e=>{ if(e.target===e.currentTarget) close(null); });
    document.getElementById('m-cancel-inv').onclick = () => close(null);
    document.getElementById('m-save-inv').onclick = async () => {
      const changes = {
        descripcion: document.getElementById('f-desc').value.trim(),
        categoria: document.getElementById('f-cat').value,
        subcategoria: document.getElementById('f-sub').value,
        detalles: document.getElementById('f-det').value.trim(),
        cantidad_actual: parseFloat(document.getElementById('f-can').value)||0,
        unidad_medida: document.getElementById('f-uni').value.trim(),
        fecha_vencimiento: document.getElementById('f-ven').value || null,
        franja_toxicologica: document.getElementById('f-fra').value || null
      };
      if (!changes.descripcion) { toast('Falta el nombre'); return; }
      // Precio (si lo escribió): calcular costo unitario con conversión
      const ptot=parseFloat(document.getElementById('f-ptot').value)||0, pcan=parseFloat(document.getElementById('f-pcan').value)||0, puc=document.getElementById('f-puc').value, pbk=parseFloat(document.getElementById('f-pbk').value)||0;
      if (ptot>0 && pcan>0){
        if (normUnidad(puc)==='bulto' && pbk<=0){ toast('Indica los kg del bulto'); return; }
        let cb = convertirUnidad(pcan, puc, changes.unidad_medida||'unidad', pbk); if (cb===null) cb=pcan;
        const costo = cb>0?ptot/cb:0;
        const totIng = parseFloat(changes.cantidad_actual)||0;
        changes.costo_unitario = costo;
        changes.precio_total = totIng>0 ? costo*totIng : ptot;
        changes.ultimo_precio = costo;
        changes.ultimo_precio_fecha = fechaLocalISO();
      }
      close(null);
      const r = await HANDLERS.edit_inventory(id, changes);
      toast(r.success ? '✅ Insumo actualizado' : r.msg); if (r.success) render();
    };
  });
};

window.flowSetPrecio = async function(id){
  const item = S.cache.inventory.find(x => x.id == id); if (!item) return;
  const base = item.unidad_medida || 'unidad';
  const actual = parseFloat(item.costo_unitario)||0;
  const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto','unidad'];
  // poner la unidad base de primera si está en la lista
  const baseNorm = normUnidad(base);
  const ordU = [base, ...opU.filter(u => normUnidad(u)!==baseNorm && u!==base)];
  const uOpts = [...new Set(ordU)].map(u => `<option value="${esc(u)}" ${normUnidad(u)===baseNorm?'selected':''}>${esc(u)}</option>`).join('');

  const html = `
    <div class="modal-h">Precio de "${esc(item.descripcion)}"</div>
    <div class="modal-sub">Escribe lo que pagaste y cuánto compraste. La app calcula el costo por ${esc(base)} (convirtiendo la unidad si hace falta).</div>
    ${actual>0?`<div class="spec-box" style="margin-bottom:12px">Precio actual: <b>${fmtMoney(actual)}/${esc(base)}</b></div>`:''}
    <div class="modal-field"><label class="modal-label">Precio total pagado</label><input class="modal-input" type="number" id="p-tot" inputmode="decimal" placeholder="Ej: 40000"></div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1.2"><label class="modal-label">Cantidad comprada</label><input class="modal-input" type="number" id="p-can" inputmode="decimal" placeholder="Ej: 1"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad</label><select class="modal-select" id="p-uc">${uOpts}</select></div>
    </div>
    <div class="modal-field" id="p-bk-wrap" style="display:none"><label class="modal-label">¿Cuántos kg trae cada bulto?</label><input class="modal-input" type="number" id="p-bk" inputmode="decimal" placeholder="Ej: 50"></div>
    <div id="p-prev" class="ficha-box" style="display:none"></div>
    <div style="text-align:center;margin-bottom:8px"><button class="ver-mas" id="p-conv"><i class="ti ti-arrows-exchange"></i> Calculadora de conversión</button></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="p-cancel">Cancelar</button><button class="btn btn-primary" id="p-ok">Guardar precio</button></div>`;

  const res = await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const g = (x)=>document.getElementById(x);
    const calc = () => {
      const tot = parseFloat(g('p-tot').value)||0, can = parseFloat(g('p-can').value)||0, uc = g('p-uc').value, bk = parseFloat(g('p-bk').value)||0;
      g('p-bk-wrap').style.display = normUnidad(uc)==='bulto' ? '' : 'none';
      const prev = g('p-prev');
      if (tot>0 && can>0){
        let cantBase = convertirUnidad(can, uc, base, bk);
        if (cantBase === null) cantBase = can; // no convertible → se asume misma unidad
        const costo = cantBase>0 ? tot/cantBase : 0;
        prev.style.display=''; prev.innerHTML = `<i class="ti ti-calculator"></i> Costo: <b>${fmtMoney(costo)}/${esc(base)}</b>${normUnidad(uc)!==normUnidad(base)?` <span class="text-tiny">(${can} ${esc(uc)} = ${cantBase.toLocaleString('es-CO',{maximumFractionDigits:2})} ${esc(base)})</span>`:''}`;
      } else { prev.style.display='none'; }
    };
    ['p-tot','p-can','p-bk'].forEach(x=>g(x).addEventListener('input', calc));
    g('p-uc').addEventListener('change', calc);
    const close = v => { document.getElementById('modal-host').innerHTML=''; resolve(v); };
    document.querySelector('#m-ov').addEventListener('click', e=>{ if(e.target===e.currentTarget) close(null); });
    g('p-cancel').onclick = () => close(null);
    g('p-conv').onclick = () => { close(null); setTimeout(()=>flowConvertirUnidades(),150); };
    g('p-ok').onclick = () => {
      const tot = parseFloat(g('p-tot').value)||0, can = parseFloat(g('p-can').value)||0, uc = g('p-uc').value, bk = parseFloat(g('p-bk').value)||0;
      if (tot<=0 || can<=0){ toast('Escribe el precio total y la cantidad'); return; }
      if (normUnidad(uc)==='bulto' && bk<=0){ toast('Indica cuántos kg trae el bulto'); return; }
      let cantBase = convertirUnidad(can, uc, base, bk);
      if (cantBase === null) cantBase = can;
      close({ costo: cantBase>0 ? tot/cantBase : 0 });
    };
  });
  if (!res) return;
  const r = await HANDLERS.set_precio(id, res.costo);
  toast(r.success ? `✅ Precio: ${fmtMoney(res.costo)}/${base}` : r.msg);
  if (r.success) render();
};

/* Calculadora de conversión de unidades (independiente) */
window.flowConvertirUnidades = async function(){
  const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto'];
  const sel = (idp, def) => `<select class="modal-select" id="${idp}">${opU.map(u=>`<option value="${u}" ${u===def?'selected':''}>${u}</option>`).join('')}</select>`;
  const html = `
    <div class="modal-h"><i class="ti ti-arrows-exchange"></i> Convertir unidades</div>
    <div class="modal-sub">Pasa de una unidad a otra (volumen o peso).</div>
    <div style="display:flex;gap:10px;align-items:flex-end">
      <div class="modal-field" style="flex:1.2"><label class="modal-label">Cantidad</label><input class="modal-input" type="number" id="c-val" inputmode="decimal" placeholder="Ej: 1"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">De</label>${sel('c-de','galon')}</div>
      <div class="modal-field" style="flex:1"><label class="modal-label">A</label>${sel('c-a','litro')}</div>
    </div>
    <div class="modal-field" id="c-bk-wrap" style="display:none"><label class="modal-label">kg por bulto</label><input class="modal-input" type="number" id="c-bk" placeholder="Ej: 50"></div>
    <div id="c-prev" class="ficha-box">Escribe una cantidad…</div>
    <div class="modal-actions"><button class="btn btn-primary btn-block" id="c-close">Cerrar</button></div>`;
  const p = M._open(html);
  const g = (x)=>document.getElementById(x);
  const calc = () => {
    const v = parseFloat(g('c-val').value)||0, de=g('c-de').value, a=g('c-a').value, bk=parseFloat(g('c-bk').value)||0;
    g('c-bk-wrap').style.display = (normUnidad(de)==='bulto'||normUnidad(a)==='bulto') ? '' : 'none';
    if (!v){ g('c-prev').innerHTML='Escribe una cantidad…'; return; }
    const r = convertirUnidad(v, de, a, bk);
    g('c-prev').innerHTML = r===null ? '<span style="color:var(--rd)">No se pueden convertir entre sí (una es volumen y otra es peso).</span>' : `<b>${v} ${de} = ${r.toLocaleString('es-CO',{maximumFractionDigits:3})} ${a}</b>`;
  };
  ['c-val','c-bk'].forEach(x=>g(x).addEventListener('input', calc));
  ['c-de','c-a'].forEach(x=>g(x).addEventListener('change', calc));
  g('c-close').onclick = () => M._close(null);
  return p;
};

window.flowRestockInventory = async function(id, name, unit){
  const item = S.cache.inventory.find(x => x.id == id); if (!item) return;
  const base = item.unidad_medida || unit || 'unidad';
  const opU = ['cc','ml','litro','galon','g','kg','arroba','bulto','unidad'];
  const baseN = normUnidad(base);
  const ordU = [base, ...opU.filter(u => normUnidad(u)!==baseN && u!==base)];
  const uOpts = [...new Set(ordU)].map(u => `<option value="${esc(u)}" ${normUnidad(u)===baseN?'selected':''}>${esc(u)}</option>`).join('');

  const html = `
    <div class="modal-h">Reponer "${esc(name)}"</div>
    <div class="modal-sub">Agrega stock y, si quieres, el precio que pagaste en esta compra. La app actualiza el costo.</div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1.2"><label class="modal-label">Cantidad a agregar</label><input class="modal-input" type="number" id="r-can" inputmode="decimal" placeholder="Ej: 5"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad</label><select class="modal-select" id="r-uc">${uOpts}</select></div>
    </div>
    <div class="modal-field" id="r-bk-wrap" style="display:none"><label class="modal-label">¿Cuántos kg trae el bulto?</label><input class="modal-input" type="number" id="r-bk" placeholder="Ej: 50"></div>
    <div class="modal-field"><label class="modal-label">Precio total pagado (opcional)</label><input class="modal-input" type="number" id="r-pre" inputmode="decimal" placeholder="Lo que pagaste por esta compra"></div>
    <div class="modal-field"><label class="modal-label">Fecha de la compra</label><input class="modal-input" type="date" id="r-fec" value="${hoyISO()}"></div>
    <div id="r-prev" class="ficha-box" style="display:none"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="r-cancel">Cancelar</button><button class="btn btn-primary" id="r-ok">Reponer</button></div>`;

  const res = await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet"><div class="modal-handle"></div>${html}</div></div>`;
    const g = (x)=>document.getElementById(x);
    const calc = () => {
      const can=parseFloat(g('r-can').value)||0, uc=g('r-uc').value, pre=parseFloat(g('r-pre').value)||0, bk=parseFloat(g('r-bk').value)||0;
      g('r-bk-wrap').style.display = normUnidad(uc)==='bulto'?'':'none';
      let cb = convertirUnidad(can, uc, base, bk); if (cb===null) cb=can;
      const prev = g('r-prev');
      if (can>0){
        let txt = `<i class="ti ti-package"></i> Agregas <b>${cb.toLocaleString('es-CO',{maximumFractionDigits:2})} ${esc(base)}</b>`;
        if (pre>0 && cb>0) txt += ` · costo de esta compra: <b>${fmtMoney(pre/cb)}/${esc(base)}</b>`;
        prev.style.display=''; prev.innerHTML = txt;
      } else prev.style.display='none';
    };
    ['r-can','r-pre','r-bk'].forEach(x=>g(x).addEventListener('input', calc));
    g('r-uc').addEventListener('change', calc);
    const close = v => { document.getElementById('modal-host').innerHTML=''; resolve(v); };
    document.querySelector('#m-ov').addEventListener('click', e=>{ if(e.target===e.currentTarget) close(null); });
    g('r-cancel').onclick = () => close(null);
    g('r-ok').onclick = () => {
      const can=parseFloat(g('r-can').value)||0, uc=g('r-uc').value, pre=parseFloat(g('r-pre').value)||0, bk=parseFloat(g('r-bk').value)||0, fec=g('r-fec').value;
      if (can<=0){ toast('Escribe la cantidad'); return; }
      if (normUnidad(uc)==='bulto' && bk<=0){ toast('Indica los kg del bulto'); return; }
      let cb = convertirUnidad(can, uc, base, bk); if (cb===null) cb=can;
      close({ cantBase: cb, precio: pre, fecha: fec });
    };
  });
  if (!res) return;
  const r = await HANDLERS.restock_inventory(id, res.cantBase, res.precio);
  if (r.success && res.precio > 0){
    await HANDLERS.add_gasto({ concepto:`${name} (reposición: ${res.cantBase.toLocaleString('es-CO',{maximumFractionDigits:2})} ${base})`, categoria:item.categoria||'otro', valor_total:res.precio, fecha: res.fecha || null });
  }
  toast(r.success ? `✅ +${res.cantBase.toLocaleString('es-CO',{maximumFractionDigits:2})} ${base}${res.precio>0?' · '+fmtMoney(res.precio):''}` : r.msg);
  if (r.success) render();
};

async function flowNewInsumo(preCat = null, prefill = null){
  const pf = prefill || {};
  const selCat = pf.cat || preCat || 'Nutrición';
  const catOpts = Object.keys(BODEGA_STRUCT).map(k => `<option value="${k}" ${k===selCat?'selected':''}>${BODEGA_STRUCT[k].name}</option>`).join('');
  const initialSubs = BODEGA_STRUCT[selCat]?.subs || [];
  const subOpts = initialSubs.map(sx => `<option value="${sx}" ${sx===(pf.sub||'')?'selected':''}>${sx}</option>`).join('');

  const html = `
    <div class="modal-h">Nuevo Insumo</div>
    <div class="modal-sub">Escanea la etiqueta y la IA llena los datos, o escríbelos tú.</div>
    <button class="btn btn-blue btn-block" id="m-scan" style="margin-bottom:14px"><i class="ti ti-scan"></i> Escanear etiqueta con la cámara</button>
    <div class="modal-field"><label class="modal-label">Nombre del producto</label><input class="modal-input" id="f-desc" placeholder="Ej: Urea 46%" value="${esc(pf.desc||'')}"></div>
    <div class="modal-field"><label class="modal-label">Categoría</label><select class="modal-select" id="f-cat">${catOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Subcategoría</label><select class="modal-select" id="f-sub">${subOpts}</select></div>
    <div class="modal-field"><label class="modal-label">Ingredientes / Especificaciones (Clave para IA)</label><input class="modal-input" id="f-det" placeholder="Ej: Nitrógeno 46%, Fósforo..." value="${esc(pf.det||'')}"></div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1"><label class="modal-label">Cantidad</label><input class="modal-input" type="number" id="f-can" value="${esc(pf.can||'')}"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Unidad</label><input class="modal-input" id="f-uni" placeholder="Kg, L, Bulto..." value="${esc(pf.uni||'')}"></div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="modal-field" style="flex:1"><label class="modal-label">Precio total (opcional)</label><input class="modal-input" type="number" id="f-pre" placeholder="Lo que costó" value="${esc(pf.pre||'')}"></div>
      <div class="modal-field" style="flex:1"><label class="modal-label">Vence (opcional)</label><input class="modal-input" type="date" id="f-ven" value="${esc(pf.ven||'')}"></div>
    </div>
    <div class="modal-field"><label class="modal-label">Franja toxicológica (opcional)</label><select class="modal-select" id="f-fra">
      <option value="">— sin definir / la detecta la IA —</option>
      <option value="roja" ${pf.fra==='roja'?'selected':''}>Roja · muy tóxico</option>
      <option value="amarilla" ${pf.fra==='amarilla'?'selected':''}>Amarilla · moderado</option>
      <option value="azul" ${pf.fra==='azul'?'selected':''}>Azul · poco tóxico</option>
      <option value="verde" ${pf.fra==='verde'?'selected':''}>Verde · bajo riesgo</option>
    </select></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="m-cancel-inv">Cancelar</button><button class="btn btn-primary" id="m-save-inv">Guardar</button></div>
  `;

  const res = await new Promise(resolve => {
    document.getElementById('modal-host').innerHTML = `<div class="modal-overlay" id="m-ov"><div class="modal-sheet">${html}</div></div>`;
    const catEl = document.getElementById('f-cat');
    const subEl = document.getElementById('f-sub');
    catEl.onchange = () => {
      const subs = BODEGA_STRUCT[catEl.value]?.subs || [];
      subEl.innerHTML = subs.map(sx => `<option value="${sx}">${sx}</option>`).join('');
    };
    const gv = (id) => (document.getElementById(id)?.value || '').trim();
    const leer = () => ({ desc:gv('f-desc'), cat:catEl.value, sub:subEl.value, det:gv('f-det'), can:gv('f-can'), uni:gv('f-uni'), pre:gv('f-pre'), ven:gv('f-ven'), fra:(document.getElementById('f-fra')?.value||'') });
    const close = (val) => { document.getElementById('modal-host').innerHTML = ''; resolve(val); };
    document.getElementById('m-cancel-inv').onclick = () => close(null);
    document.getElementById('m-scan').onclick = () => close({ scan:true, keep: leer() });
    document.getElementById('m-save-inv').onclick = () => {
      const d = leer();
      if (!d.desc || !d.can || !d.uni) { toast('Faltan campos (Nombre, cantidad, unidad)'); return; }
      close(d);
    };
  });

  if (!res) return;

  /* Escaneo de etiqueta: foto → Gemini visión → formulario prellenado */
  if (res.scan){
    if (!S.isOnline){ toast('Necesitas internet para escanear etiquetas'); return flowNewInsumo(preCat, res.keep); }
    const media = await Cam.open();
    if (!media || media.isVideo) return flowNewInsumo(preCat, res.keep);
    toast('🔍 Leyendo la etiqueta...');
    let info = null;
    try{ info = await analizarEtiqueta(media); } catch(e){ console.warn('analizarEtiqueta:', e.message); }
    if (!info || info.error){
      toast('No pude leer bien la etiqueta, llena los datos manualmente');
      return flowNewInsumo(preCat, res.keep);
    }
    toast('✅ Etiqueta leída, revisa los datos');
    return flowNewInsumo(null, {
      ...res.keep,
      desc: info.descripcion || res.keep.desc,
      det:  info.detalles || res.keep.det,
      cat:  BODEGA_STRUCT[info.categoria] ? info.categoria : res.keep.cat,
      sub:  info.subcategoria || res.keep.sub
    });
  }

  if (res.pre) await HANDLERS.add_gasto({ concepto: `${res.desc} (${res.can} ${res.uni})`, categoria: res.cat, valor_total: parseFloat(res.pre) });
  const resp = await HANDLERS.add_inventory({ descripcion:res.desc, categoria:res.cat, subcategoria:res.sub, detalles:res.det, cantidad: parseFloat(res.can), unidad: res.uni, precio_total: parseFloat(res.pre)||0, fecha_vencimiento: res.ven||null, franja_toxicologica: res.fra||null });

  if(!resp.success) {
    M.confirm({ title: 'Error en base de datos', body: resp.msg, okText: 'Entendido', cancelText: '', danger: true });
  } else {
    toast('✅ ' + resp.msg); 
    render();
    if (resp.isNew && S.isOnline){
      const quiere = await M.confirm({ title:'¿Investigar en internet?', body:`¿Quieres que investigue "${esc(res.desc)}" en internet (ingredientes, dosis, precauciones) y guarde la ficha?`, okText:'Sí, investigar', cancelText:'Ahora no' });
      if (quiere) researchProduct(res.desc);
    }
  }
}

/* Lee la etiqueta de un producto con Gemini visión y devuelve JSON */
async function analizarEtiqueta(media){
  const cats = Object.entries(BODEGA_STRUCT).map(([k,v]) => `"${k}" (subcategorías válidas: ${v.subs.join(', ')})`).join('; ');
  const prompt = `Lee la etiqueta del producto agrícola que aparece en la foto. Devuelve SOLO un JSON válido, sin markdown ni texto adicional, con esta forma exacta: {"descripcion":"nombre comercial corto","categoria":"...","subcategoria":"...","detalles":"ingredientes activos con su concentración"}. La categoria debe ser EXACTAMENTE una de estas: ${cats}. La subcategoria debe ser una de las válidas para esa categoría. Si la imagen no es una etiqueta legible devuelve {"error":"no legible"}.`;
  const req = { contents:[{ role:'user', parts:[{ inlineData:{ mimeType: media.type, data: media.b64 } }, { text: prompt }] }] };
  const rq = await llamarGemini(req);
  if (!rq.ok) return null;
  const data = rq.data;
  let txt = (data.candidates?.[0]?.content?.parts || []).filter(p=>p.text).map(p=>p.text).join('').trim();
  txt = txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  const m = txt.match(/\{[\s\S]*\}/);
  if (!m) return null;
  return JSON.parse(m[0]);
}

async function flowCompleteTask(id){
  const task = S.cache.tasks.find(t => t.id == id); if (!task) return;
  const previousState = task.estado; task.estado = 'completada';
  const row = document.getElementById(`task-row-${id}`), check = row?.querySelector('.task-check');
  if (check){ check.classList.add('checked'); row.classList.add('task-item-completing'); }
  let undone = false;
  toast(`✓ Tarea completada`, {
    duration: 4500, action: { label: 'Deshacer', onClick: async () => {
      undone = true; task.estado = previousState;
      if (S.isOnline){ try { await sb.from('tareas').update({ estado: previousState }).eq('id', id); } catch(e){} }
      else { const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); localStorage.setItem(QUEUE_KEY, JSON.stringify(q.filter(x => !(x.action === 'complete_task' && x.id == id)))); }
      render();
    }}
  });
  setTimeout(async () => { if (undone) return; await HANDLERS.complete_task(id); if (!undone) render(); }, 600);
}

function renderPlagas(){
  const activas = S.cache.plagas.filter(p => p.activa).sort((a,b) => {
    const ord = {severa:0, moderada:1, leve:2};
    return (ord[a.severidad]||2) - (ord[b.severidad]||2);
  });
  const controladas = S.cache.plagas.filter(p => !p.activa).slice(0,10);

  function plagaCard(p, esControlada){
    const sev = esControlada ? 'controlada' : (p.severidad||'leve');
    const icon = sev==='severa'?'ti-alert-triangle':sev==='moderada'?'ti-alert-circle':sev==='controlada'?'ti-circle-check':'ti-bug';
    const loteNom = p.lote?.codigo || 'Finca general';
    const ctrl = p.producto_usado ? `<div class="plaga-control"><i class="ti ti-spray"></i> <b>Control:</b> ${esc(p.producto_usado)}${p.dosis?' · '+esc(p.dosis):''} ${p.fecha_control?'('+esc(p.fecha_control)+')':''} ${p.resultado?'· '+esc(p.resultado):''}</div>` : '';
    const acciones = esControlada ? 
      `<button class="btn btn-sm btn-ghost" onclick="flowDeletePlaga('${p.id}')" style="color:var(--tx3);padding:4px;border:none"><i class="ti ti-trash"></i></button>` :
      `<div class="row gap6">
        <button class="btn btn-sm btn-ghost" onclick="flowControlarPlaga('${p.id}','${escA(p.tipo||'')}','${escA(loteNom)}')" style="padding:5px" title="Registrar control"><i class="ti ti-spray"></i> Controlar</button>
        <button class="btn btn-sm btn-ghost" onclick="flowCerrarPlaga('${p.id}','${escA(p.tipo||'')}')" style="color:var(--g);padding:5px;border:none" title="Marcar controlada"><i class="ti ti-circle-check"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowDeletePlaga('${p.id}')" style="color:var(--rd);padding:5px;border:none"><i class="ti ti-trash"></i></button>
      </div>`;
    return `<div class="plaga-card ${sev}">
      <div class="plaga-header">
        <div class="plaga-icon ${sev}"><i class="ti ${icon}"></i></div>
        <div style="flex:1">
          <div class="plaga-title">${esc(p.tipo)}</div>
          <div class="plaga-meta">
            <span><i class="ti ti-map-pin"></i> ${loteNom}</span>
            <span><i class="ti ti-calendar"></i> ${p.fecha_deteccion||'—'}</span>
            ${p.registrado?.nombre_corto?`<span><i class="ti ti-user"></i> ${p.registrado.nombre_corto}</span>`:''}
          </div>
        </div>
        <div class="row gap4" style="flex-shrink:0;align-items:flex-start">
          <span class="plaga-badge ${sev}">${sev}</span>
        </div>
      </div>
      ${p.descripcion?`<div class="plaga-desc">${clampHTML(p.descripcion,{limit:110})}</div>`:''}
      ${ctrl}
      <div style="margin-top:8px;display:flex;justify-content:flex-end">${acciones}</div>
    </div>`;
  }

  const activasHtml = activas.length ? activas.map(p=>plagaCard(p,false)).join('') : emptyState('ti-leaf','Sin plagas activas','No hay problemas fitosanitarios registrados.');
  const controladasHtml = controladas.length ? controladas.map(p=>plagaCard(p,true)).join('') : `<div class="text-tiny" style="padding:10px;text-align:center">Sin registros anteriores.</div>`;

  // Resumen por lote
  const resumenLotes = S.cache.lotes.map(l => {
    const pl = S.cache.plagas.filter(p=>p.activa && p.lote_id===l.id);
    if (!pl.length) return '';
    const sevCount = pl.filter(p=>p.severidad==='severa').length;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px">
      <span><b>${l.codigo}</b> · ${l.cultivo}</span>
      <span>${pl.length} plaga${pl.length>1?'s':''}${sevCount?` · <span style="color:var(--rd);font-weight:700">${sevCount} severa${sevCount>1?'s':''}</span>`:''}</span>
    </div>`;
  }).filter(Boolean).join('');

  return `<div class="panel">
    <div class="panel-h">
      <div class="panel-title"><i class="ti ti-bug" style="color:var(--rd)"></i> Plagas y Enfermedades</div>
      <button class="btn btn-sm btn-red" onclick="flowNuevaPlaga()"><i class="ti ti-plus"></i> Registrar</button>
    </div>
    ${resumenLotes ? `<div class="card" style="margin-bottom:12px;padding:10px 14px"><div class="sec-t" style="margin:0 0 8px"><span>Resumen por lote</span></div>${resumenLotes}</div>` : ''}
    <div class="sec-t"><span><i class="ti ti-alert-circle"></i> Activas (${activas.length})</span></div>
    ${activasHtml}
    ${controladas.length ? `<div class="sec-t mt12"><span><i class="ti ti-circle-check"></i> Controladas recientes</span></div>${controladasHtml}` : ''}
  </div>`;
}

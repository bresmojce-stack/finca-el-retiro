const Cam = {
  async open(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return this._fallback();
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return this._fallback();
    let initialStream;
    try{ initialStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} }, audio: false }); }
    catch(err){ return this._fallback(); }

    return new Promise((resolve) => {
      let stream = initialStream, mode = 'photo', facing = 'environment', recorder = null;
      const host = document.getElementById('modal-host');
      host.innerHTML = `<div class="cam-modal"><video class="cam-video" id="cam-vid" autoplay playsinline muted></video><div class="cam-top"><button class="cam-btn-top" id="cam-close" title="Cerrar"><i class="ti ti-x"></i></button><div id="cam-rec-wrap"></div><button class="cam-btn-top" id="cam-flip" title="Voltear cámara"><i class="ti ti-camera-rotate"></i></button></div><div class="cam-bottom"><div class="cam-modes"><button class="cam-mode act" data-mode="photo">📷 Foto</button><button class="cam-mode" data-mode="video">🎥 Video</button></div><div class="cam-controls-row"><div class="cam-spacer"></div><button class="cam-shutter" id="cam-shutter"></button><div class="cam-spacer"></div></div></div></div>`;
      
      const vid = document.getElementById('cam-vid'); vid.srcObject = stream;

      async function switchStream(){
        if (stream) stream.getTracks().forEach(t => t.stop());
        try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: mode === 'video' }); vid.srcObject = stream; } catch(err){}
      }
      function close(result){
        if (recorder && recorder.state !== 'inactive') try { recorder.stop(); } catch(e){}
        if (stream) stream.getTracks().forEach(t => t.stop());
        host.innerHTML = ''; resolve(result);
      }
      function setMode(m){
        if (recorder && recorder.state === 'recording' || m === mode) return;
        mode = m; document.querySelectorAll('.cam-mode').forEach(b => b.classList.toggle('act', b.dataset.mode === m)); switchStream();
      }

      document.getElementById('cam-close').onclick = () => close(null);
      document.getElementById('cam-flip').onclick = () => { facing = (facing === 'environment') ? 'user' : 'environment'; switchStream(); };
      document.querySelectorAll('.cam-mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
      document.getElementById('cam-shutter').onclick = () => {
        if (mode === 'photo') {
          const c = document.createElement('canvas'); c.width = vid.videoWidth || 1280; c.height = vid.videoHeight || 720;
          c.getContext('2d').drawImage(vid, 0, 0);
          close({ b64: c.toDataURL('image/jpeg', 0.85).split(',')[1], type:'image/jpeg', preview:c.toDataURL('image/jpeg', 0.85), isVideo:false });
        } else {
          toast('El video web consume mucha memoria. Intenta enviar fotos.');
        }
      };
    });
  },
  _fallback(){
    return new Promise((resolve) => {
      const inp = document.getElementById('camFallback'); let done = false;
      const finish = (val) => { if (done) return; done = true; inp.removeEventListener('change', changeHandler); window.removeEventListener('focus', focusHandler); resolve(val); };
      const changeHandler = (ev) => {
        const f = ev.target.files[0]; if (!f){ finish(null); return; }
        if (f.size > 19 * 1024 * 1024){ toast('Archivo muy pesado (>19MB)'); finish(null); return; }
        const rd = new FileReader();
        rd.onload = rv => finish({ b64: rv.target.result.split(',')[1], type: f.type, preview: rv.target.result, isVideo: f.type.startsWith('video/') });
        rd.readAsDataURL(f);
      };
      const focusHandler = () => { setTimeout(() => { if (!done && !inp.files.length) finish(null); }, 800); };
      inp.addEventListener('change', changeHandler); window.addEventListener('focus', focusHandler);
      inp.value = ''; inp.click();
    });
  }
};

const Voice = {
  _rec: null, _autoTimer: null, _finalText: '',
  start(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ toast('Tu dispositivo no soporta reconocimiento de voz.'); return; }
    if (S.listening){ this.cancel(); return; }
    if (this._autoTimer) { clearTimeout(this._autoTimer); this._autoTimer = null; }
    document.getElementById('voice-cd-bar')?.remove();

    this._finalText = ''; const r = new SR(); r.lang = 'es-CO'; r.continuous = false; r.interimResults = true;
    r.onstart = () => { S.listening = true; S.voiceCountdown = false; render(); };
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++){
        if (e.results[i].isFinal) this._finalText += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      const inp = document.getElementById('txt-inp'); if (inp) { inp.value = (this._finalText + interim).trim(); adjustTextarea(); }
    };
    r.onerror = (ev) => { S.listening = false; render(); };
    r.onend = () => {
      S.listening = false; const txt = this._finalText.trim();
      const micBtn = document.getElementById('btn-voice'); if (micBtn) micBtn.classList.remove('listening');
      if (!txt) return;

      const chatInp = document.querySelector('.chat-inp');
      if (chatInp){
        document.getElementById('voice-cd-bar')?.remove();
        const cd = document.createElement('div'); cd.className = 'voice-countdown'; cd.id = 'voice-cd-bar';
        cd.innerHTML = `<i class="ti ti-send" style="font-size:14px"></i><span>Enviando en 1.5s — toca para cancelar</span><div class="voice-countdown-bar"><div class="voice-countdown-fill"></div></div>`;
        cd.onclick = () => Voice.cancelAutoSend();
        chatInp.insertBefore(cd, chatInp.firstChild);
      }
      this._autoTimer = setTimeout(() => {
        document.getElementById('voice-cd-bar')?.remove();
        if (document.getElementById('txt-inp')?.value.trim()) document.getElementById('btn-send')?.click();
      }, 1500);
    };
    this._rec = r; try{ r.start(); } catch(err){ S.listening = false; render(); }
  },
  cancel(){
    if (this._rec) try { this._rec.abort(); } catch(e){}
    if (this._autoTimer) { clearTimeout(this._autoTimer); this._autoTimer = null; }
    document.getElementById('voice-cd-bar')?.remove(); S.listening = false; render();
  },
  cancelAutoSend(){
    if (this._autoTimer) { clearTimeout(this._autoTimer); this._autoTimer = null; }
    document.getElementById('voice-cd-bar')?.remove(); toast('Auto-envío cancelado');
  }
};

const Alerts = {
  _scheduledHours: [7, 12, 18], _lastFiredHour: null, _intervalId: null, SNOOZE_KEY: 'finca_snoozed_alerts',
  _today(){ return fechaLocalISO(); },
  _getSnoozed(){
    try {
      const data = JSON.parse(localStorage.getItem(this.SNOOZE_KEY) || '{}');
      const now = Date.now(), clean = {};
      Object.entries(data).forEach(([k, v]) => { if (v > now) clean[k] = v; });
      if (Object.keys(clean).length !== Object.keys(data).length) localStorage.setItem(this.SNOOZE_KEY, JSON.stringify(clean));
      return clean;
    } catch(e) { return {}; }
  },
  snooze(key, days = 7){
    const data = this._getSnoozed(); data[key] = Date.now() + (days * 24 * 60 * 60 * 1000);
    localStorage.setItem(this.SNOOZE_KEY, JSON.stringify(data));
  },
  compute(){
    const today = this._today(), tasks = S.cache.tasks || [], inv = S.cache.inventory || [], snoozed = this._getSnoozed();
    const vencidas = tasks.filter(t => t.estado === 'pendiente' && t.fecha_limite && t.fecha_limite < today && !snoozed[`task_${t.id}`]);
    const hoy      = tasks.filter(t => t.estado === 'pendiente' && t.fecha_limite === today && !snoozed[`task_${t.id}`]);
    const proximas = tasks.filter(t => t.estado === 'pendiente' && t.fecha_limite && t.fecha_limite > today);
    const sinFecha = tasks.filter(t => t.estado === 'pendiente' && !t.fecha_limite);
    const mias = tasks.filter(t => t.estado === 'pendiente' && (t.asignado?.codigo === S.user?.id || t.asignado_a_todos) && !snoozed[`task_${t.id}`]);
    const stockBajo = inv.filter(i => {
      if (snoozed[`stock_${i.id}`]) return false;
      const inq = parseFloat(i.total_ingresado || i.cantidad_actual) || 0, act = parseFloat(i.cantidad_actual) || 0;
      return inq > 0 && act > 0 && act < (inq * 0.15);
    });
    const stockCero = inv.filter(i => { if (snoozed[`stock_${i.id}`]) return false; return parseFloat(i.cantidad_actual) === 0; });
    const porVencer = inv.filter(i => {
      if (!i.fecha_vencimiento || snoozed[`venc_${i.id}`]) return false;
      if ((parseFloat(i.cantidad_actual)||0) <= 0) return false;
      return diasHasta(i.fecha_vencimiento) <= 30;
    }).map(i => ({ ...i, _diasVenc: diasHasta(i.fecha_vencimiento) }));
    return { vencidas, hoy, proximas, sinFecha, mias, stockBajo, stockCero, porVencer, today };
  },
  urgentCount(){ const a = this.compute(); return a.vencidas.length + a.hoy.length + a.stockCero.length + a.porVencer.filter(i=>i._diasVenc<=0).length; },
  pendingTasksCount(){ return (S.cache.tasks || []).filter(t => t.estado === 'pendiente').length; },
  greeting(){
    const h = horaFinca();
    if (h < 5) return '🌙 Buenas noches'; if (h < 12) return '☀️ Buenos días'; if (h < 18) return '👋 Buenas tardes'; return '🌙 Buenas noches';
  },
  async showPanel(){
    const a = this.compute(), greeting = this.greeting(), name = S.user?.display || '';
    const total = a.vencidas.length + a.hoy.length + a.mias.length + a.stockBajo.length + a.stockCero.length + a.porVencer.length;
    let body = '';
    if (total === 0){
      body = `<div class="alert-empty"><div class="icon-pill ip-green"><i class="ti ti-mood-happy"></i></div><div><div class="welcome-greeting" style="font-size:18px">Todo en orden</div><div class="welcome-sub" style="margin-bottom:0">No hay alertas pendientes en este momento. Sigue así.</div></div></div>`;
    } else {
      const taskRow = (t) => `<div class="alert-row" id="alert-task-${t.id}">
        <button class="alert-check" data-complete-alert="${t.id}" title="Marcar completada"><i class="ti ti-check"></i></button>
        <div class="alert-row-body">
          <div class="alert-row-title">${t.titulo}</div>
          <div class="alert-row-meta">${t.fecha_limite ? fmtFecha(t.fecha_limite) : 'Sin fecha'}${t.lote?.codigo?' · '+t.lote.codigo:''}</div>
        </div>
        <button class="btn btn-sm" onclick="flowDeleteTask('${t.id}', '${escA(t.titulo||'')}'); M._close(true);" style="background:transparent;color:var(--tx3);font-size:16px;padding:4px" title="Borrar alerta"><i class="ti ti-trash"></i></button>
      </div>`;
      
      const stockRow = (i) => `<div class="alert-row" id="alert-stock-${i.id}">
        <div class="alert-row-body">
          <div class="alert-row-title">${i.descripcion}</div>
          <div class="alert-row-meta">Disponible: ${i.cantidad_actual} ${i.unidad_medida||''}</div>
        </div>
        <button class="alert-snooze" data-snooze-stock="${i.id}" title="Ya lo gestioné · silenciar 7 días"><i class="ti ti-bell-off"></i></button>
      </div>`;
      
      if (a.vencidas.length) body += `<div class="alert-group urgent"><div class="alert-group-h"><div class="icon-pill ip-red"><i class="ti ti-alert-triangle"></i></div>${a.vencidas.length} tarea(s) vencida(s)</div>${a.vencidas.slice(0,6).map(taskRow).join('')}</div>`;
      if (a.hoy.length) body += `<div class="alert-group warn"><div class="alert-group-h"><div class="icon-pill ip-yellow"><i class="ti ti-calendar-event"></i></div>${a.hoy.length} tarea(s) para hoy</div>${a.hoy.slice(0,6).map(taskRow).join('')}</div>`;
      const miasRestantes = a.mias.filter(t => !(new Set([...a.vencidas, ...a.hoy].map(t => t.id)).has(t.id)));
      if (miasRestantes.length) body += `<div class="alert-group"><div class="alert-group-h"><div class="icon-pill ip-blue"><i class="ti ti-user-check"></i></div>${miasRestantes.length} pendiente(s) a tu nombre</div>${miasRestantes.slice(0,5).map(taskRow).join('')}</div>`;
      if (a.stockCero.length) body += `<div class="alert-group urgent"><div class="alert-group-h"><div class="icon-pill ip-red"><i class="ti ti-package-off"></i></div>${a.stockCero.length} insumo(s) agotado(s)</div>${a.stockCero.slice(0,5).map(stockRow).join('')}</div>`;
      if (a.stockBajo.length) body += `<div class="alert-group warn"><div class="alert-group-h"><div class="icon-pill ip-orange"><i class="ti ti-package"></i></div>${a.stockBajo.length} insumo(s) con stock bajo</div>${a.stockBajo.slice(0,5).map(stockRow).join('')}</div>`;

      const vencRow = (i) => `<div class="alert-row" id="alert-venc-${i.id}">
        <div class="alert-row-body">
          <div class="alert-row-title">${esc(i.descripcion)}</div>
          <div class="alert-row-meta">${i._diasVenc < 0 ? `Venció hace ${Math.abs(i._diasVenc)} días` : i._diasVenc === 0 ? 'Vence HOY' : `Vence en ${i._diasVenc} días`} (${fmtFecha(i.fecha_vencimiento)}) · ${i.cantidad_actual} ${esc(i.unidad_medida||'')} en stock</div>
        </div>
        <button class="alert-snooze" data-snooze-venc="${i.id}" title="Silenciar 7 días"><i class="ti ti-bell-off"></i></button>
      </div>`;
      const vencUrgentes = a.porVencer.filter(i=>i._diasVenc<=0), vencProximos = a.porVencer.filter(i=>i._diasVenc>0);
      if (vencUrgentes.length) body += `<div class="alert-group urgent"><div class="alert-group-h"><div class="icon-pill ip-red"><i class="ti ti-calendar-x"></i></div>${vencUrgentes.length} producto(s) VENCIDO(S)</div>${vencUrgentes.slice(0,5).map(vencRow).join('')}</div>`;
      if (vencProximos.length) body += `<div class="alert-group warn"><div class="alert-group-h"><div class="icon-pill ip-yellow"><i class="ti ti-calendar-exclamation"></i></div>${vencProximos.length} producto(s) por vencer (≤30 días)</div>${vencProximos.slice(0,5).map(vencRow).join('')}</div>`;
    }

    const html = `
      <div class="welcome-greeting">${greeting}${name?', '+name:''}</div>
      <div class="welcome-sub">${total === 0 ? 'Aquí está el resumen de tu finca.' : `Toca ✓ para chuliar una tarea, o 🔕 para silenciar una alerta.`}</div>
      ${body}
      <div class="modal-actions" style="margin-top:14px"><button class="btn btn-primary btn-block" id="m-close">Cerrar</button></div>`;
    const p = M._open(html);

    document.getElementById('m-close').onclick = () => M._close(true);
    document.querySelectorAll('[data-complete-alert]').forEach(el => {
      el.addEventListener('click', async (e) => {
        const id = e.currentTarget.dataset.completeAlert;
        e.currentTarget.classList.add('done');
        const row = document.getElementById(`alert-task-${id}`);
        if (row){ setTimeout(() => { row.classList.add('dismissing'); }, 220); setTimeout(() => { row.remove(); this._checkEmptyGroups(); }, 540); }
        await HANDLERS.complete_task(id); render();
      });
    });
    document.querySelectorAll('[data-snooze-venc]').forEach(el => {
      el.addEventListener('click', (e) => {
        const id = e.currentTarget.dataset.snoozeVenc;
        this.snooze(`venc_${id}`, 7);
        const row = document.getElementById(`alert-venc-${id}`);
        if (row){ row.classList.add('dismissing'); setTimeout(() => { row.remove(); this._checkEmptyGroups(); }, 320); }
        toast('🔕 Silenciada por 7 días'); render();
      });
    });
    document.querySelectorAll('[data-snooze-stock]').forEach(el => {
      el.addEventListener('click', (e) => {
        const id = e.currentTarget.dataset.snoozeStock;
        this.snooze(`stock_${id}`, 7);
        const row = document.getElementById(`alert-stock-${id}`);
        if (row){ row.classList.add('dismissing'); setTimeout(() => { row.remove(); this._checkEmptyGroups(); }, 320); }
        toast('🔕 Silenciada por 7 días'); render();
      });
    });
    return p;
  },
  _checkEmptyGroups(){
    document.querySelectorAll('.alert-group').forEach(g => {
      if (g.querySelectorAll('.alert-row').length === 0){ g.classList.add('dismissing'); setTimeout(() => g.remove(), 320); }
    });
  },
  fireNotification(){
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const a = this.compute(), urg = a.vencidas.length + a.hoy.length;
    if (urg === 0) return;
    try{
      const n = new Notification('Finca El Retiro 🌱', { body: `Tienes ${urg} cosas pendientes.`, tag: 'finca-pendientes' });
      n.onclick = () => { window.focus(); this.showPanel(); n.close(); };
    } catch(e){}
  },
  startScheduler(){
    if (this._intervalId) clearInterval(this._intervalId);
    this._intervalId = setInterval(() => {
      const h = horaFinca(), m = new Date().getMinutes();
      if (this._scheduledHours.includes(h) && m < 2 && this._lastFiredHour !== h){ this._lastFiredHour = h; this.fireNotification(); }
      if (h === 0 && m === 0) this._lastFiredHour = null;
    }, 60 * 1000);
  },
  async checkOnStartup(){
    const a = this.compute();
    if (a.vencidas.length + a.hoy.length + a.stockCero.length + a.porVencer.filter(i=>i._diasVenc<=0).length > 0) await this.showPanel();
  }
};

const Location = {
  STORAGE_KEY: 'finca_location',
  DEFAULT: { lat: 3.417, lon: -76.244, name: 'El Retiro, Pradera, Valle', isDefault: true },
  get(){ try { return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || this.DEFAULT; } catch(e){ return this.DEFAULT; } },
  set(loc){ try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(loc)); } catch(e){} },
  reset(){ try { localStorage.removeItem(this.STORAGE_KEY); } catch(e){} },
  async updateFromGPS(){
    if (!navigator.geolocation) throw new Error('GPS no soportado');
    const pos = await new Promise((resolve, reject) => { navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy: true, timeout: 15000}); });
    const loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy), name: 'Ubicación actual', isDefault: false };
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${loc.lat}&longitude=${loc.lon}&language=es&count=1`);
      if (r.ok){ const p = (await r.json()).results?.[0]; if (p) loc.name = [p.name, p.admin2, p.admin1].filter(Boolean).slice(0, 3).join(', '); }
    } catch(e){}
    this.set(loc); Weather.clearCache(); return loc;
  }
};

const Weather = {
  CACHE_KEY: 'finca_weather_cache', CACHE_MS: 30 * 60 * 1000, _fetching: false,
  describe(code){
    const map = {
      0:{text:'Despejado',icon:'ti-sun',cls:'sunny'}, 1:{text:'Despejado',icon:'ti-sun',cls:'sunny'},
      2:{text:'Parcialmente nublado',icon:'ti-cloud-sun',cls:'cloudy'}, 3:{text:'Nublado',icon:'ti-cloud',cls:'cloudy'},
      45:{text:'Neblina',icon:'ti-mist',cls:'cloudy'}, 51:{text:'Llovizna',icon:'ti-cloud-rain',cls:'rainy'},
      61:{text:'Lluvia',icon:'ti-cloud-rain',cls:'rainy'}, 65:{text:'Lluvia fuerte',icon:'ti-cloud-storm',cls:'rainy'},
      80:{text:'Aguacero',icon:'ti-cloud-rain',cls:'rainy'}, 95:{text:'Tormenta',icon:'ti-bolt',cls:'rainy'}
    };
    return map[code] || { text: 'Clima', icon: 'ti-cloud', cls: 'cloudy' };
  },
  _getCache(){ try { return JSON.parse(localStorage.getItem(this.CACHE_KEY) || 'null'); } catch(e){ return null; } },
  _setCache(data, loc){ try { localStorage.setItem(this.CACHE_KEY, JSON.stringify({ ts: Date.now(), data, locKey: `${loc.lat.toFixed(3)},${loc.lon.toFixed(3)}` })); } catch(e){} },
  clearCache(){ try { localStorage.removeItem(this.CACHE_KEY); } catch(e){} },
  getCached(){ return this._getCache()?.data || null; },
  async fetch(force = false){
    if (this._fetching) return this.getCached();
    const loc = Location.get(), locKey = `${loc.lat.toFixed(3)},${loc.lon.toFixed(3)}`, cached = this._getCache();
    if (!force && cached && cached.locKey === locKey && (Date.now() - cached.ts) < this.CACHE_MS) return cached.data;
    this._fetching = true;
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&hourly=precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('Weather API');
      const data = await r.json();
      this._setCache(data, loc); this._fetching = false; return data;
    } catch(e){ this._fetching = false; return this.getCached(); }
  },
  contextForAgent(){
    const data = this.getCached(); if (!data) return '';
    const loc = Location.get(), c = data.current, h = data.hourly, desc = this.describe(c.weather_code).text;
    let s = `\n\nCLIMA ACTUAL (${loc.name}):\n- Ahora: ${Math.round(c.temperature_2m)}°C, ${desc}, humedad ${c.relative_humidity_2m}%`;
    if (c.precipitation > 0) s += `, lloviendo (${c.precipitation}mm)`;
    if (h && h.precipitation_probability){
      const maxProb = Math.max(...h.precipitation_probability.slice(0, 6));
      if (maxProb >= 50) s += `\n- ALERTA: ${maxProb}% probabilidad de lluvia en próximas horas.`;
    }
    return s;
  },
  renderPill(){
    const data = this.getCached();
    if (!data) return `<div class="weather-pill loading" id="weather-pill"><i class="ti ti-cloud"></i><span>—</span></div>`;
    const c = data.current, d = this.describe(c.weather_code), todayRain = data.daily?.precipitation_probability_max?.[0] || 0;
    return `<div class="weather-pill ${d.cls}" id="weather-pill" title="${d.text}"><i class="ti ${d.icon}"></i><span class="wp-temp">${Math.round(c.temperature_2m)}°</span>${todayRain >= 30 ? `<span class="wp-rain"><i class="ti ti-droplet"></i>${todayRain}%</span>` : ''}</div>`;
  },
  async showPanel(){
    let data = this.getCached();
    if (!data){ toast('📡 Cargando clima...'); data = await this.fetch(true); if (!data){ toast('Sin red para clima.'); return; } }
    const loc = Location.get(), c = data.current, d = data.daily, desc = this.describe(c.weather_code);
    let forecastHtml = '';
    if (d && d.time){
      forecastHtml = d.time.map((dateStr, i) => {
        const dt = new Date(dateStr + 'T12:00:00Z'), days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        const dayName = i === 0 ? 'Hoy' : (i === 1 ? 'Mañana' : days[dt.getUTCDay()]), dd = this.describe(d.weather_code[i]);
        return `<div class="weather-day"><div class="weather-day-name">${dayName}</div><div class="weather-day-icon ${dd.cls}"><i class="ti ${dd.icon}"></i></div><div class="weather-day-temp">${Math.round(d.temperature_2m_min[i])}° / ${Math.round(d.temperature_2m_max[i])}°</div><div class="weather-day-rain"><i class="ti ti-droplet"></i>${d.precipitation_probability_max[i]}%</div></div>`;
      }).join('');
    }
    const html = `
      <div class="modal-h">Clima</div>
      <div class="weather-loc-row">
        <div class="icon-pill ip-green"><i class="ti ti-map-pin"></i></div>
        <div class="weather-loc-body"><div class="weather-loc-name">${loc.name}</div><div class="weather-loc-coord">${loc.lat.toFixed(4)}°, ${loc.lon.toFixed(4)}°</div></div>
      </div>
      <div class="weather-now"><div class="weather-now-icon ${desc.cls}"><i class="ti ${desc.icon}"></i></div>
        <div class="weather-now-body"><div class="weather-now-temp">${Math.round(c.temperature_2m)}°C</div><div class="weather-now-desc">${desc.text}</div></div>
      </div>
      <div class="weather-forecast">${forecastHtml}</div>
      <div class="modal-actions" style="flex-direction:column;gap:8px">
        <button class="btn btn-soft btn-block" id="m-update-loc"><i class="ti ti-current-location"></i> Actualizar GPS</button>
        <button class="btn btn-primary btn-block" id="m-close">Cerrar</button>
      </div>`;
    const p = M._open(html);
    document.getElementById('m-close').onclick = () => M._close(true);
    document.getElementById('m-update-loc').onclick = async () => {
      M._close(true); toast('📍 Buscando GPS...');
      try { await Location.updateFromGPS(); await Weather.fetch(true); render(); } catch(e){ toast(`❌ ${e.message}`); }
    };
    return p;
  }
};

async function captureGPS(){
  if (!navigator.geolocation){ toast('Tu dispositivo no tiene GPS.'); return; }
  toast('📍 Buscando coordenadas...');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
    const loteDbId = S.activeLote ? S.cache.lotes.find(l => l.codigo === S.activeLote.codigo)?.id : null;
    const codigoLote = S.activeLote ? S.activeLote.codigo : null;
    await HANDLERS.log_activity({ lote_id: loteDbId, codigo: codigoLote, actividad: `Punto GPS: ${coords}` });
    toast('✅ Coordenada registrada'); render();
  }, (err) => { toast('No se pudo obtener GPS'); }, { enableHighAccuracy: true, timeout: 15000 });
}

function toast(msg, opts){
  const e = document.getElementById('toast'); clearTimeout(toast._t);
  if (opts && opts.action){
    e.classList.add('has-action');
    e.innerHTML = `<span>${msg}</span><button class="toast-action" id="toast-act">${opts.action.label}</button>`;
    setTimeout(() => { const btn = document.getElementById('toast-act'); if (btn) btn.onclick = () => { opts.action.onClick(); e.classList.remove('show'); }; }, 0);
  } else { e.classList.remove('has-action'); e.textContent = msg; }
  e.classList.add('show');
  toast._t = setTimeout(() => e.classList.remove('show'), (opts && opts.duration) || 2800);
}

function buildProactivePanel(){
  const hoyISO = fechaLocalISO();
  const h = horaFinca();
  const greeting = h < 5 ? '🌙 Buenas noches' : h < 12 ? '☀️ Buenos días' : h < 18 ? '👋 Buenas tardes' : '🌙 Buenas noches';
  const items = [];

  // Tareas vencidas
  const venc = S.cache.tasks.filter(t => t.estado==='pendiente' && t.fecha_limite && t.fecha_limite < hoyISO);
  if (venc.length) items.push({ cls:'urgent', icon:'ti-alert-circle', text:`${venc.length} tarea${venc.length>1?'s':''} vencida${venc.length>1?'s':''}: ${venc.slice(0,2).map(t=>t.titulo).join(', ')}` });

  // Tareas para hoy
  const paraHoy = S.cache.tasks.filter(t => t.estado==='pendiente' && t.fecha_limite === hoyISO);
  if (paraHoy.length) items.push({ cls:'warn', icon:'ti-clock', text:`${paraHoy.length} tarea${paraHoy.length>1?'s':''} para hoy: ${paraHoy.slice(0,2).map(t=>t.titulo).join(', ')}` });

  // Lotes con ciclo por vencer (< 7 días)
  S.cache.lotes.forEach(l => {
    if (!l.fecha_siembra || !l.ciclo_dias) return;
    const diasTrans = diasDesde(l.fecha_siembra);
    const diasRest = l.ciclo_dias - diasTrans;
    if (diasRest >= 0 && diasRest <= 7) items.push({ cls:'warn', icon:'ti-plant', text:`Lote ${l.codigo} (${l.cultivo}) en ${diasRest === 0 ? 'cosecha HOY' : diasRest+' días para cosecha'}` });
    if (diasRest < 0) items.push({ cls:'urgent', icon:'ti-plant-off', text:`Lote ${l.codigo}: ciclo vencido hace ${Math.abs(diasRest)} días` });
  });

  // Lotes activos sin fumigación reciente (> 15 días)
  S.cache.lotes.filter(l => ['vegetativo','producción'].includes(l.estado)).forEach(l => {
    const lastFumig = S.cache.activities.filter(a => a.lote?.codigo === l.codigo && /fumig|aplica|fungic|insect/i.test(a.actividad||'')).sort((a,b) => tsOrden(b.fecha)-tsOrden(a.fecha))[0];
    if (!lastFumig) { items.push({ cls:'info', icon:'ti-spray', text:`Lote ${l.codigo}: sin fumigaciones registradas` }); return; }
    const dias = diasDesde(lastFumig.fecha);
    if (dias > 15) items.push({ cls:'info', icon:'ti-spray', text:`Lote ${l.codigo}: ${dias} días sin fumigación` });
  });

  // Plagas activas severas
  const plagasSev = (S.cache.plagas||[]).filter(p=>p.activa && p.severidad==='severa');
  if (plagasSev.length) items.push({ cls:'urgent', icon:'ti-bug', text:`Plaga severa activa: ${plagasSev.map(p=>`${p.tipo} en ${p.lote?.codigo||'finca'}`).join(', ')}` });
  const plagasMod = (S.cache.plagas||[]).filter(p=>p.activa && p.severidad==='moderada');
  if (plagasMod.length) items.push({ cls:'warn', icon:'ti-bug', text:`${plagasMod.length} plaga${plagasMod.length>1?'s':''} moderada${plagasMod.length>1?'s':''}: ${plagasMod.map(p=>p.tipo).join(', ')}` });

  if (!items.length) items.push({ cls:'ok', icon:'ti-mood-happy', text:'Todo en orden. Sin alertas pendientes.' });

  return `<div class="proactive-panel">
    <div class="proactive-greeting">${greeting}, ${S.user?.display||''}</div>
    <div class="proactive-sub">Resumen operativo · Finca El Retiro</div>
    <div class="proactive-items">${items.slice(0,5).map(i => `<div class="proactive-item ${i.cls}"><i class="ti ${i.icon}"></i><span>${i.text}</span></div>`).join('')}</div>
  </div>`;
}

window.flowGestionCiclos = async function(){
  const ciclos = S.cache.ciclos;
  const listHtml = ciclos.length ? ciclos.map(c => {
    const etapas = Array.isArray(c.etapas) ? c.etapas : [];
    return `<div class="card" style="margin-bottom:8px">
      <div class="card-h"><div class="card-t">${c.cultivo}${c.variedad?' · '+c.variedad:''}</div><div class="row gap6"><span class="badge bg-green">${c.duracion_dias} días</span><button class="btn btn-sm btn-ghost" onclick="flowDeleteCiclo('${c.id}','${c.cultivo}')" style="color:var(--rd);padding:4px;border:none"><i class="ti ti-trash"></i></button></div></div>
      ${etapas.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${etapas.map(e=>`<span class="ciclo-etapa-chip"><i class="ti ti-plant"></i>${e.nombre} (día ${e.dia_inicio})</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('') : `<div class="text-tiny" style="text-align:center;padding:16px">Sin ciclos definidos. Crea uno para que la app calcule automáticamente los días de cada lote.</div>`;

  const html = `<div class="modal-h"><i class="ti ti-plant-2"></i> Ciclos de cultivo</div>
    <div class="modal-sub">Define cuántos días dura cada cultivo para que la app calcule el progreso automáticamente.</div>
    ${listHtml}
    <div class="modal-actions" style="flex-direction:column;gap:8px">
      <button class="btn btn-primary btn-block" id="m-new-ciclo"><i class="ti ti-plus"></i> Nuevo ciclo</button>
      <button class="btn btn-ghost btn-block" id="m-close-ciclo">Cerrar</button>
    </div>`;
  const p = M._open(html);
  document.getElementById('m-close-ciclo').onclick = () => M._close(null);
  document.getElementById('m-new-ciclo').onclick = async () => {
    M._close(null);
    await flowNuevoCiclo();
  };
  return p;
};

window.flowNuevoCiclo = async function(){
  const r = await M.form({ title:'Nuevo ciclo de cultivo', okText:'Guardar ciclo', fields:[
    { name:'cultivo', label:'Cultivo', type:'text', required:true, placeholder:'Ej: Tomate, Pimentón, Pepino' },
    { name:'variedad', label:'Variedad (opcional)', type:'text' },
    { name:'duracion_dias', label:'Duración total (días)', type:'number', required:true, placeholder:'Ej: 90' }
  ]});
  if (!r) return;
  if (!S.isOnline) { toast('Necesitas conexión'); return; }
  const { error } = await sb.from('ciclos_cultivo').insert({ cultivo:r.cultivo, variedad:r.variedad||null, duracion_dias:parseInt(r.duracion_dias), etapas:[] });
  if (error) { toast('Error: '+error.message); return; }
  await refreshAll(); toast('✅ Ciclo guardado'); render();
};

window.flowDeleteCiclo = async function(id, cultivo){
  const ok = await M.confirm({ title:'Borrar ciclo', body:`¿Borrar el ciclo de "${cultivo}"?`, okText:'Sí, borrar', danger:true, cancelText:'Cancelar' });
  if (!ok) return;
  const { error } = await sb.from('ciclos_cultivo').delete().eq('id', id);
  if (error) { toast('Error: '+error.message); return; }
  await refreshAll(); toast('🗑️ Ciclo borrado');
};

function renderTareas(){
  const a = Alerts.compute(), completadas = (S.cache.tasks || []).filter(t => t.estado === 'completada');
  function taskRow(t){
    const tit = escA(t.titulo||'');
    return `<div class="task-row" id="task-row-${t.id}">
      <div class="task-check" data-complete-task="${t.id}"><i class="ti ti-check"></i></div>
      <div class="task-row-body">
        <div class="task-row-title">${esc(t.titulo)}</div>
        <div class="task-row-meta">
          <span><i class="ti ti-map-pin"></i> ${t.lote?.codigo || 'Finca'}</span>
          ${t.fecha_limite ? `<span><i class="ti ti-calendar"></i> ${fmtFecha(t.fecha_limite)}</span>` : `<span style="color:var(--tx3)"><i class="ti ti-calendar-off"></i> Sin fecha</span>`}
          ${t.asignado?.nombre_corto ? `<span><i class="ti ti-user"></i> ${t.asignado.nombre_corto}</span>` : ''}
        </div>
      </div>
      <div class="row gap6" style="flex-shrink:0">
        <button class="btn btn-sm btn-ghost" onclick="flowEditTask('${t.id}')" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowDeleteTask('${t.id}','${tit}')" style="color:var(--tx3);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }
  function taskGroup(cls, label, items){
    if (!items.length) return '';
    return `<div class="task-group ${cls}"><div class="task-group-h"><span class="dot"></span>${label} (${items.length})</div><div class="task-group-card">${items.map(taskRow).join('')}</div></div>`;
  }

  const pendBlock = (a.vencidas.length + a.hoy.length + a.proximas.length + a.sinFecha.length) ? `
    ${taskGroup('urgent', 'Vencidas', a.vencidas)} ${taskGroup('today', 'Para hoy', a.hoy)}
    ${taskGroup('soon', 'Próximas', a.proximas)} ${taskGroup('later', 'Sin fecha', a.sinFecha)}
  ` : emptyState('ti-mood-happy', 'Todo al día', 'No hay tareas pendientes.');

  const doneList = completadas.length ? completadas.slice(0,10).map(t => `<div class="task-row" style="opacity:.55"><div class="task-check checked" style="cursor:default"><i class="ti ti-check"></i></div><div class="task-row-body"><div class="task-row-title" style="text-decoration:line-through;font-weight:500">${esc(t.titulo)}</div></div></div>`).join('') : `<div class="text-tiny" style="padding:10px;text-align:center">Sin tareas completadas todavía.</div>`;

  return `<div class="panel">
    <div class="panel-h"><div class="panel-title">Tareas</div><button class="btn btn-sm btn-primary" id="btn-global-task"><i class="ti ti-plus"></i> Nueva</button></div>
    ${pendBlock}
    <div class="sec-t mt12"><span><i class="ti ti-check"></i> Completadas recientes</span></div>
    <div class="task-group-card">${doneList}</div>
  </div>`;
}

        const costoL = (S.cache.compras||[]).filter(c=>c.lote_id===l.id).reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
        const resumen = `<div class="map-dims" style="margin-bottom:8px"><div><b>${totalKg.toLocaleString('es-CO')} kg</b>Cosechado</div>${costoL>0?`<div><b>${fmtMoney(costoL/totalKg)}</b>Costo por kg</div><div><b>${fmtMoney(costoL)}</b>Invertido</div>`:''}</div>`;
        return resumen + `<div class="card" style="padding:4px 14px">${cs.slice(0,8).map(c=>`<div class="mini-list-item"><div class="mini-list-dot done"></div><div class="mini-list-body"><div class="mini-list-title">${c.volumen_kg} kg · ${esc(c.calidad||'normal')}</div><div class="mini-list-meta"><span><i class="ti ti-calendar"></i> ${fmtFecha(c.fecha_recoleccion)}</span>${c.observaciones?`<span>${esc(c.observaciones)}</span>`:''}</div></div><div class="row gap6" style="flex-shrink:0"><button class="btn btn-sm btn-ghost" onclick="flowEditCosecha('${c.id}')" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button><button class="btn btn-sm btn-ghost" onclick="flowDeleteCosecha('${c.id}')" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button></div></div>`).join('')}</div>`;
      })()}
      <div class="sec-t mt12"><span><i class="ti ti-photo"></i> Fotos del lote</span><div class="row gap6"><button class="btn btn-sm btn-soft" onclick="flowGaleria('${l.id}')" style="font-size:10px;padding:3px 8px"><i class="ti ti-photo"></i> Ver todas</button><button class="btn btn-sm btn-yellow" onclick="flowNuevaFoto('${l.id}')" style="font-size:10px;padding:3px 8px"><i class="ti ti-camera"></i> Foto</button></div></div>
      ${(() => {
        const fs = (S.cache.fotos||[]).filter(f => f.lote_id === l.id).slice(0,6);
        return fs.length ? `<div class="galeria-grid">${fs.map(f => `<img class="galeria-thumb" loading="lazy" src="${esc(f.url)}" onclick="flowVerFoto('${f.id}')">`).join('')}</div>` : `<div class="text-tiny" style="padding:6px 0;color:var(--tx3)">Sin fotos de este lote aún.</div>`;
      })()}
      <div class="sec-t mt12"><span><i class="ti ti-bug"></i> Plagas activas en este lote</span><button class="btn btn-sm btn-red" onclick="flowNuevaPlaga()" style="font-size:10px;padding:3px 8px"><i class="ti ti-plus"></i> Nueva</button></div>
      ${(() => {
        const pl = S.cache.plagas.filter(p=>p.activa && p.lote_id===l.id);
        if (!pl.length) return `<div class="text-tiny" style="padding:8px 0;color:var(--tx3)"><i class="ti ti-circle-check" style="color:var(--g)"></i> Sin plagas activas en este lote.</div>`;
        return pl.map(p=>`<div class="plaga-card ${p.severidad||'leve'}" style="margin-bottom:6px">
          <div class="plaga-header"><div class="plaga-icon ${p.severidad||'leve'}"><i class="ti ti-bug"></i></div>
          <div style="flex:1"><div class="plaga-title">${esc(p.tipo)}</div><div class="plaga-meta"><span>${fmtFecha(p.fecha_deteccion)}</span></div></div>
          <span class="plaga-badge ${p.severidad||'leve'}">${p.severidad||'leve'}</span></div>
          ${p.descripcion?`<div class="plaga-desc">${clampHTML(p.descripcion,{limit:110})}</div>`:''}
          <div style="margin-top:6px;display:flex;gap:6px;justify-content:flex-end">
            <button class="btn btn-sm btn-ghost" onclick="flowControlarPlaga('${p.id}','${escA(p.tipo||'')}','${escA(l.codigo)}')" style="padding:4px 8px;font-size:11px"><i class="ti ti-spray"></i> Controlar</button>
            <button class="btn btn-sm btn-ghost" onclick="flowCerrarPlaga('${p.id}','${escA(p.tipo||'')}')" style="color:var(--g);padding:4px;border:none"><i class="ti ti-circle-check"></i></button>
          </div>
        </div>`).join('');
      })()}
    </div>`;
  }
  // Lista de lotes con progreso de ciclo
  return `<div class="panel">
    <div class="panel-h"><div class="panel-title">Lotes</div><div class="row gap6"><button class="btn btn-sm btn-soft" onclick="flowGestionCiclos()"><i class="ti ti-plant-2"></i> Ciclos</button><button class="btn btn-sm btn-primary" id="btn-new-lote"><i class="ti ti-plus"></i> Crear</button></div></div>
    ${S.cache.lotes.length ? S.cache.lotes.map(l => {
      let cicloMini = '';
      if (l.fecha_siembra && l.ciclo_dias){
        const diasTrans = diasDesde(l.fecha_siembra);
        const pct = Math.min(100, Math.round((diasTrans / l.ciclo_dias)*100));
        const diasRest = Math.max(0, l.ciclo_dias - diasTrans);
        cicloMini = `<div class="ciclo-bar" style="margin-top:8px"><div class="ciclo-bar-fill" style="width:${pct}%"></div></div><div class="ciclo-info"><span>Día ${diasTrans} de ${l.ciclo_dias}</span><span>${diasRest > 0 ? diasRest+' días para cosecha' : '⚠️ Ciclo vencido'}</span></div>`;
      } else if (l.fecha_siembra){
        const diasTrans = diasDesde(l.fecha_siembra);
        cicloMini = `<div class="text-tiny" style="margin-top:4px"><i class="ti ti-calendar"></i> Siembra: ${fmtFecha(l.fecha_siembra)} · ${diasTrans} días</div>`;
      }
      return `<div class="card lote-card" data-lote="${l.codigo}">
        <div class="lote-card-row">
          <div class="icon-pill ip-green"><i class="ti ti-plant"></i></div>
          <div class="lote-card-body">
            <div class="lote-card-title">${esc(l.codigo)} · ${esc(l.cultivo)}</div>
            <div class="lote-card-sub">${l.variedad?esc(l.variedad)+' · ':''}<span class="badge bg-yellow">${esc(l.estado)}</span></div>
            ${cicloMini}
          </div>
          <div class="row gap6" style="flex-shrink:0" onclick="event.stopPropagation()">
            <button class="btn btn-sm btn-ghost" onclick="flowEditLote('${l.id}')" style="padding:5px;border:none" title="Editar lote"><i class="ti ti-edit"></i></button>
            <button class="btn btn-sm btn-ghost" onclick="flowDeleteLote('${l.id}','${escA(l.codigo||'')}')" style="color:var(--rd);padding:5px;border:none" title="Borrar lote"><i class="ti ti-trash"></i></button>
          </div>
          <i class="ti ti-chevron-right lote-card-chev"></i>
        </div>
      </div>`;
    }).join('') : emptyState('ti-plant', 'Sin lotes', 'Crea tu primer lote.')}
  </div>`;
}

window.flowHistorialLote = function(loteId){
  const l = S.cache.lotes.find(x => x.id == loteId); if (!l) return;
  const comprasRaw = (S.cache.compras||[]).filter(c => c.lote_id === loteId);
  const jornalesRaw = (S.cache.jornales||[]).filter(j => j.lote_id === loteId)
    .map(j => ({ id:j.id, concepto:`Jornal: ${j.trabajador} (${j.dias} día${parseFloat(j.dias)>1?'s':''})`, valor_total:j.valor_total, fecha_compra:j.fecha, categoria:'jornales', _jornal:true }));
  const comprasL = [...comprasRaw, ...jornalesRaw].sort((a,b)=> tsOrden(b.fecha_compra) - tsOrden(a.fecha_compra));
  const consumos = comprasRaw.filter(c => c.origen === 'consumo');
  const totInsumos = consumos.reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
  const totJorn = jornalesRaw.reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
  const otros = comprasRaw.filter(c=>c.origen!=='consumo').reduce((a,c)=>a+(parseFloat(c.valor_total)||0),0);
  const total = totInsumos + totJorn + otros;
  const cosechado = (S.cache.cosechas||[]).filter(c=>c.lote_id===loteId).reduce((a,c)=>a+(parseFloat(c.volumen_kg)||0),0);

  const icono = (c) => c._jornal ? ['ip-brown','ti-user'] : c.origen==='consumo' ? ['ip-blue','ti-droplet'] : ['ip-red','ti-shopping-cart'];
  const fnEdit = (c) => c._jornal ? `flowEditJornal('${c.id}')` : c.origen==='consumo' ? `flowEditConsumo('${c.id}')` : `flowEditGasto('${c.id}','${escA(c.concepto||'')}',${c.valor_total},'${escA(c.categoria||'otro')}')`;
  const fnDel  = (c) => c._jornal ? `flowDeleteJornal('${c.id}')` : c.origen==='consumo' ? `flowDeleteConsumo('${c.id}')` : `flowDeleteGasto('${c.id}','${escA(c.concepto||'')}')`;

  const filas = comprasL.length ? comprasL.map(c => {
    const [ip,ic] = icono(c);
    const ed = fnEdit(c);
    return `<div class="mini-list-item"><div class="icon-pill ${ip}" style="width:30px;height:30px"><i class="ti ${ic}"></i></div>
      <div class="mini-list-body"><div class="mini-list-title">${esc(c.concepto)}</div><div class="mini-list-meta"><span><i class="ti ti-calendar"></i> ${fmtDate(c.fecha_compra)}</span>${c.categoria?`<span>${esc(c.categoria)}</span>`:''}</div></div>
      <div style="font-weight:700;color:var(--rd);flex-shrink:0;font-feature-settings:'tnum'">${fmtMoney(c.valor_total)}</div>
      <div class="row gap6" style="flex-shrink:0">${ed?`<button class="btn btn-sm btn-ghost" onclick="${ed}" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button>`:''}<button class="btn btn-sm btn-ghost" onclick="${fnDel(c)}" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button></div>
    </div>`;
  }).join('') : `<div class="text-tiny" style="padding:10px;text-align:center">Sin movimientos en este lote.</div>`;

  const html = `<div class="modal-h"><i class="ti ti-plant"></i> ${esc(l.codigo)} · ${esc(l.cultivo)}</div>
    <div class="map-dims" style="margin-bottom:12px"><div><b>${fmtMoney(totInsumos)}</b>Insumos</div><div><b>${fmtMoney(totJorn)}</b>Jornales</div>${otros>0?`<div><b>${fmtMoney(otros)}</b>Otros</div>`:''}<div><b>${fmtMoney(total)}</b>Total</div></div>
    ${cosechado>0?`<div class="spec-box" style="margin-bottom:12px"><b>Producido:</b> ${cosechado.toLocaleString('es-CO')} kg · <b>Costo por kilo:</b> ${fmtMoney(total/cosechado)}</div>`:''}
    <div class="sec-t" style="margin-bottom:8px"><span>Movimientos (${comprasL.length})</span></div>
    <div class="card" style="padding:4px 14px;max-height:46vh;overflow-y:auto">${filas}</div>
    <div class="modal-actions" style="margin-top:12px"><button class="btn btn-primary btn-block" id="m-hl-close">Cerrar</button></div>`;
  const p = M._open(html);
  document.getElementById('m-hl-close').onclick = () => M._close(null);
  return p;
};

function renderDinero(){
  /* Los registros origen='consumo' son costo interno por lote: la plata ya salió al comprar el insumo, no se vuelven a sumar a egresos */
  const totalEgresos = egresosTotales();
  const totalIngresos = S.cache.ingresos.reduce((acc, c) => acc + (parseFloat(c.valor_total) || 0), 0);
  const balance = totalIngresos - totalEgresos;

  /* Costo acumulado por lote: compras + consumos + jornales (centralizado) */
  const costoPorLote = {};
  S.cache.lotes.forEach(l => { const c = costoLote(l.id); if (c>0) costoPorLote[l.id] = c; });
  const lotesConCosto = S.cache.lotes.filter(l => costoPorLote[l.id] > 0);
  const loteCostHtml = lotesConCosto.length ? `<div class="card" style="margin-top:12px;padding:10px 14px">
    <div class="sec-t" style="margin:0 0 6px"><span><i class="ti ti-plant"></i> Costo acumulado por lote</span></div>
    ${lotesConCosto.map(l => `<div class="lote-cost-row" style="cursor:pointer" onclick="flowHistorialLote('${l.id}')"><span><b>${esc(l.codigo)}</b> · ${esc(l.cultivo)}</span><span style="display:flex;align-items:center;gap:6px"><span style="font-weight:700;font-feature-settings:'tnum';color:var(--br)">${fmtMoney(costoPorLote[l.id])}</span><i class="ti ti-chevron-right" style="color:var(--tx3)"></i></span></div>`).join('')}
  </div>` : '';

  const ultimos = [
    ...S.cache.compras.map(c => ({tipo:'gasto', id:c.id, concepto:c.concepto, valor:c.valor_total, fecha:c.fecha_compra, categoria:c.categoria, origen:c.origen, lote_id:c.lote_id})),
    ...S.cache.jornales.map(j => ({tipo:'jornal', id:j.id, concepto:`Jornal: ${j.trabajador} (${j.dias} día${parseFloat(j.dias)>1?'s':''})`, valor:j.valor_total, fecha:j.fecha, categoria:'jornales', lote_id:j.lote_id})),
    ...S.cache.ingresos.map(i => ({tipo:'ingreso', id:i.id, concepto:i.concepto, valor:i.valor_total, fecha:i.fecha}))
  ].sort((a,b) => tsOrden(b.fecha) - tsOrden(a.fecha)).slice(0, 25);

  const movList = ultimos.length ? ultimos.map(m => {
    const conEsc = escA(m.concepto||'');
    const esConsumo = m.origen === 'consumo';
    const loteCod = esConsumo && m.lote_id ? (S.cache.lotes.find(l=>l.id==m.lote_id)?.codigo||'') : '';
    const editFn = m.tipo==='jornal' ? `flowEditJornal('${m.id}')` : m.tipo==='gasto' ? `flowEditGasto('${m.id}','${conEsc}',${m.valor},'${escA(m.categoria||'otro')}')` : `flowEditIngreso('${m.id}','${conEsc}',${m.valor})`;
    const delFn  = m.tipo==='jornal' ? `flowDeleteJornal('${m.id}')` : m.tipo==='gasto' ? `flowDeleteGasto('${m.id}','${conEsc}')` : `flowDeleteIngreso('${m.id}','${conEsc}')`;
    const esJornal = m.tipo==='jornal';
    return `<div class="mini-list-item">
      <div class="icon-pill ${esConsumo?'ip-blue':esJornal?'ip-brown':(m.tipo==='gasto'?'ip-red':'ip-green')}"><i class="ti ${esConsumo?'ti-droplet':esJornal?'ti-user':(m.tipo==='gasto'?'ti-arrow-down':'ti-arrow-up')}"></i></div>
      <div class="mini-list-body">
        <div class="mini-list-title">${esc(m.concepto)}</div>
        <div class="mini-list-meta"><span>${fmtDate(m.fecha)}</span>${m.categoria?`<span>${esc(m.categoria)}</span>`:''}${esConsumo?`<span class="badge bg-blue" style="font-size:9px;padding:1px 6px">costo lote${loteCod?' '+esc(loteCod):''}</span>`:''}</div>
      </div>
      <div style="font-weight:700;color:${esConsumo?'var(--bl)':esJornal?'var(--br)':(m.tipo==='gasto'?'var(--rd)':'var(--g)')};font-feature-settings:'tnum';flex-shrink:0">${fmtMoney(m.valor)}</div>
      <div class="row gap6" style="flex-shrink:0;margin-left:4px">
        <button class="btn btn-sm btn-ghost" onclick="${editFn}" style="padding:4px;border:none" title="Editar"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="${delFn}" style="color:var(--rd);padding:4px;border:none" title="Borrar"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('') : emptyState('ti-coin', 'Sin movimientos', 'Registra tu primer gasto o ingreso.');

  return `<div class="panel">
    <div class="panel-h"><div class="panel-title">Dinero</div></div>
    <div class="finanzas-header">
      <div class="fin-box fin-egresos"><div class="fin-box-t">Egresos</div><div class="fin-box-v" style="color:var(--rd)">${fmtMoney(totalEgresos)}</div></div>
      <div class="fin-box fin-ingresos"><div class="fin-box-t">Ingresos</div><div class="fin-box-v" style="color:var(--g)">${fmtMoney(totalIngresos)}</div></div>
    </div>
    <div class="balance-card"><div class="balance-label">Balance real</div><div class="balance-val" style="color:${balance>=0?'var(--g)':'var(--rd)'}">${fmtMoney(balance)}</div></div>
    ${loteCostHtml}
    <div class="row gap8 mt12"><button class="btn btn-red flex1" id="btn-add-gasto"><i class="ti ti-minus"></i> Gasto</button><button class="btn btn-yellow flex1" onclick="flowNuevoJornal()"><i class="ti ti-user"></i> Jornal</button><button class="btn btn-primary flex1" id="btn-add-ingreso"><i class="ti ti-plus"></i> Ingreso</button></div>
    <div class="sec-t mt12"><span><i class="ti ti-history"></i> Últimos movimientos</span></div>
    <div class="card">${movList}</div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   BODEGA (REDISEÑO CON CARPETAS Y RESCATE DE ANTIGUOS)
   ═══════════════════════════════════════════════════════════════ */
window._bodegaFilter = function(q){
  const res = document.getElementById('bodega-search-results');
  const folders = document.getElementById('bodega-folders');
  if (!res || !folders) return;
  q = (q||'').trim().toLowerCase();
  if (q.length < 2){ res.innerHTML=''; folders.style.display=''; return; }
  folders.style.display = 'none';
  const matches = S.cache.inventory.filter(i =>
    (i.descripcion||'').toLowerCase().includes(q) || (i.detalles||'').toLowerCase().includes(q) || (i.subcategoria||'').toLowerCase().includes(q)
  ).sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'', 'es'));
  res.innerHTML = matches.length ? matches.map(i => renderItemCard(i)).join('') : emptyState('ti-search-off','Sin resultados',`Nada en bodega coincide con "${esc(q)}"`);
};

function renderBodega(){
  if (S.activeBodegaCat) return renderBodegaDetalle(S.activeBodegaCat);

  const totalItems = S.cache.inventory.length;
  let html = `<div class="panel">
    <div class="panel-h"><div class="panel-title">Bodega</div><button class="btn btn-sm btn-primary" onclick="flowNewInsumo()"><i class="ti ti-plus"></i> Insumo manual</button></div>
    <div class="search-box" style="margin-bottom:12px"><input id="bodega-search" placeholder="Buscar producto en bodega..." oninput="_bodegaFilter(this.value)" autocomplete="off"><button class="search-btn" style="pointer-events:none"><i class="ti ti-search"></i></button></div>
    <div id="bodega-search-results"></div>
    <div id="bodega-folders">
    <div class="bodega-folder" onclick="abrirBodegaCat('__TODOS__')" style="margin-bottom:10px;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px">
       <div class="icon-pill ip-green" style="margin:0;width:44px;height:44px;font-size:22px"><i class="ti ti-list-letters"></i></div>
       <div style="flex:1"><div class="bodega-folder-title">Todo en bodega</div><div class="text-tiny" style="margin-top:2px">${totalItems} productos de la A a la Z</div></div>
       <i class="ti ti-chevron-right" style="color:var(--tx3)"></i>
    </div>
    <div class="bodega-grid">`;

  // Renderizar las carpetas principales (con conteo y valor total)
  for(const [cat, data] of Object.entries(BODEGA_STRUCT)){
    const its = S.cache.inventory.filter(i => i.categoria === cat);
    const comp = its.reduce((a,i)=>a+compradoInv(i),0);
    html += `<div class="bodega-folder" onclick="abrirBodegaCat('${cat}')">
       <div class="icon-pill ip-${data.color}"><i class="ti ${data.icon}"></i></div>
       <div class="bodega-folder-title">${data.name}</div>
       <div class="text-tiny" style="margin-top:6px;font-weight:600;color:var(--tx3)">${its.length} INSUMOS</div>
       ${comp>0?`<div class="text-tiny" style="margin-top:2px;color:var(--br);font-weight:700" title="Total comprado">${fmtMoney(comp)}</div>`:''}
    </div>`;
  }

  // RESCATE AUTOMÁTICO DE DATOS VIEJOS: 
  const oldItems = S.cache.inventory.filter(i => !BODEGA_STRUCT[i.categoria]);
  if(oldItems.length > 0){
    html += `<div class="bodega-folder" onclick="abrirBodegaCat('Otros')">
       <div class="icon-pill ip-gray"><i class="ti ti-archive"></i></div>
       <div class="bodega-folder-title">Otros / Antiguos</div>
       <div class="text-tiny" style="margin-top:6px;font-weight:600;color:var(--tx3)">${oldItems.length} INSUMOS</div>
    </div>`;
  }

  html += `</div></div></div>`;
  return html;
}

window.abrirBodegaCat = function(cat){
  S.activeBodegaCat = cat;
  S.activeBodegaSub = null;
  Nav.push();
  render();
};

function renderBodegaDetalle(cat){
  if (cat === '__TODOS__') {
    const items = [...S.cache.inventory].sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'', 'es'));
    let html = `<div class="panel">
      <button class="lote-back" onclick="S.activeBodegaCat=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> Volver a categorías</button>
      <div class="panel-h" style="margin-top:12px">
        <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-green" style="width:34px;height:34px"><i class="ti ti-list-letters" style="font-size:18px"></i></div>Todo en bodega (${items.length})</div>
      </div>`;
    if (!items.length) html += emptyState('ti-package','Bodega vacía','Registra tu primer insumo.');
    else {
      let letra = '';
      items.forEach(i => {
        const ini = ((i.descripcion||'?')[0]||'?').toUpperCase();
        if (ini !== letra){ letra = ini; html += `<div class="sec-t mt12" style="font-size:13px;color:var(--g)"><span>${esc(letra)}</span></div>`; }
        html += renderItemCard(i);
      });
    }
    return html + `</div>`;
  }
  if (cat === 'Otros') {
    const items = S.cache.inventory.filter(i => !BODEGA_STRUCT[i.categoria]);
    let html = `<div class="panel">
      <button class="lote-back" onclick="S.activeBodegaCat=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> Volver a categorías</button>
      <div class="panel-h" style="margin-top:12px">
        <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-gray" style="width:34px;height:34px"><i class="ti ti-archive" style="font-size:18px"></i></div>Otros / Antiguos</div>
      </div>`;
    items.forEach(i => html += renderItemCard(i));
    return html + `</div>`;
  }

  const data = BODEGA_STRUCT[cat] || { name: cat, icon:'ti-package', color:'gray', subs:[] };
  const items = S.cache.inventory.filter(i => i.categoria === cat);

  // ── NIVEL 3: una subcategoría abierta → solo sus productos ──
  if (S.activeBodegaSub){
    const sub = S.activeBodegaSub;
    const subItems = (sub === '__SINCLAS__')
      ? items.filter(i => !data.subs.includes(subcatActual(i.subcategoria))).sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'','es'))
      : items.filter(i => subcatActual(i.subcategoria) === sub).sort((a,b)=>(a.descripcion||'').localeCompare(b.descripcion||'','es'));
    const subNom = sub === '__SINCLAS__' ? 'Sin clasificar' : sub;
    let html = `<div class="panel">
      <button class="lote-back" onclick="S.activeBodegaSub=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> ${esc(data.name)}</button>
      <div class="panel-h" style="margin-top:12px">
        <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-${data.color}" style="width:30px;height:30px"><i class="ti ${data.icon}" style="font-size:16px"></i></div>${esc(subNom)}</div>
        <button class="btn btn-sm btn-primary" onclick="flowNewInsumo('${cat}', ${JSON.stringify({sub: sub==='__SINCLAS__'?'':sub}).replace(/"/g,'&quot;')})"><i class="ti ti-plus"></i> Añadir</button>
      </div>`;
    if (!subItems.length) html += emptyState('ti-package','Sin productos','Aún no hay insumos en esta subcategoría.');
    else subItems.forEach(i => html += renderItemCard(i));
    return html + `</div>`;
  }

  // ── NIVEL 2: la categoría → sus subcategorías como carpetas (todas a la vista) ──
  const valorCat = items.reduce((a,i)=>a+valorInv(i),0);
  const compradoCat = items.reduce((a,i)=>a+compradoInv(i),0);
  let html = `<div class="panel">
    <button class="lote-back" onclick="S.activeBodegaCat=null; Nav.push(); render();"><i class="ti ti-arrow-left"></i> Volver a categorías</button>
    <div class="panel-h" style="margin-top:12px">
      <div class="panel-title" style="display:flex;align-items:center;gap:8px"><div class="icon-pill ip-${data.color}" style="width:34px;height:34px"><i class="ti ${data.icon}" style="font-size:18px"></i></div>${data.name}</div>
      <button class="btn btn-sm btn-primary" onclick="flowNewInsumo('${cat}')"><i class="ti ti-plus"></i> Añadir</button>
    </div>
    ${(compradoCat>0||valorCat>0)?`<div class="map-dims" style="margin-bottom:10px"><div><b>${items.length}</b>Productos</div><div><b>${fmtMoney(compradoCat)}</b>Comprado</div><div><b>${fmtMoney(valorCat)}</b>En bodega</div></div>`:''}`;

  data.subs.forEach(sub => {
    const subItems = items.filter(i => subcatActual(i.subcategoria) === sub);
    const valor = subItems.reduce((a,i)=>a+compradoInv(i),0);
    const vacia = subItems.length === 0;
    html += `<div class="bodega-folder" onclick="abrirBodegaSub('${escA(sub)}')" style="margin-bottom:8px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;${vacia?'opacity:.55':''}">
       <div class="icon-pill ip-${data.color}" style="margin:0;width:38px;height:38px;font-size:18px"><i class="ti ${data.icon}"></i></div>
       <div style="flex:1"><div class="bodega-folder-title" style="font-size:14px">${esc(sub)}</div><div class="text-tiny" style="margin-top:2px">${vacia?'vacía':`${subItems.length} prod${valor>0?' · comprado '+fmtMoney(valor):''}`}</div></div>
       <i class="ti ti-chevron-right" style="color:var(--tx3)"></i>
    </div>`;
  });
  // Sin clasificar (productos cuya subcategoría no está en la lista oficial)
  const sinClas = items.filter(i => !data.subs.includes(subcatActual(i.subcategoria)));
  if (sinClas.length){
    const valor = sinClas.reduce((a,i)=>a+valorInv(i),0);
    html += `<div class="bodega-folder" onclick="abrirBodegaSub('__SINCLAS__')" style="margin-bottom:8px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px">
       <div class="icon-pill ip-gray" style="margin:0;width:38px;height:38px;font-size:18px"><i class="ti ti-help-circle"></i></div>
       <div style="flex:1"><div class="bodega-folder-title" style="font-size:14px">Sin clasificar</div><div class="text-tiny" style="margin-top:2px">${sinClas.length} prod${valor>0?' · '+fmtMoney(valor):''}</div></div>
       <i class="ti ti-chevron-right" style="color:var(--tx3)"></i>
    </div>`;
  }
  return html + `</div>`;
}

window.abrirBodegaSub = function(sub){
  S.activeBodegaSub = sub;
  Nav.push();
  render();
};

function renderItemCard(i){
  const ingresado = parseFloat(i.total_ingresado || i.cantidad_actual) || 0, actual = parseFloat(i.cantidad_actual) || 0, consumido = Math.max(0, ingresado - actual), lowStock = actual < (ingresado * 0.15);
  const desc = escA(i.descripcion||'');
  const unit = escA(i.unidad_medida||'');
  const costoU = parseFloat(i.costo_unitario)||0;
  const costoChip = costoU > 0 ? `<span class="costo-chip" title="Costo unitario promedio"><i class="ti ti-coin"></i> ${fmtMoney(costoU)}/${esc(i.unidad_medida||'u')}</span>` : '';
  const ult = parseFloat(i.ultimo_precio)||0;
  let ultLinea = '';
  if (ult > 0){
    const dif = costoU>0 ? (ult>costoU*1.02?'<span style="color:var(--rd)">subió</span>':ult<costoU*0.98?'<span style="color:var(--g)">bajó</span>':'igual') : '';
    ultLinea = `<div class="text-tiny" style="margin:-2px 0 8px"><i class="ti ti-clock"></i> Último: ${fmtMoney(ult)}/${esc(i.unidad_medida||'u')}${i.ultimo_precio_fecha?' · '+fmtFecha(i.ultimo_precio_fecha):''}${dif?' · '+dif:''}</div>`;
  } else if (costoU === 0){
    ultLinea = `<div class="text-tiny" style="margin:-2px 0 8px;color:var(--yl)"><i class="ti ti-coin-off"></i> Sin precio · toca <b>Precio</b> para registrarlo</div>`;
  }
  const franja = franjaChip(i);
  let venceChip = '';
  if (i.fecha_vencimiento){
    const diasV = diasHasta(i.fecha_vencimiento);
    venceChip = diasV < 0 ? `<span class="badge bg-red"><i class="ti ti-alert-triangle"></i> Vencido</span>`
      : diasV <= 30 ? `<span class="badge bg-orange"><i class="ti ti-clock"></i> Vence en ${diasV} d</span>`
      : `<span class="badge bg-yellow"><i class="ti ti-calendar"></i> Vence ${fmtFecha(i.fecha_vencimiento)}</span>`;
  }
  const comprado = compradoInv(i);
  const tieneCosto = costoU > 0 || comprado > 0;
  const filaCostos = tieneCosto ? `<div class="inv-grid" style="grid-template-columns:repeat(2,1fr);margin-top:6px">
      <div class="inv-stat"><span style="color:var(--br)">Comprado</span><b style="color:var(--br)">${fmtMoney(comprado)}</b></div>
      <div class="inv-stat active">En bodega<b>${fmtMoney(actual*costoU)}</b></div>
    </div>` : '';
  const fichaHtml = i.ficha_investigacion
    ? `<div class="ficha-box"><div class="ficha-box-t"><i class="ti ti-microscope"></i> Ficha técnica (IA) <button class="ver-mas" style="margin-left:auto;font-size:10px" onclick="flowInvestigarInsumo('${i.id}')" title="Volver a investigar"><i class="ti ti-refresh"></i></button></div>${clampHTML(i.ficha_investigacion,{limit:150})}</div>`
    : `<button class="btn btn-sm btn-blue" style="margin-bottom:10px" onclick="flowInvestigarInsumo('${i.id}')"><i class="ti ti-world-search"></i> Investigar producto con IA</button>`;
  return `<div class="card">
    <div class="card-h">
      <div class="card-t">${esc(i.descripcion)} ${lowStock?'<span class="badge bg-red">Bajo</span>':''} ${costoChip} ${venceChip} ${franja}</div>
      <div class="row gap6">
        <button class="btn btn-sm btn-ghost" onclick="flowDeleteInventory('${i.id}','${desc}')" style="color:var(--rd);padding:6px;border:none" title="Borrar"><i class="ti ti-trash"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowEditInventory('${i.id}')" style="padding:6px;border:none" title="Editar"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowHistorialInsumo('${i.id}','${desc}')" style="padding:6px;border:none" title="Historial de uso"><i class="ti ti-history"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="flowSetPrecio('${i.id}')" style="color:var(--yl);padding:6px;border:none" title="Editar precio"><i class="ti ti-coin"></i></button>
        <button class="btn btn-sm btn-blue" onclick="flowRestockInventory('${i.id}','${desc}','${unit}')" title="Reponer stock"><i class="ti ti-plus"></i> Reponer</button>
        <button class="btn btn-sm btn-red" onclick="flowUseInventory('${i.id}','${desc}','${unit}')"><i class="ti ti-minus"></i> Usar</button>
      </div>
    </div>
    ${ultLinea}
    ${i.detalles ? `<div class="spec-box"><b>Especificaciones:</b> ${clampHTML(i.detalles,{limit:120})}</div>` : ''}
    ${fichaHtml}
    <div class="inv-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="inv-stat">Ingresó<b>${ingresado}</b></div>
      <div class="inv-stat">Consumido<b>${consumido}</b></div>
      <div class="inv-stat active">Disponible<b>${actual} ${esc(i.unidad_medida||'')}</b></div>
    </div>
    ${filaCostos}
  </div>`;
}
